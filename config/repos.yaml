---
# =============================================================================
# External Repositories — cloned automatically by the installer
# =============================================================================
# Each entry defines a Git repo whose roles/ directory is added to the
# Ansible roles_path.  The installer clones missing repos on first run.
#
# Fields:
#   url:              Git clone URL
#   dest:             Directory name (created under ext/)
#   branch:           What to check out (default: main). Accepts a branch name,
#                     a tag, or a full ref (refs/pull/N/head). Prefer a release
#                     tag over a branch so the same installer commit always
#                     produces the same tree.
#                     NOT accepted: a bare commit SHA. `git clone --branch`
#                     takes only branch and tag names, so a SHA would fail the
#                     clone and silently fall back to the default branch.
#   deployment_subdir: Optional sub-path where roles/, components.yaml, and
#                     config.yaml live relative to the repo root. Defaults to
#                     "" (roles/ at the repo root). Set to "deployment" for
#                     repos that nest their Ansible tree under a deployment/
#                     subdirectory.
#   solution:         Short tag identifying the solution (e.g. "inference", "rag").
#                     Used by `init --<solution>` to include optional repos.
#   always:           When true, config is always loaded. When false, only loaded
#                     if the env was init'd with --<solution> or the env's
#                     .solutions file lists it.
#
# To add a new repo:
#   1. Add an entry below
#   2. Register its components in config/components.yaml
# =============================================================================

repos:
  - url: "https://github.com/intel/enterprise-inference"
    dest: "enterprise.ai-inference"
    branch: "v1.0.0"
    deployment_subdir: ""
    solution: "inference"
    always: true
