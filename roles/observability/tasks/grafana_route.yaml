---
# =============================================================================
# Observability — publish Grafana on the platform gateway (K8s and OpenShift)
#   observability_grafana_service       Grafana's Service
#   observability_grafana_service_port  its port
# =============================================================================

- name: "observability | Publish Grafana"
  ansible.builtin.include_role:
    name: gateway
    tasks_from: publish.yaml
  vars:
    gateway_publish_name: grafana
    gateway_publish_namespace: "{{ observability_namespace }}"
    gateway_publish_host: "{{ observability_grafana_hostname }}"
    gateway_publish_path: "{{ observability_grafana_path }}"
    gateway_publish_portal: {title: "Grafana", description: "Metrics, logs and traces dashboards"}
  when: observability_gateway_publish | bool

- name: "observability | Expose Grafana via gateway HTTPRoute"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: grafana
        namespace: "{{ observability_namespace }}"
      spec:
        parentRefs:
          # Its own HTTPS listener or the apex (path mode); never plaintext :80.
          - "{{ gateway_publish.parent_ref }}"
        hostnames:
          - "{{ gateway_publish.host }}"
        rules:
          - matches: [{path: {type: PathPrefix, value: "{{ gateway_publish.relative_path }}"}}]
            filters:
              # HSTS: only ever reach Grafana over HTTPS on a compliant browser,
              # so a later plaintext attempt is refused before the admin
              # credential leaves the browser. Only honored over HTTPS, so it is
              # set here on the :443 route, not the :80 redirect.
              - type: ResponseHeaderModifier
                responseHeaderModifier:
                  set:
                    - name: Strict-Transport-Security
                      value: "max-age=31536000; includeSubDomains"
            backendRefs:
              - name: "{{ observability_grafana_service }}"
                port: "{{ observability_grafana_service_port | int }}"
  when: observability_gateway_publish | bool

# With Keycloak sign-in nobody reaches Grafana without a realm session; without
# it Grafana's own login is the only gate. One policy per route: the other is
# removed first.
- name: "observability | Remove the other Grafana gateway policy"
  ansible.builtin.include_role:
    name: gateway
    tasks_from: "{{ 'route_auth_exempt.yaml' if _obs_grafana_sso | bool else 'route_sso.yaml' }}"
  vars:
    gateway_route_name: grafana
    gateway_route_namespace: "{{ observability_namespace }}"
    gateway_route_policy_name: "{{ 'grafana-no-auth' if _obs_grafana_sso | bool else 'grafana-sso' }}"
    gateway_route_state: absent
  when: observability_gateway_publish | bool

- name: "observability | Sign in to Grafana at the gateway"
  ansible.builtin.include_role:
    name: gateway
    tasks_from: route_sso.yaml
  vars:
    gateway_route_name: grafana
    gateway_route_namespace: "{{ observability_namespace }}"
    gateway_route_policy_name: grafana-sso
    gateway_sso:
      issuer: "{{ keycloak_client_issuer }}"
      issuer_internal: "{{ keycloak_client_issuer_internal }}"
      client_id: "{{ observability_grafana_oidc_client_id }}"
      client_secret_name: grafana-sso
      redirect_url: "{{ observability_grafana_url }}/oauth2/callback"
      allowed_groups: "{{ observability_grafana_allowed_groups }}"
  when: observability_gateway_publish | bool and _obs_grafana_sso | bool

- name: "observability | Bypass gateway auth for Grafana (Keycloak sign-in off)"
  ansible.builtin.include_role:
    name: gateway
    tasks_from: route_auth_exempt.yaml
  vars:
    gateway_route_name: grafana
    gateway_route_namespace: "{{ observability_namespace }}"
    gateway_route_policy_name: grafana-no-auth
  when: observability_gateway_publish | bool and not (_obs_grafana_sso | bool)
