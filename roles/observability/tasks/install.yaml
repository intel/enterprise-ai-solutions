---
# =============================================================================
# Observability — Install
# Deploys: kube-prometheus-stack → Loki → Tempo → OTel Collector → Prometheus Adapter
# =============================================================================

# ── Pre-flight: check what is already installed ───────────────────────────────

- name: "observability | Check kube-prometheus-stack release"
  kubernetes.core.helm_info:
    name: kube-prometheus-stack
    release_namespace: "{{ observability_namespace }}"
  register: _obs_prom_release
  failed_when: false

- name: "observability | Check Loki release"
  kubernetes.core.helm_info:
    name: loki
    release_namespace: "{{ observability_namespace }}"
  register: _obs_loki_release
  failed_when: false

- name: "observability | Check Tempo release"
  kubernetes.core.helm_info:
    name: tempo
    release_namespace: "{{ observability_namespace }}"
  register: _obs_tempo_release
  failed_when: false

- name: "observability | Check OTel Collector release"
  kubernetes.core.helm_info:
    name: opentelemetry-collector
    release_namespace: "{{ observability_namespace }}"
  register: _obs_otel_release
  failed_when: false

- name: "observability | Check Prometheus Adapter release"
  kubernetes.core.helm_info:
    name: prometheus-adapter
    release_namespace: "{{ observability_namespace }}"
  register: _obs_prom_adapter_release
  failed_when: false

# ── Namespace ────────────────────────────────────────────────────────────────

- name: "observability | Create namespace"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ observability_namespace }}"

- name: "observability | Label namespace — Istio"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ observability_namespace }}"
        labels:
          istio.io/dataplane-mode: "ambient"
  when: istio_enabled | default(false) | bool

# Under mesh-wide STRICT the host-network apiserver reaches these over plaintext:
# the prometheus-operator admission webhook (10250) and the prometheus-adapter
# aggregated API (6443). Open only those ports; the rest of each pod stays STRICT.
- name: "observability | Allow apiserver to reach operator webhook + metrics adapter (port-level mTLS)"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: security.istio.io/v1
      kind: PeerAuthentication
      metadata:
        name: "{{ item.name }}"
        namespace: "{{ observability_namespace }}"
      spec:
        selector:
          matchLabels: "{{ item.selector }}"
        mtls:
          mode: STRICT
        portLevelMtls: "{{ {(item.port | string): {'mode': 'PERMISSIVE'}} }}"
  loop:
    - name: allow-webhook-operator
      selector: {app: kube-prometheus-stack-operator}
      port: 10250
    - name: allow-metrics-adapter
      selector: {app.kubernetes.io/name: prometheus-adapter}
      port: 6443
  loop_control:
    label: "{{ item.name }}:{{ item.port }}"
  when: istio_enabled | default(false) | bool

- name: "observability | Label namespace — PSS"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ observability_namespace }}"
        labels:
          pod-security.kubernetes.io/enforce: "privileged"
          pod-security.kubernetes.io/audit: "privileged"
          pod-security.kubernetes.io/warn: "privileged"
  when: enforce_pss | default(false) | bool

# ── Credentials ──────────────────────────────────────────────────────────────

- name: "observability | Bootstrap credentials"
  ansible.builtin.include_tasks: credentials.yaml

# ── Also load object_store credentials from minio Secret ─────────────────────
# minio role runs before observability and stores loki/tempo keys there.

- name: "observability | Load object_store credentials from minio Secret"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: minio-credentials
    namespace: "{{ minio_namespace }}"
  register: _obs_minio_secret
  failed_when: false

- name: "observability | Set object_store credentials from minio Secret"
  ansible.builtin.set_fact:
    object_store_endpoint: "{{ _obs_minio_secret.resources[0].data.endpoint | b64decode }}"
    object_store_loki_access_key: "{{ _obs_minio_secret.resources[0].data.lokiAccessKey | b64decode }}"
    object_store_loki_secret_key: "{{ _obs_minio_secret.resources[0].data.lokiSecretKey | b64decode }}"
    object_store_tempo_access_key: "{{ _obs_minio_secret.resources[0].data.tempoAccessKey | b64decode }}"
    object_store_tempo_secret_key: "{{ _obs_minio_secret.resources[0].data.tempoSecretKey | b64decode }}"
  when: (_obs_minio_secret.resources | default([])) | length > 0

# ── Helm repos ───────────────────────────────────────────────────────────────

- name: "observability | Add prometheus-community Helm repo"
  kubernetes.core.helm_repository:
    name: prometheus-community
    repo_url: "{{ observability_prometheus_helm_repo }}"

- name: "observability | Add grafana-community Helm repo"
  kubernetes.core.helm_repository:
    name: grafana-community
    repo_url: "{{ observability_grafana_helm_repo }}"

- name: "observability | Add open-telemetry Helm repo"
  kubernetes.core.helm_repository:
    name: open-telemetry
    repo_url: "{{ observability_otel_helm_repo }}"

# =============================================================================
# 1. kube-prometheus-stack
#    Installs: Prometheus Operator, Prometheus, Alertmanager,
#              Node Exporter (DaemonSet), kube-state-metrics, Grafana
# =============================================================================

- name: "observability | Install kube-prometheus-stack"
  when: _obs_prom_release.status is not defined or _obs_prom_release.status is none
  block:
    - name: "observability | Deploy kube-prometheus-stack"
      kubernetes.core.helm:
        name: kube-prometheus-stack
        chart_ref: prometheus-community/kube-prometheus-stack
        release_namespace: "{{ observability_namespace }}"
        create_namespace: false
        chart_version: "{{ observability_kube_prometheus_stack_version }}"
        wait: "{{ helm_wait }}"
        timeout: "{{ helm_timeout }}"
        values:
          # ── Prometheus ──────────────────────────────────────────────────────
          prometheus:
            prometheusSpec:
              retention: "{{ observability_prometheus_retention }}"
              # Discover ServiceMonitors/PodMonitors from ALL namespaces so
              # inference and application layers are scraped automatically.
              serviceMonitorSelectorNilUsesHelmValues: false
              podMonitorSelectorNilUsesHelmValues: false
              ruleSelectorNilUsesHelmValues: false
              storageSpec:
                volumeClaimTemplate:
                  spec:
                    accessModes: ["ReadWriteOnce"]
                    resources:
                      requests:
                        storage: "{{ observability_prometheus_storage_size }}"
            affinity: "{{ _platform_affinity | default({}) }}"
          # ── Alertmanager ────────────────────────────────────────────────────
          alertmanager:
            alertmanagerSpec:
              affinity: "{{ _platform_affinity | default({}) }}"
          # ── Grafana ─────────────────────────────────────────────────────────
          grafana:
            adminUser: "{{ observability_grafana_admin_user }}"
            adminPassword: "{{ observability_grafana_admin_password }}"
            affinity: "{{ _platform_affinity | default({}) }}"
            initChownData:
              enabled: false
            securityContext:
              fsGroup: 472
              runAsUser: 472
              runAsGroup: 472
            env:
              http_proxy: "{{ http_proxy | default('') }}"
              https_proxy: "{{ https_proxy | default('') }}"
              no_proxy: "{{ no_proxy | default('') }}"
            grafana.ini:
              plugins:
                plugin_admin_enabled: true
              auth:
                login_maximum_lifetime_duration: 3h              # default 30d -> 3h
                login_maximum_inactive_lifetime_duration: 30m    # default 7d -> 30m
                token_rotation_interval_minutes: 10m             # default 10m
            plugins:
              - grafana-metricsdrilldown-app
              - grafana-lokiexplore-app
              - grafana-exploretraces-app
              - grafana-pyroscope-app
            # Sidecar auto-discovers ConfigMaps labelled grafana_dashboard="1"
            # from ALL namespaces so inference-layer dashboards (llm-inference)
            # are picked up without manual import.
            sidecar:
              dashboards:
                enabled: true
                searchNamespace: ALL
            # Loki and Tempo datasources — injected at deploy time so Grafana
            # is pre-wired to all three backends on first boot.
            # Stable uids — dashboards reference datasources by uid (loki/tempo),
            # so pin them here instead of letting Grafana assign random uids.
            additionalDataSources:
              - name: Loki
                type: loki
                uid: loki
                url: "{{ observability_loki_url }}"
                access: proxy
                isDefault: false
                jsonData:
                  maxLines: 1000
              - name: Tempo
                type: tempo
                uid: tempo
                url: "{{ observability_tempo_url }}"
                access: proxy
                isDefault: false
                jsonData:
                  tracesToLogs:
                    datasourceUid: loki
                    filterByTraceID: true
                  serviceMap:
                    datasourceUid: prometheus
                  lokiSearch:
                    datasourceUid: loki
            # Persistence for dashboards / plugin state
            persistence:
              enabled: true
              size: 5Gi
          # ── Node Exporter ───────────────────────────────────────────────────
          prometheus-node-exporter:
            affinity: "{{ _platform_affinity | default({}) }}"
          # ── kube-state-metrics ──────────────────────────────────────────────
          kube-state-metrics:
            affinity: "{{ _platform_affinity | default({}) }}"

    - name: "observability | Wait for Prometheus Operator"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: kube-prometheus-stack-operator
        namespace: "{{ observability_namespace }}"
      register: _obs_prom_operator
      until:
        - (_obs_prom_operator.resources | default([])) | length > 0
        - (_obs_prom_operator.resources | default([]))[0].status.conditions | default([]) | selectattr('type', 'eq', 'Available') | selectattr('status', 'eq', 'True') | list | length > 0
      retries: 72
      delay: 5

    - name: "observability | Wait for Grafana"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: kube-prometheus-stack-grafana
        namespace: "{{ observability_namespace }}"
      register: _obs_grafana
      until:
        - (_obs_grafana.resources | default([])) | length > 0
        - (_obs_grafana.resources | default([]))[0].status.conditions | default([]) | selectattr('type', 'eq', 'Available') | selectattr('status', 'eq', 'True') | list | length > 0
      retries: 72
      delay: 5

    - name: "observability | Wait for Node Exporter DaemonSet"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: DaemonSet
        name: kube-prometheus-stack-prometheus-node-exporter
        namespace: "{{ observability_namespace }}"
      register: _obs_node_exporter
      until:
        - (_obs_node_exporter.resources | default([])) | length > 0
        - (_obs_node_exporter.resources[0].status.desiredNumberScheduled | default(0) | int) > 0
        - (_obs_node_exporter.resources[0].status.numberReady | default(0) | int) == (_obs_node_exporter.resources[0].status.desiredNumberScheduled | int)
      retries: 60
      delay: 5

- name: "observability | kube-prometheus-stack already installed — skipping"
  ansible.builtin.debug:
    msg: "kube-prometheus-stack already deployed in {{ observability_namespace }} — skipping."
  when: _obs_prom_release.status is defined and _obs_prom_release.status is not none

# =============================================================================
# 2. Loki (monolithic mode)
#    Single-binary log aggregation. Receives logs from OTel Collector.
# =============================================================================

- name: "observability | Install Loki"
  when: _obs_loki_release.status is not defined or _obs_loki_release.status is none
  block:
    - name: "observability | Deploy Loki"
      kubernetes.core.helm:
        name: loki
        chart_ref: grafana-community/loki
        release_namespace: "{{ observability_namespace }}"
        create_namespace: false
        chart_version: "{{ observability_loki_version }}"
        wait: "{{ helm_wait }}"
        timeout: "{{ helm_timeout }}"
        values:
          deploymentMode: SingleBinary
          loki:
            auth_enabled: false
            commonConfig:
              replication_factor: 1
            limits_config:
              retention_period: "{{ observability_loki_retention_hours }}h"
            storage:
              type: s3
              bucketNames:
                chunks: "loki-chunks"
                ruler: "loki-ruler"
              s3:
                endpoint: "{{ object_store_endpoint }}"
                accessKeyId: "{{ object_store_loki_access_key }}"
                secretAccessKey: "{{ object_store_loki_secret_key }}"
                region: "us-east-1"
                s3ForcePathStyle: true
                insecure: true
            schemaConfig:
              configs:
                - from: "2024-01-01"
                  store: tsdb
                  object_store: s3
                  schema: v13
                  index:
                    prefix: loki_index_
                    period: 24h
          singleBinary:
            replicas: 1
            affinity: "{{ _platform_affinity | default({}) }}"
            persistence:
              # WAL and index cache only — chunks go to MinIO
              enabled: true
              size: "{{ observability_loki_storage_size }}"
          # Disable gateway — nginx crashes when kube-dns is not present (cluster uses coredns).
          # In SingleBinary mode services talk directly to the loki service, no gateway needed.
          gateway:
            enabled: false
          # Disable all microservice replicas — we're in monolithic mode
          read:
            replicas: 0
          write:
            replicas: 0
          backend:
            replicas: 0
          chunksCache:
            enabled: "{{ observability_loki_cache_enabled | bool }}"
          resultsCache:
            enabled: "{{ observability_loki_cache_enabled | bool }}"
          # Disable bundled Grafana agent and canary — we use OTel Collector instead
          monitoring:
            selfMonitoring:
              enabled: false
              grafanaAgent:
                installOperator: false
            lokiCanary:
              enabled: false

    - name: "observability | Wait for Loki StatefulSet"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: StatefulSet
        name: loki
        namespace: "{{ observability_namespace }}"
      register: _obs_loki_sts
      until:
        - (_obs_loki_sts.resources | default([])) | length > 0
        - (_obs_loki_sts.resources[0].status.readyReplicas | default(0) | int) >= 1
      retries: 60
      delay: 5

- name: "observability | Loki already installed — skipping"
  ansible.builtin.debug:
    msg: "Loki already deployed in {{ observability_namespace }} — skipping."
  when: _obs_loki_release.status is defined and _obs_loki_release.status is not none

# =============================================================================
# 3. Tempo (monolithic mode)
#    Single-binary distributed tracing. Receives OTLP traces from OTel Collector.
# =============================================================================

- name: "observability | Install Tempo"
  when: _obs_tempo_release.status is not defined or _obs_tempo_release.status is none
  block:
    - name: "observability | Deploy Tempo"
      kubernetes.core.helm:
        name: tempo
        chart_ref: grafana-community/tempo
        release_namespace: "{{ observability_namespace }}"
        create_namespace: false
        chart_version: "{{ observability_tempo_version }}"
        wait: "{{ helm_wait }}"
        timeout: "{{ helm_timeout }}"
        values:
          tempo:
            reportingEnabled: false
            receivers:
              otlp:
                protocols:
                  grpc:
                    endpoint: "0.0.0.0:{{ observability_otel_grpc_port }}"
                  http:
                    endpoint: "0.0.0.0:{{ observability_otel_http_port }}"
            storage:
              trace:
                backend: s3
                s3:
                  endpoint: "{{ object_store_endpoint | replace('http://', '') }}"
                  bucket: "tempo-traces"
                  access_key: "{{ object_store_tempo_access_key }}"
                  secret_key: "{{ object_store_tempo_secret_key }}"
                  insecure: true
                  forcepathstyle: true
            retention: "{{ observability_loki_retention_hours }}h"
          persistence:
            enabled: false
          affinity: "{{ _platform_affinity | default({}) }}"
          serviceMonitor:
            enabled: true

    - name: "observability | Wait for Tempo StatefulSet"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: StatefulSet
        name: tempo
        namespace: "{{ observability_namespace }}"
      register: _obs_tempo_sts
      until:
        - (_obs_tempo_sts.resources | default([])) | length > 0
        - (_obs_tempo_sts.resources[0].status.readyReplicas | default(0) | int) >= 1
      retries: 60
      delay: 5

- name: "observability | Tempo already installed — skipping"
  ansible.builtin.debug:
    msg: "Tempo already deployed in {{ observability_namespace }} — skipping."
  when: _obs_tempo_release.status is defined and _obs_tempo_release.status is not none

# =============================================================================
# 4. OpenTelemetry Collector (DaemonSet mode)
#    Runs on every node. Collects pod stdout/stderr logs and OTLP traces,
#    fans out to Loki (logs) and Tempo (traces).
#    Also scrapes Prometheus metrics from annotated pods as a backup path.
# =============================================================================

- name: "observability | Install OpenTelemetry Collector"
  when: _obs_otel_release.status is not defined or _obs_otel_release.status is none
  block:
    - name: "observability | Deploy OpenTelemetry Collector"
      kubernetes.core.helm:
        name: opentelemetry-collector
        chart_ref: open-telemetry/opentelemetry-collector
        release_namespace: "{{ observability_namespace }}"
        create_namespace: false
        chart_version: "{{ observability_otel_collector_version }}"
        wait: "{{ helm_wait }}"
        timeout: "{{ helm_timeout }}"
        values: "{{ lookup('template', 'otel-collector-values.yaml.j2') | from_yaml }}"

    - name: "observability | Wait for OTel Collector DaemonSet"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: DaemonSet
        name: opentelemetry-collector-agent
        namespace: "{{ observability_namespace }}"
      register: _obs_otel_ds
      until:
        - (_obs_otel_ds.resources | default([])) | length > 0
        - (_obs_otel_ds.resources[0].status.desiredNumberScheduled | default(0) | int) > 0
        - (_obs_otel_ds.resources[0].status.numberReady | default(0) | int) == (_obs_otel_ds.resources[0].status.desiredNumberScheduled | int)
      retries: 60
      delay: 5

- name: "observability | OTel Collector already installed — skipping"
  ansible.builtin.debug:
    msg: "OpenTelemetry Collector already deployed in {{ observability_namespace }} — skipping."
  when: _obs_otel_release.status is defined and _obs_otel_release.status is not none

# =============================================================================
# 5. Prometheus Adapter
#    Exposes Prometheus metrics via the K8s custom.metrics.k8s.io API so that
#    HorizontalPodAutoscalers can scale on any Prometheus metric.
# =============================================================================

- name: "observability | Install Prometheus Adapter"
  when: _obs_prom_adapter_release.status is not defined or _obs_prom_adapter_release.status is none
  block:
    - name: "observability | Deploy Prometheus Adapter"
      kubernetes.core.helm:
        name: prometheus-adapter
        chart_ref: prometheus-community/prometheus-adapter
        release_namespace: "{{ observability_namespace }}"
        create_namespace: false
        chart_version: "{{ observability_prometheus_adapter_version }}"
        wait: "{{ helm_wait }}"
        timeout: "{{ helm_timeout }}"
        values:
          prometheus:
            url: "http://kube-prometheus-stack-prometheus.{{ observability_namespace }}.svc.cluster.local"
            port: 9090
          affinity: "{{ _platform_affinity | default({}) }}"
          rules:
            default: true

    - name: "observability | Wait for Prometheus Adapter"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: prometheus-adapter
        namespace: "{{ observability_namespace }}"
      register: _obs_prom_adapter
      until:
        - (_obs_prom_adapter.resources | default([])) | length > 0
        - (_obs_prom_adapter.resources | default([]))[0].status.conditions | default([]) | selectattr('type', 'eq', 'Available') | selectattr('status', 'eq', 'True') | list | length > 0
      retries: 60
      delay: 5

- name: "observability | Prometheus Adapter already installed — skipping"
  ansible.builtin.debug:
    msg: "Prometheus Adapter already deployed in {{ observability_namespace }} — skipping."
  when: _obs_prom_adapter_release.status is defined and _obs_prom_adapter_release.status is not none

# =============================================================================
# 6. Grafana HTTPRoute (expose via Envoy Gateway)
# =============================================================================

- name: "observability | Expose Grafana via gateway HTTPRoute"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: grafana
        namespace: "{{ observability_namespace }}"
      spec:
        parentRefs:
          - name: "{{ gateway_name }}"
            namespace: "{{ gateway_namespace }}"
        hostnames:
          - "{{ observability_grafana_hostname }}"
        rules:
          - backendRefs:
              - name: kube-prometheus-stack-grafana
                port: 80
  when: gateway_create | default(false) | bool

- name: "observability | Bypass gateway auth for Grafana (Grafana has its own login)"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.envoyproxy.io/v1alpha1
      kind: SecurityPolicy
      metadata:
        name: grafana-no-auth
        namespace: "{{ observability_namespace }}"
      spec:
        targetRefs:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
            name: grafana
  when: gateway_create | default(false) | bool and auth_provider | default('none') in ['keycloak', 'litellm']

- name: "observability | Store Grafana admin credentials as a cluster Secret"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: grafana-admin-credentials
        namespace: "{{ observability_namespace }}"
      type: Opaque
      stringData:
        username: "{{ observability_grafana_admin_user }}"
        password: "{{ observability_grafana_admin_password }}"

# =============================================================================
# 7. ServiceMonitors for observability components
#    Loki and OTel Collector don't ship with ServiceMonitors enabled.
#    These let Prometheus scrape their internal metrics.
# =============================================================================

- name: "observability | Create Loki ServiceMonitor"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: loki
        namespace: "{{ observability_namespace }}"
        labels:
          app: loki
      spec:
        selector:
          matchLabels:
            app.kubernetes.io/name: loki
        namespaceSelector:
          matchNames:
            - "{{ observability_namespace }}"
        endpoints:
          - port: http-metrics
            path: /metrics
            interval: 30s

- name: "observability | Create OTel Collector ServiceMonitor"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: opentelemetry-collector
        namespace: "{{ observability_namespace }}"
        labels:
          app: opentelemetry-collector
      spec:
        selector:
          matchLabels:
            app.kubernetes.io/name: opentelemetry-collector
        namespaceSelector:
          matchNames:
            - "{{ observability_namespace }}"
        endpoints:
          - port: metrics
            path: /metrics
            interval: 30s

# MinIO ServiceMonitor — created here (after Prometheus Operator CRDs are installed)
# because minio role runs before observability and disables the built-in serviceMonitor.
- name: "observability | Create MinIO ServiceMonitor"
  when: object_store_backend | default('minio') == 'minio'
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: minio
        namespace: "{{ observability_namespace }}"
        labels:
          app: minio
      spec:
        selector:
          matchLabels:
            app: minio
            monitoring: "true"
            release: minio
        namespaceSelector:
          matchNames:
            - "{{ minio_namespace | default('minio') }}"
        endpoints:
          - port: http
            path: /minio/v2/metrics/cluster
            interval: 30s

- name: "observability | Install complete"
  ansible.builtin.debug:
    msg: >-
      Observability stack deployed in namespace '{{ observability_namespace }}'.
      Components: kube-prometheus-stack {{ observability_kube_prometheus_stack_version }},
      Loki {{ observability_loki_version }}, Tempo {{ observability_tempo_version }},
      OTel Collector {{ observability_otel_collector_version }}.
      Grafana: https://{{ observability_grafana_hostname }}
      OTLP gRPC: {{ observability_otel_grpc_endpoint }}
      OTLP HTTP: {{ observability_otel_http_endpoint }}
