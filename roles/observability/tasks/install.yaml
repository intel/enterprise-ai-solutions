---
# =============================================================================
# Observability — Install
# _observability_from_olm (vars/<platform>.yaml) picks the stack:
#   false  the Helm charts, installed by this role (install_helm.yaml)
#   true   instances of the operators the admin installed from OperatorHub, with
#          the cluster's own monitoring for metrics (install_olm.yaml)
# Both get the same namespace, credentials, object store buckets, datasource uids,
# dashboards and Grafana route.
# =============================================================================

- name: "observability | Check the cluster's operators and monitoring"
  when: _observability_from_olm | bool
  block:
    - name: "observability | Check the operators' CRDs"
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: "{{ item.crd }}"
      loop: "{{ observability_openshift_required_crds }}"
      loop_control:
        label: "{{ item.operator }}"
      register: _obs_os_crds

    - name: "observability | Operators are installed"
      ansible.builtin.assert:
        that: _obs_os_missing | length == 0
        fail_msg: >-
          Install from OperatorHub first: {{ _obs_os_missing | join(', ') }}.
          See docs/deploy/openshift.md, or set observability_enabled: false.
        quiet: true
      vars:
        _obs_os_missing: >-
          {{ _obs_os_crds.results | selectattr('resources', 'equalto', []) | map(attribute='item.operator') | list }}

    - name: "observability | Read cluster monitoring config"
      kubernetes.core.k8s_info:
        kind: ConfigMap
        name: cluster-monitoring-config
        namespace: openshift-monitoring
      register: _obs_os_cmc

    - name: "observability | User-workload monitoring is on"
      ansible.builtin.assert:
        that: (_obs_os_cmc_config.enableUserWorkload | default(false)) | bool
        fail_msg: >-
          User-workload monitoring is off, so nothing scrapes the installer's services.
          Set enableUserWorkload: true in openshift-monitoring/cluster-monitoring-config
          (see docs/deploy/openshift.md), or set observability_enabled: false.
        quiet: true
      vars:
        _obs_os_cmc_config: >-
          {{ ((_obs_os_cmc.resources | first | default({})).data | default({}))['config.yaml'] | default('{}') | from_yaml or {} }}

    # cluster_default_storageclass: set by preflight.
    - name: "observability | Pick the StorageClass"
      ansible.builtin.set_fact:
        _obs_os_storage_class: "{{ observability_openshift_storage_class or cluster_default_storageclass | default('') }}"

    - name: "observability | A StorageClass is set"
      ansible.builtin.assert:
        that: _obs_os_storage_class | length > 0
        fail_msg: "The cluster has no default StorageClass: set observability_openshift_storage_class."
        quiet: true

- name: "observability | Namespace"
  ansible.builtin.include_tasks: namespace.yaml

- name: "observability | Bootstrap credentials"
  ansible.builtin.include_tasks: credentials.yaml

- name: "observability | Load object_store credentials"
  ansible.builtin.include_tasks: object_store_credentials.yaml

- name: "observability | Install the stack"
  ansible.builtin.include_tasks: "{{ 'install_olm.yaml' if _observability_from_olm | bool else 'install_helm.yaml' }}"
