---
# =============================================================================
# Observability — Loki and Tempo keys from the object_store backend's Secret
# The backend role (seaweedfs, …) runs before observability and stores them there.
# =============================================================================

- name: "observability | object_store | Load object_store credentials Secret"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ object_store_credentials_secret }}"
    namespace: "{{ object_store_namespace }}"
  register: _obs_object_store_secret

- name: "observability | object_store | The object store is installed"
  ansible.builtin.assert:
    that: _obs_object_store_secret.resources | length > 0
    fail_msg: >-
      No {{ object_store_namespace }}/{{ object_store_credentials_secret }} Secret: Loki and
      Tempo keep their data in the object store. Install the platform layer with
      object_store_backend: seaweedfs.
    quiet: true

- name: "observability | object_store | Set object_store credentials from Secret"
  vars:
    _d: "{{ _obs_object_store_secret.resources[0].data }}"
  ansible.builtin.set_fact:
    object_store_endpoint: "{{ _d.endpoint | b64decode }}"
    object_store_loki_access_key: "{{ _d.lokiAccessKey | b64decode }}"
    object_store_loki_secret_key: "{{ _d.lokiSecretKey | b64decode }}"
    object_store_tempo_access_key: "{{ _d.tempoAccessKey | b64decode }}"
    object_store_tempo_secret_key: "{{ _d.tempoSecretKey | b64decode }}"
