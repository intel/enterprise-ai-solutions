---
# =============================================================================
# Observability — Loki and Tempo keys from the object_store backend's Secret
# The backend role (seaweedfs, …) runs before observability and stores them there.
# With object_store_backend: external there is no backend role and no Secret: the
# endpoint and keys come from global_config.yaml.
# =============================================================================

- name: "observability | object_store | The external object store is configured"
  ansible.builtin.assert:
    that: _obs_os_unset | length == 0
    fail_msg: >-
      object_store_backend is external, so Loki and Tempo use the object store set in
      global_config.yaml, but {{ _obs_os_unset | join(', ') }} {{ 'is' if _obs_os_unset | length == 1 else 'are' }} empty.
    quiet: true
  vars:
    _obs_os_unset: >-
      {{ [
        ('object_store_endpoint' if (object_store_endpoint | default('', true) | string | trim | length == 0) else ''),
        ('object_store_loki_access_key' if (object_store_loki_access_key | default('', true) | string | trim | length == 0) else ''),
        ('object_store_loki_secret_key' if (object_store_loki_secret_key | default('', true) | string | trim | length == 0) else ''),
        ('object_store_tempo_access_key' if (object_store_tempo_access_key | default('', true) | string | trim | length == 0) else ''),
        ('object_store_tempo_secret_key' if (object_store_tempo_secret_key | default('', true) | string | trim | length == 0) else '')
      ] | reject('equalto', '') | list }}
  when: object_store_backend | default('seaweedfs') == 'external'

- name: "observability | object_store | Keys from the backend's Secret"
  when: object_store_backend | default('seaweedfs') != 'external'
  block:
    - name: "observability | object_store | Load object_store credentials Secret"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "{{ object_store_credentials_secret }}"
        namespace: "{{ object_store_namespace }}"
      register: _obs_object_store_secret

    - name: "observability | object_store | The object store is installed"
      ansible.builtin.assert:
        that:
          - _obs_object_store_secret.resources | length > 0
          - _obs_os_missing | length == 0
        fail_msg: >-
          {{ 'No ' ~ object_store_namespace ~ '/' ~ object_store_credentials_secret ~ ' Secret'
             if _obs_object_store_secret.resources | length == 0
             else object_store_namespace ~ '/' ~ object_store_credentials_secret ~ ' lacks '
                  ~ _obs_os_missing | join(', ') }}: Loki and Tempo keep their data in the
          object store. Install the platform layer with object_store_backend: seaweedfs.
        quiet: true
      vars:
        _obs_os_missing: >-
          {{ ['endpoint', 'lokiAccessKey', 'lokiSecretKey', 'tempoAccessKey', 'tempoSecretKey']
             | difference((_obs_object_store_secret.resources | first | default({})).data | default({}) | list) }}

    - name: "observability | object_store | Set object_store credentials from Secret"
      vars:
        _d: "{{ _obs_object_store_secret.resources[0].data }}"
      ansible.builtin.set_fact:
        object_store_endpoint: "{{ _d.endpoint | b64decode }}"
        object_store_loki_access_key: "{{ _d.lokiAccessKey | b64decode }}"
        object_store_loki_secret_key: "{{ _d.lokiSecretKey | b64decode }}"
        object_store_tempo_access_key: "{{ _d.tempoAccessKey | b64decode }}"
        object_store_tempo_secret_key: "{{ _d.tempoSecretKey | b64decode }}"
