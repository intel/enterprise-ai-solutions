---
- name: "observability | namespace | Create namespace"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ observability_namespace }}"

- name: "observability | namespace | Label namespace — Istio"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ observability_namespace }}"
        labels: "{{ istio_namespace_labels }}"
  when: istio_enabled | default(false) | bool
