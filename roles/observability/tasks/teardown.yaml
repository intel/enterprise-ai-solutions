---
# =============================================================================
# Observability — Teardown
# The Helm stack goes in reverse install order: OTel Collector → Tempo → Loki →
# kube-prometheus-stack. With _observability_from_olm only the instances
# install_olm.yaml created go; the operators, their CRDs and the cluster's
# monitoring belong to the admin and stay.
# The telemetry SeaweedFS shares the namespace. While it stays (Langfuse still
# uses it: used_by in configs/components.yaml), so does the namespace, and only
# this role's own objects and PVCs go.
# =============================================================================

- name: "observability | Look for the telemetry SeaweedFS outside the plan"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ object_store_credentials_secret }}"
    namespace: "{{ object_store_namespace }}"
  register: _obs_td_object_store
  failed_when: false
  when:
    - object_store_namespace == observability_namespace
    - "'seaweedfs' not in (_active_components | default([]) | map(attribute='name'))"

- name: "observability | Keep the namespace for the telemetry SeaweedFS"
  ansible.builtin.set_fact:
    _obs_keep_namespace: "{{ _obs_td_object_store.resources | default([]) | length > 0 }}"

- name: "observability | Check if any release exists"
  kubernetes.core.helm_info:
    name: kube-prometheus-stack
    release_namespace: "{{ observability_namespace }}"
  register: _obs_prom_check
  failed_when: false
  when: not _observability_from_olm | bool

- name: "observability | Not installed — skipping teardown"
  ansible.builtin.debug:
    msg: "No observability stack found in {{ observability_namespace }}. Nothing to tear down."
  when:
    - not _observability_from_olm | bool
    - _obs_prom_check.status is not defined

- name: "observability | Teardown the Helm stack"
  when:
    - not _observability_from_olm | bool
    - _obs_prom_check.status is defined
  block:
    # ── Prometheus Adapter (must go first — owns the custom.metrics APIService) ─

    - name: "observability | Check Prometheus Adapter release"
      kubernetes.core.helm_info:
        name: prometheus-adapter
        release_namespace: "{{ observability_namespace }}"
      register: _obs_prom_adapter_check
      failed_when: false

    - name: "observability | Uninstall Prometheus Adapter"
      kubernetes.core.helm:
        name: prometheus-adapter
        release_namespace: "{{ observability_namespace }}"
        state: absent
        wait: "{{ helm_wait }}"
        timeout: "{{ helm_timeout }}"
      failed_when: false
      when: _obs_prom_adapter_check.status is defined

    - name: "observability | Delete orphaned custom.metrics APIService"
      kubernetes.core.k8s:
        api_version: apiregistration.k8s.io/v1
        kind: APIService
        name: v1beta1.custom.metrics.k8s.io
        state: absent
      failed_when: false

    - name: "observability | Delete the mesh policies"
      kubernetes.core.k8s:
        api_version: security.istio.io/v1
        kind: "{{ item.kind }}"
        name: "{{ item.name }}"
        namespace: "{{ observability_namespace }}"
        state: absent
      loop:
        - {kind: PeerAuthentication, name: allow-webhook-operator}
        - {kind: PeerAuthentication, name: allow-metrics-adapter}
        - {kind: AuthorizationPolicy, name: authz-webhook-operator}
        - {kind: AuthorizationPolicy, name: authz-metrics-adapter}
      loop_control:
        label: "{{ item.kind }} {{ item.name }}"
      when: _obs_keep_namespace | bool
      failed_when: false

    # ── Gateway route ─────────────────────────────────────────────────────────

    - name: "observability | Take Grafana off the gateway"
      ansible.builtin.include_tasks: grafana_route_remove.yaml

    # ── OTel Collector ────────────────────────────────────────────────────────

    - name: "observability | Check OTel Collector release"
      kubernetes.core.helm_info:
        name: opentelemetry-collector
        release_namespace: "{{ observability_namespace }}"
      register: _obs_otel_check
      failed_when: false

    - name: "observability | Uninstall OTel Collector"
      kubernetes.core.helm:
        name: opentelemetry-collector
        release_namespace: "{{ observability_namespace }}"
        state: absent
        wait: "{{ helm_wait }}"
        timeout: "{{ helm_timeout }}"
      failed_when: false
      when: _obs_otel_check.status is defined

    # ── Tempo ─────────────────────────────────────────────────────────────────

    - name: "observability | Check Tempo release"
      kubernetes.core.helm_info:
        name: tempo
        release_namespace: "{{ observability_namespace }}"
      register: _obs_tempo_check
      failed_when: false

    - name: "observability | Uninstall Tempo"
      kubernetes.core.helm:
        name: tempo
        release_namespace: "{{ observability_namespace }}"
        state: absent
        wait: "{{ helm_wait }}"
        timeout: "{{ helm_timeout }}"
      failed_when: false
      when: _obs_tempo_check.status is defined

    # ── Loki ──────────────────────────────────────────────────────────────────

    - name: "observability | Check Loki release"
      kubernetes.core.helm_info:
        name: loki
        release_namespace: "{{ observability_namespace }}"
      register: _obs_loki_check
      failed_when: false

    - name: "observability | Uninstall Loki"
      kubernetes.core.helm:
        name: loki
        release_namespace: "{{ observability_namespace }}"
        state: absent
        wait: "{{ helm_wait }}"
        timeout: "{{ helm_timeout }}"
      failed_when: false
      when: _obs_loki_check.status is defined

    # ── kube-prometheus-stack ─────────────────────────────────────────────────

    - name: "observability | Uninstall kube-prometheus-stack"
      kubernetes.core.helm:
        name: kube-prometheus-stack
        release_namespace: "{{ observability_namespace }}"
        state: absent
        wait: "{{ helm_wait }}"
        timeout: "{{ helm_timeout }}"
      failed_when: false

    # ── CRDs left behind by Prometheus Operator ───────────────────────────────

    - name: "observability | Find Prometheus Operator CRDs"
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
      register: _obs_all_crds
      failed_when: false

    # Selected on spec.group rather than a name regex: in the folded scalar this
    # expression used to live in, YAML performs no escape processing, so the
    # '\\.' reached `re` as an escaped backslash and the pattern matched nothing —
    # which is why these CRDs survived every teardown.
    - name: "observability | Delete Prometheus Operator CRDs"
      kubernetes.core.k8s:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: "{{ item.metadata.name }}"
        state: absent
      loop: "{{ _obs_all_crds.resources | default([]) | selectattr('spec.group', 'in', ['monitoring.coreos.com', 'grafana.integreatly.org']) | list }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      failed_when: false

# ── The OperatorHub stack ────────────────────────────────────────────────────
# Its instances go first, so each operator cleans up what it made.

- name: "observability | olm | Look up the namespace"
  when: _observability_from_olm | bool
  kubernetes.core.k8s_info:
    kind: Namespace
    name: "{{ observability_namespace }}"
  register: _obs_os_ns

- name: "observability | olm | Not installed — skipping teardown"
  ansible.builtin.debug:
    msg: "Namespace {{ observability_namespace }} not found. Nothing to tear down."
  when:
    - _observability_from_olm | bool
    - _obs_os_ns.resources | length == 0

- name: "observability | olm | Teardown"
  when:
    - _observability_from_olm | bool
    - _obs_os_ns.resources | length > 0
  block:
    - name: "observability | olm | Take Grafana off the gateway"
      ansible.builtin.include_tasks: grafana_route_remove.yaml

    - name: "observability | olm | Delete the operator instances"
      kubernetes.core.k8s:
        api_version: "{{ item.api_version }}"
        kind: "{{ item.kind }}"
        name: "{{ item.name }}"
        namespace: "{{ item.namespace | default(observability_namespace) }}"
        state: absent
        wait: true
      loop: "{{ observability_openshift_instances | reverse | list }}"
      loop_control:
        label: "{{ item.kind }} {{ item.name }}"
      failed_when: false

    # Cluster-scoped, so the namespace does not take them along.
    - name: "observability | olm | Delete cluster RBAC"
      kubernetes.core.k8s:
        api_version: rbac.authorization.k8s.io/v1
        kind: "{{ item.kind }}"
        name: "{{ observability_namespace }}-{{ item.name }}"
        state: absent
      loop:
        - {kind: ClusterRoleBinding, name: log-collector-collect-application-logs}
        - {kind: ClusterRoleBinding, name: log-collector-logging-collector-logs-writer}
        - {kind: ClusterRoleBinding, name: otel-collector}
        - {kind: ClusterRole, name: otel-collector}
        - {kind: ClusterRoleBinding, name: grafana-application-logs-view}
        - {kind: ClusterRoleBinding, name: grafana-cluster-monitoring-view}
        - {kind: ClusterRole, name: application-logs-view}
        - {kind: ClusterRoleBinding, name: grafana-dashboards}
        - {kind: ClusterRole, name: grafana-dashboards}
      loop_control:
        label: "{{ item.kind }} {{ observability_namespace }}-{{ item.name }}"
      failed_when: false

    # Ours alone (the ClusterLogForwarder's), so it goes even when the stack's stays.
    - name: "observability | olm | Delete the log collector namespace"
      kubernetes.core.k8s:
        kind: Namespace
        name: "{{ observability_openshift_log_collector_namespace }}"
        state: absent
        wait: true
      failed_when: false

    - name: "observability | olm | Find the datasources"
      kubernetes.core.k8s_info:
        api_version: grafana.integreatly.org/v1beta1
        kind: GrafanaDatasource
        namespace: "{{ observability_namespace }}"
      register: _obs_os_datasources
      when: _obs_keep_namespace | bool
      failed_when: false

    - name: "observability | olm | Delete the datasources and the stack's accounts"
      kubernetes.core.k8s:
        api_version: "{{ item.apiVersion }}"
        kind: "{{ item.kind }}"
        name: "{{ item.metadata.name }}"
        namespace: "{{ observability_namespace }}"
        state: absent
      loop: "{{ _obs_os_datasources.resources | default([]) + _obs_os_own }}"
      vars:
        _obs_os_own:
          - {apiVersion: v1, kind: ConfigMap, metadata: {name: grafana-dashboard-provider}}
          - {apiVersion: v1, kind: Secret, metadata: {name: logging-loki-s3}}
          - {apiVersion: v1, kind: Secret, metadata: {name: tempo-s3}}
          - {apiVersion: v1, kind: Secret, metadata: {name: grafana-datasources-token}}
          - {apiVersion: v1, kind: ServiceAccount, metadata: {name: log-collector}}
          - {apiVersion: v1, kind: ServiceAccount, metadata: {name: otel-collector}}
          - {apiVersion: v1, kind: ServiceAccount, metadata: {name: grafana-datasources}}
      loop_control:
        label: "{{ item.kind }} {{ item.metadata.name }}"
      when: _obs_keep_namespace | bool
      failed_when: false

# ── Both stacks: credentials, PVCs and the namespace ─────────────────────────

- name: "observability | Credentials, PVCs and namespace"
  when: >-
    (_obs_os_ns.resources | default([]) | length > 0) if _observability_from_olm | bool
    else _obs_prom_check.status is defined
  block:
    - name: "observability | Delete the credentials in a namespace that stays"
      kubernetes.core.k8s:
        api_version: v1
        kind: Secret
        name: "{{ item }}"
        namespace: "{{ observability_namespace }}"
        state: absent
      # kube-prometheus-stack-admission: a Helm hook's, so the uninstall leaves it.
      loop: [observability-credentials, grafana-admin-credentials, grafana-sso, kube-prometheus-stack-admission]
      when: _obs_keep_namespace | bool
      failed_when: false

    # The namespace takes them along on OpenShift; the Helm stack's go explicitly,
    # as before. SeaweedFS's are its own role's (found by name, as there).
    - name: "observability | List PVCs"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: PersistentVolumeClaim
        namespace: "{{ observability_namespace }}"
      register: _obs_pvcs
      when: not _observability_from_olm | bool or _obs_keep_namespace | bool
      failed_when: false

    - name: "observability | Delete PVCs"
      kubernetes.core.k8s:
        api_version: v1
        kind: PersistentVolumeClaim
        name: "{{ item.metadata.name }}"
        namespace: "{{ observability_namespace }}"
        state: absent
      loop: "{{ _obs_pvcs.resources | default([]) | rejectattr('metadata.name', 'search', _obs_seaweedfs_fullname) | list }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      failed_when: false

    - name: "observability | Keep the namespace"
      ansible.builtin.debug:
        msg: "Namespace {{ observability_namespace }} stays: the telemetry SeaweedFS in it is still used."
      when: _obs_keep_namespace | bool

    - name: "observability | Delete namespace"
      kubernetes.core.k8s:
        kind: Namespace
        name: "{{ observability_namespace }}"
        state: absent
        wait: "{{ _observability_from_olm | bool }}"
      when: not _obs_keep_namespace | bool
      failed_when: false
