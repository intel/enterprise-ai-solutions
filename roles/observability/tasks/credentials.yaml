---
# =============================================================================
# Observability — Credential bootstrap
# Pattern: K8s Secret is source of truth.
#   First run:  generate → deploy → store in Secret
#   Subsequent: read from Secret → deploy (idempotent, same passwords)
# =============================================================================

- name: "observability | credentials | Check for existing credentials Secret"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: observability-credentials
    namespace: "{{ observability_namespace }}"
  register: _obs_creds_secret
  failed_when: false

- name: "observability | credentials | Load passwords from existing Secret"
  ansible.builtin.set_fact:
    observability_grafana_admin_password: "{{ _obs_creds_secret.resources[0].data.grafanaAdminPassword | b64decode }}"
  when: (_obs_creds_secret.resources | default([])) | length > 0

- name: "observability | credentials | Generate new passwords (first install)"
  ansible.builtin.set_fact:
    observability_grafana_admin_password: "{{ lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}"
  when: (_obs_creds_secret.resources | default([])) | length == 0

- name: "observability | credentials | Store credentials Secret"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: observability-credentials
        namespace: "{{ observability_namespace }}"
        labels:
          app.kubernetes.io/managed-by: ansible
          app.kubernetes.io/component: observability
      type: Opaque
      stringData:
        grafanaAdminUser: "{{ observability_grafana_admin_user }}"
        grafanaAdminPassword: "{{ observability_grafana_admin_password }}"
        grafanaUrl: "{{ observability_grafana_url }}"
