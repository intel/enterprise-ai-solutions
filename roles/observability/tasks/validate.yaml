---
# =============================================================================
# Observability — Validate
# =============================================================================

# ── kube-prometheus-stack ─────────────────────────────────────────────────────

- name: "observability | Check kube-prometheus-stack release"
  kubernetes.core.helm_info:
    name: kube-prometheus-stack
    release_namespace: "{{ observability_namespace }}"
  register: _obs_prom_release

- name: "observability | Assert kube-prometheus-stack is installed"
  ansible.builtin.assert:
    that: _obs_prom_release.status is defined
    fail_msg: "kube-prometheus-stack is not installed in {{ observability_namespace }}"
    success_msg: "kube-prometheus-stack release found"

- name: "observability | Check Prometheus Operator deployment"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: kube-prometheus-stack-operator
    namespace: "{{ observability_namespace }}"
  register: _obs_prom_operator

- name: "observability | Assert Prometheus Operator is ready"
  ansible.builtin.assert:
    that:
      - _obs_prom_operator.resources | length > 0
      - (_obs_prom_operator.resources[0].status.readyReplicas | default(0) | int) >= 1
    fail_msg: "Prometheus Operator has no ready replicas"
    success_msg: "Prometheus Operator ready"

- name: "observability | Check Grafana deployment"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: kube-prometheus-stack-grafana
    namespace: "{{ observability_namespace }}"
  register: _obs_grafana

- name: "observability | Assert Grafana is ready"
  ansible.builtin.assert:
    that:
      - _obs_grafana.resources | length > 0
      - (_obs_grafana.resources[0].status.readyReplicas | default(0) | int) >= 1
    fail_msg: "Grafana has no ready replicas"
    success_msg: "Grafana ready ({{ _obs_grafana.resources[0].status.readyReplicas | default(0) }} replicas)"

- name: "observability | Check Node Exporter DaemonSet"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: DaemonSet
    name: kube-prometheus-stack-prometheus-node-exporter
    namespace: "{{ observability_namespace }}"
  register: _obs_node_exporter

- name: "observability | Assert Node Exporter is fully scheduled"
  ansible.builtin.assert:
    that:
      - _obs_node_exporter.resources | length > 0
      - (_obs_node_exporter.resources[0].status.desiredNumberScheduled | default(0) | int) > 0
      - (_obs_node_exporter.resources[0].status.numberReady | default(0) | int) == (_obs_node_exporter.resources[0].status.desiredNumberScheduled | int)
    fail_msg: "Node Exporter DaemonSet not fully ready"
    success_msg: "Node Exporter ready on all {{ _obs_node_exporter.resources[0].status.numberReady }} nodes"

# ── Loki ─────────────────────────────────────────────────────────────────────

- name: "observability | Check Loki release"
  kubernetes.core.helm_info:
    name: loki
    release_namespace: "{{ observability_namespace }}"
  register: _obs_loki_release

- name: "observability | Assert Loki is installed"
  ansible.builtin.assert:
    that: _obs_loki_release.status is defined
    fail_msg: "Loki is not installed in {{ observability_namespace }}"
    success_msg: "Loki release found"

- name: "observability | Check Loki StatefulSet"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
    name: loki
    namespace: "{{ observability_namespace }}"
  register: _obs_loki_sts

- name: "observability | Assert Loki has ready replicas"
  ansible.builtin.assert:
    that:
      - _obs_loki_sts.resources | length > 0
      - (_obs_loki_sts.resources[0].status.readyReplicas | default(0) | int) >= 1
    fail_msg: "Loki StatefulSet has no ready replicas"
    success_msg: "Loki ready ({{ _obs_loki_sts.resources[0].status.readyReplicas | default(0) }} replicas)"

# ── Tempo ─────────────────────────────────────────────────────────────────────

- name: "observability | Check Tempo release"
  kubernetes.core.helm_info:
    name: tempo
    release_namespace: "{{ observability_namespace }}"
  register: _obs_tempo_release

- name: "observability | Assert Tempo is installed"
  ansible.builtin.assert:
    that: _obs_tempo_release.status is defined
    fail_msg: "Tempo is not installed in {{ observability_namespace }}"
    success_msg: "Tempo release found"

- name: "observability | Check Tempo StatefulSet"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
    name: tempo
    namespace: "{{ observability_namespace }}"
  register: _obs_tempo_sts

- name: "observability | Assert Tempo is ready"
  ansible.builtin.assert:
    that:
      - _obs_tempo_sts.resources | length > 0
      - (_obs_tempo_sts.resources[0].status.readyReplicas | default(0) | int) >= 1
    fail_msg: "Tempo StatefulSet has no ready replicas"
    success_msg: "Tempo ready ({{ _obs_tempo_sts.resources[0].status.readyReplicas | default(0) }} replicas)"

# ── OTel Collector ────────────────────────────────────────────────────────────

- name: "observability | Check OTel Collector release"
  kubernetes.core.helm_info:
    name: opentelemetry-collector
    release_namespace: "{{ observability_namespace }}"
  register: _obs_otel_release

- name: "observability | Assert OTel Collector is installed"
  ansible.builtin.assert:
    that: _obs_otel_release.status is defined
    fail_msg: "OpenTelemetry Collector is not installed in {{ observability_namespace }}"
    success_msg: "OpenTelemetry Collector release found"

- name: "observability | Check OTel Collector DaemonSet"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: DaemonSet
    name: opentelemetry-collector-agent
    namespace: "{{ observability_namespace }}"
  register: _obs_otel_ds

- name: "observability | Assert OTel Collector is running on all nodes"
  ansible.builtin.assert:
    that:
      - _obs_otel_ds.resources | length > 0
      - (_obs_otel_ds.resources[0].status.desiredNumberScheduled | default(0) | int) > 0
      - (_obs_otel_ds.resources[0].status.numberReady | default(0) | int) == (_obs_otel_ds.resources[0].status.desiredNumberScheduled | int)
    fail_msg: "OTel Collector DaemonSet not fully ready"
    success_msg: "OTel Collector running on all {{ _obs_otel_ds.resources[0].status.numberReady }} nodes"

- name: "observability | Validation passed"
  ansible.builtin.debug:
    msg: >-
      Observability stack validation passed.
      Grafana: {{ observability_grafana_url }}
      All components healthy in namespace '{{ observability_namespace }}'.
