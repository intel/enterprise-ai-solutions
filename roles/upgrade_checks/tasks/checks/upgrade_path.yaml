---
# upgrade and conflict runs are judged; the rest is skipped (filter_plugins/upgrade_checks.py).
- name: "upgrade_checks | upgrade-path"
  ansible.builtin.set_fact:
    _upgrade_verdicts: >-
      {{ _upgrade_verdicts + [_layer_version_data[item] | upgrade_path_verdict(item, _layer_records.get(item),
                                                                             _layer_class[item], _layer_release[item],
                                                                             env_name | default('local'))] }}
  loop: "{{ _check_layers }}"
