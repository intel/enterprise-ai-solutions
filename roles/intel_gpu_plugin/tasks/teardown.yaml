#
# Removes the plugin whether or not GPUs are still detected, so a node whose GPUs were
# pulled keeps no stale plugin. The kubelet drops gpu.intel.com/* once the socket is gone.

- name: "intel_gpu_plugin | teardown | Delete the plugin"
  kubernetes.core.k8s:
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    name: intel-gpu-plugin
    namespace: kube-system
    state: absent
    wait: true
  loop:
    - {api_version: apps/v1, kind: DaemonSet}
    - {api_version: networking.k8s.io/v1, kind: NetworkPolicy}
  loop_control:
    label: "{{ item.kind }}/intel-gpu-plugin"
  environment:
    KUBECONFIG: "{{ kubernetes_kubeconfig }}"
