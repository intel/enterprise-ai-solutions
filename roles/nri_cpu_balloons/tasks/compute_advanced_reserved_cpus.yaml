---
# =============================================================================
# NRI CPU Balloons — compute reserved CPU list (profile-based)
# =============================================================================
# Runs `files/compute_reserved_cpus_advanced.sh` inside every optimizer pod
# to produce a NUMA-balanced cpuset for each worker node.
#
# Sizing is driven by `nri_deployment_profile`:
#   minimal       =  8 logical CPUs (core services only)
#   standard      = 12 logical CPUs (core + auth)   [default]
#   observability = 16 logical CPUs (standard + monitoring)
#   full          = 20 logical CPUs (all components)
#
# The script spreads the chosen total evenly across the node's NUMA domains
# and balances physical / hyperthread siblings.
#
# Operators can bypass this entire path by setting `nri_reserved_cpu_list`
# explicitly — install_advanced.yaml then skips this task file.
# =============================================================================

# =============================================================================
# NOTE ON EXECUTION MODEL (revised — no rooted lscpu pod):
# compute_reserved_cpus_advanced.sh now runs ON THE ANSIBLE CONTROLLER with
# topology INJECTED via NRI_TOPO_* environment variables that were collected
# from each node's /sys tree by the unprivileged busybox probe in
# generate_balloon_types.yaml (stored in _nri_per_node_topology). The script no
# longer needs lscpu, and no script is copied into or executed inside any pod.
# =============================================================================

# Reusable env block builder: given a node's topology dict, emit the NRI_TOPO_*
# environment map the script consumes. Per-NUMA cpulists (node_cpus) expand to
# NRI_TOPO_NODE_<i> keys.
#
# -----------------------------------------------------------------------------
# Cluster-default invocation (feeds the helm-rendered "default" BalloonsPolicy
# CR that backs up any node we haven't discovered yet). Uses the most-capable
# node's topology as the representative default.
# -----------------------------------------------------------------------------
- name: "nri_cpu_balloons | Select representative node for cluster-default reserved calc"
  ansible.builtin.set_fact:
    _nri_default_topo: >-
      {{ (_nri_per_node_topology | dict2items
          | sort(attribute='value.numa') | last).value }}

- name: "nri_cpu_balloons | Compute cluster-default reserved CPU list (profile={{ nri_deployment_profile }})"
  ansible.builtin.command:
    cmd: >-
      bash {{ role_path }}/files/compute_reserved_cpus_advanced.sh
      --profile {{ nri_deployment_profile }}
      --strategy balanced
      --ht-strategy balanced
  environment:
    NRI_TOPO_NUMA: "{{ _nri_default_topo.numa | string }}"
    NRI_TOPO_TPC: "{{ _nri_default_topo.threads_per_core | string }}"
    NRI_TOPO_LOGICAL: "{{ _nri_default_topo.logical_cpus | string }}"
    NRI_TOPO_SIBLINGS: "{{ _nri_default_topo.siblings | default('') }}"
    NRI_TOPO_NODECPUS: "{{ _nri_default_topo.nodecpus_str }}"
  delegate_to: localhost
  changed_when: false
  register: _compute_reserved
  failed_when: _compute_reserved.rc != 0

- name: "nri_cpu_balloons | Reservation exceeds 25% of total CPUs"
  vars:
    _warn_lines: "{{ _compute_reserved.stderr_lines | select('search', 'WARNING') | list }}"
  ansible.builtin.debug:
    msg:
      - "[WARNING] Profile '{{ nri_deployment_profile }}' reserves more than 25% of total vCPUs."
      - "{{ _warn_lines | join(' ') }}"
      - "Remaining CPUs for inference may be limited. Proceeding with deployment."
  when: (_compute_reserved.stderr | default('')) is search('WARNING')
  changed_when: (_compute_reserved.stderr | default('')) is search('WARNING')

- name: "nri_cpu_balloons | Parse NRI_RESERVED_CPU_LIST"
  ansible.builtin.set_fact:
    _nri_reserved_cpu_list: >-
      {{ (_compute_reserved.stdout | regex_findall('NRI_RESERVED_CPU_LIST=(.+)') | first | trim) }}

- name: "nri_cpu_balloons | Validate reserved CPU list"
  ansible.builtin.assert:
    that:
      - _nri_reserved_cpu_list is defined
      - (_nri_reserved_cpu_list | length) > 0
      - (_nri_reserved_cpu_list | regex_search('^[0-9]+([,-][0-9]+)*$')) is not none
    fail_msg: >-
      compute_reserved_cpus_advanced.sh returned an invalid cpuset:
      '{{ _nri_reserved_cpu_list | default('') }}'

- name: "nri_cpu_balloons | Reserved CPU summary"
  vars:
    _expanded_count: >-
      {%- set ns = namespace(total=0) -%}
      {%- for part in (_nri_reserved_cpu_list | trim).split(',') -%}
        {%- if '-' in part -%}
          {%- set lo, hi = part.split('-') -%}
          {%- set ns.total = ns.total + (hi | int) - (lo | int) + 1 -%}
        {%- else -%}
          {%- set ns.total = ns.total + 1 -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.total }}
  ansible.builtin.set_fact:
    _nri_actual_reserved_count: "{{ _expanded_count | int }}"

- name: "nri_cpu_balloons | Display cluster-default reserved CPU plan"
  ansible.builtin.debug:
    msg:
      - "Profile:                   {{ nri_deployment_profile }}"
      - "Reserved cpuset:           {{ _nri_reserved_cpu_list }}"
      - "Reserved CPUs (count):     {{ _nri_actual_reserved_count }}"
      - "Workload CPUs available:   {{ (_nri_detected_total_cpus | int) - (_nri_actual_reserved_count | int) }}"

# -----------------------------------------------------------------------------
# Per-node invocation: run the script ON THE CONTROLLER once per discovered
# node, injecting that node's own topology, so each node's BalloonsPolicy CR
# carries a reserved cpuset tailored to its NUMA and HT layout. No pod exec.
# -----------------------------------------------------------------------------
- name: "nri_cpu_balloons | Compute reserved CPUs per node (controller, injected topology)"
  ansible.builtin.command:
    cmd: >-
      bash {{ role_path }}/files/compute_reserved_cpus_advanced.sh
      --profile {{ nri_deployment_profile }}
      --strategy balanced
      --ht-strategy balanced
  environment:
    NRI_TOPO_NUMA: "{{ item.value.numa | string }}"
    NRI_TOPO_TPC: "{{ item.value.threads_per_core | string }}"
    NRI_TOPO_LOGICAL: "{{ item.value.logical_cpus | string }}"
    NRI_TOPO_SIBLINGS: "{{ item.value.siblings | default('') }}"
    NRI_TOPO_NODECPUS: "{{ item.value.nodecpus_str }}"
  delegate_to: localhost
  changed_when: false
  register: _compute_reserved_per_node
  failed_when: _compute_reserved_per_node.rc != 0
  loop: "{{ _nri_per_node_topology | dict2items }}"
  loop_control:
    label: "{{ item.key }} (profile={{ nri_deployment_profile }})"

- name: "nri_cpu_balloons | Per-node reservation exceeds 25% of total CPUs"
  vars:
    _warn_lines: "{{ item.stderr_lines | select('search', 'WARNING') | list }}"
  ansible.builtin.debug:
    msg:
      - "[WARNING] Node '{{ item.item.key }}' — profile '{{ nri_deployment_profile }}' reserves more than 25% of total vCPUs."
      - "{{ _warn_lines | join(' ') }}"
      - "Remaining CPUs for inference may be limited. Proceeding with deployment."
  when: (item.stderr | default('')) is search('WARNING')
  changed_when: (item.stderr | default('')) is search('WARNING')
  loop: "{{ _compute_reserved_per_node.results }}"
  loop_control:
    label: "{{ item.item.key }}"

- name: "nri_cpu_balloons | Merge per-node reserved into topology fact"
  vars:
    _merged_res: >-
      {%- set out = {} -%}
      {%- for r in _compute_reserved_per_node.results -%}
        {%- set node = r.item.key -%}
        {%- set base = _nri_per_node_topology[node] -%}
        {%- set cpuset = (r.stdout | regex_findall('NRI_RESERVED_CPU_LIST=(.+)') | first | default('') | trim) -%}
        {%- set ns = namespace(total=0) -%}
        {%- if cpuset -%}
          {%- for part in cpuset.split(',') -%}
            {%- if '-' in part -%}
              {%- set lo, hi = part.split('-') -%}
              {%- set ns.total = ns.total + (hi | int) - (lo | int) + 1 -%}
            {%- else -%}
              {%- set ns.total = ns.total + 1 -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}
        {%- set _ = out.update({node: base | combine({'reserved_cpu_list': cpuset, 'reserved_count': ns.total})}) -%}
      {%- endfor -%}
      {{ out }}
  ansible.builtin.set_fact:
    _nri_per_node_topology: "{{ _merged_res }}"

- name: "nri_cpu_balloons | Per-node reserved summary"
  ansible.builtin.debug:
    msg: >-
      node={{ item.key }}
      numa={{ item.value.numa }}
      threads_per_core={{ item.value.threads_per_core }}
      profile={{ nri_deployment_profile }}
      reserved_count={{ item.value.reserved_count }}
      cpuset={{ item.value.reserved_cpu_list }}
  loop: "{{ _nri_per_node_topology | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
