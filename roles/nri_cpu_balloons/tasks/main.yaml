---
# Canonical dispatcher (docs/reference/adding_solutions.md), the same in every
# role with platform values but for the name.
#   vars/<cluster_distribution>.yaml   values that differ by platform;
#                                      the tasks are the same on both
- name: "nri_cpu_balloons | dispatch | Assert supported action"
  ansible.builtin.assert:
    that: component_action | default('') in ['install', 'teardown', 'validate']
    fail_msg: "nri_cpu_balloons: unsupported component_action='{{ component_action | default('') }}'"
    quiet: true

- name: "nri_cpu_balloons | dispatch | Load {{ cluster_distribution }} values"
  ansible.builtin.include_vars: "{{ role_path }}/vars/{{ cluster_distribution }}.yaml"
  when: (role_path ~ '/vars/' ~ cluster_distribution ~ '.yaml') is file

- name: "nri_cpu_balloons | dispatch | Include {{ component_action }}"
  ansible.builtin.include_tasks:
    file: "{{ component_action }}.yaml"
