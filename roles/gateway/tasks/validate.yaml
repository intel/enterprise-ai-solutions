---
# =============================================================================
# Gateway — Validate
# =============================================================================

- name: "gateway | Load the platform record"
  ansible.builtin.include_tasks: platform.yaml

- name: "gateway | Controller is ready"
  ansible.builtin.include_role:
    name: "{{ _gw_provider_role }}"
    tasks_from: controller_validate.yaml

- name: "gateway | Check ListenerSet API"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: listenersets.gateway.networking.k8s.io
  register: _gw_ls_crd
  when: _gw_attach_mode == 'listenerset'

- name: "gateway | Assert ListenerSet API installed"
  ansible.builtin.assert:
    that: _gw_ls_crd.resources | length > 0
    fail_msg: "ListenerSet CRD missing; solutions cannot publish hosts"
    success_msg: >-
      ListenerSet API installed (Gateway API
      {{ _gw_ls_crd.resources[0].metadata.annotations['gateway.networking.k8s.io/bundle-version'] | default('?') }})
  when: _gw_attach_mode == 'listenerset'

- name: "gateway | Check GatewayClass"
  kubernetes.core.k8s_info:
    api_version: gateway.networking.k8s.io/v1
    kind: GatewayClass
    name: "{{ gateway_platform.class_name }}"
  register: _gw_gc

- name: "gateway | Assert GatewayClass exists"
  ansible.builtin.assert:
    that: _gw_gc.resources | length > 0
    fail_msg: "GatewayClass '{{ gateway_platform.class_name }}' not found"
    success_msg: "GatewayClass '{{ gateway_platform.class_name }}' exists"

- name: "gateway | Check Gateway is accepted"
  kubernetes.core.k8s_info:
    api_version: gateway.networking.k8s.io/v1
    kind: Gateway
    name: "{{ gateway_name }}"
    namespace: "{{ gateway_namespace }}"
  register: _gw_status
  when: gateway_create

- name: "gateway | Assert Gateway accepted"
  ansible.builtin.assert:
    that:
      - _gw_status.resources | length > 0
      - _gw_status.resources[0].status.conditions | default([]) | selectattr('type','eq','Accepted') | selectattr('status','eq','True') | list | length > 0
    fail_msg: "Gateway '{{ gateway_name }}' is not in Accepted state"
    success_msg: "Gateway '{{ gateway_name }}' is Accepted"
  when: gateway_create

- name: "gateway | Check TLS secret exists"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ gateway_tls_secret_name }}"
    namespace: "{{ gateway_namespace }}"
  register: _tls_secret
  when: gateway_create

- name: "gateway | Assert TLS secret exists"
  ansible.builtin.assert:
    that: _tls_secret.resources | length > 0
    fail_msg: "TLS secret '{{ gateway_tls_secret_name }}' not found"
    success_msg: "TLS secret '{{ gateway_tls_secret_name }}' exists"
  when: gateway_create

- name: "gateway | Check exported root CA certificate"
  ansible.builtin.stat:
    path: "{{ gateway_ca_export_path }}"
  register: _ca_export
  when: gateway_tls_mode == 'selfsigned' and gateway_create

- name: "gateway | Assert root CA was exported"
  ansible.builtin.assert:
    that: _ca_export.stat.exists
    fail_msg: "Root CA certificate not exported to '{{ gateway_ca_export_path }}'"
    success_msg: "Root CA certificate exported to '{{ gateway_ca_export_path }}'"
  when: gateway_tls_mode == 'selfsigned' and gateway_create

- name: "gateway | Validation passed"
  ansible.builtin.debug:
    msg: >-
      Gateway validation passed ({{ gateway_platform.provider | default(gateway_provider) }}).
      {{ 'Gateway ' + gateway_name + ' with TLS (' + gateway_tls_mode + ') on ' + base_domain_name if gateway_create
         else 'No Gateway resource managed.' }}
