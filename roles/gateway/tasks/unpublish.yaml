---
# =============================================================================
# Gateway — unpublish a service (both modes; same inputs as publish.yaml)
# =============================================================================

- name: "gateway | unpublish | Platform attach mode"
  ansible.builtin.include_tasks: platform.yaml
  when: gateway_platform is not defined

- name: "gateway | unpublish | {{ gateway_publish_name }}"
  ansible.builtin.include_tasks: "{{ _gp_file }}"
  loop: "{{ ['listenerset_remove.yaml'] + (['apex_path_remove.yaml'] if _gp_path else []) }}"
  loop_control:
    loop_var: _gp_file      # included files loop over item themselves
  vars:
    gateway_listenerset_name: "{{ gateway_publish_name }}"
    gateway_listenerset_namespace: "{{ gateway_publish_namespace }}"
    gateway_listenerset_listeners: [{name: "{{ gateway_publish_name }}", hostname: "{{ gateway_publish_host }}"}]
    gateway_apex_namespace: "{{ gateway_publish_namespace }}"
    gateway_apex_path: "{{ _gp_path }}"
