# =============================================================================
# Gateway — the landing redirect on the apex host ('/' -> gateway_landing_path)
# =============================================================================
# Route and auth exemption only; the '/' grant is handled by the caller.
#   gateway_landing_state  present | absent

- name: "gateway | landing | Redirect '/' to {{ gateway_landing_path }}"
  kubernetes.core.k8s:
    state: "{{ gateway_landing_state }}"
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: apex-landing
        namespace: "{{ gateway_namespace }}"
      spec:
        parentRefs:
          - name: "{{ gateway_name }}"
            namespace: "{{ gateway_namespace }}"
            sectionName: https-apex
        hostnames: ["{{ base_domain_name }}"]
        rules:
          # Exact '/', so unknown paths still 404.
          - matches: [{path: {type: Exact, value: /}}]
            filters:
              - type: RequestRedirect
                requestRedirect:
                  path: {type: ReplaceFullPath, replaceFullPath: "{{ gateway_landing_path }}"}
                  statusCode: 302

# A redirect carries no credentials; without this the gateway JWT answers 401.
- name: "gateway | landing | Auth exemption"
  ansible.builtin.include_tasks: route_auth_exempt.yaml
  vars:
    gateway_route_name: apex-landing
    gateway_route_namespace: "{{ gateway_namespace }}"
    gateway_route_policy_name: apex-landing-no-auth
    gateway_route_state: "{{ gateway_landing_state }}"
