---
# =============================================================================
# Gateway — publish a service in the current routing mode
# =============================================================================
# subdomain: its own host via a ListenerSet (listenerset.yaml), or in shared
#            attach mode (older controllers) a host grant on the wildcard listener
# path:      a path on the apex host via a path grant (apex_path.yaml)
# The other mode's objects are removed, so switching modes leaves nothing stale.
#   gateway_publish_name       service / listener name (e.g. keycloak)
#   gateway_publish_namespace  owning namespace
#   gateway_publish_host       subdomain host
#   gateway_publish_path       apex path (e.g. /keycloak); omit for services
#                              that only publish on a subdomain
#   gateway_publish_mode       override routing_mode (e.g. subdomain for apps
#                              that cannot run under a path)
# Sets gateway_publish: {mode, attach, host, relative_path, frontend_url, parent_ref}.

- name: "gateway | publish | Platform attach mode"
  ansible.builtin.include_tasks: platform.yaml
  when: gateway_platform is not defined

- name: "gateway | publish | Path mode needs a path for {{ gateway_publish_name }}"
  ansible.builtin.assert:
    that: _gp_mode == 'subdomain' or _gp_path | length > 0
    fail_msg: "{{ gateway_publish_name }}: set gateway_publish_path, or gateway_publish_mode: subdomain."
    quiet: true

- name: "gateway | publish | {{ gateway_publish_name ~ ' (' ~ _gp_mode ~ ')' }}"
  ansible.builtin.include_tasks: "{{ _gp_file }}"
  loop: >-
    {{ ((['listenerset.yaml'] if _gw_attach_mode == 'listenerset' else ['host_grant.yaml', 'listenerset_remove.yaml'])
        + (['apex_path_remove.yaml'] if _gp_path else [])) if _gp_mode == 'subdomain'
       else ['apex_path.yaml', 'listenerset_remove.yaml'] }}
  loop_control:
    loop_var: _gp_file      # included files loop over item themselves
  vars:
    gateway_listenerset_name: "{{ gateway_publish_name }}"
    gateway_listenerset_namespace: "{{ gateway_publish_namespace }}"
    gateway_listenerset_listeners: [{name: "{{ gateway_publish_name }}", hostname: "{{ gateway_publish_host }}"}]
    gateway_apex_namespace: "{{ gateway_publish_namespace }}"
    gateway_apex_path: "{{ _gp_path }}"
    gateway_listenerset_keep_grant: "{{ _gp_mode == 'subdomain' }}"

# Path mode serves on the apex host, whose Route install.yaml created; the
# subdomain host's Route from an earlier subdomain-mode run is removed.
- name: "gateway | publish | OpenShift: Route (subdomain) or none (path) for {{ gateway_publish_host }}"
  ansible.builtin.include_role:
    name: "{{ _gw_provider_role }}"
    tasks_from: openshift_routes.yaml
    vars_from: "{{ cluster_distribution }}.yaml"
  vars:
    _openshift_route_hosts: "{{ [gateway_publish_host] | reject('in', gateway_openshift_route_exclude + [base_domain_name]) | list }}"
    _openshift_route_state: "{{ 'present' if _gp_mode == 'subdomain' else 'absent' }}"
  when: gateway_platform.openshift_routes | default(false) | bool

- name: "gateway | publish | Route parent for {{ gateway_publish_name }}"
  ansible.builtin.set_fact:
    gateway_publish:
      mode: "{{ _gp_mode }}"
      attach: "{{ _gw_attach_mode }}"
      host: "{{ gateway_publish_host if _gp_mode == 'subdomain' else base_domain_name }}"
      relative_path: "{{ '/' if _gp_mode == 'subdomain' else _gp_path }}"
      frontend_url: >-
        {{ 'https://' ~ gateway_publish_host if _gp_mode == 'subdomain'
           else 'https://' ~ base_domain_name ~ _gp_path }}
      parent_ref: >-
        {{ {'name': gateway_name, 'namespace': gateway_namespace, 'sectionName': 'https-apex'} if _gp_mode != 'subdomain'
           else gateway_listenerset_ref | combine({'sectionName': gateway_publish_name}) if _gw_attach_mode == 'listenerset'
           else {'name': gateway_name, 'namespace': gateway_namespace, 'sectionName': 'https'} }}
