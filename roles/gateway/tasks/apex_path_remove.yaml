---
# =============================================================================
# Gateway — release an apex path grant (reverse of apex_path.yaml)
# =============================================================================
# Same inputs. Tolerates a missing ConfigMap or namespace.

- name: "gateway | apex path | Read path grants"
  kubernetes.core.k8s_info:
    kind: ConfigMap
    name: "{{ gateway_path_grants_configmap }}"
    namespace: "{{ gateway_namespace }}"
  register: _gw_ap_grants
  failed_when: false

- name: "gateway | apex path | Release {{ gateway_apex_path }}"
  vars:
    _data: "{{ (_gw_ap_grants.resources | default([]) | first | default({})).data | default({}) }}"
  when: _data.get(_gw_ap_key, '') == gateway_apex_namespace
  kubernetes.core.k8s:
    state: patched
    kind: ConfigMap
    name: "{{ gateway_path_grants_configmap }}"
    namespace: "{{ gateway_namespace }}"
    definition:
      data: "{{ {_gw_ap_key: None} }}"

- name: "gateway | apex path | Admission policy without the grant"
  ansible.builtin.include_tasks: apex_policy.yaml
  when: _gw_ap_grants.resources | default([]) | length > 0

# An app released '/': the landing redirect takes it back. Decided once here,
# since the tasks below re-scope gateway_apex_namespace to the gateway's own.
- name: "gateway | apex path | Does the landing redirect take '/' back"
  vars:
    _data: "{{ (_gw_ap_grants.resources | default([]) | first | default({})).data | default({}) }}"
  ansible.builtin.set_fact:
    _gw_ap_takeback: >-
      {{ _gw_ap_key == '_root'
         and gateway_apex_namespace != gateway_namespace
         and _data.get('_root', '') == gateway_apex_namespace
         and gateway_path_mode | bool and gateway_landing_path | length > 0 }}

- name: "gateway | apex path | Landing redirect takes '/' back"
  when: _gw_ap_takeback | bool
  block:
    - name: "gateway | apex path | Hold '/' for the landing redirect"
      ansible.builtin.include_tasks: apex_path.yaml
      vars:
        gateway_apex_namespace: "{{ gateway_namespace }}"
        gateway_apex_path: "/"

    - name: "gateway | apex path | Landing redirect route"
      ansible.builtin.include_tasks: apex_landing.yaml
      vars:
        gateway_landing_state: present

# Drop the apex label once the namespace holds no grant.
- name: "gateway | apex path | Drop the apex label of {{ gateway_apex_namespace }}"
  vars:
    _data: "{{ (_gw_ap_grants.resources | default([]) | first | default({})).data | default({}) }}"
    _left: "{{ _data | dict2items | rejectattr('key', 'eq', _gw_ap_key) | selectattr('value', 'eq', gateway_apex_namespace) | list }}"
  when: _left | length == 0
  kubernetes.core.k8s:
    state: patched
    kind: Namespace
    name: "{{ gateway_apex_namespace }}"
    definition:
      metadata:
        labels: "{{ {gateway_apex_label_key: None} }}"
  failed_when: false
