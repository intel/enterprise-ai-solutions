---
# =============================================================================
# Gateway — apex host in path mode (path grants, landing redirect)
# =============================================================================
# Path mode: solutions register path grants (apex_path.yaml); the admission
# policy enforces them. Subdomain mode: policy and landing are removed.

- name: "gateway | apex | Path grants ConfigMap (kept across runs)"
  kubernetes.core.k8s_info:
    kind: ConfigMap
    name: "{{ gateway_path_grants_configmap }}"
    namespace: "{{ gateway_namespace }}"
  register: _gw_grants

- name: "gateway | apex | Create path grants ConfigMap"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ gateway_path_grants_configmap }}"
        namespace: "{{ gateway_namespace }}"
      data: {}
  when: _gw_grants.resources | length == 0

- name: "gateway | apex | Admit apex routes only within their path grants"
  ansible.builtin.include_tasks: apex_policy.yaml

# The landing redirect holds '/' only while no app does: an app that publishes
# '/' takes it over (apex_path.yaml), and gets it back when it releases it.
- name: "gateway | apex | Landing redirect"
  when: gateway_path_mode | bool and gateway_landing_path | length > 0
  vars:
    _root_owner: "{{ ((_gw_grants.resources | first | default({})).data | default({})).get('_root', '') }}"
  block:
    - name: "gateway | apex | Read path grants for the landing"
      kubernetes.core.k8s_info:
        kind: ConfigMap
        name: "{{ gateway_path_grants_configmap }}"
        namespace: "{{ gateway_namespace }}"
      register: _gw_grants

    - name: "gateway | apex | Hold '/' for the landing redirect"
      ansible.builtin.include_tasks: apex_path.yaml
      vars:
        gateway_apex_namespace: "{{ gateway_namespace }}"
        gateway_apex_path: "/"
      when: _root_owner in ['', gateway_namespace]

    - name: "gateway | apex | Landing redirect route"
      ansible.builtin.include_tasks: apex_landing.yaml
      vars:
        gateway_landing_state: present
      when: _root_owner in ['', gateway_namespace]

    - name: "gateway | apex | '/' belongs to an app"
      ansible.builtin.debug:
        msg: >-
          NOTICE: '/' on {{ base_domain_name }} is published by namespace {{ _root_owner }}, so the
          landing redirect to {{ gateway_landing_path }} stays off until it releases '/'.
      when: _root_owner not in ['', gateway_namespace]

- name: "gateway | apex | Remove the landing redirect when off"
  when: not (gateway_path_mode | bool and gateway_landing_path | length > 0)
  block:
    - name: "gateway | apex | Delete the landing route"
      ansible.builtin.include_tasks: apex_landing.yaml
      vars:
        gateway_landing_state: absent

    - name: "gateway | apex | Release the landing path grant"
      ansible.builtin.include_tasks: apex_path_remove.yaml
      vars:
        gateway_apex_namespace: "{{ gateway_namespace }}"
        gateway_apex_path: "/"
