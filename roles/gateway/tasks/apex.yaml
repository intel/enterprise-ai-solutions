---
# =============================================================================
# Gateway — apex host in path mode (path grants, landing redirect)
# =============================================================================
# Path mode: solutions register path grants (apex_path.yaml); the admission
# policy enforces them. Subdomain mode: policy and landing are removed.

- name: "gateway | apex | Path grants ConfigMap (kept across runs)"
  kubernetes.core.k8s_info:
    kind: ConfigMap
    name: "{{ gateway_path_grants_configmap }}"
    namespace: "{{ gateway_namespace }}"
  register: _gw_grants

- name: "gateway | apex | Create path grants ConfigMap"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ gateway_path_grants_configmap }}"
        namespace: "{{ gateway_namespace }}"
      data: {}
  when: _gw_grants.resources | length == 0

- name: "gateway | apex | Admit apex routes only within their path grants"
  kubernetes.core.k8s:
    state: "{{ 'present' if gateway_path_mode | bool else 'absent' }}"
    definition: "{{ lookup('ansible.builtin.template', 'apex-path-admission-policy.yaml.j2') | from_yaml_all | select | list }}"

# The landing route lives in the gateway namespace and owns '/' exactly.
- name: "gateway | apex | Publish the landing redirect path"
  ansible.builtin.include_tasks: apex_path.yaml
  vars:
    gateway_apex_namespace: "{{ gateway_namespace }}"
    gateway_apex_path: "/"
  when: gateway_path_mode | bool and gateway_landing_path | length > 0

- name: "gateway | apex | Landing redirect"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: apex-landing
        namespace: "{{ gateway_namespace }}"
      spec:
        parentRefs:
          - name: "{{ gateway_name }}"
            namespace: "{{ gateway_namespace }}"
            sectionName: https-apex
        hostnames: ["{{ base_domain_name }}"]
        rules:
          # Exact '/', so unknown paths still 404.
          - matches: [{path: {type: Exact, value: /}}]
            filters:
              - type: RequestRedirect
                requestRedirect:
                  path: {type: ReplaceFullPath, replaceFullPath: "{{ gateway_landing_path }}"}
                  statusCode: 302
  when: gateway_path_mode | bool and gateway_landing_path | length > 0

# A redirect carries no credentials; without this the gateway JWT answers 401.
- name: "gateway | apex | Exempt the landing redirect from gateway auth"
  ansible.builtin.include_tasks: route_auth_exempt.yaml
  vars:
    gateway_route_name: apex-landing
    gateway_route_namespace: "{{ gateway_namespace }}"
    gateway_route_policy_name: apex-landing-no-auth
  when: gateway_path_mode | bool and gateway_landing_path | length > 0

- name: "gateway | apex | Remove the landing redirect when off"
  when: not (gateway_path_mode | bool and gateway_landing_path | length > 0)
  block:
    - name: "gateway | apex | Delete the landing route"
      kubernetes.core.k8s:
        state: absent
        api_version: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        name: apex-landing
        namespace: "{{ gateway_namespace }}"

    - name: "gateway | apex | Drop the landing route's auth exemption"
      ansible.builtin.include_tasks: route_auth_exempt.yaml
      vars:
        gateway_route_name: apex-landing
        gateway_route_namespace: "{{ gateway_namespace }}"
        gateway_route_policy_name: apex-landing-no-auth
        gateway_route_state: absent

    - name: "gateway | apex | Release the landing path grant"
      ansible.builtin.include_tasks: apex_path_remove.yaml
      vars:
        gateway_apex_namespace: "{{ gateway_namespace }}"
        gateway_apex_path: "/"
