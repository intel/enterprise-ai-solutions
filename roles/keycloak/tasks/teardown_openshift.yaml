---
# =============================================================================
# Keycloak — Teardown on OpenShift
# The operator, its CRDs and the namespace come from the admin's RHBK
# Subscription (OperatorHub) and stay: only the gateway objects, the CR and the
# admin Secret are ours.
# =============================================================================

- name: "keycloak | OpenShift: check for the Keycloak CR"
  kubernetes.core.k8s_info:
    api_version: k8s.keycloak.org/v2beta1
    kind: Keycloak
    name: keycloak
    namespace: "{{ keycloak_namespace }}"
  register: _kc_cr
  failed_when: false

- name: "keycloak | OpenShift: not installed — skipping teardown"
  ansible.builtin.debug:
    msg: "No Keycloak CR in {{ keycloak_namespace }}. Nothing to tear down."
  when: _kc_cr.resources | default([]) | length == 0

- name: "keycloak | OpenShift: teardown"
  when: _kc_cr.resources | default([]) | length > 0
  block:
    - name: "keycloak | Unpublish and delete the instance"
      ansible.builtin.include_tasks: expose_remove.yaml

    - name: "keycloak | OpenShift: delete the admin credentials secret"
      kubernetes.core.k8s:
        api_version: v1
        kind: Secret
        name: keycloak-admin-secret
        namespace: "{{ keycloak_namespace }}"
        state: absent
