---
# Internal: one kcadm call in the Keycloak pod, logged in as the admin.
#   _kc_args   kcadm arguments, e.g. [get, clients, -r, platform]
#   _kc_write  true when the call changes Keycloak (reported as changed)
# Sets _kc_kcadm (stdout is kcadm's output, JSON for get).

- name: "keycloak | kcadm | Admin credentials and pod"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: "{{ item.kind }}"
    namespace: "{{ keycloak_namespace }}"
    name: "{{ item.name | default(omit) }}"
    label_selectors: "{{ item.labels | default(omit) }}"
    field_selectors: "{{ item.fields | default(omit) }}"
  loop:
    - {kind: Secret, name: keycloak-admin-secret}
    - {kind: Pod, labels: [app=keycloak], fields: [status.phase=Running]}
  loop_control:
    label: "{{ item.kind }}"
  register: _kc_kcadm_ctx
  when: _kc_kcadm_pod is not defined
  no_log: true

- name: "keycloak | kcadm | Remember them for this run"
  ansible.builtin.set_fact:
    _kc_kcadm_pod: "{{ (_kc_kcadm_ctx.results[1].resources | first).metadata.name }}"
    _kc_kcadm_auth:
      - --no-config
      - --server
      - "{{ 'http://localhost:8080' ~ (keycloak_path if _keycloak_path_mode | bool else '') }}"
      - --realm
      - master
      - --user
      - "{{ (_kc_kcadm_ctx.results[0].resources | first).data.username | b64decode }}"
      - --password
      - "{{ (_kc_kcadm_ctx.results[0].resources | first).data.password | b64decode }}"
  when: _kc_kcadm_pod is not defined
  no_log: true

# k8s_exec splits the command like a shell would but runs no shell: each
# argument is quoted, so no value can turn into another argument.
- name: "keycloak | kcadm | {{ _kc_args[:2] | join(' ') }}"
  kubernetes.core.k8s_exec:
    namespace: "{{ keycloak_namespace }}"
    pod: "{{ _kc_kcadm_pod }}"
    command: "{{ (['/opt/keycloak/bin/kcadm.sh'] + _kc_args + _kc_kcadm_auth) | map('quote') | join(' ') }}"
  register: _kc_kcadm
  changed_when: _kc_write | default(false) | bool
  failed_when: false
  no_log: true

# kcadm's own errors carry no credentials; the call (which does) stays hidden.
- name: "keycloak | kcadm | Result"
  ansible.builtin.assert:
    that: _kc_kcadm.rc | default(1) == 0
    fail_msg: "kcadm {{ _kc_args[:2] | join(' ') }} failed (rc {{ _kc_kcadm.rc | default('?') }}): {{ _kc_kcadm.stderr | default('') | trim }}"
    quiet: true
