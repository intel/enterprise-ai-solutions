---
# =============================================================================
# Keycloak — Install (Operator-based, no OLM)
# =============================================================================

- name: "keycloak | Check for existing operator deployment"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: keycloak-operator
    namespace: "{{ keycloak_namespace }}"
  register: _kc_existing
  failed_when: false

- name: "keycloak | Check for existing Keycloak StatefulSet"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
    name: keycloak
    namespace: "{{ keycloak_namespace }}"
  register: _kc_sts_existing
  failed_when: false

- name: "keycloak | Check for existing Keycloak CR"
  kubernetes.core.k8s_info:
    api_version: k8s.keycloak.org/v2beta1
    kind: Keycloak
    name: keycloak
    namespace: "{{ keycloak_namespace }}"
  register: _kc_cr_existing
  failed_when: false

- name: "keycloak | Check for existing admin credentials secret"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: keycloak-admin-secret
    namespace: "{{ keycloak_namespace }}"
  register: _kc_admin_secret_existing
  failed_when: false

- name: "keycloak | Already installed — skipping"
  ansible.builtin.debug:
    msg: "Keycloak operator and instance already deployed in {{ keycloak_namespace }} — skipping install."
  when:
    - _kc_existing.resources | default([]) | length > 0
    - _kc_existing.resources[0].status.conditions | default([]) | selectattr('type','eq','Available') | selectattr('status','eq','True') | list | length > 0
    - _kc_cr_existing.resources | default([]) | length > 0
    - _kc_sts_existing.resources | default([]) | length > 0
    - (_kc_sts_existing.resources[0].status.readyReplicas | default(0) | int) >= (keycloak_instances | int)

- name: "keycloak | Label namespace — Istio"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ keycloak_namespace }}"
        labels:
          istio.io/dataplane-mode: "ambient"
  when: istio_enabled | default(false) | bool

- name: "keycloak | Label namespace — PSS"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ keycloak_namespace }}"
        labels:
          pod-security.kubernetes.io/enforce: "baseline"
          pod-security.kubernetes.io/audit: "restricted"
          pod-security.kubernetes.io/warn: "restricted"
  when: enforce_pss | default(false) | bool

- name: "keycloak | Install"
  when: >-
    _kc_existing.resources | default([]) | length == 0 or
    _kc_existing.resources[0].status.conditions | default([]) | selectattr('type','eq','Available') | selectattr('status','eq','True') | list | length == 0 or
    _kc_cr_existing.resources | default([]) | length == 0 or
    _kc_sts_existing.resources | default([]) | length == 0 or
    (_kc_sts_existing.resources[0].status.readyReplicas | default(0) | int) < (keycloak_instances | int)
  block:
    - name: "keycloak | Validate hostname is set"
      ansible.builtin.assert:
        that:
          - keycloak_hostname | default('') | length > 0
        fail_msg: >-
          keycloak_hostname is not set. Set it in global_config.yaml or defaults
          (e.g. "keycloak.inference-example.com").
        success_msg: "Keycloak hostname: {{ keycloak_hostname }}"

    - name: "keycloak | Create namespace"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ keycloak_namespace }}"

    # ── CRDs ──────────────────────────────────────────────────────────────────────

    - name: "keycloak | Install Keycloak CRDs"
      kubernetes.core.k8s:
        src: "{{ keycloak_k8s_resources_base }}/{{ keycloak_version }}/kubernetes/{{ item }}"
        state: present
      loop:
        - keycloaks.k8s.keycloak.org-v1.yml
        - keycloakrealmimports.k8s.keycloak.org-v1.yml

    # ── Operator ──────────────────────────────────────────────────────────────────

    - name: "keycloak | Deploy Keycloak Operator"
      kubernetes.core.k8s:
        src: "{{ keycloak_k8s_resources_base }}/{{ keycloak_version }}/kubernetes/kubernetes.yml"
        namespace: "{{ keycloak_namespace }}"
        state: present

    - name: "keycloak | Wait for operator rollout"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: keycloak-operator
        namespace: "{{ keycloak_namespace }}"
      register: _kc_operator_deploy
      until:
        - _kc_operator_deploy.resources | length > 0
        - _kc_operator_deploy.resources[0].status.conditions | default([]) | selectattr('type','eq','Available') | selectattr('status','eq','True') | list | length > 0
      retries: 60
      delay: 5

    # ── Keycloak instance ─────────────────────────────────────────────────────────

    # The postgresql role copies DB credentials as 'keycloak-db-secret' to
    # the keycloak namespace. Just verify it exists.

    - name: "keycloak | Verify DB credentials secret exists"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: keycloak-db-secret
        namespace: "{{ keycloak_namespace }}"
      register: _kc_db_secret
      when: keycloak_db_vendor == "postgres"
      failed_when:
        - keycloak_db_vendor == "postgres"
        - (_kc_db_secret.resources | default([]) | length) == 0

    # ── Keycloak admin + CR ─────────────────────────────────────────────────────

    - name: "keycloak | Create admin credentials secret"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: keycloak-admin-secret
            namespace: "{{ keycloak_namespace }}"
          type: Opaque
          stringData:
            username: "{{ keycloak_admin_user }}"
            password: "{{ keycloak_admin_password }}"
      when: (_kc_admin_secret_existing.resources | default([]) | length) == 0

    - name: "keycloak | Admin credentials secret already exists"
      ansible.builtin.debug:
        msg: "keycloak-admin-secret already exists — preserving existing admin password."
      when: (_kc_admin_secret_existing.resources | default([]) | length) > 0

    - name: "keycloak | Apply Keycloak CR"
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'keycloak.yaml.j2') | from_yaml }}"

    - name: "keycloak | Wait for Keycloak StatefulSet readiness"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: StatefulSet
        name: keycloak
        namespace: "{{ keycloak_namespace }}"
      register: _kc_sts
      until:
        - _kc_sts.resources | length > 0
        - (_kc_sts.resources[0].status.readyReplicas | default(0) | int) >= (keycloak_instances | int)
      retries: 30
      delay: 10

    - name: "keycloak | Install complete"
      ansible.builtin.debug:
        msg: >-
          Keycloak {{ keycloak_version }} operator + instance deployed in {{ keycloak_namespace }}
          ({{ keycloak_instances }} instance(s), db={{ keycloak_db_vendor }}).
          Realm/client configuration is owned by solution layers (e.g. keycloak_config role).

# The install block is skipped once Keycloak is healthy, so a later config
# change (e.g. routing_mode, which moves the hostname and relative path) would
# never reach the live CR. The operator rolls the pod only on a real change.
- name: "keycloak | Reconcile Keycloak CR on re-install"
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'keycloak.yaml.j2') | from_yaml }}"
  register: _kc_reconcile
  when: _kc_cr_existing.resources | default([]) | length > 0

# A changed CR restarts Keycloak; the realm steps below need it serving again.
- name: "keycloak | Wait for the operator to apply the change"
  kubernetes.core.k8s_info:
    api_version: k8s.keycloak.org/v2beta1
    kind: Keycloak
    name: keycloak
    namespace: "{{ keycloak_namespace }}"
  register: _kc_cr_live
  vars:
    _cr: "{{ _kc_cr_live.resources | default([]) | first | default({}) }}"
    _ready: "{{ _cr.status.conditions | default([]) | selectattr('type', 'eq', 'Ready') | first | default({}) }}"
  until:
    - _ready.status | default('') == 'True'
    - _ready.observedGeneration | default(-1) == _cr.metadata.generation | default(-2)
  retries: 30
  delay: 10
  when: _kc_reconcile is changed

- name: "keycloak | Wait for the restarted Keycloak"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
    name: keycloak
    namespace: "{{ keycloak_namespace }}"
  register: _kc_sts_live
  vars:
    _sts: "{{ _kc_sts_live.resources | default([]) | first | default({}) }}"
    _s: "{{ _sts.status | default({}) }}"
  until:
    - _s.observedGeneration | default(-1) == _sts.metadata.generation | default(-2)
    - _s.updateRevision | default('') == _s.currentRevision | default('-')
    - (_s.readyReplicas | default(0) | int) >= (keycloak_instances | int)
  retries: 30
  delay: 10
  when: _kc_reconcile is changed

# ── HTTPRoute (expose via gateway) — runs even on re-install ──────────────────

- name: "keycloak | Publish Keycloak"
  ansible.builtin.include_role:
    name: gateway
    tasks_from: publish.yaml
  vars:
    gateway_publish_name: keycloak
    gateway_publish_namespace: "{{ keycloak_namespace }}"
    gateway_publish_host: "{{ keycloak_hostname }}"
    gateway_publish_path: "{{ keycloak_path }}"
    gateway_publish_portal: {title: "Keycloak", description: "Identity and access management", path: "/admin/master/console/"}
  when: keycloak_gateway_publish | bool

- name: "keycloak | Create HTTPRoute for gateway"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: keycloak
        namespace: "{{ keycloak_namespace }}"
      spec:
        parentRefs:
          # Its own HTTPS listener or the apex (path mode); never plaintext :80.
          - "{{ gateway_publish.parent_ref }}"
        hostnames:
          - "{{ gateway_publish.host }}"
        rules:
          - matches: [{path: {type: PathPrefix, value: "{{ gateway_publish.relative_path }}"}}]
            filters:
              # HSTS: tell compliant browsers to only ever reach this host over
              # HTTPS, so a later plaintext attempt is refused client-side before
              # any credential leaves the browser. Only honored when received over
              # HTTPS, hence set here on the :443 route, not the :80 redirect.
              - type: ResponseHeaderModifier
                responseHeaderModifier:
                  set:
                    - name: Strict-Transport-Security
                      value: "max-age=31536000; includeSubDomains"
            backendRefs:
              - name: keycloak-service
                port: 8080
  when: keycloak_gateway_publish | bool

- name: "keycloak | Exclude Keycloak route from gateway JWT policy"
  ansible.builtin.include_role:
    name: gateway
    tasks_from: route_auth_exempt.yaml
  vars:
    gateway_route_name: keycloak
    gateway_route_namespace: "{{ keycloak_namespace }}"
    gateway_route_policy_name: keycloak-no-auth
  when: keycloak_gateway_publish | bool

# ── Platform SSO realm (people sign in here for every platform UI) ───────────
- name: "keycloak | Platform SSO realm"
  ansible.builtin.include_tasks: platform_realm.yaml
