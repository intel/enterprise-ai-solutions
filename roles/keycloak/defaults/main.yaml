---
# =============================================================================
# Keycloak Role Defaults
# =============================================================================

keycloak_version: "26.6.0"
keycloak_namespace: "keycloak"
keycloak_wait_timeout: "300s"

# Gateway integration — only create HTTPRoute when our envoy_gateway component manages the gateway
gateway_create: "{{ envoy_gateway_enabled | default(false) }}"

# Keycloak Operator — kubectl-based install (no OLM required)
keycloak_k8s_resources_base: "https://raw.githubusercontent.com/keycloak/keycloak-k8s-resources"

# Keycloak instance
keycloak_instances: 1

# Gateway routing is resolved once by the shared `service_route` filter from the
# service_routes registry (configs/service_routes.yaml), the cluster routing_mode
# and base_domain_name, plus any per-service override in service_route_overrides.
# This is the ONLY routing derivation for Keycloak — the subdomain-vs-apex logic
# and the "path must live in both the frontend URL and http-relative-path" rule
# live in the filter, shared with every other service.
keycloak_route: >-
  {{ 'keycloak' | service_route(routing_mode | default('subdomain'),
                                base_domain_name | default('inference-example.com'),
                                service_routes | default({}),
                                service_route_overrides | default({})) }}
# Convenience aliases used by the template, the HTTPRoute and validation below.
keycloak_route_host: "{{ keycloak_route.host }}"              # host the route matches on
keycloak_relative_path: "{{ keycloak_route.relative_path }}"  # path Keycloak serves under ('/' = subdomain mode)
keycloak_frontend_url: "{{ keycloak_route.frontend_url }}"    # advertised URL (issuer/redirects/assets)
keycloak_section_name: "{{ keycloak_route.section_name }}"    # gateway listener (apex or its own host)
# Route host only (no scheme/path): used for NO_PROXY, validation and log messages.
keycloak_hostname: "{{ keycloak_route.host }}"
keycloak_admin_user: "admin"
keycloak_admin_password: "{{ lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}"
keycloak_db_vendor: "postgres"        # dev-file (embedded H2) | postgres
keycloak_proxy_headers: "xforwarded"  # xforwarded | forwarded
keycloak_http_enabled: true
keycloak_health_enabled: true
keycloak_metrics_enabled: true

# PostgreSQL connection (used when keycloak_db_vendor == "postgres")
# The postgresql role copies credentials as 'keycloak-db-secret' into this namespace.

# Realm & client — configured by solution layers (e.g. keycloak_config role).
# These defaults are used by the Envoy SecurityPolicy template if not overridden.
keycloak_realm: "inference"
keycloak_client_id: "inference-client"

