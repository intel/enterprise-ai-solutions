---
# =============================================================================
# Keycloak Role Defaults
# =============================================================================

keycloak_version: "26.6.0"
keycloak_namespace: "keycloak"
keycloak_wait_timeout: "300s"

# Publish Keycloak on the platform gateway.
# Foreign var (canonical owner: gateway component flag; envoy_gateway_enabled is its alias).
keycloak_gateway_publish: "{{ gateway_enabled | default(envoy_gateway_enabled | default(true)) | bool }}"

# Keycloak Operator — kubectl-based install (no OLM required)
keycloak_k8s_resources_base: "https://raw.githubusercontent.com/keycloak/keycloak-k8s-resources"

# Keycloak instance
keycloak_instances: 1
keycloak_hostname: "keycloak.{{ base_domain_name | default('inference-example.com') }}"
# Path mode (routing_mode: path): served under <base>/keycloak. The path is in
# both the advertised URL and http-relative-path; the gateway forwards it as is.
keycloak_path: "/keycloak"
_keycloak_path_mode: "{{ (routing_mode | default('subdomain')) == 'path' }}"
keycloak_relative_path: "{{ keycloak_path if _keycloak_path_mode | bool else '/' }}"
keycloak_route_host: "{{ base_domain_name if _keycloak_path_mode | bool else keycloak_hostname }}"
keycloak_frontend_url: "https://{{ keycloak_route_host }}{{ keycloak_path if _keycloak_path_mode | bool else '' }}"
keycloak_admin_user: "admin"
keycloak_admin_password: "{{ lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}"
keycloak_db_vendor: "postgres"        # dev-file (embedded H2) | postgres
keycloak_proxy_headers: "xforwarded"  # xforwarded | forwarded
keycloak_http_enabled: true
keycloak_health_enabled: true
keycloak_metrics_enabled: true

# PostgreSQL connection (used when keycloak_db_vendor == "postgres")
# The postgresql role copies credentials as 'keycloak-db-secret' into this namespace.

# Realm & client — configured by solution layers (e.g. keycloak_config role).
# These defaults are used by the Envoy SecurityPolicy template if not overridden.
keycloak_realm: "inference"
keycloak_client_id: "inference-client"

# ── Platform SSO realm ────────────────────────────────────────────────────────
# One realm people sign in to for every platform UI (Headlamp, Grafana, Langfuse,
# LiteLLM). Members of the admin group are admins in each; others are read-only.
# Apps add their OIDC client with tasks_from: oidc_client.yaml.
keycloak_platform_realm: "platform"
keycloak_platform_admin_group: "platform-admins"
# Day-0 admin: generated temporary password (Secret platform-bootstrap-admin in
# this namespace), changed at first login. Off when identities are federated in.
keycloak_platform_bootstrap_admin: true
keycloak_platform_bootstrap_admin_user: "platform-admin"
# Langfuse and LiteLLM key accounts by email, so the bootstrap admin has one.
keycloak_platform_bootstrap_admin_email: "{{ keycloak_platform_bootstrap_admin_user }}@{{ base_domain_name | default('inference-example.com') }}"
# true: the bootstrap admin must enrol OTP at first login. Read when the realm is
# first created; for an existing realm, add the OTP required action in Keycloak.
keycloak_platform_bootstrap_admin_mfa: false
# Signed out after this long without a token refresh, or at the max lifespan.
keycloak_platform_session_idle_timeout: 3600  # seconds (1 h)
keycloak_platform_session_max_lifespan: 28800 # seconds (8 h)
# Issuer as browsers see it, and in-cluster (token exchange, key fetch).
keycloak_platform_issuer_url: "{{ keycloak_frontend_url }}/realms/{{ keycloak_platform_realm }}"
keycloak_platform_issuer_internal: >-
  http://keycloak-service.{{ keycloak_namespace }}.svc.cluster.local:8080{{
  keycloak_path if _keycloak_path_mode | bool else '' }}/realms/{{ keycloak_platform_realm }}
