---
# =============================================================================
# GPU Operator — Teardown
# =============================================================================

- name: "gpu_operator | teardown | NVIDIA"
  when: rack_scale_gpu_vendor | default('') == 'nvidia'
  environment:
    KUBECONFIG: "{{ kubernetes_kubeconfig }}"
  block:
    - name: "gpu_operator | teardown | nvidia | Helm uninstall"
      ansible.builtin.command:
        cmd: >-
          helm uninstall {{ gpu_operator_release_name }}
          --namespace {{ gpu_operator_namespace }}
      register: _gpu_helm_uninstall
      failed_when: false
      changed_when: _gpu_helm_uninstall.rc == 0

    - name: "gpu_operator | teardown | nvidia | Delete DCGM metrics ConfigMap"
      kubernetes.core.k8s:
        api_version: v1
        kind: ConfigMap
        name: dcgm-metrics-config
        namespace: "{{ gpu_operator_namespace }}"
        state: absent
      failed_when: false

    - name: "gpu_operator | teardown | nvidia | Delete namespace"
      kubernetes.core.k8s:
        name: "{{ gpu_operator_namespace }}"
        api_version: v1
        kind: Namespace
        state: absent
      failed_when: false

- name: "gpu_operator | teardown | Intel"
  when: rack_scale_gpu_vendor | default('') == 'intel'
  environment:
    KUBECONFIG: "{{ kubernetes_kubeconfig }}"
  block:
    - name: "gpu_operator | teardown | intel | Delete Intel GPU Plugin"
      ansible.builtin.command:
        cmd: "kubectl delete -f {{ intel_gpu_plugin_manifest }} --ignore-not-found=true"
      register: _intel_gpu_delete
      failed_when: false
      changed_when: "'deleted' in _intel_gpu_delete.stdout"
