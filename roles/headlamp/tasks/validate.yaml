---
# =============================================================================
# Headlamp — Validate
# =============================================================================

- name: "headlamp | validate | Deployment ready"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: headlamp
    namespace: "{{ headlamp_namespace }}"
  register: __headlamp_val_deploy
  failed_when: >-
    __headlamp_val_deploy.resources | length == 0
    or (__headlamp_val_deploy.resources[0].status.readyReplicas | default(0) | int) < 1

# Ready now, and not stuck or crash-looping (a restart is reported, not failed).
- name: "headlamp | validate | Pod healthy"
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ headlamp_namespace }}"
    label_selectors: [app.kubernetes.io/name=headlamp, app.kubernetes.io/instance=headlamp]
  register: __headlamp_val_pods
  failed_when: >-
    __headlamp_val_pods.resources | length == 0
    or (__headlamp_val_pods.resources | map(attribute='status.containerStatuses') | flatten
        | selectattr('state.waiting', 'defined') | list | length > 0)

- name: "headlamp | validate | Restarts"
  vars:
    _restarts: >-
      {{ __headlamp_val_pods.resources | map(attribute='status.containerStatuses') | flatten
         | map(attribute='restartCount') | sum }}
  ansible.builtin.debug:
    msg: "NOTICE: Headlamp restarted {{ _restarts }} time(s); see kubectl -n {{ headlamp_namespace }} logs deploy/headlamp --previous."
  when: _restarts | int > 0

- name: "headlamp | validate | Route, gateway policy and network policy"
  kubernetes.core.k8s_info:
    api_version: "{{ item.api }}"
    kind: "{{ item.kind }}"
    name: "{{ item.name }}"
    namespace: "{{ headlamp_namespace }}"
  loop:
    - {api: gateway.networking.k8s.io/v1, kind: HTTPRoute, name: headlamp, accepted: true}
    - api: gateway.envoyproxy.io/v1alpha1
      kind: SecurityPolicy
      name: "{{ 'headlamp-no-auth' if __headlamp_apiserver_mode | bool else 'headlamp-sso' }}"
      accepted: true
    - {api: networking.k8s.io/v1, kind: NetworkPolicy, name: headlamp-gateway-only, accepted: false}
  loop_control:
    label: "{{ item.kind }}/{{ item.name }}"
  register: __headlamp_val_gw
  failed_when: >-
    __headlamp_val_gw.resources | length == 0
    or (item.accepted and (__headlamp_val_gw.resources[0].status.ancestors
                           | default(__headlamp_val_gw.resources[0].status.parents | default([]))
        | map(attribute='conditions') | flatten
        | selectattr('type', 'eq', 'Accepted') | selectattr('status', 'eq', 'True') | list | length == 0))
  when: headlamp_gateway_publish | bool

- name: "headlamp | validate | Realm imported"
  kubernetes.core.k8s_info:
    api_version: k8s.keycloak.org/v2beta1
    kind: KeycloakRealmImport
    name: "{{ keycloak_platform_realm }}-realm"
    namespace: "{{ keycloak_namespace }}"
  register: __headlamp_val_realm
  failed_when: >-
    __headlamp_val_realm.resources | length == 0
    or (__headlamp_val_realm.resources[0].status.conditions | default([])
        | selectattr('type', 'eq', 'Done') | selectattr('status', 'eq', 'True') | list | length == 0)

# ── Through the gateway, as a browser sees it ────────────────────────────────
# Skipped, with a notice, when the Headlamp host does not resolve here.

- name: "headlamp | validate | Resolve {{ headlamp_hostname }} and {{ __headlamp_issuer_host }}"
  ansible.builtin.getent:
    database: ahostsv4
    key: "{{ item }}"
    fail_key: false
  loop: ["{{ headlamp_hostname }}", "{{ __headlamp_issuer_host }}"]
  register: __headlamp_val_dns

- name: "headlamp | validate | Hosts that resolve"
  ansible.builtin.set_fact:
    # getent maps a name that does not resolve to null.
    __headlamp_val_resolves: >-
      {{ __headlamp_val_dns.results | map(attribute='ansible_facts.getent_ahostsv4') | map('dict2items') | flatten
         | selectattr('value', 'none') | list | length == 0 }}

- name: "headlamp | validate | Hosts not in DNS"
  ansible.builtin.debug:
    msg: >-
      NOTICE: {{ headlamp_hostname }} or {{ __headlamp_issuer_host }} does not resolve here, so the
      Headlamp sign-in and token checks were skipped. Add them to DNS (a *.{{ base_domain_name }}
      record covers every app host).
  when: not __headlamp_val_resolves | bool

- name: "headlamp | validate | Gateway CA and address"
  ansible.builtin.include_role:
    name: gateway
    tasks_from: client_trust.yaml
  when: __headlamp_val_resolves | bool

- name: "headlamp | validate | Through the gateway"
  when: __headlamp_val_resolves | bool
  block:
    - name: "headlamp | validate | CA files"
      ansible.builtin.tempfile:
        suffix: .crt
      loop: [gateway, cluster]
      register: __headlamp_val_ca

    - name: "headlamp | validate | Write the gateway CA"
      ansible.builtin.copy:
        content: "{{ gateway_trust.ca_pem }}"
        dest: "{{ __headlamp_val_ca.results[0].path }}"
        mode: "0600"
      when: gateway_trust.ca_pem | length > 0

    # The UI loads, and sign-in sends people to the platform realm: Headlamp's
    # /oidc in apiserver mode, the gateway's own redirect in gateway mode.
    - name: "headlamp | validate | UI loads"
      ansible.builtin.uri:
        url: "{{ headlamp_url }}/"
        ca_path: "{{ __headlamp_val_ca.results[0].path if gateway_trust.ca_pem | length > 0 else omit }}"
        use_proxy: false
        timeout: 20
        return_content: true
      register: __headlamp_val_ui
      failed_when: __headlamp_val_ui.status != 200 or '<title>Headlamp' not in __headlamp_val_ui.content
      when: headlamp_gateway_publish | bool and __headlamp_apiserver_mode | bool

    - name: "headlamp | validate | Sign-in redirect"
      ansible.builtin.uri:
        url: "{{ headlamp_url ~ ('/oidc?cluster=main' if __headlamp_apiserver_mode | bool else '/') }}"
        ca_path: "{{ __headlamp_val_ca.results[0].path if gateway_trust.ca_pem | length > 0 else omit }}"
        use_proxy: false
        timeout: 20
        follow_redirects: none
        status_code: [302, 303]
      register: __headlamp_val_login
      failed_when: >-
        __headlamp_val_login.status not in [302, 303]
        or not (__headlamp_val_login.location | default('') is match((__headlamp_issuer_url ~ '/protocol/openid-connect/auth') | regex_escape))
      when: headlamp_gateway_publish | bool

# ── API server trust (apiserver mode) ────────────────────────────────────────

- name: "headlamp | validate | API server accepts Keycloak tokens"
  when: __headlamp_apiserver_mode | bool
  block:
    - name: "headlamp | validate | Admin group bound"
      kubernetes.core.k8s_info:
        api_version: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        name: "headlamp-{{ keycloak_platform_admin_group }}"
      register: __headlamp_val_crb
      failed_when: __headlamp_val_crb.resources | length == 0

    - name: "headlamp | validate | Read the check client"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "{{ __headlamp_check_secret_name }}"
        namespace: "{{ keycloak_namespace }}"
      register: __headlamp_val_check
      no_log: true

    # A machine identity of the realm asks the API server who it is: success
    # proves the issuer, audience, CA and claim mappings all line up.
    - name: "headlamp | validate | Keycloak token for the check client"
      when: __headlamp_val_resolves | bool
      ansible.builtin.uri:
        url: "{{ __headlamp_issuer_url }}/protocol/openid-connect/token"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: client_credentials
          client_id: "{{ __headlamp_check_client_id }}"
          client_secret: "{{ (__headlamp_val_check.resources | first | default({'data': {'value': ''}})).data.value | b64decode }}"
        ca_path: "{{ __headlamp_val_ca.results[0].path if gateway_trust.ca_pem | length > 0 else omit }}"
        use_proxy: false
        timeout: 20
      register: __headlamp_val_token
      no_log: true

    # Token only, straight to the API server: no client certificate that would answer instead.
    - name: "headlamp | validate | API server from the kubeconfig"
      when: __headlamp_val_resolves | bool
      vars:
        _kcfg: >-
          {{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'K8S_AUTH_KUBECONFIG')
             or lookup('ansible.builtin.env', 'KUBECONFIG') or '~/.kube/config' | expanduser) | from_yaml }}
        _ctx: "{{ (_kcfg.contexts | selectattr('name', 'eq', _kcfg['current-context']) | first).context }}"
      ansible.builtin.set_fact:
        __headlamp_val_cluster: "{{ (_kcfg.clusters | selectattr('name', 'eq', _ctx.cluster) | first).cluster }}"

    - name: "headlamp | validate | Write the cluster CA"
      ansible.builtin.copy:
        content: "{{ __headlamp_val_cluster['certificate-authority-data'] | b64decode }}"
        dest: "{{ __headlamp_val_ca.results[1].path }}"
        mode: "0600"
      when:
        - __headlamp_val_resolves | bool
        - "'certificate-authority-data' in __headlamp_val_cluster"

    - name: "headlamp | validate | Who am I, with a Keycloak token"
      when: __headlamp_val_resolves | bool
      ansible.builtin.uri:
        url: "{{ __headlamp_val_cluster.server }}/apis/authentication.k8s.io/v1/selfsubjectreviews"
        method: POST
        body_format: json
        body: {apiVersion: authentication.k8s.io/v1, kind: SelfSubjectReview}
        headers:
          Authorization: "Bearer {{ __headlamp_val_token.json.access_token }}"
        ca_path: >-
          {{ __headlamp_val_ca.results[1].path if 'certificate-authority-data' in __headlamp_val_cluster
             else __headlamp_val_cluster['certificate-authority'] | default(omit) }}
        use_proxy: false
        timeout: 20
        status_code: [201, 401, 403]
      register: __headlamp_val_whoami
      no_log: true

    - name: "headlamp | validate | Keycloak identities reach Kubernetes"
      when: __headlamp_val_resolves | bool
      vars:
        _want: "{{ headlamp_oidc_prefix }}service-account-{{ __headlamp_check_client_id }}"
        _byo: "{{ existing_kubernetes | default('', true) | length > 0 }}"
        _ok: "{{ __headlamp_val_whoami.status | default(0) == 201 and __headlamp_val_whoami.json.status.userInfo.username == _want }}"
      ansible.builtin.assert:
        that: _ok | bool or _byo | bool
        fail_msg: >-
          The API server did not accept a Keycloak token from realm {{ keycloak_platform_realm }}
          (expected user {{ _want }}). Check {{ __headlamp_authn_file }} on the control-plane nodes
          and the kube-apiserver log; the cluster must have been built with kubernetes_apiserver_authn_enabled.
        success_msg: "{{ 'API server accepts Keycloak tokens (' ~ _want ~ ').' if _ok | bool
                         else 'NOTICE: the API server does not accept Keycloak tokens yet; the cluster owner must add the issuer (see install notice).' }}"

# Certificates only (public), so a failed run leaving one behind exposes nothing.
- name: "headlamp | validate | Remove the CA files"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ __headlamp_val_ca.results | default([]) | selectattr('path', 'defined') | list }}"
  loop_control:
    label: "{{ item.path }}"

- name: "headlamp | validate | Summary"
  ansible.builtin.debug:
    msg: >-
      Headlamp OK ({{ headlamp_auth_mode }} mode): pod healthy, route, gateway and network policies in place,
      realm {{ keycloak_platform_realm }} imported{{ ', UI and sign-in redirect answer through the gateway'
      if headlamp_gateway_publish | bool and __headlamp_val_resolves | bool else '' }}.
