#
# fabric_validate — Validate
#
# End-to-end fabric health verification.  Read-only — never mutates the cluster.
# Ported from verify-fabric.yml + validate-stack/layer-fabric.yml.
#
# Checks per topology:
#   Star:  hub ip_forward, rp_filter, iptables FORWARD, persistence
#   Clos:  BIRD running, ECMP hash policy (ECMP nodes), BGP Established, bird routes
#   L2:    Calico node-to-node mesh Established (only with calico_mode: bgp)
#   All:   declared fabric NICs (up, carrier, MTU, address), don't-fragment
#          ping at the fabric MTU, spoke-to-spoke ping, fabric IP reachability
#          from the deploy node
#
# The NICs come from rack-profile.yaml (node_fabric_nics on each host) and the
# MTU from network.mtu (rack_scale_fabric_mtu), so a 1500-byte fabric is
# checked at 1500, not at a hard-coded 9000.

# ─── Skip fabric checks when topology=none ─────────────────────────────────
# No fabric to validate — jump straight to node labels.

- name: "fabric_validate | validate | Skip fabric checks (topology=none)"
  ansible.builtin.set_fact:
    _skip_fabric_checks: "{{ (rack_scale_topology | default('star')) == 'none' }}"

# ─── Fabric IP reachability from deploy node ────────────────────────────────
# Verifies every node's fabric access_ip is reachable BEFORE anything depends
# on it.  Quorum members (etcd/CP) fail hard; workers warn and continue.

- name: "fabric_validate | validate | Check fabric IP reachability"
  ansible.builtin.wait_for:
    host: "{{ hostvars[item].access_ip | default(hostvars[item].ansible_host | default('')) }}"
    port: 22
    timeout: "{{ rack_scale_validate_timeout }}"
  delegate_to: localhost
  failed_when: false
  register: _fabric_reach
  loop: "{{ groups['k8s_cluster'] | default(['localhost']) }}"
  loop_control:
    label: "{{ item }} ({{ hostvars[item].access_ip | default('unknown') }})"
  when: not _skip_fabric_checks

- name: "fabric_validate | validate | Fail on unreachable quorum members"
  ansible.builtin.fail:
    msg: >-
      Fabric IP {{ hostvars[item.item].access_ip }} on {{ item.item }}
      is not reachable from the deploy node on port 22.
      This node is an etcd/control-plane member — deployment cannot succeed.
      On a star topology, check the hub (fabric_routers group) first:
      iptables -S FORWARD and sysctl net.ipv4.ip_forward.
  when:
    - not _skip_fabric_checks
    - item is failed
    - item.item in (groups.get('etcd', []) + groups.get('kube_control_plane', []))
  loop: "{{ _fabric_reach.results }}"
  loop_control:
    label: "{{ item.item | default('unknown') }}"

- name: "fabric_validate | validate | Warn on unreachable non-quorum nodes"
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ hostvars[item.item].access_ip | default('?') }} on {{ item.item }}
      not reachable from deploy node.  Non-quorum node — continuing, but investigate
      if kubelet registration or Calico peering fails later.
  when:
    - not _skip_fabric_checks
    - item is failed
    - item.item not in (groups.get('etcd', []) + groups.get('kube_control_plane', []))
  loop: "{{ _fabric_reach.results }}"
  loop_control:
    label: "{{ item.item | default('unknown') }}"

# ─── Per-node fabric checks (delegated to each cluster member) ──────────────

- name: "fabric_validate | validate | Run fabric checks on each node"
  when: not _skip_fabric_checks
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      HN=$(hostname -s)
      ERRORS=0
      {% set topo = rack_scale_topology | default('star') %}
      {% set fabric_mtu = rack_scale_fabric_mtu | int %}
      {% set peer_hosts = groups.get('k8s_cluster', []) | difference([item]) %}

      # grep -c prints the count (0 included) and exits 1 when nothing matches;
      # "|| true" keeps that from aborting the script.  "|| echo 0" would print
      # a second 0 and turn every failed check into a pass.

      # --- Star topology: hub checks ---
      {% if topo == 'star' %}
      {% if 'fabric_routers' in groups and item in groups.get('fabric_routers', []) %}
      IP_FWD=$(sysctl -n net.ipv4.ip_forward 2>/dev/null || echo "0")
      if [ "$IP_FWD" != "1" ]; then
        echo "FAIL: ip_forward=$IP_FWD on hub $HN (expected 1)"
        ERRORS=$((ERRORS+1))
      else
        echo "OK: ip_forward=1 on hub $HN"
      fi

      RP_FILTER=$(sysctl -n net.ipv4.conf.all.rp_filter 2>/dev/null || echo "0")
      if [ "$RP_FILTER" != "2" ]; then
        echo "FAIL: rp_filter=$RP_FILTER on hub $HN (expected 2)"
        ERRORS=$((ERRORS+1))
      else
        echo "OK: rp_filter=2 on hub $HN"
      fi

      FWD_RULES=$(iptables -S FORWARD 2>/dev/null | grep -c ACCEPT || true)
      if [ "$FWD_RULES" -eq 0 ]; then
        echo "FAIL: no iptables FORWARD ACCEPT rules on hub $HN"
        ERRORS=$((ERRORS+1))
      else
        echo "OK: $FWD_RULES iptables FORWARD ACCEPT rules on hub $HN"
      fi

      PERSIST=$(iptables-save 2>/dev/null | grep -c 'FORWARD.*ACCEPT' || true)
      if [ "$PERSIST" -eq 0 ]; then
        echo "FAIL: iptables rules not persisted on hub $HN"
        ERRORS=$((ERRORS+1))
      else
        echo "OK: iptables rules persisted on hub $HN"
      fi
      {% endif %}
      {% endif %}

      # --- Clos topology checks ---
      {% if topo == 'clos' %}
      # BIRD runs inside the calico-node container (under runsv), not as a
      # systemd unit, so look for the process.
      if pgrep -x bird >/dev/null 2>&1; then
        echo "OK: BIRD running on $HN"
      else
        echo "FAIL: BIRD not running on $HN"
        ERRORS=$((ERRORS+1))
      fi

      {% if item in groups.get('ecmp_nodes', []) %}
      # fabric_sysctl sets the multipath hash only on the multi-homed nodes.
      ECMP=$(sysctl -n net.ipv4.fib_multipath_hash_policy 2>/dev/null || echo "0")
      if [ "$ECMP" != "1" ]; then
        echo "FAIL: fib_multipath_hash_policy=$ECMP on $HN (expected 1)"
        ERRORS=$((ERRORS+1))
      else
        echo "OK: ECMP hash policy=1 on $HN"
      fi
      {% endif %}

      BIRD_ROUTES=$(ip route show proto bird 2>/dev/null | grep -cv 'blackhole' || true)
      if [ "$BIRD_ROUTES" -eq 0 ]; then
        echo "FAIL: no BIRD routes on $HN"
        ERRORS=$((ERRORS+1))
      else
        echo "OK: $BIRD_ROUTES BIRD routes on $HN"
      fi
      {% endif %}

      # --- L2 with calico_mode: bgp — node-to-node mesh over the fabric ---
      {% if topo == 'l2' and (rack_scale_calico_mode | default('')) == 'bgp' %}
      if command -v calicoctl >/dev/null 2>&1; then
        MESH_EST=$(calicoctl node status 2>/dev/null | grep 'node-to-node mesh' | grep -c 'Established' || true)
        if [ "$MESH_EST" -eq {{ peer_hosts | length }} ]; then
          echo "OK: BGP node mesh Established on $HN ($MESH_EST/{{ peer_hosts | length }})"
        else
          echo "FAIL: BGP node mesh on $HN: $MESH_EST/{{ peer_hosts | length }} Established — check TCP 179 between fabric addresses"
          ERRORS=$((ERRORS+1))
        fi
      else
        # calicoctl not on this node: Calico's BIRD still installs the routes
        # it learns over the mesh with proto bird.
        MESH_ROUTES=$(ip route show proto bird 2>/dev/null | grep -cv 'blackhole' || true)
        if [ "$MESH_ROUTES" -gt 0 ]; then
          echo "OK: $MESH_ROUTES routes learned over the BGP node mesh on $HN (calicoctl not found)"
        else
          echo "FAIL: no routes learned over the BGP node mesh on $HN — check TCP 179 between fabric addresses"
          ERRORS=$((ERRORS+1))
        fi
      fi
      {% endif %}

      # --- Don't-fragment ping at the fabric MTU (skipped at 1500 or less) ---
      # Star: spokes ping the hub, the hub pings a spoke.  Otherwise any peer.
      {% if fabric_mtu > 1500 and peer_hosts | length > 0 %}
      {% set routers = groups.get('fabric_routers', []) | difference([item]) %}
      {% set mtu_peer = routers | first if (topo == 'star' and routers | length > 0) else peer_hosts | first %}
      MTU_IP="{{ hostvars[mtu_peer].access_ip | default('') }}"
      if [ -n "$MTU_IP" ]; then
        if ping -M do -s {{ rack_scale_validate_mtu_size }} -c 2 -W 5 "$MTU_IP" >/dev/null 2>&1; then
          echo "OK: MTU {{ fabric_mtu }} don't-fragment ping ({{ rack_scale_validate_mtu_size }}B) to $MTU_IP from $HN"
        else
          echo "FAIL: MTU {{ fabric_mtu }} don't-fragment ping ({{ rack_scale_validate_mtu_size }}B) to $MTU_IP from $HN — check switch and NIC MTU"
          ERRORS=$((ERRORS+1))
        fi
      fi
      {% endif %}

      # --- Fabric NICs: present, up, carrier, MTU, address ---
      {% set fabric_nics = hostvars[item].node_fabric_nics | default([]) %}
      NIC_BAD=""
      {% if fabric_nics | length > 0 %}
      {% for fn in fabric_nics %}
      DEV="{{ fn.nic }}"
      if [ ! -e "/sys/class/net/$DEV" ]; then
        NIC_BAD="${NIC_BAD}${DEV}:missing "
      else
        STATE=$(cat "/sys/class/net/$DEV/operstate" 2>/dev/null || echo "?")
        CARRIER=$(cat "/sys/class/net/$DEV/carrier" 2>/dev/null || echo "0")
        MTU=$(cat "/sys/class/net/$DEV/mtu" 2>/dev/null || echo "?")
        if [ "$STATE" != "up" ] || [ "$CARRIER" != "1" ]; then
          NIC_BAD="${NIC_BAD}${DEV}:state=${STATE},carrier=${CARRIER} "
        fi
        if [ "$MTU" != "{{ fabric_mtu }}" ]; then
          NIC_BAD="${NIC_BAD}${DEV}:mtu=${MTU}(want {{ fabric_mtu }}) "
        fi
        ADDRS=" $(ip -o -4 addr show dev "$DEV" 2>/dev/null || true) "
        case "$ADDRS" in
          *" {{ fn.fabric_ip }}/"*) ;;
          *) NIC_BAD="${NIC_BAD}${DEV}:no {{ fn.fabric_ip }} " ;;
        esac
      fi
      {% endfor %}
      {% else %}
      # No fabric NICs declared for this node: check every up, non-management NIC.
      for DEV in $(ip -o link show up | awk -F': ' '{print $2}' | grep -v 'lo\|cali\|vxlan\|tunl\|docker\|br-\|veth'); do
        MTU=$(cat /sys/class/net/$DEV/mtu 2>/dev/null || echo "?")
        SPEED=$(cat /sys/class/net/$DEV/speed 2>/dev/null || echo "?")
        [ "$SPEED" = "-1" ] && SPEED="virtual"
        IS_MGMT=$(ip route show default | grep -c "dev $DEV " || true)
        if [ "$MTU" != "{{ fabric_mtu }}" ] && [ "$SPEED" != "virtual" ] && [ "$SPEED" != "?" ] && [ "$IS_MGMT" -eq 0 ]; then
          NIC_BAD="${NIC_BAD}${DEV}:mtu=${MTU}(want {{ fabric_mtu }}) "
        fi
      done
      {% endif %}
      if [ -n "$NIC_BAD" ]; then
        echo "FAIL: fabric NICs on $HN: $NIC_BAD"
        ERRORS=$((ERRORS+1))
      else
        echo "OK: fabric NICs up with MTU {{ fabric_mtu }} on $HN"
      fi

      # --- Spoke-to-spoke ping ---
      PASS=0; FAIL_IPS=""
      {% for host in groups.get('all', []) %}
      {% if host != item %}
      PEER="{{ hostvars[host].access_ip | default(hostvars[host].ansible_host | default('')) }}"
      if [ -n "$PEER" ]; then
        if ping -c 1 -W 3 "$PEER" >/dev/null 2>&1; then
          PASS=$((PASS+1))
        else
          FAIL_IPS="${FAIL_IPS}$PEER "
        fi
      fi
      {% endif %}
      {% endfor %}
      TOTAL=$((PASS + $(echo "$FAIL_IPS" | wc -w)))
      if [ -z "$FAIL_IPS" ]; then
        echo "OK: spoke-to-spoke ping from $HN passed=$PASS/$TOTAL"
      else
        echo "FAIL: spoke-to-spoke ping from $HN passed=$PASS/$TOTAL unreachable=$FAIL_IPS"
        ERRORS=$((ERRORS+1))
      fi

      exit $ERRORS
    executable: /bin/bash
  become: true
  changed_when: false
  failed_when: false
  register: _fabric_check_results
  delegate_to: "{{ item }}"
  loop: "{{ groups['k8s_cluster'] | default(['localhost']) }}"
  loop_control:
    label: "{{ item }}"

- name: "fabric_validate | validate | Report per-node results"
  ansible.builtin.debug:
    msg: "{{ item.stdout_lines | default([]) }}"
  loop: "{{ _fabric_check_results.results }}"
  loop_control:
    label: "{{ item.item | default('unknown') }}"
  when: not _skip_fabric_checks

- name: "fabric_validate | validate | Check for failures"
  ansible.builtin.assert:
    that:
      - item.rc == 0
    fail_msg: >-
      Fabric validation FAILED on {{ item.item }} with {{ item.rc }} error(s).
      {{ item.stdout_lines | default([]) | select('match', '^FAIL:') | list | join('; ') }}
    success_msg: "Fabric validation passed on {{ item.item }}."
  loop: "{{ _fabric_check_results.results }}"
  loop_control:
    label: "{{ item.item | default('unknown') }}"
  when: not _skip_fabric_checks

# ─── Re-apply node labels (idempotent — same task as install.yaml) ─────────

- name: "fabric_validate | validate | Re-apply silicon/GPU node labels"
  ansible.builtin.include_tasks: install.yaml

- name: "fabric_validate | validate | ━━━ PASS ━━━"
  ansible.builtin.debug:
    msg: >-
      {{ 'topology=none — fabric checks skipped, node labels applied.'
         if _skip_fabric_checks else
         'Fabric validation passed on all ' ~ _fabric_check_results.results | length ~ ' node(s). Topology: ' ~ (rack_scale_topology | default('star')) }}
