---
# =============================================================================
# cert-manager — Validate
# =============================================================================

- name: "cert_manager | Check Helm release"
  kubernetes.core.helm_info:
    name: cert-manager
    release_namespace: "{{ certmanager_namespace }}"
  register: _cm_release
  when: not _certmanager_from_olm | bool

- name: "cert_manager | Assert cert-manager is installed"
  ansible.builtin.assert:
    that: _cm_release.status is defined
    fail_msg: "cert-manager is not installed in namespace {{ certmanager_namespace }}"
    success_msg: "cert-manager Helm release found"
  when: not _certmanager_from_olm | bool

- name: "cert_manager | Check webhook deployment"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: cert-manager-webhook
    namespace: "{{ certmanager_namespace }}"
  register: _cm_webhook

- name: "cert_manager | Assert webhook has ready replicas"
  ansible.builtin.assert:
    that:
      - _cm_webhook.resources | length > 0
      - (_cm_webhook.resources[0].status.readyReplicas | default(0) | int) >= 1
    fail_msg: "cert-manager-webhook has no ready replicas"
    success_msg: "cert-manager-webhook ready ({{ _cm_webhook.resources[0].status.readyReplicas | default(0) }} replicas)"

- name: "cert_manager | Validation passed"
  ansible.builtin.debug:
    msg: "cert-manager validation passed."
