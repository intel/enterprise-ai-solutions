---
# On OpenShift cert-manager comes from the marketplace (cert-manager Operator for
# Red Hat OpenShift): openshift.yaml only checks that it is there, and never
# installs or deletes anything.
- name: "cert_manager | Dispatch action: {{ component_action }}"
  ansible.builtin.include_tasks:
    file: >-
      {{ 'openshift.yaml' if cluster_distribution | default('kubernetes') == 'openshift' else component_action ~ '.yaml' }}
