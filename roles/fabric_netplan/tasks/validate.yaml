---
# =============================================================================
# Fabric Netplan — Validate
# =============================================================================
# Confirms each node's fabric NICs are as its fabric file sets them and its
# address is present. Does not check cross-node reachability — that is
# fabric_validate's job.
# =============================================================================

- name: "fabric_netplan | validate | Nodes and their netplan files"
  ansible.builtin.import_tasks: nodes.yaml

- name: "fabric_netplan | validate | Check the fabric NICs"
  ansible.builtin.import_tasks: check_nics.yaml

- name: "fabric_netplan | validate | ━━━ PASS ━━━"
  ansible.builtin.debug:
    msg: "Fabric netplan validation passed — the fabric NICs on all {{ _fabric_all_nodes | length }} nodes are as their fabric files set them."
