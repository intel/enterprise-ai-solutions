---
# =============================================================================
# Fabric Netplan — Install
# =============================================================================
# Pushes per-node fabric netplan config, then applies it.
#
# All nodes (including the bastion) are reached via delegate_to + SSH.
# The parser no longer emits ansible_connection: local, so every node is
# uniform. Uses content: with lookup('file', ...) which reads on the
# controller and writes on the delegate target — same pattern as the UR's
# kubernetes role for SSH preflight and CPU reservation.
# =============================================================================

- name: "fabric_netplan | Skip — topology=none (no fabric)"
  ansible.builtin.meta: end_role
  when: (rack_scale_topology | default('star')) == 'none'

- name: "fabric_netplan | Compute cluster node list"
  ansible.builtin.set_fact:
    _fabric_all_nodes: >-
      {{ (groups['kube_control_plane'] | default([]))
         | union(groups['kube_node'] | default([]))
         | union(groups.get('ceph_storage_nodes', []))
         | reject('equalto', 'localhost')
         | unique }}

- name: "fabric_netplan | Check netplan source exists for each node"
  ansible.builtin.stat:
    path: "{{ rack_scale_netplan_dir }}/{{ hostvars[item].node_hostname | default(item) }}.yaml"
  loop: "{{ _fabric_all_nodes }}"
  loop_control:
    label: "{{ item }}"
  register: _netplan_sources

- name: "fabric_netplan | Fail if any netplan file is missing"
  ansible.builtin.fail:
    msg: >-
      No netplan file for node {{ item.item }}
      (hostname: {{ hostvars[item.item].node_hostname | default(item.item) }})
  loop: "{{ _netplan_sources.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not item.stat.exists

# Preflight, before anything is written: the fabric step configures NICs only
# through netplan. A node without netplan (e.g. RHEL), or with a second
# configuration for a fabric NIC, used to fail later with a misleading
# "address not present" error.
#
# Any other netplan file that configures a fabric NIC (cloud-init's
# 50-cloud-init.yaml, an installer's bond or bridge) conflicts as well. An
# entry named after the NIC is merged with the fabric file: lists such as
# addresses add up, and on single values the file that sorts later wins, so
# dhcp4/dhcp6 from a file sorting before the fabric file are overridden, and
# an entry that configures nothing (dhcp4: no, optional: true) is harmless. An
# entry that selects the NIC with match: is not merged: networkd applies the
# first matching .network file by name, which may not be the fabric one, so it
# conflicts even if it configures nothing. The probe is files/netplan_probe.py.
#
# NetworkManager running next to networkd is fine: for renderer networkd,
# netplan also tells NetworkManager to leave the fabric NICs alone, so
# NetworkManager can keep the node's other NICs. What conflicts is a saved
# NetworkManager profile that names a fabric NIC: a 90-NM-*.yaml (where nmcli
# saves profiles on Ubuntu 24.04) or a keyfile. Check the saved configuration,
# not NetworkManager's device state: NetworkManager also takes idle NICs that
# nothing configures, and when it is disabled it only runs after a netplan
# apply, so its device state changes between runs.
- name: "fabric_netplan | Probe netplan and NetworkManager on each node"
  vars:
    _fabric_nics: >-
      {{ (lookup('file', rack_scale_netplan_dir ~ '/' ~ (hostvars[item].node_hostname | default(item)) ~ '.yaml') | from_yaml).network.ethernets
         | default({}) | list }}
  ansible.builtin.shell: |
    command -v netplan >/dev/null 2>&1 || { echo "netplan=no"; exit 0; }
    echo "netplan=yes"
    echo "nm_enabled=$(systemctl is-enabled NetworkManager 2>/dev/null || true)"
    python3 -I - --fabric-file {{ rack_scale_netplan_dest | basename | quote }} --old-file {{ rack_scale_netplan_old | basename | quote }} {{ _fabric_nics | map('quote') | join(' ') }} <<'PY'
    {{ lookup('file', role_path ~ '/files/netplan_probe.py') }}
    PY
  args:
    executable: /bin/bash
  become: true
  delegate_to: "{{ item }}"
  loop: "{{ _fabric_all_nodes }}"
  loop_control:
    label: "{{ item }}"
  register: _netplan_probe
  changed_when: false
  check_mode: false

- name: "fabric_netplan | Fail if netplan is not installed on a node"
  ansible.builtin.fail:
    msg: >-
      netplan is not installed on {{ item.item }}
      ({{ hostvars[item.item].node_hostname | default(item.item) }}).
      The rack-scale fabric step configures NICs only through netplan, so this
      node is not supported. Use Ubuntu 22.04 or 24.04 LTS on every node; see
      docs/rack-scale-deployment.md (Prerequisites).
  when: "'netplan=yes' not in item.stdout_lines"
  loop: "{{ _netplan_probe.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: "fabric_netplan | Fail if a saved NetworkManager profile configures a fabric NIC"
  vars:
    # "<nic> in <file> (profile '<name>')"
    _nm_profiles: "{{ item.stdout_lines | select('match', '^nmprof=') | map('regex_replace', '^nmprof=', '') | list }}"
  ansible.builtin.fail:
    msg: >-
      On {{ item.item }} ({{ hostvars[item.item].node_hostname | default(item.item) }})
      a saved NetworkManager profile configures a fabric NIC:
      {{ _nm_profiles | join('; ') }}. This step writes the fabric NIC
      configuration itself ({{ rack_scale_netplan_dest }}), and two
      configurations for one NIC conflict. Delete the profile (nmcli connection
      delete '<profile>', or remove the file if NetworkManager is not running)
      and re-run. NetworkManager can keep managing the node's other NICs.
  when: _nm_profiles | length > 0
  loop: "{{ _netplan_probe.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: "fabric_netplan | Another netplan file configures a fabric NIC"
  vars:
    # "<nic> in <file> ('<entry>' sets <keys>)" or "(member of bond '<name>')"
    _other_defs: "{{ item.stdout_lines | select('match', '^netplandef=') | map('regex_replace', '^netplandef=', '') | list }}"
    _allowed: "{{ rack_scale_netplan_allow_other_definitions | bool }}"
  ansible.builtin.debug:
    msg: >-
      {{ 'WARNING: on' if _allowed else 'On' }} {{ item.item }}
      ({{ hostvars[item.item].node_hostname | default(item.item) }})
      another netplan file configures a fabric NIC:
      {{ _other_defs | join('; ') }}. An entry named after the NIC is merged
      with {{ rack_scale_netplan_dest }}, so the NIC would carry both
      configurations (for example a second address); an entry that matches it
      is a separate configuration that networkd may apply instead.
      {{ 'Continuing because rack_scale_netplan_allow_other_definitions is true.'
         if _allowed else
         'Remove the entry for the NIC from that file, or narrow the match so it no longer selects the NIC (for cloud-init, also stop it rewriting the file: set network: {config: disabled} in /etc/cloud/cloud.cfg.d/), and re-run, or set rack_scale_netplan_allow_other_definitions: true to continue with a warning.' }}
  failed_when: not _allowed
  when: _other_defs | length > 0
  loop: "{{ _netplan_probe.results }}"
  loop_control:
    label: "{{ item.item }}"

# A disabled NetworkManager still runs after a netplan apply, but not after a
# reboot, so the fabric would come up now and be gone after the next boot.
- name: "fabric_netplan | Fail if the renderer is NetworkManager but it is not enabled"
  vars:
    _spec: "{{ lookup('file', rack_scale_netplan_dir ~ '/' ~ (hostvars[item.item].node_hostname | default(item.item)) ~ '.yaml') | from_yaml }}"
  ansible.builtin.fail:
    msg: >-
      network.netplan_renderer in rack-profile.yaml is 'NetworkManager', but
      NetworkManager is not enabled on {{ item.item }}
      ({{ hostvars[item.item].node_hostname | default(item.item) }}), so the
      fabric NICs would not come up after a reboot. Enable it (systemctl enable
      NetworkManager), or use 'networkd', which works whether or not
      NetworkManager runs for the node's other NICs.
  when:
    - (_spec.network.renderer | default('networkd')) == 'NetworkManager'
    - "'nm_enabled=enabled' not in item.stdout_lines"
  loop: "{{ _netplan_probe.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: "fabric_netplan | Deploy netplan to each node"
  ansible.builtin.copy:
    content: "{{ lookup('file', rack_scale_netplan_dir ~ '/' ~ hostvars[item].node_hostname ~ '.yaml') }}"
    dest: "{{ rack_scale_netplan_dest }}"
    owner: root
    group: root
    mode: '0600'
  delegate_to: "{{ item }}"
  become: true
  loop: "{{ _fabric_all_nodes }}"
  loop_control:
    label: "{{ item }} ({{ hostvars[item].node_hostname }})"
  register: _netplan_deployed

- name: "fabric_netplan | Remove old 60-fabric.yaml if present"
  ansible.builtin.file:
    path: /etc/netplan/60-fabric.yaml
    state: absent
  delegate_to: "{{ item }}"
  become: true
  loop: "{{ _fabric_all_nodes }}"
  loop_control:
    label: "{{ item }}"

- name: "fabric_netplan | Validate netplan config before applying"
  ansible.builtin.command: netplan generate
  delegate_to: "{{ item.item }}"
  become: true
  loop: "{{ _netplan_deployed.results | selectattr('changed') | list }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: false

- name: "fabric_netplan | Apply netplan on nodes where config changed"
  ansible.builtin.command: netplan apply
  delegate_to: "{{ item.item }}"
  become: true
  loop: "{{ _netplan_deployed.results | selectattr('changed') | list }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true

- name: "fabric_netplan | Wait for interfaces to settle"
  ansible.builtin.pause:
    seconds: "{{ rack_scale_netplan_settle_seconds }}"
  when: _netplan_deployed.results | selectattr('changed', 'equalto', true) | list | length > 0

- name: "fabric_netplan | Confirm fabric address on each node"
  ansible.builtin.command: ip -o addr show
  delegate_to: "{{ item }}"
  become: true
  loop: "{{ _fabric_all_nodes }}"
  loop_control:
    label: "{{ item }}"
  register: _addr_checks
  changed_when: false

- name: "fabric_netplan | Fail if fabric address not present"
  ansible.builtin.fail:
    msg: >-
      Netplan applied on {{ item.item }} ({{ hostvars[item.item].node_hostname }}) but
      {{ hostvars[item.item].access_ip }} is not present on any interface.
  loop: "{{ _addr_checks.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: (hostvars[item.item].access_ip ~ '/') not in (item.stdout | default(''))

- name: "fabric_netplan | ━━━ DONE ━━━"
  ansible.builtin.debug:
    msg: "Netplan deployed to {{ _fabric_all_nodes | length }} nodes"
