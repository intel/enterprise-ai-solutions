# =============================================================================
# Fabric Netplan — Teardown
# =============================================================================
# Runs after the kubespray reset (es_auto_installer.sh): the node IPs live on
# the fabric, and the reset needs them.

- name: "fabric_netplan | teardown | Compute cluster node list"
  ansible.builtin.set_fact:
    _fabric_all_nodes: >-
      {{ (groups['kube_control_plane'] | default([]))
         | union(groups['kube_node'] | default([]))
         | unique }}

# netplan apply leaves an address on a NIC that no netplan file configures any
# more, so read what 99-fabric.yaml assigned before removing it.
- name: "fabric_netplan | teardown | Read fabric netplan on each node"
  ansible.builtin.slurp:
    src: "{{ rack_scale_netplan_dest }}"
  delegate_to: "{{ item }}"
  become: true
  loop: "{{ _fabric_all_nodes }}"
  loop_control:
    label: "{{ item }}"
  register: _netplan_current
  failed_when: false

# The node file is gone on a re-run after a failure below. The controller copy
# fabric_inventory generated is still there (its teardown runs after this one),
# so the addresses come from both.
- name: "fabric_netplan | teardown | Read generated netplan for each node"
  ansible.builtin.slurp:
    src: "{{ rack_scale_netplan_dir }}/{{ hostvars[item].node_hostname | default(item) }}.yaml"
  loop: "{{ _fabric_all_nodes }}"
  loop_control:
    label: "{{ item }}"
  register: _netplan_generated
  failed_when: false

- name: "fabric_netplan | teardown | Collect fabric addresses"
  ansible.builtin.set_fact:
    _fabric_addresses: >-
      {%- set out = [] -%}
      {%- for r in _netplan_current.results + _netplan_generated.results if r.content is defined -%}
      {%- set eths = ((r.content | b64decode | from_yaml).network | default({})).ethernets | default({}) -%}
      {%- for nic, cfg in eths.items() -%}
      {%- for addr in cfg.addresses | default([]) -%}
      {%- set _ = out.append({'node': r.item, 'nic': nic, 'addr': addr}) -%}
      {%- endfor -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ out | unique }}

- name: "fabric_netplan | teardown | Remove the fabric netplan and addresses, then re-apply netplan"
  ansible.builtin.script:
    cmd: "{{ role_path }}/files/remove_fabric_netplan.sh"
  environment:
    FABRIC_FILES: "{{ rack_scale_netplan_dest }} {{ rack_scale_netplan_old }}"
    FABRIC_ADDRESSES: "{% for a in _fabric_addresses if a.node == item %}{{ a.nic }}={{ a.addr }} {% endfor %}"
  delegate_to: "{{ item }}"
  become: true
  loop: "{{ _fabric_all_nodes }}"
  loop_control:
    label: "{{ item }}"
  register: _fabric_netplan_removed
  changed_when: "'fabric-netplan-changed' in _fabric_netplan_removed.stdout"
