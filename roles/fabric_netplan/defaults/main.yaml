---
# =============================================================================
# Fabric Netplan — Defaults
# =============================================================================

rack_scale_netplan_dir: "{{ env_dir }}/inventory/netplan"
rack_scale_netplan_dest: /etc/netplan/99-fabric.yaml
rack_scale_netplan_old: /etc/netplan/60-fabric.yaml
rack_scale_netplan_settle_seconds: 3
# true: another netplan file configuring a fabric NIC is a warning, not a stop.
rack_scale_netplan_allow_other_definitions: false
