---
# =============================================================================
# metrics-server — Validate (whoever serves it, metrics.k8s.io must answer)
# =============================================================================

- name: "metrics_server | Detect"
  ansible.builtin.include_tasks: detect.yaml

- name: "metrics_server | Check deployment"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: metrics-server
    namespace: "{{ metrics_server_namespace }}"
  register: _ms_deploy
  when: _ms_ours | bool

- name: "metrics_server | Assert replicas ready"
  ansible.builtin.assert:
    that:
      - _ms_deploy.resources | length > 0
      - ((_ms_deploy.resources | first | default({})).status.readyReplicas | default(0) | int) >= (metrics_server_replicas | int)
    fail_msg: "metrics-server has fewer than {{ metrics_server_replicas }} ready replica(s)"
    success_msg: "metrics-server has {{ (_ms_deploy.resources | first | default({})).status.readyReplicas | default(0) }} ready replica(s)"
  when: _ms_ours | bool

- name: "metrics_server | Assert metrics.k8s.io Available"
  ansible.builtin.assert:
    that: _ms_available | bool
    fail_msg: >-
      metrics.k8s.io is not Available
      ({{ _ms_api_service.namespace | default('not registered') }}/{{ _ms_api_service.name | default('') }}):
      kubectl top and the Headlamp CPU/memory tiles will be empty
    success_msg: "metrics.k8s.io is Available"

- name: "metrics_server | Read node metrics"
  kubernetes.core.k8s_info:
    api_version: metrics.k8s.io/v1beta1
    kind: NodeMetrics
  register: _ms_nodes
  until: _ms_nodes.resources | default([]) | length > 0
  retries: 6
  delay: 10
