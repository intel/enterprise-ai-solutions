---
# Ours = our Helm release in our own namespace. Otherwise an existing
# metrics.k8s.io belongs to someone else: foreign when it answers, stale when not.
- name: "metrics_server | Check our Helm release"
  kubernetes.core.helm_info:
    name: metrics-server
    release_namespace: "{{ metrics_server_namespace }}"
  register: _ms_release
  failed_when: false

- name: "metrics_server | Check metrics.k8s.io APIService"
  kubernetes.core.k8s_info:
    api_version: apiregistration.k8s.io/v1
    kind: APIService
    name: v1beta1.metrics.k8s.io
  register: _ms_api

- name: "metrics_server | Classify"
  vars:
    _api: "{{ _ms_api.resources | first | default(none) }}"
    _available: >-
      {{ _api is not none and _api.status.conditions | default([])
         | selectattr('type', 'eq', 'Available') | selectattr('status', 'eq', 'True') | list | length > 0 }}
    _ours: "{{ (_ms_release.status | default(none)) is not none }}"
  ansible.builtin.set_fact:
    _ms_ours: "{{ _ours | bool }}"
    _ms_foreign: "{{ not _ours | bool and _available | bool }}"
    _ms_stale: "{{ not _ours | bool and _api is not none and not _available | bool }}"
    _ms_api_service: "{{ (_api.spec.service | default({}, true)) if _api is not none else {} }}"
