---
# =============================================================================
# Generate inventory from nodes.yaml (optional)
# =============================================================================
# If nodes.yaml defines control_plane nodes, render a kubespray-compatible
# inventory. Otherwise skip — the user-maintained hosts file is used as-is.
# =============================================================================

- name: "kubernetes | nodes → inventory | Check if nodes are defined"
  ansible.builtin.set_fact:
    _nodes_defined: "{{ (nodes_control_plane | default([]) | length) > 0 }}"

- name: "kubernetes | nodes → inventory | Generate hosts"
  when: _nodes_defined | bool
  block:
    - name: "kubernetes | nodes → inventory | Validate node entries"
      ansible.builtin.assert:
        that:
          - item.ip is defined
          - item.hostname is defined
        fail_msg: "Each node must have 'ip' and 'hostname': {{ item }}"
      loop: "{{ nodes_control_plane + (nodes_workers | default([])) }}"
      loop_control:
        label: "{{ item.hostname | default('MISSING') }}"

    # Catches a typo'd copy-paste entry (same ip or hostname reused across two
    # nodes) before it reaches Kubespray, where it would show up as a much
    # less obvious failure (or worse, silently join the wrong host twice).
    # An identical entry under both nodes_control_plane and nodes_workers is
    # allowed: that is how a control-plane node is also made a worker (common
    # on small clusters). Identical entries are collapsed first, so only
    # conflicting reuse (same hostname, different ip/ssh settings, or two
    # hostnames on one ip) is left to fail here.
    - name: "kubernetes | nodes → inventory | Validate no conflicting hostname/ip"
      vars:
        _unique_nodes: "{{ (nodes_control_plane + (nodes_workers | default([]))) | unique }}"
        _hostnames: "{{ _unique_nodes | map(attribute='hostname') | list }}"
        _ips: "{{ _unique_nodes | map(attribute='ip') | list }}"
        # Values used by more than one distinct entry, for the message below.
        _conflicts: >-
          {%- set ns = namespace(out=[]) -%}
          {%- for v in (_hostnames + _ips) | unique -%}
          {%- if ((_hostnames + _ips) | select('equalto', v) | list | length) > 1 -%}
          {%- set ns.out = ns.out + [v] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.out | join(', ') }}
      ansible.builtin.assert:
        that:
          - (_hostnames | length) == (_hostnames | unique | length)
          - (_ips | length) == (_ips | unique | length)
        fail_msg: >-
          Conflicting node entries in nodes.yaml for: {{ _conflicts }}.
          Each is used by more than one distinct entry across
          nodes_control_plane/nodes_workers. A node listed under both must be
          an identical entry in both; otherwise each node needs its own
          hostname and ip.

    - name: "kubernetes | nodes → inventory | Set template vars"
      ansible.builtin.set_fact:
        _nodes_control_plane: "{{ nodes_control_plane }}"
        _nodes_workers: "{{ nodes_workers | default([]) }}"
        _nodes_ssh_user: "{{ nodes_ssh_user | default('') }}"
        _nodes_ssh_key: "{{ nodes_ssh_key | default('') }}"

    - name: "kubernetes | nodes → inventory | Render hosts"
      ansible.builtin.template:
        src: hosts.yaml.j2
        dest: "{{ kubespray_custom_inventory }}"
        mode: "0644"
        backup: true

    - name: "kubernetes | nodes → inventory | Done"
      ansible.builtin.debug:
        msg: >-
          Generated {{ kubespray_custom_inventory }} from nodes.yaml
          ({{ _nodes_control_plane | length }} control-plane,
          {{ _nodes_workers | length }} worker nodes)
