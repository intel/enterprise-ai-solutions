---
# =============================================================================
# Kubespray Prep — Ensure stack, inventory, kubespray_extra_auto.yml
# =============================================================================
# Prepares kubespray for execution. The actual cluster.yml run is handled
# by es_auto_installer.sh (direct execution → live output).
# =============================================================================

# ─── Clone, venv, collections ───────────────────────────────────────────────

- name: "kubernetes | kubespray | Ensure kubespray stack"
  ansible.builtin.include_tasks: kubespray_ensure.yaml

# ─── Inventory ───────────────────────────────────────────────────────────────

- name: "kubernetes | kubespray | Generate inventory from nodes.yaml (if defined)"
  ansible.builtin.include_tasks: generate_hosts_from_nodes.yaml

- name: "kubernetes | kubespray | Generate inventory from current config"
  ansible.builtin.include_tasks: generate_inventory.yaml

# ─── CPU Reservation (NUMA-aware, computed per node) ────────────────────────
# Only needed for kubelet-static and best-effort; NRI manages its own cpusets
# (nri_cpu_balloons writes reservedResources.cpu into the BalloonsPolicy CR).
#
# The reserved cpuset is a *per-node* property: it must name CPU ids that
# actually exist on that node, laid out across that node's NUMA nodes. A
# heterogeneous cluster (e.g. 128-core CP + 32-core worker) therefore cannot
# share one cpuset — pushing "0-3,64-67" onto a 32-core worker makes kubelet
# refuse to start. So we probe every cluster member and emit the result as
# kubespray *host_vars* rather than a single extra-var.
#
# host_vars beat group_vars/role defaults but lose to extra-vars, which is why
# kubespray_extra_auto.yml.j2 deliberately does NOT set kubelet_reserved_cpus.
# Ansible auto-loads host_vars/ next to the inventory file, and kubespray is
# invoked with `-i <env>/inventory/hosts.yaml`, so writing
# <env>/inventory/host_vars/<node>.yml is picked up by the cluster.yml run.
#
# Extracted to kubelet_reserved_cpus.yaml so add-node's post phase can re-run
# just this step, scoped to the newly added node(s).

- name: "kubernetes | kubespray | Kubelet CPU reservation"
  ansible.builtin.include_tasks: kubelet_reserved_cpus.yaml

# ─── kubespray_extra_auto.yml (auto-generated kubespray config) ─────────────
# Extra-vars have highest Ansible precedence — no group_vars editing needed.

- name: "kubernetes | kubespray | Generate extra-vars overrides"
  ansible.builtin.template:
    src: kubespray_extra_auto.yml.j2
    dest: "{{ env_dir }}/kubespray_extra_auto.yml"
    mode: "0600"

# ─── Patch Kubespray template for reservedSystemCPUs ────────────────────────

- name: "kubernetes | kubespray | Check if kubelet template already patched"
  ansible.builtin.command:
    cmd: grep -q "ANSIBLE MANAGED - reservedSystemCPUs support" "{{ kubespray_dir }}/roles/kubernetes/node/templates/kubelet-config.v1beta1.yaml.j2"
  register: _kubelet_template_check
  changed_when: false
  failed_when: false

- name: "kubernetes | kubespray | Patch kubelet template for reservedSystemCPUs"
  when: _kubelet_template_check.rc != 0
  ansible.builtin.blockinfile:
    path: "{{ kubespray_dir }}/roles/kubernetes/node/templates/kubelet-config.v1beta1.yaml.j2"
    marker: "# {mark} ANSIBLE MANAGED - reservedSystemCPUs support"
    insertafter: "topologyManagerPolicy"
    block: |
      {% raw %}{% if kubelet_reserved_cpus is defined %}
      reservedSystemCPUs: {{ kubelet_reserved_cpus }}
      {% endif %}{% endraw %}

# ─── Summary ─────────────────────────────────────────────────────────────────

- name: "kubernetes | kubespray | Prep summary"
  ansible.builtin.debug:
    msg:
      - "Kubespray ready: {{ kubespray_dir }}"
      - "Kubernetes {{ kubernetes_version }} via Kubespray {{ kubespray_version }}"
      - "CNI: {{ kubernetes_cni }}  |  Runtime: {{ kubernetes_container_manager }}"
      - "Proxy mode: {{ kubernetes_kube_proxy_mode }}"
      - "Inventory: {{ _kubespray_inventory | trim }}"
      - "CPU policy: {{ kubernetes_cpu_policy | default('nri-balloons') }} (accelerator: {{ kubernetes_accelerator }})"
      - >-
        CPU reservation:
        {%- if _kubelet_pin_enabled | bool %}
        {{ _kubelet_reserve_total | trim }} CPUs/node →
        {{ _kubelet_reserved_per_node.results | default([])
           | map(attribute='item') | zip(_kubelet_reserved_per_node.results | default([])
           | map(attribute='stdout') | map('trim')) | map('join', '=') | join('  ') }}
        {%- else %}
        n/a (managed by {{ 'nri_cpu_balloons' if (kubernetes_cpu_policy | default('nri-balloons')) == 'nri-balloons' else kubernetes_accelerator ~ ' scheduler' }})
        {%- endif %}
