---
# =============================================================================
# Kubespray Prep — Ensure stack, inventory, kubespray_extra_auto.yml
# =============================================================================
# Prepares kubespray for execution. The actual cluster.yml run is handled
# by es_auto_installer.sh (direct execution → live output).
# =============================================================================

# ─── Clone, venv, collections ───────────────────────────────────────────────

- name: "kubernetes | kubespray | Ensure kubespray stack"
  ansible.builtin.include_tasks: kubespray_ensure.yaml

# ─── Inventory ───────────────────────────────────────────────────────────────

- name: "kubernetes | kubespray | Generate inventory from nodes.yaml (if defined)"
  ansible.builtin.include_tasks: generate_hosts_from_nodes.yaml

- name: "kubernetes | kubespray | Generate inventory from current config"
  ansible.builtin.include_tasks: generate_inventory.yaml

# ─── CPU Reservation (NUMA-aware, computed per node) ────────────────────────
# Only needed for kubelet-static and best-effort; NRI manages its own cpusets
# (nri_cpu_balloons writes reservedResources.cpu into the BalloonsPolicy CR).
#
# The reserved cpuset is a *per-node* property: it must name CPU ids that
# actually exist on that node, laid out across that node's NUMA nodes. A
# heterogeneous cluster (e.g. 128-core CP + 32-core worker) therefore cannot
# share one cpuset — pushing "0-3,64-67" onto a 32-core worker makes kubelet
# refuse to start. So we probe every cluster member and emit the result as
# kubespray *host_vars* rather than a single extra-var.
#
# host_vars beat group_vars/role defaults but lose to extra-vars, which is why
# kubespray_extra_auto.yml.j2 deliberately does NOT set kubelet_reserved_cpus.
# Ansible auto-loads host_vars/ next to the inventory file, and kubespray is
# invoked with `-i <env>/inventory/hosts.yaml`, so writing
# <env>/inventory/host_vars/<node>.yml is picked up by the cluster.yml run.

- name: "kubernetes | kubespray | Resolve CPU-reservation facts"
  ansible.builtin.set_fact:
    # Every kubelet in the cluster needs a cpuset, not just the control plane.
    _kubelet_calc_hosts: >-
      {{ (groups['kube_control_plane'] | default([]))
         | union(groups['kube_node'] | default([]))
         | unique | default(['localhost'], true) }}
    _kubelet_reserve_total: >-
      {%- if _k8s_needs_ssh | bool -%}
        {{ kubelet_reserved_cpus_multi_node | default(8) }}
      {%- else -%}
        {{ kubelet_reserved_cpus_single_node | default(4) }}
      {%- endif -%}
    _kubelet_hostvars_dir: "{{ (kubespray_custom_inventory | dirname) ~ '/host_vars' }}"
    _kubelet_pin_enabled: >-
      {{ kubernetes_accelerator == 'cpu'
         and (kubernetes_cpu_policy | default('nri-balloons')) in ['kubelet-static', 'best-effort'] }}

- name: "kubernetes | kubespray | CPU reservation (per node)"
  when: _kubelet_pin_enabled | bool
  block:
    - name: "kubernetes | kubespray | Copy NUMA reservation script to each node"
      ansible.builtin.copy:
        src: generate_reserved_cpus.sh
        dest: /tmp/generate_reserved_cpus.sh
        mode: '0755'
      delegate_to: "{{ item }}"
      loop: "{{ _kubelet_calc_hosts }}"

    - name: "kubernetes | kubespray | Calculate reserved CPUs on each node"
      ansible.builtin.command: /tmp/generate_reserved_cpus.sh {{ _kubelet_reserve_total }}
      register: _kubelet_reserved_per_node
      changed_when: false
      delegate_to: "{{ item }}"
      loop: "{{ _kubelet_calc_hosts }}"

    - name: "kubernetes | kubespray | Remove NUMA reservation script from each node"
      ansible.builtin.file:
        path: /tmp/generate_reserved_cpus.sh
        state: absent
      delegate_to: "{{ item }}"
      loop: "{{ _kubelet_calc_hosts }}"

    - name: "kubernetes | kubespray | Ensure inventory host_vars directory"
      ansible.builtin.file:
        path: "{{ _kubelet_hostvars_dir }}"
        state: directory
        mode: "0755"

    # One file per node. Marked auto-generated: the operator's own overrides
    # belong in <env>/kubespray_extra.yml (extra-vars, highest precedence).
    - name: "kubernetes | kubespray | Write per-node kubelet_reserved_cpus host_vars"
      ansible.builtin.copy:
        dest: "{{ _kubelet_hostvars_dir }}/{{ item.item }}.yml"
        mode: "0644"
        content: |
          # Auto-generated by es_auto_installer — DO NOT EDIT
          # NUMA-balanced reservedSystemCPUs for {{ item.item }}
          # cpu policy: {{ kubernetes_cpu_policy | default('nri-balloons') }}, reserved: {{ _kubelet_reserve_total | trim }} CPUs
          kubelet_reserved_cpus: "{{ item.stdout | trim }}"
      loop: "{{ _kubelet_reserved_per_node.results }}"
      loop_control:
        label: "{{ item.item }} → {{ item.stdout | default('') | trim }}"

    - name: "kubernetes | kubespray | Report per-node CPU reservation"
      ansible.builtin.debug:
        msg: >-
          {{ _kubelet_reserved_per_node.results
             | map(attribute='item') | zip(_kubelet_reserved_per_node.results
             | map(attribute='stdout') | map('trim'))
             | map('join', '=') | list }}

# NRI (or a GPU cluster) owns pinning — make sure a stale host_vars file from a
# previous kubelet-static run cannot keep injecting reservedSystemCPUs.
- name: "kubernetes | kubespray | Remove stale per-node kubelet_reserved_cpus host_vars"
  ansible.builtin.file:
    path: "{{ _kubelet_hostvars_dir }}/{{ item }}.yml"
    state: absent
  loop: "{{ _kubelet_calc_hosts }}"
  when: not (_kubelet_pin_enabled | bool)

# ─── kubespray_extra_auto.yml (auto-generated kubespray config) ─────────────
# Extra-vars have highest Ansible precedence — no group_vars editing needed.

- name: "kubernetes | kubespray | Generate extra-vars overrides"
  ansible.builtin.template:
    src: kubespray_extra_auto.yml.j2
    dest: "{{ env_dir }}/kubespray_extra_auto.yml"
    mode: "0600"

# The apiserver refuses to start if --authentication-config points at a missing
# file, so seed an empty (valid) one before cluster.yml. force: false keeps a
# live config intact on re-provision.
- name: "kubernetes | kubespray | Seed apiserver AuthenticationConfiguration"
  when: kubernetes_structured_auth_enabled | bool
  become: true
  block:
    - name: "kubernetes | kubespray | Ensure /etc/kubernetes on control-plane nodes"
      ansible.builtin.file:
        path: "{{ kubernetes_auth_config_path | dirname }}"
        state: directory
        mode: "0755"
      delegate_to: "{{ item }}"
      loop: "{{ groups['kube_control_plane'] | default(['localhost'], true) }}"

    - name: "kubernetes | kubespray | Write empty AuthenticationConfiguration"
      ansible.builtin.copy:
        dest: "{{ kubernetes_auth_config_path }}"
        content: "{{ lookup('template', 'authentication-config.yaml.j2') }}"
        force: false
        mode: "0600"
      delegate_to: "{{ item }}"
      loop: "{{ groups['kube_control_plane'] | default(['localhost'], true) }}"

# ─── Patch Kubespray template for reservedSystemCPUs ────────────────────────

- name: "kubernetes | kubespray | Check if kubelet template already patched"
  ansible.builtin.command:
    cmd: grep -q "ANSIBLE MANAGED - reservedSystemCPUs support" "{{ kubespray_dir }}/roles/kubernetes/node/templates/kubelet-config.v1beta1.yaml.j2"
  register: _kubelet_template_check
  changed_when: false
  failed_when: false

- name: "kubernetes | kubespray | Patch kubelet template for reservedSystemCPUs"
  when: _kubelet_template_check.rc != 0
  ansible.builtin.blockinfile:
    path: "{{ kubespray_dir }}/roles/kubernetes/node/templates/kubelet-config.v1beta1.yaml.j2"
    marker: "# {mark} ANSIBLE MANAGED - reservedSystemCPUs support"
    insertafter: "topologyManagerPolicy"
    block: |
      {% raw %}{% if kubelet_reserved_cpus is defined %}
      reservedSystemCPUs: {{ kubelet_reserved_cpus }}
      {% endif %}{% endraw %}

# ─── Summary ─────────────────────────────────────────────────────────────────

- name: "kubernetes | kubespray | Prep summary"
  ansible.builtin.debug:
    msg:
      - "Kubespray ready: {{ kubespray_dir }}"
      - "Kubernetes {{ kubernetes_version }} via Kubespray {{ kubespray_version }}"
      - "CNI: {{ kubernetes_cni }}  |  Runtime: {{ kubernetes_container_manager }}"
      - "Proxy mode: {{ kubernetes_kube_proxy_mode }}"
      - "Inventory: {{ _kubespray_inventory | trim }}"
      - "CPU policy: {{ kubernetes_cpu_policy | default('nri-balloons') }} (accelerator: {{ kubernetes_accelerator }})"
      - >-
        CPU reservation:
        {%- if _kubelet_pin_enabled | bool %}
        {{ _kubelet_reserve_total | trim }} CPUs/node →
        {{ _kubelet_reserved_per_node.results | default([])
           | map(attribute='item') | zip(_kubelet_reserved_per_node.results | default([])
           | map(attribute='stdout') | map('trim')) | map('join', '=') | join('  ') }}
        {%- else %}
        n/a (managed by {{ 'nri_cpu_balloons' if (kubernetes_cpu_policy | default('nri-balloons')) == 'nri-balloons' else kubernetes_accelerator ~ ' scheduler' }})
        {%- endif %}
