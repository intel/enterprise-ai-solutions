---
# =============================================================================
# Kubernetes — add-node (Kubespray scale.yml, worker nodes only)
# =============================================================================
# es_auto_installer.sh (do_add_node) finds the new node(s) (_added_nodes) and runs:
#   prep (_scale_phase=prep): the inventory from nodes.yaml, pre-flight on the
#        new node(s), their kubelet CPU reservation;
#   Kubespray scale.yml for the new node(s) and the control plane;
#   post (_scale_phase=post): labels, NFS export, wait for Ready and the pod
#        network, the node's NRI balloons policy, then lift the pending taint.
# =============================================================================

# Same refusal as es_auto_installer.sh: storage/tasks/resolve.yaml rejects
# these on a multi-node cluster, so every later install, validate and teardown
# would fail once a node joins. storage_backend is read directly, since
# preflight.yaml skips resolve.yaml for add-node.
- name: "kubernetes | add-node | Refuse single-node storage backend"
  vars:
    _backend: "{{ storage_backend | default('local-path') | string | trim | lower }}"
  ansible.builtin.fail:
    msg: >-
      add-node is not supported with storage_backend '{{ _backend }}'{{ ' and storage_custom_rwx: false'
      if _backend == 'custom' else '' }}: it only runs on a single node. Move to nfs or ceph first.
  when: >-
    _backend == 'local-path'
    or (_backend == 'custom' and not (storage_custom_rwx | default(true) | bool))

- name: "kubernetes | add-node | Resolve newly added node list"
  ansible.builtin.set_fact:
    _added_nodes_list: "{{ _added_nodes | default('') | split(',') | reject('equalto', '') | list }}"


# =====================================================================
# PHASE: post — finishing steps for the newly added node(s)
# =====================================================================

- name: "kubernetes | add-node | Post phase — new-node finishing steps"
  when: _scale_phase | default('prep') == 'post'
  block:
    - name: "kubernetes | add-node | Detect SSH requirement from inventory"
      ansible.builtin.include_tasks: needs_ssh.yaml

    - name: "kubernetes | add-node | Re-apply node topology labels (idempotent)"
      ansible.builtin.include_tasks: apply_node_topology.yaml
      when: node_topology_enabled | default(false) | bool

    # storage_backend, not _resolved_storage_backend: preflight skips
    # storage/resolve.yaml for add-node and remove-node.
    - name: "kubernetes | add-node | NFS exports for new node(s)"
      ansible.builtin.include_role:
        name: nfs_storage
        tasks_from: refresh_exports.yaml
      vars:
        _nfs_refresh_hosts_override: "{{ _added_nodes_list }}"
      when: (storage_backend | default('local-path') | string | trim | lower) == 'nfs'

    - name: "kubernetes | add-node | Wait for new node(s) to be Ready"
      kubernetes.core.k8s_info:
        kind: Node
        name: "{{ item }}"
      register: _k8s_new_node
      until: >-
        (_k8s_new_node.resources | default([]) | length) > 0
        and (_k8s_new_node.resources[0].status.conditions | default([])
             | selectattr('type', 'equalto', 'Ready')
             | selectattr('status', 'equalto', 'True') | list | length) > 0
      retries: 30
      delay: 10
      loop: "{{ _added_nodes_list }}"

    # Ready does not prove a pod network: the node turns Ready even while
    # calico-node crash-loops. The DaemonSet pods that tolerate the pending
    # taint (calico-node, kube-proxy, ...) must be Ready too.
    - name: "kubernetes | add-node | Wait for the DaemonSet pods on new node(s)"
      kubernetes.core.k8s_info:
        kind: Pod
        field_selectors:
          - "spec.nodeName={{ item }}"
      register: _add_node_ds_pods
      until: >-
        (_add_node_ds_pods.resources | default([]) | daemonset_pods | length) > 0
        and not (_add_node_ds_pods.resources | default([]) | daemonset_pods | unready_pods)
      retries: 30
      delay: 10
      failed_when: false
      loop: "{{ _added_nodes_list }}"

    - name: "kubernetes | add-node | Fail if a DaemonSet pod on a new node is not Ready"
      vars:
        _ds: "{{ item.resources | default([]) | daemonset_pods }}"
      ansible.builtin.fail:
        msg: >-
          {{ item.item }} is Ready, but its pod network is not:
          {{ ('not Ready: ' ~ (_ds | unready_pods | join(', '))) if _ds else 'no DaemonSet pod has started' }}.
          It keeps the {{ _add_node_pending_taint }} taint, so no workload lands on it.
          Check those pods (kubectl describe pod -n kube-system); a large node can need a higher
          calico_node_memory_limit in env/{{ env_name | default('ENV') }}/kubespray_extra.yml.
          Then re-run add-node, which resumes here.
      loop: "{{ _add_node_ds_pods.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: not _ds or (_ds | unready_pods | length) > 0

    # Before the taint lift lets the node's balloons agent start. The other
    # nodes' policies and the Helm release are left alone.
    - name: "kubernetes | add-node | Per-node NRI balloon policy for new node(s)"
      ansible.builtin.include_role:
        name: nri_cpu_balloons
        tasks_from: node_policies.yaml
        # tasks_from skips the role's main.yaml dispatcher, which is what
        # normally loads these platform values.
        vars_from: "{{ cluster_distribution }}.yaml"
      vars:
        _nri_scope_nodes: "{{ _added_nodes_list }}"
      when:
        - (kubernetes_cpu_policy | default('nri-balloons')) == 'nri-balloons'
        - (kubernetes_accelerator | default('cpu')) == 'cpu'

    # Last: if anything above failed, the node keeps the taint and re-running
    # add-node resumes the post phase.
    - name: "kubernetes | add-node | Lift add-node pending taint"
      kubernetes.core.k8s_taint:
        state: absent
        name: "{{ item }}"
        taints:
          - key: "{{ _add_node_pending_taint }}"
            effect: NoSchedule
      register: _add_node_untaint
      failed_when:
        - _add_node_untaint.failed | default(false)
        - "'not found' not in (_add_node_untaint.msg | default('') | lower)"
      loop: "{{ _added_nodes_list }}"

    - name: "kubernetes | add-node | New node(s) ready"
      ansible.builtin.debug:
        msg: "Added and Ready: {{ _added_nodes_list | join(', ') }}"

- name: "kubernetes | add-node | End role (post phase complete)"
  when: _scale_phase | default('prep') == 'post'
  meta: end_role

# =====================================================================
# PHASE: prep — regenerate inventory from nodes.yaml
# =====================================================================

- name: "kubernetes | add-node | Ensure kubespray stack"
  ansible.builtin.include_tasks: kubespray_ensure.yaml

- name: "kubernetes | add-node | Regenerate inventory from nodes.yaml"
  ansible.builtin.include_tasks: generate_hosts_from_nodes.yaml

# The play loaded the inventory before it was rewritten: without a reload,
# delegate_to resolves a new node by DNS instead of its ansible_host.
- name: "kubernetes | add-node | Reload inventory to pick up newly added node(s)"
  ansible.builtin.meta: refresh_inventory

- name: "kubernetes | add-node | Detect SSH requirement from the new inventory"
  ansible.builtin.include_tasks: needs_ssh.yaml

# ─── Pre-flight for the new node(s), over SSH ────────────────────────────────

# A node joined to another cluster (or left from this one) would corrupt both.
- name: "kubernetes | add-node | SSH pre-flight | Check new node(s) aren't already joined to a cluster"
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  delegate_to: "{{ item }}"
  loop: "{{ _added_nodes_list }}"
  loop_control:
    label: "{{ item }}"
  register: _add_node_kubelet_conf_stat

- name: "kubernetes | add-node | SSH pre-flight | Fail on already-joined node(s)"
  ansible.builtin.fail:
    msg: >-
      {{ item.item }} already has /etc/kubernetes/kubelet.conf — it looks like
      it's already part of a Kubernetes cluster. Reset it (kubeadm reset, or
      this installer's teardown against whichever env it belongs to) before
      adding it here.
  loop: "{{ _add_node_kubelet_conf_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists | default(false)

# scale.yml would otherwise wipe Docker and its data on the new node(s).
- name: "kubernetes | add-node | SSH pre-flight | Refuse new node(s) with Docker installed"
  ansible.builtin.include_tasks: docker_preflight.yaml
  vars:
    _docker_check_hosts: "{{ _added_nodes_list }}"

- name: "kubernetes | add-node | SSH pre-flight | Check control-plane API server reachability from new node(s)"
  ansible.builtin.wait_for:
    host: "{{ hostvars[groups['kube_control_plane'][0]].ansible_host }}"
    port: 6443
    timeout: 10
  delegate_to: "{{ item }}"
  loop: "{{ _added_nodes_list }}"
  loop_control:
    label: "{{ item }}"

- name: "kubernetes | add-node | SSH pre-flight | Check internet on new node(s)"
  ansible.builtin.uri:
    url: https://github.com
    method: GET
    timeout: 10
    status_code: [200, 301, 302]
  delegate_to: "{{ item }}"
  loop: "{{ _added_nodes_list }}"
  loop_control:
    label: "{{ item }}"
  environment:
    http_proxy: "{{ http_proxy | default('') }}"
    https_proxy: "{{ https_proxy | default('') }}"
    no_proxy: "{{ no_proxy | default('') }}"
  failed_when: false
  register: _add_node_inet_results

- name: "kubernetes | add-node | SSH pre-flight | Report new node(s) without internet"
  ansible.builtin.debug:
    msg: "WARNING: {{ item.item }} cannot reach https://github.com — check proxy settings"
  loop: "{{ _add_node_inet_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.status | default(0) not in [200, 301, 302]

# Before scale.yml: it writes host_vars/<node>.yml (kubelet_reserved_cpus),
# which Kubespray reads when it renders the new node's kubelet config.
- name: "kubernetes | add-node | Kubelet CPU reservation for new node(s)"
  ansible.builtin.include_tasks: kubelet_reserved_cpus.yaml
  vars:
    _kubelet_calc_hosts_override: "{{ _added_nodes_list }}"

- name: "kubernetes | add-node | Prep complete"
  ansible.builtin.debug:
    msg: >-
      Inventory regenerated at {{ kubespray_custom_inventory }}.
      es_auto_installer.sh now runs Kubespray scale.yml for the new worker node(s).

- name: "kubernetes | add-node | End role (prep complete — scale.yml runs from caller)"
  meta: end_role
