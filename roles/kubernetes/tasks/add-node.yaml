---
# =============================================================================
# Kubernetes — add-node (Kubespray scale.yml, worker nodes only)
# =============================================================================
# Flow (driven by es_auto_installer.sh):
#   Phase 1 (_scale_phase=prep, default): regenerate inventory from the edited
#            nodes.yaml, SSH/internet pre-flight against just the new
#            node(s), then their per-node kubelet CPU reservation (host_vars
#            that scale.yml must see on its first run) → end_role. es_auto_installer.sh diffs the regenerated
#            inventory against the live cluster to find the new worker node(s)
#            (computed in bash before this phase even runs; see
#            es_auto_installer.sh:do_add_node — _added_nodes is passed in
#            already, not derived here).
#   Phase 2: es_auto_installer.sh runs Kubespray scale.yml directly (live
#            output), limited to the new node(s) + control-plane.
#   Phase 3 (_scale_phase=post): topology labels, NFS export, wait-for-Ready,
#            per-node NRI balloons policy, then lift the pending taint —
#            scoped to just the newly added node(s).
#
# add-node never adds control-plane nodes — Kubespray's scale.yml cannot do
# that (see docs/customize/node_scaling.md); es_auto_installer.sh refuses
# before this role is ever invoked if a new node is under nodes_control_plane.
# BYO clusters are refused — a bring-your-own cluster is not managed by
# Kubespray at all.
# =============================================================================

- name: "kubernetes | add-node | Refuse on BYO cluster"
  ansible.builtin.fail:
    msg: "add-node is not supported for a BYO cluster (existing_kubernetes is set)."
  when: existing_kubernetes | default('') | trim | length > 0

# Same refusal as es_auto_installer.sh: storage/tasks/resolve.yaml rejects
# these on a multi-node cluster, so every later install, validate and teardown
# would fail once a node joins. storage_backend is read directly, since
# preflight.yaml skips resolve.yaml for add-node.
- name: "kubernetes | add-node | Refuse single-node storage backend"
  vars:
    _backend: "{{ storage_backend | default('local-path') | string | trim | lower }}"
  ansible.builtin.fail:
    msg: >-
      add-node is not supported with storage_backend '{{ _backend }}'{{ ' and storage_custom_rwx: false'
      if _backend == 'custom' else '' }}: it only runs on a single node. Move to nfs or ceph first.
  when: >-
    _backend == 'local-path'
    or (_backend == 'custom' and not (storage_custom_rwx | default(true) | bool))

# _added_nodes is passed by es_auto_installer.sh on both the prep and post
# calls (it already knows the diff before either Ansible pass runs), so both
# phases below can scope to just the new node(s) without recomputing anything.
- name: "kubernetes | add-node | Resolve newly added node list"
  ansible.builtin.set_fact:
    _added_nodes_list: "{{ _added_nodes | default('') | split(',') | reject('equalto', '') | list }}"

# Used by both phases (kubelet_reserved_cpus.yaml in prep,
# apply_node_topology.yaml in post).
- name: "kubernetes | add-node | Detect SSH requirement from inventory"
  ansible.builtin.set_fact:
    _k8s_needs_ssh: >-
      {{
        (groups['kube_control_plane'] | default([]) + groups['kube_node'] | default([]))
        | unique
        | reject('equalto', 'localhost')
        | list
        | length > 0
      }}

# =====================================================================
# PHASE: post — finishing steps for the newly added node(s)
# =====================================================================

- name: "kubernetes | add-node | Post phase — new-node finishing steps"
  when: _scale_phase | default('prep') == 'post'
  block:
    - name: "kubernetes | add-node | Re-apply node topology labels (idempotent)"
      ansible.builtin.include_tasks: apply_node_topology.yaml
      when: node_topology_enabled | default(false) | bool

    # Unlike nri_cpu_balloons (deliberately NOT re-applied automatically —
    # see _nri_balloons_reminder in es_auto_installer.sh), refreshing the NFS
    # export allowlist is a plain additive config change (append this node's
    # IP, `exportfs -ra` to reload — no restart, no fleet-wide rollout), so
    # there's no reason to leave it to a manual step: without this, the new
    # node's NFS-backed PVC mounts are rejected by the server with "access
    # denied" until someone notices and re-runs `install storage` by hand.
    # `storage_backend` is read directly (not `_resolved_storage_backend`):
    # preflight.yaml skips storage/resolve.yaml for add-node/remove-node on
    # purpose (its "reject local-path on multi-node" check has nothing to do
    # with scaling), so that fact was never set for this run.
    - name: "kubernetes | add-node | NFS exports for new node(s)"
      ansible.builtin.include_role:
        name: nfs_storage
        tasks_from: refresh_exports.yaml
      vars:
        _nfs_refresh_hosts_override: "{{ _added_nodes_list }}"
      when: (storage_backend | default('local-path') | string | trim | lower) == 'nfs'

    # Looked up by exact name (not filtered from the full node list), so
    # there are no substring collisions between e.g. worker1/worker10.
    - name: "kubernetes | add-node | Wait for new node(s) to be Ready"
      kubernetes.core.k8s_info:
        kind: Node
        name: "{{ item }}"
        kubeconfig: "{{ kubernetes_kubeconfig }}"
      register: _k8s_new_node
      until: >-
        (_k8s_new_node.resources | default([]) | length) > 0
        and (_k8s_new_node.resources[0].status.conditions | default([])
             | selectattr('type', 'equalto', 'Ready')
             | selectattr('status', 'equalto', 'True') | list | length) > 0
      retries: 30
      delay: 10
      loop: "{{ _added_nodes_list }}"

    # Ready does not prove a pod network: Calico's init container writes the
    # CNI config before calico-node runs, so the node turns Ready even when
    # calico-node keeps crashing. The DaemonSet pods that tolerate the pending
    # taint (calico-node, kube-proxy, ...) are already on the node: wait for
    # them before any workload is let in.
    - name: "kubernetes | add-node | Wait for the DaemonSet pods on new node(s)"
      kubernetes.core.k8s_info:
        kind: Pod
        field_selectors:
          - "spec.nodeName={{ item }}"
        kubeconfig: "{{ kubernetes_kubeconfig }}"
      register: _add_node_ds_pods
      until: >-
        (_add_node_ds_pods.resources | default([]) | daemonset_pods | length) > 0
        and not (_add_node_ds_pods.resources | default([]) | daemonset_pods | unready_pods)
      retries: 30
      delay: 10
      failed_when: false
      loop: "{{ _added_nodes_list }}"

    - name: "kubernetes | add-node | Fail if a DaemonSet pod on a new node is not Ready"
      vars:
        _ds: "{{ item.resources | default([]) | daemonset_pods }}"
      ansible.builtin.fail:
        msg: >-
          {{ item.item }} is Ready, but its pod network is not:
          {{ ('not Ready: ' ~ (_ds | unready_pods | join(', '))) if _ds else 'no DaemonSet pod has started' }}.
          It keeps the {{ _add_node_pending_taint | default('add-node pending') }} taint, so no workload lands on it.
          Check those pods (kubectl describe pod -n kube-system); a large node can need a higher
          calico_node_memory_limit in env/{{ env_name | default('ENV') }}/kubespray_extra.yml.
          Then re-run add-node, which resumes here.
      loop: "{{ _add_node_ds_pods.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: not _ds or (_ds | unready_pods | length) > 0

    # Without its own node.<NAME> CR, a new node's balloons agent runs on the
    # cluster `default` CR — sized for whichever node was most capable when
    # nri_cpu_balloons last ran, not for this one. The node is still under the
    # add-node pending taint here, so that agent (no tolerations) hasn't
    # started yet; creating the CR now means it finds its own policy the
    # moment the taint is lifted below, and never runs on `default` at all.
    # Scoped to the new node(s): the Helm release, the default CR and every
    # existing node's CR/labels are left untouched (see install_advanced.yaml).
    # Runs only once the node is Ready, since the topology probe pod (which
    # does tolerate the taint) has to schedule there, and only if the
    # component is already installed — before that, `install nri_cpu_balloons`
    # covers every node anyway.
    - name: "kubernetes | add-node | Check whether NRI balloons is installed"
      kubernetes.core.k8s_info:
        api_version: config.nri/v1alpha1
        kind: BalloonsPolicy
        namespace: kube-system
        name: default
      register: _add_node_nri_default
      failed_when: false
      when:
        - (kubernetes_cpu_policy | default('nri-balloons')) == 'nri-balloons'
        - (kubernetes_accelerator | default('cpu')) == 'cpu'

    - name: "kubernetes | add-node | Per-node NRI balloon policy for new node(s)"
      ansible.builtin.include_role:
        name: nri_cpu_balloons
        tasks_from: install_advanced.yaml
        # tasks_from skips the role's main.yaml dispatcher, which is what
        # normally loads these platform values.
        vars_from: "{{ cluster_distribution }}.yaml"
      vars:
        _nri_scope_nodes: "{{ _added_nodes_list }}"
      when: (_add_node_nri_default.resources | default([]) | length) > 0

    # Last step on purpose: everything the node needs before it may take
    # workloads (labels, NFS export, its own balloons CR) is in place above.
    # If anything earlier failed, the node keeps the taint — nothing lands on
    # it — and re-running add-node resumes from this post phase.
    - name: "kubernetes | add-node | Lift add-node pending taint"
      kubernetes.core.k8s_taint:
        state: absent
        name: "{{ item }}"
        taints:
          - key: "{{ _add_node_pending_taint }}"
            effect: NoSchedule
        kubeconfig: "{{ kubernetes_kubeconfig }}"
      register: _add_node_untaint
      failed_when:
        - _add_node_untaint.failed | default(false)
        - "'not found' not in (_add_node_untaint.msg | default('') | lower)"
      loop: "{{ _added_nodes_list }}"
      when: _add_node_pending_taint | default('') | length > 0

    - name: "kubernetes | add-node | New node(s) ready"
      ansible.builtin.debug:
        msg: "Added and Ready: {{ _added_nodes_list | join(', ') }}"

- name: "kubernetes | add-node | End role (post phase complete)"
  when: _scale_phase | default('prep') == 'post'
  meta: end_role

# =====================================================================
# PHASE: prep — regenerate inventory from nodes.yaml
# =====================================================================

- name: "kubernetes | add-node | Ensure kubespray stack"
  ansible.builtin.include_tasks: kubespray_ensure.yaml

- name: "kubernetes | add-node | Regenerate inventory from nodes.yaml"
  ansible.builtin.include_tasks: generate_hosts_from_nodes.yaml

# The template task above just rewrote hosts.yaml on disk to include the new
# node(s), but this play's inventory was already loaded into memory at
# startup — Ansible won't notice the file changed on its own. Without this,
# delegate_to below finds no inventory entry for the new node (it didn't
# exist yet when the play started), so it falls back to resolving the raw
# hostname via DNS instead of using the ansible_host IP just templated in.
- name: "kubernetes | add-node | Reload inventory to pick up newly added node(s)"
  ansible.builtin.meta: refresh_inventory

# ─── Pre-flight for the new node(s) ──────────────────────────────────────────
# SSH ping and internet reachability mirror what install.yaml already runs
# against every node before a fresh cluster.yml. Already-joined and
# control-plane-reachability are add-node-specific: a fast, clear failure
# here beats a 10+ minute Kubespray run timing out or half-corrupting state
# deep inside whichever task first needs the thing that isn't actually there.
#
# These reach the new node(s) over SSH via the k8s_cluster
# `ansible_connection: ssh` set in hosts.yaml.j2 — see the note there.

- name: "kubernetes | add-node | SSH pre-flight | Ping new node(s)"
  ansible.builtin.ping:
  delegate_to: "{{ item }}"
  loop: "{{ _added_nodes_list }}"
  loop_control:
    label: "{{ item }}"

# Adding a node that's already part of some other cluster (or a stale
# leftover join on this one) can corrupt both — catch it before scale.yml
# ever touches it, rather than mid-join.
- name: "kubernetes | add-node | SSH pre-flight | Check new node(s) aren't already joined to a cluster"
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  delegate_to: "{{ item }}"
  loop: "{{ _added_nodes_list }}"
  loop_control:
    label: "{{ item }}"
  register: _add_node_kubelet_conf_stat

- name: "kubernetes | add-node | SSH pre-flight | Fail on already-joined node(s)"
  ansible.builtin.fail:
    msg: >-
      {{ item.item }} already has /etc/kubernetes/kubelet.conf — it looks like
      it's already part of a Kubernetes cluster. Reset it (kubeadm reset, or
      this installer's teardown against whichever env it belongs to) before
      adding it here.
  loop: "{{ _add_node_kubelet_conf_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists | default(false)

# scale.yml would otherwise wipe Docker and its data on the new node(s).
- name: "kubernetes | add-node | SSH pre-flight | Refuse new node(s) with Docker installed"
  ansible.builtin.include_tasks: docker_preflight.yaml
  vars:
    _docker_check_hosts: "{{ _added_nodes_list }}"

# scale.yml's kubeadm join needs this; failing here is faster and clearer
# than a join timeout deep inside the Kubespray run.
- name: "kubernetes | add-node | SSH pre-flight | Check control-plane API server reachability from new node(s)"
  ansible.builtin.wait_for:
    host: "{{ hostvars[groups['kube_control_plane'][0]].ansible_host }}"
    port: 6443
    timeout: 10
  delegate_to: "{{ item }}"
  loop: "{{ _added_nodes_list }}"
  loop_control:
    label: "{{ item }}"

- name: "kubernetes | add-node | SSH pre-flight | Check internet on new node(s)"
  ansible.builtin.uri:
    url: https://github.com
    method: GET
    timeout: 10
    status_code: [200, 301, 302]
  delegate_to: "{{ item }}"
  loop: "{{ _added_nodes_list }}"
  loop_control:
    label: "{{ item }}"
  environment:
    http_proxy: "{{ http_proxy | default('') }}"
    https_proxy: "{{ https_proxy | default('') }}"
    no_proxy: "{{ no_proxy | default('') }}"
  failed_when: false
  register: _add_node_inet_results

- name: "kubernetes | add-node | SSH pre-flight | Report new node(s) without internet"
  ansible.builtin.debug:
    msg: "WARNING: {{ item.item }} cannot reach https://github.com — check proxy settings"
  loop: "{{ _add_node_inet_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.status | default(0) not in [200, 301, 302]

# Before scale.yml, not after: this writes <inventory>/host_vars/<node>.yml
# (kubelet_reserved_cpus), which Kubespray reads when it renders the new
# node's kubelet config. Written after the join, the kubelet would start
# without reservedSystemCPUs and keep running that way until the next full
# cluster.yml. A no-op unless kubernetes_cpu_policy is kubelet-static or
# best-effort (see kubelet_reserved_cpus.yaml).
- name: "kubernetes | add-node | Kubelet CPU reservation for new node(s)"
  ansible.builtin.include_tasks: kubelet_reserved_cpus.yaml
  vars:
    _kubelet_calc_hosts_override: "{{ _added_nodes_list }}"

- name: "kubernetes | add-node | Prep complete"
  ansible.builtin.debug:
    msg: >-
      Inventory regenerated at {{ kubespray_custom_inventory }}.
      es_auto_installer.sh now runs Kubespray scale.yml for the new worker node(s).

- name: "kubernetes | add-node | End role (prep complete — scale.yml runs from caller)"
  meta: end_role
