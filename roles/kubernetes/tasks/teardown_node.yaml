---
# One node, after the Kubespray reset. Only names this stack creates are touched.
# reset.yml deletes chains in the filter table only, and an older kube-proxy
# crashes on a newer one's nftables tables.

# An unreachable node is skipped and reported, so the other nodes still get cleaned.
# wait_for_connection fails instead of going unreachable, which would end the play.
- name: "kubernetes | teardown | {{ _node }} | Check the node is reachable"
  ansible.builtin.wait_for_connection:
    timeout: 30
  delegate_to: "{{ _node }}"
  register: _kn_ping
  ignore_errors: true

- name: "kubernetes | teardown | {{ _node }} | Warn that the node is unreachable"
  ansible.builtin.debug:
    msg: "WARNING: {{ _node }} is unreachable; its post-reset cleanup was skipped. Re-run the teardown once it is back."
  when: _kn_ping is failed

- name: "kubernetes | teardown | {{ _node }} | Clean the node"
  when: _kn_ping is not failed
  delegate_to: "{{ _node }}"
  become: true
  block:
    # No nftables module exists; listing is read-only and argv deletes exactly the listed table.
    - name: "kubernetes | teardown | {{ _node }} | Read nftables tables"
      ansible.builtin.command:
        argv: [nft, list, tables]
      register: _kn_nft
      changed_when: false
      failed_when: false

    - name: "kubernetes | teardown | {{ _node }} | Delete kube-proxy nftables tables"
      ansible.builtin.command:
        argv: [nft, delete, table, "{{ item.split()[1] }}", kube-proxy]
      loop: "{{ _kn_nft.stdout_lines | default([]) | select('match', '^table (ip|ip6) kube-proxy$') | list }}"
      register: _kn_nft_del
      changed_when: _kn_nft_del.rc == 0
      failed_when: false

    # The iptables module cannot list chains, and it drives whichever backend `iptables` is.
    # The -legacy binaries are a second backend only when that default is nf_tables.
    - name: "kubernetes | teardown | {{ _node }} | Read the default iptables backend"
      ansible.builtin.command:
        argv: [iptables, --version]
      register: _kn_ipt_version
      changed_when: false
      failed_when: false

    - name: "kubernetes | teardown | {{ _node }} | Read iptables chains"
      vars:
        _bins: >-
          {{ ['iptables', 'ip6tables']
             + (['iptables-legacy', 'ip6tables-legacy'] if 'nf_tables' in (_kn_ipt_version.stdout | default('')) else []) }}
      ansible.builtin.command:
        argv: ["{{ item.0 }}", -t, "{{ item.1 }}", -S]
      loop: "{{ _bins | product(['filter', 'nat', 'mangle', 'raw']) | list }}"
      loop_control:
        label: "{{ item.0 }} -t {{ item.1 }}"
      register: _kn_chains
      changed_when: false
      failed_when: false

    # Rules elsewhere that jump to them: reset flushes only the IPv4 tables of the
    # default backend, so IPv6 and legacy keep e.g. "-A POSTROUTING -j ISTIO_POSTRT".
    - name: "kubernetes | teardown | {{ _node }} | Select leftover chains and the rules that jump to them"
      vars:
        _ours: '^(cali-|KUBE-|CNI-|ISTIO)'
        _listed: "{{ _kn_chains.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'equalto', 0) | list }}"
      ansible.builtin.set_fact:
        _kn_leftover: >-
          {%- set out = [] -%}
          {%- for r in _listed -%}
          {%- for line in r.stdout_lines if line is match('^-N ') and line.split()[1] is match(_ours) -%}
          {%- set _ = out.append({'bin': r.item.0, 'table': r.item.1, 'chain': line.split()[1],
                                  'ip_version': 'ipv6' if r.item.0.startswith('ip6') else 'ipv4',
                                  'legacy': r.item.0.endswith('-legacy')}) -%}
          {%- endfor -%}
          {%- endfor -%}
          {{ out }}
        _kn_jumps: >-
          {%- set out = [] -%}
          {%- for r in _listed -%}
          {%- for line in r.stdout_lines if line is match('^-A ') and line.split()[1] is not match(_ours) -%}
          {%- set words = line | regex_findall('"[^"]*"|\\S+') | map('regex_replace', '^"(.*)"$', '\\1') | list -%}
          {%- set flag = (words | select('in', ['-j', '-g']) | list | first) | default('') -%}
          {%- set target = words[words.index(flag) + 1] if flag else '' -%}
          {%- if target is match(_ours) -%}
          {%- set _ = out.append({'bin': r.item.0, 'table': r.item.1, 'rule': ['-D'] + words[1:]}) -%}
          {%- endif -%}
          {%- endfor -%}
          {%- endfor -%}
          {{ out }}

    # A rule spec can carry any match; the iptables module needs each as a parameter.
    - name: "kubernetes | teardown | {{ _node }} | Delete rules that jump to leftover chains"
      ansible.builtin.command:
        argv: "{{ [item.bin, '-t', item.table] + item.rule }}"
      loop: "{{ _kn_jumps }}"
      loop_control:
        label: "{{ item.bin }} {{ item.table }}: {{ item.rule | join(' ') }}"
      register: _kn_jump_del
      changed_when: _kn_jump_del.rc == 0
      failed_when: false

    # Chains may jump to each other: every flush runs before any delete.
    - name: "kubernetes | teardown | {{ _node }} | Flush, then delete leftover chains"
      ansible.builtin.iptables:
        ip_version: "{{ item.1.ip_version }}"
        table: "{{ item.1.table }}"
        chain: "{{ item.1.chain }}"
        flush: "{{ item.0 == 'flush' }}"
        chain_management: "{{ item.0 == 'delete' }}"
        state: "{{ 'absent' if item.0 == 'delete' else 'present' }}"
      loop: "{{ ['flush', 'delete'] | product(_kn_leftover | rejectattr('legacy') | list) | list }}"
      loop_control:
        label: "{{ item.1.bin }} {{ item.1.table }}/{{ item.1.chain }} {{ item.0 }}"
      register: _kn_chain_del
      failed_when: false

    # The iptables module drives only the default backend; same order.
    - name: "kubernetes | teardown | {{ _node }} | Flush, then delete leftover legacy chains"
      ansible.builtin.command:
        argv: ["{{ item.1.bin }}", -t, "{{ item.1.table }}", "{{ item.0 }}", "{{ item.1.chain }}"]
      loop: "{{ ['-F', '-X'] | product(_kn_leftover | selectattr('legacy') | list) | list }}"
      loop_control:
        label: "{{ item.1.bin }} {{ item.1.table }}/{{ item.1.chain }} {{ item.0 }}"
      register: _kn_del_legacy
      changed_when: _kn_del_legacy.rc == 0
      failed_when: false

    # No ipset module exists; listing is read-only and argv destroys exactly the listed set.
    - name: "kubernetes | teardown | {{ _node }} | Read ipsets"
      ansible.builtin.command:
        argv: [ipset, list, -n]
      register: _kn_ipsets
      changed_when: false
      failed_when: false

    - name: "kubernetes | teardown | {{ _node }} | Destroy Calico and Istio ipsets"
      ansible.builtin.command:
        argv: [ipset, destroy, "{{ item }}"]
      loop: "{{ _kn_ipsets.stdout_lines | default([]) | select('match', '^(cali|istio-)') | list }}"
      register: _kn_ipset_del
      changed_when: _kn_ipset_del.rc == 0
      failed_when: false

    - name: "kubernetes | teardown | {{ _node }} | Check the containerd service"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/systemd/system/containerd.service
        - /usr/lib/systemd/system/containerd.service
        - /lib/systemd/system/containerd.service
      register: _kn_containerd_unit

    - name: "kubernetes | teardown | {{ _node }} | Remove containerd config"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/containerd
        - /etc/systemd/system/containerd.service.d
      when: _kn_containerd_unit.results | selectattr('stat.exists') | list | length == 0

    # Headlamp's own teardown does not run for teardown kubernetes.
    - name: "kubernetes | teardown | {{ _node }} | Remove the Headlamp issuer entry from /etc/hosts"
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} enterprise-ai headlamp issuer"
        state: absent

    - name: "kubernetes | teardown | {{ _node }} | Remove local-path volume data"
      ansible.builtin.file:
        path: "{{ kubernetes_local_path_root }}"
        state: absent
      when: kubernetes_teardown_purge_volumes | bool

    # failed_when: false clears `failed` on these results, so a failure shows only in rc.
    - name: "kubernetes | teardown | {{ _node }} | Report what could not be removed"
      vars:
        _failed: >-
          {{ ((_kn_nft_del.results | default([])) + (_kn_jump_del.results | default([]))
              + (_kn_chain_del.results | default([]))
              + (_kn_del_legacy.results | default([])) + (_kn_ipset_del.results | default([])))
             | selectattr('rc', 'defined') | rejectattr('rc', 'equalto', 0) | list }}
      ansible.builtin.debug:
        msg: >-
          WARNING: on {{ _node }} the post-reset cleanup left {{ _failed | length }} item(s):
          {{ _failed | map(attribute='item') | map('string') | unique | join('; ') | truncate(600) }}
      when: _failed | length > 0

    # A failed read (e.g. no nft or ipset binary) leaves nothing to delete, unchecked.
    # cmd is a list, or a string when the binary is missing.
    - name: "kubernetes | teardown | {{ _node }} | Report what could not be read"
      vars:
        _unread: >-
          {%- set out = [] -%}
          {%- for r in [_kn_nft, _kn_ipsets] + (_kn_chains.results | default([]))
              if r.rc is defined and r.rc != 0 -%}
          {%- set _ = out.append(r.cmd if r.cmd is string else r.cmd | join(' ')) -%}
          {%- endfor -%}
          {{ out }}
      ansible.builtin.debug:
        msg: >-
          WARNING: on {{ _node }} these reads failed, so their leftovers were not checked:
          {{ _unread | join('; ') }}
      when: _unread | length > 0
