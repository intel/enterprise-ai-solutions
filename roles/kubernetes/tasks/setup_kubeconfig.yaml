---
# =============================================================================
# Kubernetes — Verify kubeconfig
# =============================================================================
# Kubespray handles kubeconfig fetch via kubeconfig_localhost: true (writes
# admin.conf to artifacts_dir). The bash caller renames it to kubeconfig.yaml
# in the env dir. This task only verifies the result is usable.
#
# For localhost mode, kubespray writes it locally. For custom_inventory mode,
# kubespray fetches it from the CP node via slurp + delegate_to localhost.
# =============================================================================

- name: "kubernetes | kubeconfig | Stat kubeconfig"
  ansible.builtin.stat:
    path: "{{ kubernetes_kubeconfig }}"
  register: _kube_cfg_stat

- name: "kubernetes | kubeconfig | Verify kubeconfig exists"
  when: existing_kubernetes | default('') | trim | length == 0
  ansible.builtin.assert:
    that: _kube_cfg_stat.stat.exists
    fail_msg: >-
      Kubeconfig not found at {{ kubernetes_kubeconfig }}.
      Kubespray should have written admin.conf to the env dir via
      kubeconfig_localhost: true. Check kubespray logs for errors.

# For localhost-only deployments rewrite the apiserver address to 127.0.0.1
# so kubectl doesn't route via the external IP. Without this, proxy
# environments require the node IP in no_proxy to reach the apiserver.
- name: "kubernetes | kubeconfig | Rewrite server to 127.0.0.1 (localhost mode)"
  when:
    - not (_k8s_needs_ssh | bool)
    - existing_kubernetes | default('') | trim | length == 0
  block:
    - name: "kubernetes | kubeconfig | Read cluster name"
      ansible.builtin.command: kubectl config view -o jsonpath='{.clusters[0].name}'
      environment:
        KUBECONFIG: "{{ kubernetes_kubeconfig }}"
      changed_when: false
      register: _kube_cluster_name

    - name: "kubernetes | kubeconfig | Read current server"
      ansible.builtin.command: kubectl config view -o jsonpath='{.clusters[0].cluster.server}'
      environment:
        KUBECONFIG: "{{ kubernetes_kubeconfig }}"
      changed_when: false
      register: _kube_server

    - name: "kubernetes | kubeconfig | Rewrite server to 127.0.0.1"
      ansible.builtin.command: >
        kubectl config set-cluster {{ _kube_cluster_name.stdout }}
        --server=https://127.0.0.1:{{ _kube_server.stdout | regex_replace('.*:', '') }}
      environment:
        KUBECONFIG: "{{ kubernetes_kubeconfig }}"
      changed_when: true
      when: "'127.0.0.1' not in _kube_server.stdout"

- name: "kubernetes | kubeconfig | Verify cluster reachable"
  ansible.builtin.command: kubectl cluster-info --request-timeout=10s
  environment:
    KUBECONFIG: "{{ kubernetes_kubeconfig }}"
  changed_when: false

- name: "kubernetes | kubeconfig | Display cluster info"
  ansible.builtin.debug:
    msg: "Kubeconfig OK at {{ kubernetes_kubeconfig }}"
