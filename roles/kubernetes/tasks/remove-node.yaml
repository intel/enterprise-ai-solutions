---
# =============================================================================
# Kubernetes — remove-node (Kubespray remove-node.yml)
# =============================================================================
# Flow (driven by es_auto_installer.sh):
#   Phase 1 (_scale_phase=prep, default): ensure kubespray stack only. The
#            inventory is deliberately NOT regenerated here — remove-node.yml
#            needs the node(s) being removed to still be present in it (with
#            their connection details) so it can reach them to drain and
#            reset. Regenerating from the already-edited nodes.yaml at this
#            point would drop them first, and remove-node.yml's "Reset node" /
#            "Post node removal" plays would then match zero hosts and
#            silently do nothing — the -e node=<name> extra-var only selects
#            among hosts the inventory actually defines.
#   Phase 2: es_auto_installer.sh runs Kubespray remove-node.yml directly
#            (live output) against the still-unregenerated inventory.
#   Phase 3 (_scale_phase=post): NOW regenerate the inventory from nodes.yaml,
#            so the removed node(s) are finally dropped, and delete their
#            now-orphaned node.<NAME> BalloonsPolicy CR(s) (_removed_nodes).
#            es_auto_installer.sh then deletes their now-stale host_vars file(s).
#
# es_auto_installer.sh refuses BYO, OpenShift and rack-scale envs first, and
# the first kube_control_plane/etcd host, which Kubespray cannot remove.
# =============================================================================

- name: "kubernetes | remove-node | Post phase — drop removed node(s) from inventory"
  when: _scale_phase | default('prep') == 'post'
  block:
    - name: "kubernetes | remove-node | Regenerate inventory from nodes.yaml"
      ansible.builtin.include_tasks: generate_hosts_from_nodes.yaml

    - name: "kubernetes | remove-node | Reload inventory without the removed node(s)"
      ansible.builtin.meta: refresh_inventory

    # The export allowlist comes from the inventory: until it is rewritten, a
    # removed node's address keeps rw,no_root_squash on the share.
    - name: "kubernetes | remove-node | NFS exports without the removed node(s)"
      ansible.builtin.include_role:
        name: nfs_storage
        tasks_from: refresh_exports.yaml
      when: (storage_backend | default('local-path') | string | trim | lower) == 'nfs'

    # A removed node's node.<NAME> BalloonsPolicy CR outlives it, and the NRI
    # plugin matches CRs by node name: a later node joining under the same
    # name would pick up this one — written for the old hardware — the moment
    # its balloons agent starts. Deleted here rather than left for the next
    # `install nri_cpu_balloons`. Only for nodes whose Node object is really
    # gone, so a removal that didn't complete can never strip a live node's
    # policy. Skipped when balloons isn't installed (no CRD); an already-absent
    # CR is a no-op under state: absent.
    - name: "kubernetes | remove-node | Check for BalloonsPolicy CRD"
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: balloonspolicies.config.nri
      register: _remove_node_bp_crd
      when: _removed_nodes | default('') | length > 0

    - name: "kubernetes | remove-node | List remaining cluster nodes"
      kubernetes.core.k8s_info:
        kind: Node
      register: _remove_node_live_nodes
      when: (_remove_node_bp_crd.resources | default([]) | length) > 0

    - name: "kubernetes | remove-node | Delete removed node(s)' BalloonsPolicy CR"
      kubernetes.core.k8s:
        state: absent
        api_version: config.nri/v1alpha1
        kind: BalloonsPolicy
        namespace: kube-system
        name: "node.{{ item }}"
      loop: >-
        {{ _removed_nodes | default('') | split(',') | reject('equalto', '')
           | reject('in', _remove_node_live_nodes.resources | default([]) | map(attribute='metadata.name') | list)
           | list }}
      loop_control:
        label: "node.{{ item }}"
      when: (_remove_node_bp_crd.resources | default([]) | length) > 0

    - name: "kubernetes | remove-node | Post phase complete"
      ansible.builtin.debug:
        msg: "Inventory regenerated at {{ kubespray_custom_inventory }} — removed node(s) dropped."

- name: "kubernetes | remove-node | End role (post phase complete)"
  when: _scale_phase | default('prep') == 'post'
  meta: end_role

# =====================================================================
# PHASE: prep — ensure kubespray only, inventory untouched
# =====================================================================

- name: "kubernetes | remove-node | Ensure kubespray stack"
  ansible.builtin.include_tasks: kubespray_ensure.yaml

- name: "kubernetes | remove-node | Prep complete"
  ansible.builtin.debug:
    msg: >-
      es_auto_installer.sh now runs Kubespray remove-node.yml for the removed
      node(s), against the current inventory (unregenerated on purpose).

- name: "kubernetes | remove-node | End role (prep complete — remove-node.yml runs from caller)"
  meta: end_role
