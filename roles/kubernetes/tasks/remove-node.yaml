---
# =============================================================================
# Kubernetes — remove-node (Kubespray remove-node.yml)
# =============================================================================
# es_auto_installer.sh (do_remove_node) finds the removed node(s) and runs:
#   prep (_scale_phase=prep): the Kubespray stack only. The inventory is not
#        regenerated yet: remove-node.yml reaches the node(s) through it, and
#        its -e node= only selects among hosts the inventory defines;
#   Kubespray remove-node.yml (drain, reset, remove);
#   post (_scale_phase=post, _removed_nodes): regenerate the inventory from
#        nodes.yaml, refresh the NFS exports, delete the node(s)' BalloonsPolicy.
# =============================================================================

- name: "kubernetes | remove-node | Post phase — drop removed node(s) from inventory"
  when: _scale_phase | default('prep') == 'post'
  block:
    - name: "kubernetes | remove-node | Regenerate inventory from nodes.yaml"
      ansible.builtin.include_tasks: generate_hosts_from_nodes.yaml

    - name: "kubernetes | remove-node | Reload inventory without the removed node(s)"
      ansible.builtin.meta: refresh_inventory

    # The export allowlist comes from the inventory: until it is rewritten, a
    # removed node's address keeps rw,no_root_squash on the share.
    - name: "kubernetes | remove-node | NFS exports without the removed node(s)"
      ansible.builtin.include_role:
        name: nfs_storage
        tasks_from: refresh_exports.yaml
      when: (storage_backend | default('local-path') | string | trim | lower) == 'nfs'

    # A node.<NAME> policy left behind would be picked up by a later node of
    # the same name. Deleted only for nodes really gone from the cluster.
    - name: "kubernetes | remove-node | Check for BalloonsPolicy CRD"
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: balloonspolicies.config.nri
      register: _remove_node_bp_crd
      when: _removed_nodes | default('') | length > 0

    - name: "kubernetes | remove-node | List remaining cluster nodes"
      kubernetes.core.k8s_info:
        kind: Node
      register: _remove_node_live_nodes
      when: (_remove_node_bp_crd.resources | default([]) | length) > 0

    - name: "kubernetes | remove-node | Delete removed node(s)' BalloonsPolicy CR"
      kubernetes.core.k8s:
        state: absent
        api_version: config.nri/v1alpha1
        kind: BalloonsPolicy
        namespace: kube-system
        name: "node.{{ item }}"
      loop: >-
        {{ _removed_nodes | default('') | split(',') | reject('equalto', '')
           | reject('in', _remove_node_live_nodes.resources | default([]) | map(attribute='metadata.name') | list)
           | list }}
      loop_control:
        label: "node.{{ item }}"
      when: (_remove_node_bp_crd.resources | default([]) | length) > 0

    - name: "kubernetes | remove-node | Post phase complete"
      ansible.builtin.debug:
        msg: "Inventory regenerated at {{ kubespray_custom_inventory }} — removed node(s) dropped."

- name: "kubernetes | remove-node | End role (post phase complete)"
  when: _scale_phase | default('prep') == 'post'
  meta: end_role

# =====================================================================
# PHASE: prep — ensure kubespray only, inventory untouched
# =====================================================================

- name: "kubernetes | remove-node | Ensure kubespray stack"
  ansible.builtin.include_tasks: kubespray_ensure.yaml

- name: "kubernetes | remove-node | Prep complete"
  ansible.builtin.debug:
    msg: >-
      es_auto_installer.sh now runs Kubespray remove-node.yml for the removed
      node(s), against the current inventory (unregenerated on purpose).

- name: "kubernetes | remove-node | End role (prep complete — remove-node.yml runs from caller)"
  meta: end_role
