---
# Canonical dispatcher (docs/reference/adding_solutions.md), the same in every
# role but for the name. Nothing here differs by platform, so there is no
# vars/<cluster_distribution>.yaml to load.
- name: "object_store | dispatch | Assert supported action"
  ansible.builtin.assert:
    that: component_action | default('') in ['install', 'teardown', 'validate']
    fail_msg: "object_store: unsupported component_action='{{ component_action | default('') }}'"
    quiet: true

- name: "object_store | dispatch | Include {{ component_action }}"
  ansible.builtin.include_tasks:
    file: "{{ component_action }}.yaml"
