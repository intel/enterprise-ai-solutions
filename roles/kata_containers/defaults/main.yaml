---
# =============================================================================
# Kata Containers Role Defaults
# =============================================================================
# Installs the Kata Containers runtime so Agent Sandbox can run each sandbox
# as a microVM (own guest kernel) instead of a runc pod sharing the host
# kernel.
#
# The kata-backed SandboxTemplate + warm pool are applied by the agent-toolkit
# layer's agent_sandbox role (it needs the Agent Sandbox CRDs).
# =============================================================================

# Kata runtime to use for sandboxes (options: kata-fc, kata-qemu, both)
kata_runtime: "kata-fc"
kata_version: "4.2.0"  # https://github.com/kata-containers/kata-containers kata-deploy chart version

# Confidential runtime installed alongside kata_runtime (options: "", kata-qemu-coco-dev, kata-qemu-tdx).
# kata-qemu-coco-dev runs the same CoCo flow in a normal VM, for testing without TDX hardware.
kata_confidential_runtime: ""

# Pod annotations containerd forwards to each Kata runtime. kata-deploy <= 4.2.0 forwards every
# io.katacontainers.* annotation, letting pod authors override the Kata config (GHSA-37rf-pj8c-g5g3).
# Only what our workloads need is allowed; extend a list only when a workload requires it.
kata_pod_annotations:
  kata-fc: []
  kata-qemu: []
  kata-qemu-coco-dev: &kata_confidential_pod_annotations
    - io.katacontainers.config.hypervisor.cc_init_data
    - io.katacontainers.config.runtime.create_container_timeout
  kata-qemu-tdx: *kata_confidential_pod_annotations

# Kata Containers configuration (microVM runtime for Agent Sandbox)
kata_namespace: "kube-system"
kata_release_name: "kata-deploy"
kata_chart_ref: "oci://ghcr.io/kata-containers/kata-deploy-charts/kata-deploy"

# Node eligibility label applied to nodes that pass the KVM preflight.
# Keep it free of dots — the key is passed through `helm --set nodeSelector.<key>`.
kata_node_label_key: "ei-kata-eligible"
kata_node_label_value: "true"
# Applied to nodes whose kvm_intel module has TDX enabled; kata-qemu-tdx pods are scheduled only there.
kata_tdx_node_label_key: "ei-tdx-eligible"

# RuntimeClasses created by the kata-deploy chart for the selected shims
kata_fc_runtime_class: "kata-fc"
kata_qemu_runtime_class: "kata-qemu"
