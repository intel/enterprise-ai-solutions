---
# =============================================================================
# Kata Containers — node preflight (one inventory node: kata_node)
# =============================================================================
# Run per node via delegate_to. Kata needs hardware virtualisation on every node it runs on,
# and kata-fc additionally needs a thin-provisioning snapshotter (Firecracker
# cannot use overlayfs). Failures here are never fatal: unusable nodes are
# simply excluded.
# =============================================================================

- name: "kata_containers | {{ kata_node }} | Check for /dev/kvm"
  ansible.builtin.stat:
    path: /dev/kvm
  register: kvm_device
  delegate_to: "{{ kata_node }}"

# This is an Intel Xeon stack, so we load the Intel KVM module (kvm_intel,
# gated on the 'vmx' flag). When VT-x is absent (disabled in BIOS, or a VM
# without nested virt) we load only the generic 'kvm' module and let the
# /dev/kvm re-check below warn-and-skip.
- name: "kata_containers | {{ kata_node }} | Check for the vmx CPU flag"
  ansible.builtin.command: grep -qw vmx /proc/cpuinfo
  register: kvm_vmx_flag
  delegate_to: "{{ kata_node }}"
  failed_when: false
  changed_when: false
  when: not kvm_device.stat.exists

- name: "kata_containers | {{ kata_node }} | Load KVM kernel modules when /dev/kvm is absent"
  ansible.builtin.command: "modprobe {{ item }}"
  become: true
  delegate_to: "{{ kata_node }}"
  loop: "{{ ['kvm'] + _kvm_vendor_module }}"
  vars:
    _kvm_vendor_module: "{{ ['kvm_intel'] if (kvm_vmx_flag.rc | default(1)) == 0 else [] }}"
  when: not kvm_device.stat.exists
  failed_when: false
  changed_when: false

- name: "kata_containers | {{ kata_node }} | Re-check /dev/kvm after loading modules"
  ansible.builtin.stat:
    path: /dev/kvm
  register: kvm_device_retry
  delegate_to: "{{ kata_node }}"
  when: not kvm_device.stat.exists

# kata-fc maps the fc shim onto containerd's devmapper snapshotter, which
# needs a thin-pool and a containerd config entry. kubespray regenerates
# /etc/containerd/config.toml on every fresh install (wiping any manual
# edit), so the feature configures it here — after kubespray, before the
# status check below — making kata-fc survive fresh installs and brownfield
# clusters alike. Only runs on KVM-capable nodes when Firecracker is wanted.
- name: "kata_containers | {{ kata_node }} | Set up containerd devmapper snapshotter for Firecracker"
  when:
    - (kvm_device.stat.exists or (kvm_device_retry.stat.exists | default(false)))
    - (kata_runtime | default('kata-fc')) in ['kata-fc', 'both']
  become: true
  delegate_to: "{{ kata_node }}"
  block:
    # The thin-pool script needs dmsetup, which minimal OS images do not ship.
    - name: "kata_containers | {{ kata_node }} | Ensure dmsetup is installed"
      ansible.builtin.shell: |
        command -v dmsetup >/dev/null 2>&1 && { echo present; exit 0; }
        if command -v apt-get >/dev/null 2>&1; then
          DEBIAN_FRONTEND=noninteractive apt-get install -y dmsetup
        elif command -v dnf >/dev/null 2>&1; then
          dnf install -y device-mapper
        else
          yum install -y device-mapper
        fi
      args:
        executable: /bin/bash
      register: _kata_dmsetup
      changed_when: "'present' not in _kata_dmsetup.stdout"

    - name: "kata_containers | {{ kata_node }} | Install devmapper thin-pool setup script"
      ansible.builtin.copy:
        dest: /usr/local/bin/containerd-devmapper-setup.sh
        mode: "0755"
        content: |
          #!/bin/bash
          # Recreate the loopback-backed devmapper thin-pool for containerd.
          # Idempotent: safe to run on every boot (systemd) and by hand.
          set -euo pipefail
          DATA_DIR=/var/lib/containerd/devmapper
          POOL_NAME=containerd-thinpool
          DATA_SIZE=100G
          META_SIZE=1G
          if dmsetup info "${POOL_NAME}" >/dev/null 2>&1; then exit 0; fi
          mkdir -p "${DATA_DIR}"
          [ -f "${DATA_DIR}/data" ] || truncate -s "${DATA_SIZE}" "${DATA_DIR}/data"
          [ -f "${DATA_DIR}/meta" ] || truncate -s "${META_SIZE}" "${DATA_DIR}/meta"
          DATA_DEV=$(losetup -j "${DATA_DIR}/data" | awk -F: 'NR==1{print $1}')
          [ -n "${DATA_DEV}" ] || DATA_DEV=$(losetup --find --show "${DATA_DIR}/data")
          META_DEV=$(losetup -j "${DATA_DIR}/meta" | awk -F: 'NR==1{print $1}')
          [ -n "${META_DEV}" ] || META_DEV=$(losetup --find --show "${DATA_DIR}/meta")
          LENGTH_SECTORS=$(( $(blockdev --getsize64 "${DATA_DEV}") / 512 ))
          dmsetup create "${POOL_NAME}" \
            --table "0 ${LENGTH_SECTORS} thin-pool ${META_DEV} ${DATA_DEV} 128 32768"

    - name: "kata_containers | {{ kata_node }} | Install devmapper thin-pool systemd unit (recreates pool on boot)"
      ansible.builtin.copy:
        dest: /etc/systemd/system/containerd-devmapper.service
        mode: "0644"
        content: |
          [Unit]
          Description=Setup containerd devmapper thin-pool (Kata Firecracker)
          DefaultDependencies=no
          After=systemd-udev-settle.service
          Before=containerd.service
          Wants=systemd-udev-settle.service
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/local/bin/containerd-devmapper-setup.sh
          [Install]
          WantedBy=multi-user.target

    - name: "kata_containers | {{ kata_node }} | Enable and start the thin-pool unit (creates the pool now)"
      ansible.builtin.systemd:
        name: containerd-devmapper.service
        enabled: true
        state: started
        daemon_reload: true

    # Add only if absent so we never define the TOML table twice (which
    # would stop containerd). kubespray's regenerated config drops it, so
    # this re-adds on the next run.
    - name: "kata_containers | {{ kata_node }} | Check whether devmapper snapshotter is already configured"
      ansible.builtin.command: grep -q 'io.containerd.snapshotter.v1.devmapper' /etc/containerd/config.toml
      register: kata_devmapper_present
      failed_when: false
      changed_when: false

    - name: "kata_containers | {{ kata_node }} | Register the devmapper snapshotter in containerd config"
      ansible.builtin.blockinfile:
        path: /etc/containerd/config.toml
        marker: "# {mark} kata devmapper snapshotter (managed)"
        block: |
          [plugins."io.containerd.snapshotter.v1.devmapper"]
            root_path = "/var/lib/containerd/devmapper"
            pool_name = "containerd-thinpool"
            base_image_size = "10GB"
            discard_blocks = true
      register: kata_devmapper_cfg
      when: kata_devmapper_present.rc != 0

    # kubespray defaults to discard_unpacked_layers=true, which drops layer
    # blobs after the first (overlayfs) unpack — so the devmapper snapshotter
    # can't unpack the same image and kata-fc pods fail with
    # "content digest ... not found". Keep the layers so both snapshotters work.
    - name: "kata_containers | {{ kata_node }} | Keep unpacked layers so overlayfs and devmapper can share images"
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: '^(\s*)discard_unpacked_layers\s*=\s*true'
        replace: '\g<1>discard_unpacked_layers = false'
      register: kata_discard_cfg

    - name: "kata_containers | {{ kata_node }} | Restart containerd to load the devmapper snapshotter"
      ansible.builtin.systemd:
        name: containerd
        state: restarted
      when: (kata_devmapper_cfg is changed) or (kata_discard_cfg is changed)

  # Missing prerequisites never fail the stack run: a node
  # whose devmapper setup fails is reported devmapper=False below, and the
  # cluster step warns and skips kata-fc (or installs kata-qemu only for "both").
  rescue:
    - name: "kata_containers | {{ kata_node }} | Devmapper setup failed — kata-fc unavailable on this node"
      ansible.builtin.debug:
        msg: >-
          WARNING: containerd devmapper setup failed on {{ kata_node }}
          ({{ ansible_failed_result.msg | default('see task output above') }}).
          The node is excluded from kata-fc; kata-qemu is unaffected.

- name: "kata_containers | {{ kata_node }} | Check containerd devmapper snapshotter status"
  ansible.builtin.shell: |
    set -o pipefail
    # localhost-mode clusters keep kubespray binaries (ctr) in <kubespray_dir>/bin
    export PATH="${PATH}:/usr/local/bin:/usr/bin{{ (':' ~ kubespray_dir ~ '/bin') if kubespray_dir is defined else '' }}"
    command -v ctr >/dev/null 2>&1 || { echo 0; exit 0; }
    ctr -a /run/containerd/containerd.sock plugins ls 2>/dev/null \
      | awk '$2 ~ /devmapper$/ && $NF == "ok" { found = 1 } END { print found + 0 }'
  args:
    executable: /bin/bash
  become: true
  delegate_to: "{{ kata_node }}"
  register: devmapper_check
  failed_when: false
  changed_when: false

- name: "kata_containers | {{ kata_node }} | Check whether kvm_intel has TDX enabled"
  ansible.builtin.slurp:
    src: /sys/module/kvm_intel/parameters/tdx
  register: kvm_tdx_param
  delegate_to: "{{ kata_node }}"
  failed_when: false
  when: kata_confidential_runtime | default('') == 'kata-qemu-tdx'

# Kata's QEMU needs the upstream KVM TDX VM type (5, Linux >= 6.16); older TDX backports report tdx=Y without it.
- name: "kata_containers | {{ kata_node }} | Check KVM offers the TDX VM type"
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - "import fcntl, os; print(fcntl.ioctl(os.open('/dev/kvm', os.O_RDWR), 0xAE03, 235) >> 5 & 1)"
  become: true
  delegate_to: "{{ kata_node }}"
  register: kvm_tdx_vm_type
  failed_when: false
  changed_when: false
  when: (kvm_tdx_param.content | default('') | b64decode | trim) == 'Y'

- name: "kata_containers | {{ kata_node }} | Record node capabilities"
  ansible.builtin.set_fact:
    _kata_node_results: >-
      {{ _kata_node_results | default({}) | combine({kata_node: {
           'kvm_ok': (kvm_device.stat.exists or (kvm_device_retry.stat.exists | default(false))) | bool,
           'devmapper_ok': ((devmapper_check.stdout | default('0') | trim) == '1') | bool,
           'tdx_enabled': ((kvm_tdx_param.content | default('') | b64decode | trim) == 'Y') | bool,
           'tdx_ok': ((kvm_tdx_vm_type.stdout | default('') | trim) == '1') | bool }}) }}

- name: "kata_containers | {{ kata_node }} | Display node preflight result"
  ansible.builtin.debug:
    msg: >-
      {{ kata_node }}: kvm={{ _kata_node_results[kata_node].kvm_ok }}
      devmapper={{ _kata_node_results[kata_node].devmapper_ok }}
      tdx={{ _kata_node_results[kata_node].tdx_ok }}
