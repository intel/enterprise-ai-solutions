---
# =============================================================================
# Kata Containers — Validate
# =============================================================================

# Install skips Kata (warn, no failure) when no node has /dev/kvm or no shim is
# left to install — validate reports that state instead of failing on it.
- name: "kata_containers | validate | Check whether kata-deploy is installed"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: DaemonSet
    name: "{{ kata_release_name }}"
    namespace: "{{ kata_namespace }}"
  register: _val_kata_installed

- name: "kata_containers | validate | Kata not installed (skipped at install)"
  ansible.builtin.debug:
    msg: >-
      kata_containers_enabled is set but kata-deploy is not installed — install skipped
      Kata (no node with /dev/kvm, or no shim left to install). See the install output.
  when: _val_kata_installed.resources | default([]) | length == 0

- name: "kata_containers | validate | End when Kata was skipped at install"
  ansible.builtin.meta: end_role
  when: _val_kata_installed.resources | default([]) | length == 0

- name: "kata_containers | validate | Check kata-deploy DaemonSet rollout"
  ansible.builtin.command: >-
    kubectl -n {{ kata_namespace }} rollout status daemonset/{{ kata_release_name }}
    --timeout=60s
  register: _val_kata_ds
  changed_when: false

- name: "kata_containers | validate | Get RuntimeClasses"
  kubernetes.core.k8s_info:
    api_version: node.k8s.io/v1
    kind: RuntimeClass
  register: _val_kata_rc

- name: "kata_containers | validate | Check a requested Kata RuntimeClass exists"
  vars:
    _requested: >-
      {{ ([kata_fc_runtime_class] if kata_runtime | default('kata-fc') in ['kata-fc', 'both'] else [])
         + ([kata_qemu_runtime_class] if kata_runtime | default('kata-fc') in ['kata-qemu', 'both'] else [])
         + ([kata_confidential_runtime] if kata_confidential_runtime | default('') | length > 0 else []) }}
    _present: "{{ _val_kata_rc.resources | map(attribute='metadata.name') | list }}"
  ansible.builtin.assert:
    that: _requested | intersect(_present) | length > 0
    fail_msg: "None of the requested Kata RuntimeClasses ({{ _requested | join(', ') }}) exist"
    success_msg: "Kata RuntimeClasses present: {{ _requested | intersect(_present) | join(', ') }}"

# kata-deploy counts TDX key slots only when NFD runs; without it the scheduler can oversubscribe them.
- name: "kata_containers | validate | Get TDX-eligible nodes"
  kubernetes.core.k8s_info:
    kind: Node
    label_selectors:
      - "{{ kata_tdx_node_label_key }}=true"
  register: _val_tdx_nodes
  when: kata_confidential_runtime | default('') == 'kata-qemu-tdx'

- name: "kata_containers | validate | Warn when TDX key slots are not advertised"
  ansible.builtin.debug:
    msg: >-
      WARNING: no TDX-eligible node advertises tdx.intel.com/keys — NFD was not running when
      kata-deploy was installed. Re-run the kata_containers install once NFD is deployed.
  when:
    - kata_confidential_runtime | default('') == 'kata-qemu-tdx'
    - "'tdx.intel.com/keys' not in (_val_tdx_nodes.resources | default([])
        | map(attribute='status.allocatable', default={}) | map('list') | flatten)"

# GHSA-37rf-pj8c-g5g3: no Kata runtime may forward every io.katacontainers.* pod annotation.
- name: "kata_containers | validate | Check containerd does not forward all Kata pod annotations"
  ansible.builtin.shell: |
    set -o pipefail
    export PATH="${PATH}:/usr/local/bin:/usr/bin{{ (':' ~ kubespray_dir ~ '/bin') if kubespray_dir is defined else '' }}"
    command -v containerd >/dev/null 2>&1 || { echo missing; exit 0; }
    containerd config dump | grep -c 'io\.katacontainers\.\*' || true
  args:
    executable: /bin/bash
  become: true
  delegate_to: "{{ item }}"
  loop: "{{ (groups['kube_control_plane'] | default([])) | union(groups['kube_node'] | default([])) | unique }}"
  register: _val_kata_pod_annotations
  changed_when: false
  failed_when: (_val_kata_pod_annotations.stdout | trim) != '0'
