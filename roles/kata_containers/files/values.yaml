# kata-deploy chart overrides; the role enables the shims selected by kata_runtime.

deploymentMode: daemonset
priorityClassName: system-node-critical

runtimeClasses:
  enabled: true
  createDefault: false

shims:
  disableAll: true

nodeSelector: {}
