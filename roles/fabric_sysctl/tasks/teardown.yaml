# =============================================================================
# Fabric Sysctl — Teardown
# =============================================================================

# ── Remove ECMP settings ────────────────────────────────────────────────────

- name: "fabric_sysctl | teardown | Remove ECMP sysctl config"
  ansible.builtin.file:
    path: /etc/sysctl.d/99-fabric-ecmp.conf
    state: absent
  delegate_to: "{{ item }}"
  become: true
  loop: "{{ groups['ecmp_nodes'] | default([]) }}"
  loop_control:
    label: "{{ item }}"
  register: _ecmp_removed

# The file is gone either way; the reload only re-applies what is left.
# sysctl --system re-applies every sysctl.d file and exits non-zero when any
# key is unknown to the running kernel (Ubuntu 22.04 GNR nodes reject
# net.ipv4.conf.all.accept_source_route), so a failure here is not ours.
- name: "fabric_sysctl | teardown | Reload sysctl on ECMP nodes"
  ansible.builtin.command: sysctl --system
  delegate_to: "{{ item.item }}"
  become: true
  loop: "{{ _ecmp_removed.results | default([]) | selectattr('changed') | list }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true
  failed_when: false

# ── Remove star hub settings ────────────────────────────────────────────────

- name: "fabric_sysctl | teardown | Remove fabric FORWARD rules from iptables"
  ansible.builtin.iptables:
    chain: FORWARD
    source: "{{ item.1.0 }}"
    destination: "{{ item.1.1 }}"
    jump: ACCEPT
    comment: "ai-solutions: fabric transit ({{ item.1.0 }} -> {{ item.1.1 }})"
    state: absent
  delegate_to: "{{ item.0 }}"
  become: true
  loop: >-
    {{ groups['fabric_routers'] | default([])
       | product(rack_scale_fabric_cidrs | default([]) | product(rack_scale_fabric_cidrs | default([])) | list)
       | list }}
  loop_control:
    label: "{{ item.0 }}: {{ item.1.0 }} -> {{ item.1.1 }}"
  when: rack_scale_fabric_cidrs | default([]) | length > 0
  # Best-effort: teardown must not abort on a router whose rules are already gone.
  failed_when: false

- name: "fabric_sysctl | teardown | Remove router sysctl config"
  ansible.builtin.file:
    path: /etc/sysctl.d/99-fabric-router.conf
    state: absent
  delegate_to: "{{ item }}"
  become: true
  loop: "{{ groups['fabric_routers'] | default([]) }}"
  loop_control:
    label: "{{ item }}"
  register: _router_removed

- name: "fabric_sysctl | teardown | Reload sysctl on router nodes"
  ansible.builtin.command: sysctl --system
  delegate_to: "{{ item.item }}"
  become: true
  loop: "{{ _router_removed.results | default([]) | selectattr('changed') | list }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true
  # Same as the ECMP reload above.
  failed_when: false

- name: "fabric_sysctl | teardown | Re-save iptables after rule removal"
  ansible.builtin.shell: >
    set -o pipefail;
    if [ -d /etc/iptables ]; then iptables-save > /etc/iptables/rules.v4;
    elif [ -d /etc/sysconfig ]; then iptables-save > /etc/sysconfig/iptables; fi
  args:
    executable: /bin/bash
  delegate_to: "{{ item }}"
  become: true
  loop: "{{ groups['fabric_routers'] | default([]) }}"
  loop_control:
    label: "{{ item }}"
  changed_when: true
