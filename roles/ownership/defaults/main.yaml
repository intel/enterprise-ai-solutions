---
# =============================================================================
# Ownership Role Defaults
# =============================================================================
# Labels every object a component creates, so teardown can delete exactly those.
# site.yaml and run_component.yaml call it around every component of every layer;
# no other role needs to know about it.
# =============================================================================

ownership_enabled: true

# Label keys: <prefix>/env, <prefix>/layer, <prefix>/component. Teardown matches on
# env + component, so two envs on one cluster never remove each other's objects.
ownership_label_prefix: "ai-solutions.intel.com"

# UIDs of the objects already on the cluster, rewritten after every component, and
# the component that runs now (cleared once it is labelled).
ownership_state_file: "{{ tmp_dir | default(playbook_dir ~ '/../env/local/logs/tmp') }}/ownership-uids.json"

# Objects a component creates outside its own tasks, which no task result names:
# in a Job or a controller it starts. (model-manager prints what it applies the way
# kubectl does, so its objects need no entry.) Each entry matches by any of kind, namespace,
# name and labels; only objects that appeared while the component ran are labelled.
ownership_declared:
  app_keycloak_config:
    - {kind: Secret, name: erag-credentials}         # keycloak configurator Job (kubectl apply)
  app_edp:
    - {kind: Secret, name: keycloak-minio-secret}    # keycloak client-secret Job (kubectl apply)

# Never listed: high-churn objects that always have an owner, and APIs that are
# slow or unsafe to list.
ownership_skip_resources:
  - events
  - events.events.k8s.io
  - pods
  - replicasets.apps
  - controllerrevisions.apps
  - endpoints
  - endpointslices.discovery.k8s.io
  - leases.coordination.k8s.io
  - packagemanifests.packages.operators.coreos.com

# Objects that may already be there when a component adds labels to them (a
# Namespace it does not own, a Node). The label pass records what it added on the
# object; teardown puts the old values back.
ownership_restore_resources:
  - namespaces
  - nodes

# Seconds teardown waits for each delete phase (finalizers, namespace deletion).
ownership_delete_timeout: 600
