---
# =============================================================================
# MinIO — Install
# Deploys standalone MinIO and wires up the object_store_* interface vars
# so that consumer roles (Loki, Tempo, …) never reference minio_* directly.
#
# Consumer credentials and bucket names come from object_store_consumers
# (defined in roles/object_store/defaults/main.yaml). This task just deploys
# the backend and translates — no consumer-specific logic lives here.
# =============================================================================

# ── Load object_store interface defaults ─────────────────────────────────────
# include_role only auto-loads the included role's own defaults. Explicitly
# load object_store defaults so object_store_consumers and object_store_*
# vars are available to this task file.

- name: "minio | Load object_store interface vars"
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../object_store/defaults/main.yaml"

# ── Pre-flight ────────────────────────────────────────────────────────────────

- name: "minio | Create namespace"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ minio_namespace }}"

- name: "minio | Label namespace — Istio"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ minio_namespace }}"
        labels:
          istio.io/dataplane-mode: "ambient"
  when: istio_enabled | default(false) | bool

- name: "minio | Label namespace — PSS"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ minio_namespace }}"
        labels:
          # baseline, not restricted: the chart's post-install Job (buckets/policies/
          # users) exposes only a pod-level securityContext, so its containers can
          # never set allowPrivilegeEscalation or drop capabilities — both are
          # container-only fields. The MinIO Deployment itself is restricted-clean.
          pod-security.kubernetes.io/enforce: "baseline"
          pod-security.kubernetes.io/audit: "restricted"
          pod-security.kubernetes.io/warn: "restricted"
  when: enforce_pss | default(false) | bool

- name: "minio | Bootstrap credentials"
  ansible.builtin.include_tasks: credentials.yaml

- name: "minio | Check MinIO release"
  kubernetes.core.helm_info:
    name: minio
    release_namespace: "{{ minio_namespace }}"
  register: _minio_release
  failed_when: false

# ── Helm repo ─────────────────────────────────────────────────────────────────

- name: "minio | Add MinIO Helm repo"
  kubernetes.core.helm_repository:
    name: minio
    repo_url: "{{ minio_helm_repo }}"
  register: helm_repo_add_result
  until: helm_repo_add_result is succeeded
  retries: "{{ helm_retries }}"
  delay: 15

# =============================================================================
# Translate object_store_consumers → MinIO buckets / IAM policies / users.
#
# For each consumer this produces:
#   bucket:  { name: "<bucket>", policy: none, purge: false }
#   policy:  scoped to that consumer's buckets (object CRUD + bucket list)
#   user:    { accessKey, secretKey, policy: "<name>-policy" }
# =============================================================================

- name: "minio | Build bucket list"
  ansible.builtin.set_fact:
    _minio_buckets: >-
      {{
        object_store_consumers
        | map(attribute='buckets')
        | flatten
        | map('community.general.dict_kv', 'name')
        | list
        | map('combine', {'policy': 'none', 'purge': false})
        | list
      }}

- name: "minio | Build IAM policies"
  ansible.builtin.set_fact:
    _minio_iam_policies: >-
      {%- set result = [] -%}
      {%- for c in object_store_consumers -%}
        {%- set bucket_arns = [] -%}
        {%- set object_arns = [] -%}
        {%- for b in c.buckets -%}
          {%- set _ = bucket_arns.append('arn:aws:s3:::' ~ b) -%}
          {%- set _ = object_arns.append('arn:aws:s3:::' ~ b ~ '/*') -%}
        {%- endfor -%}
        {%- set _ = result.append({
          'name': c.name ~ '-policy',
          'statements': [
            {
              'resources': object_arns,
              'actions': [
                's3:AbortMultipartUpload',
                's3:DeleteObject',
                's3:GetObject',
                's3:ListMultipartUploadParts',
                's3:PutObject'
              ]
            },
            {
              'resources': bucket_arns,
              'actions': [
                's3:CreateBucket',
                's3:DeleteBucket',
                's3:GetBucketLocation',
                's3:ListBucket',
                's3:ListBucketMultipartUploads'
              ]
            }
          ]
        }) -%}
      {%- endfor -%}
      {{ result }}

- name: "minio | Build IAM users"
  ansible.builtin.set_fact:
    _minio_iam_users: >-
      {%- set result = [] -%}
      {%- for c in object_store_consumers -%}
        {%- set _ = result.append({
          'accessKey': c.access_key,
          'secretKey': c.secret_key,
          'policy': c.name ~ '-policy'
        }) -%}
      {%- endfor -%}
      {{ result }}

# =============================================================================
# Deploy MinIO
# =============================================================================

- name: "minio | Install MinIO"
  when: _minio_release.status is not defined or _minio_release.status is none
  block:
    - name: "minio | Deploy MinIO"
      kubernetes.core.helm:
        name: minio
        chart_ref: minio/minio
        release_namespace: "{{ minio_namespace }}"
        create_namespace: false
        chart_version: "{{ minio_chart_version }}"
        wait: "{{ helm_wait }}"
        timeout: "{{ helm_timeout }}"
        values:
          mode: standalone
          replicas: 1
          rootUser: "{{ minio_root_user }}"
          rootPassword: "{{ minio_root_password }}"
          persistence:
            enabled: true
            size: "{{ minio_storage_size }}"
          # Chart passes this through verbatim, so the MinIO Deployment itself is
          # fully restricted-compliant even though the namespace enforces baseline.
          containerSecurityContext:
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: "1"
          affinity: "{{ _platform_affinity | default({}) }}"
          buckets: "{{ _minio_buckets }}"
          policies: "{{ _minio_iam_policies }}"
          users: "{{ _minio_iam_users }}"
          service:
            type: ClusterIP
            port: "{{ minio_api_port }}"
          consoleService:
            type: ClusterIP
            port: "{{ minio_console_port }}"
          metrics:
            serviceMonitor:
              # Prometheus Operator CRDs are installed by the observability role
              # which runs after minio — disable here to avoid CRD-not-found errors.
              enabled: false
      register: helm_install_result
      until: helm_install_result is succeeded
      retries: "{{ helm_retries }}"
      delay: 15

    - name: "minio | Wait for MinIO Deployment"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: minio
        namespace: "{{ minio_namespace }}"
      register: _minio_deploy
      until:
        - (_minio_deploy.resources | default([])) | length > 0
        - (_minio_deploy.resources[0].status.readyReplicas | default(0) | int) >= 1
      retries: 60
      delay: 5

- name: "minio | MinIO already installed — skipping"
  ansible.builtin.debug:
    msg: "MinIO already deployed in {{ minio_namespace }} — skipping."
  when: _minio_release.status is defined and _minio_release.status is not none

# ── Store per-consumer credentials as Secrets ─────────────────────────────────

- name: "minio | Store consumer credentials as Secrets"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "object-store-{{ item.name }}-credentials"
        namespace: "{{ minio_namespace }}"
      type: Opaque
      stringData:
        accessKey: "{{ item.access_key }}"
        secretKey: "{{ item.secret_key }}"
        endpoint: "{{ _minio_endpoint }}"
        buckets: "{{ item.buckets | join(',') }}"
  loop: "{{ object_store_consumers }}"
  loop_control:
    label: "object-store-{{ item.name }}-credentials"

# =============================================================================
# Set provider-agnostic object_store_* facts.
# Everything below this point in the play uses these vars — minio_* is done.
# =============================================================================

- name: "minio | Set object_store_endpoint"
  ansible.builtin.set_fact:
    object_store_endpoint: "{{ _minio_endpoint }}"

- name: "minio | Install complete"
  ansible.builtin.debug:
    msg: >-
      MinIO deployed in namespace '{{ minio_namespace }}'.
      object_store_endpoint: {{ object_store_endpoint }}
      Consumers: {{ object_store_consumers | map(attribute='name') | join(', ') }}
      Buckets: {{ object_store_consumers | map(attribute='buckets') | flatten | join(', ') }}
