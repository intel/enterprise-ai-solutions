---
# =============================================================================
# SeaweedFS — Credential bootstrap
# Pattern: K8s Secret is source of truth.
#   First run:  generate → deploy → store in Secret
#   Subsequent: read from Secret → deploy (idempotent, same passwords)
# Consumers added after the first install get a key generated on the next run.
# =============================================================================

- name: "seaweedfs | credentials | Check for existing credentials Secret"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: seaweedfs-credentials
    namespace: "{{ seaweedfs_namespace }}"
  register: _seaweedfs_creds_secret
  failed_when: false

- name: "seaweedfs | credentials | Load passwords from existing Secret"
  ansible.builtin.set_fact:
    object_store_loki_secret_key: "{{ _seaweedfs_creds_secret.resources[0].data.lokiSecretKey | b64decode }}"
    object_store_tempo_secret_key: "{{ _seaweedfs_creds_secret.resources[0].data.tempoSecretKey | b64decode }}"
    object_store_langfuse_secret_key: >-
      {{ (_seaweedfs_creds_secret.resources[0].data.langfuseSecretKey | default('') | b64decode)
         or lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}
  when: (_seaweedfs_creds_secret.resources | default([])) | length > 0

- name: "seaweedfs | credentials | Generate new passwords (first install)"
  ansible.builtin.set_fact:
    object_store_loki_secret_key: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
    object_store_tempo_secret_key: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
    object_store_langfuse_secret_key: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
  when: (_seaweedfs_creds_secret.resources | default([])) | length == 0

- name: "seaweedfs | credentials | Store credentials Secret"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: seaweedfs-credentials
        namespace: "{{ seaweedfs_namespace }}"
        labels:
          app.kubernetes.io/managed-by: ansible
          app.kubernetes.io/component: object-store
      type: Opaque
      stringData:
        endpoint: "{{ _seaweedfs_endpoint }}"
        lokiAccessKey: "{{ object_store_loki_access_key }}"
        lokiSecretKey: "{{ object_store_loki_secret_key }}"
        tempoAccessKey: "{{ object_store_tempo_access_key }}"
        tempoSecretKey: "{{ object_store_tempo_secret_key }}"
        langfuseAccessKey: "{{ object_store_langfuse_access_key }}"
        langfuseSecretKey: "{{ object_store_langfuse_secret_key }}"
