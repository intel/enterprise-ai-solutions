---
# =============================================================================
# SeaweedFS — Teardown
# =============================================================================

- name: "seaweedfs | Check if Helm release exists"
  kubernetes.core.helm_info:
    name: "{{ seaweedfs_release_name }}"
    release_namespace: "{{ seaweedfs_namespace }}"
  register: _seaweedfs_release
  failed_when: false

- name: "seaweedfs | Not installed — skipping teardown"
  ansible.builtin.debug:
    msg: "SeaweedFS Helm release not found in {{ seaweedfs_namespace }}. Nothing to tear down."
  when: _seaweedfs_release.status is not defined

- name: "seaweedfs | Teardown"
  when: _seaweedfs_release.status is defined
  block:
    - name: "seaweedfs | Uninstall Helm release"
      kubernetes.core.helm:
        name: "{{ seaweedfs_release_name }}"
        release_namespace: "{{ seaweedfs_namespace }}"
        state: absent
        wait: "{{ helm_wait }}"
        timeout: "{{ helm_timeout }}"
      failed_when: false

    - name: "seaweedfs | Delete namespace"
      kubernetes.core.k8s:
        kind: Namespace
        name: "{{ seaweedfs_namespace }}"
        state: absent
      failed_when: false
      when: not (_seaweedfs_shared_namespace | bool)

    # Shared namespace: remove only what this role created. StatefulSet PVCs
    # outlive `helm uninstall`, so they are deleted explicitly.
    - name: "seaweedfs | Remove own resources from shared namespace"
      when: _seaweedfs_shared_namespace | bool
      block:
        - name: "seaweedfs | Load object_store interface vars"
          ansible.builtin.include_vars:
            file: "{{ role_path }}/../object_store/defaults/main.yaml"

        - name: "seaweedfs | Find PVCs"
          kubernetes.core.k8s_info:
            api_version: v1
            kind: PersistentVolumeClaim
            namespace: "{{ seaweedfs_namespace }}"
          register: _seaweedfs_pvcs
          failed_when: false

        - name: "seaweedfs | Delete PVCs"
          kubernetes.core.k8s:
            api_version: v1
            kind: PersistentVolumeClaim
            name: "{{ item }}"
            namespace: "{{ seaweedfs_namespace }}"
            state: absent
          loop: "{{ _seaweedfs_pvcs.resources | default([]) | map(attribute='metadata.name') | select('search', _seaweedfs_fullname) | list }}"
          failed_when: false

        - name: "seaweedfs | Delete Secrets"
          kubernetes.core.k8s:
            api_version: v1
            kind: Secret
            name: "{{ item }}"
            namespace: "{{ seaweedfs_namespace }}"
            state: absent
          loop: "{{ ['seaweedfs-credentials', seaweedfs_s3_config_secret] + (object_store_consumers | map(attribute='name') | map('regex_replace', '^(.*)$', 'object-store-\\1-credentials') | list) }}"
          failed_when: false
