---
# Canonical dispatcher, the same in every component role but for the name.
# Keep it identical across roles (docs/reference/adding_solutions.md).
#   vars/<cluster_distribution>.yaml   values that differ by platform, if any
#   tasks/<action>_openshift.yaml      what the role does on OpenShift: its own
#                                      steps, an include of <action>.yaml, or a
#                                      fail when it is not used there
- name: "seaweedfs | dispatch | Assert supported action"
  ansible.builtin.assert:
    that: component_action | default('') in ['install', 'teardown', 'validate']
    fail_msg: "seaweedfs: unsupported component_action='{{ component_action | default('') }}'"
    quiet: true

- name: "seaweedfs | dispatch | Load {{ cluster_distribution }} values"
  ansible.builtin.include_vars: "{{ role_path }}/vars/{{ cluster_distribution }}.yaml"
  when: (role_path ~ '/vars/' ~ cluster_distribution ~ '.yaml') is file

- name: "seaweedfs | dispatch | Include {{ component_action }}"
  ansible.builtin.include_tasks:
    file: "{{ component_action }}{{ '_openshift' if cluster_distribution == 'openshift' else '' }}.yaml"
