---
# A route-level SecurityPolicy overrides the Gateway-wide JWT check: Envoy runs
# the OIDC login, keeps the tokens in encrypted HttpOnly cookies and admits only
# allowed groups (every signed-in realm user when none are listed).
- name: "envoy_gateway | sso | {{ gateway_route_namespace }}/{{ gateway_route_name }}"
  vars:
    _s: "{{ gateway_sso | default({}) }}"
    _oidc: "{{ (_s.issuer_internal | default('')) ~ '/protocol/openid-connect' }}"
    _id_cookie: "{{ gateway_route_name }}-id"
    _groups: "{{ _s.allowed_groups | default([]) | select | list }}"
    _spec:
      targetRefs:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          name: "{{ gateway_route_name }}"
      oidc:
        provider:
          issuer: "{{ _s.issuer | default('') }}"
          authorizationEndpoint: "{{ _s.issuer | default('') }}/protocol/openid-connect/auth"
          endSessionEndpoint: "{{ _s.issuer | default('') }}/protocol/openid-connect/logout"
          tokenEndpoint: "{{ _oidc }}/token"
        clientID: "{{ _s.client_id | default('') }}"
        clientSecret:
          name: "{{ _s.client_secret_name | default('') }}"
        redirectURL: "{{ _s.redirect_url | default('') }}"
        # Next to the callback, so it stays on the route under a path.
        logoutPath: "{{ (_s.redirect_url | default('') | urlsplit('path')) | regex_replace('/callback$', '/logout') }}"
        refreshToken: true
        cookieNames:
          idToken: "{{ _id_cookie }}"
          accessToken: "{{ gateway_route_name }}-at"
        # Not sent on cross-site POSTs or subrequests (CSRF).
        cookieConfig:
          sameSite: Lax
        # Only page loads go to the login page; a page's own requests (fetch,
        # assets, WebSocket) get 401 when the session is gone, so the app sees it.
        denyRedirect:
          headers:
            - name: Sec-Fetch-Mode
              type: RegularExpression
              value: "cors|same-origin|no-cors|websocket"
      jwt:
        providers:
          - name: sso
            issuer: "{{ _s.issuer | default('') }}"
            audiences: ["{{ _s.client_id | default('') }}"]
            remoteJWKS:
              uri: "{{ _oidc }}/certs"
            extractFrom:
              cookies: ["{{ _id_cookie }}"]
    _authz:
      defaultAction: Deny
      rules:
        - name: allowed-groups
          action: Allow
          principal:
            jwt:
              provider: sso
              claims:
                - name: groups
                  valueType: StringArray
                  values: "{{ _groups }}"
  kubernetes.core.k8s:
    state: "{{ gateway_route_state | default('present') }}"
    definition:
      apiVersion: gateway.envoyproxy.io/v1alpha1
      kind: SecurityPolicy
      metadata:
        name: "{{ gateway_route_policy_name | default(gateway_route_name ~ '-sso', true) }}"
        namespace: "{{ gateway_route_namespace }}"
      spec: "{{ _spec | combine({'authorization': _authz} if _groups | length > 0 else {}) }}"
  register: _eg_sso
  # Removing tolerates a cluster without the Envoy Gateway API.
  failed_when: _eg_sso is failed and gateway_route_state | default('present') == 'present'
