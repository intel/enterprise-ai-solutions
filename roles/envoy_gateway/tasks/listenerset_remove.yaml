---
# =============================================================================
# Envoy Gateway — unpublish a solution's hosts (reverse of listenerset.yaml)
# =============================================================================
# Same inputs as listenerset.yaml. Tolerates a missing gateway, namespace or
# ListenerSet API. gateway_listenerset_keep_grant keeps the host grant.

- name: "envoy_gateway | listenerset | Delete ListenerSet and its certificate"
  kubernetes.core.k8s:
    state: absent
    api_version: "{{ item.api }}"
    kind: "{{ item.kind }}"
    name: "{{ item.name }}"
    namespace: "{{ item.namespace }}"
  loop:
    - api: gateway.networking.k8s.io/v1
      kind: ListenerSet
      name: "{{ gateway_listenerset_name }}"
      namespace: "{{ gateway_listenerset_namespace }}"
    - api: cert-manager.io/v1
      kind: Certificate
      name: "{{ _ls_secret }}"
      namespace: "{{ gateway_listenerset_namespace }}"
    - api: v1
      kind: Secret
      name: "{{ _ls_secret }}"
      namespace: "{{ gateway_listenerset_namespace }}"
    - api: gateway.networking.k8s.io/v1beta1
      kind: ReferenceGrant
      name: "listenerset-{{ gateway_listenerset_namespace }}-{{ gateway_listenerset_name }}"
      namespace: "{{ gateway_namespace }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.name }}"
  failed_when: false

- name: "envoy_gateway | listenerset | Read namespace grant"
  kubernetes.core.k8s_info:
    kind: Namespace
    name: "{{ gateway_listenerset_namespace }}"
  register: _ls_ns
  when: not gateway_listenerset_keep_grant | default(false) | bool

- name: "envoy_gateway | listenerset | Revoke hosts from {{ gateway_listenerset_namespace }}"
  vars:
    _left: >-
      {{ ((_ls_ns.resources[0].metadata.annotations | default({})).get(gateway_hostnames_annotation, '')).split(',')
         | map('trim') | select | difference(gateway_listenerset_listeners | map(attribute='hostname')) | sort }}
  kubernetes.core.k8s:
    state: patched
    kind: Namespace
    name: "{{ gateway_listenerset_namespace }}"
    definition:
      metadata:
        annotations: "{{ {gateway_hostnames_annotation: (_left | join(',')) if _left else None} }}"
        labels: "{{ {gateway_listeners_label_key: gateway_listeners_label_value if _left else None} }}"
  when:
    - not gateway_listenerset_keep_grant | default(false) | bool
    - _ls_ns.resources | default([]) | length > 0
