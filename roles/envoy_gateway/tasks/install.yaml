---
# =============================================================================
# Envoy Gateway — Install via Helm + Gateway resource
# =============================================================================

- name: "envoy_gateway | Check for existing Helm release"
  kubernetes.core.helm_info:
    name: envoy-gateway
    release_namespace: "{{ envoy_gateway_namespace }}"
  register: _eg_release
  failed_when: false

- name: "envoy_gateway | Already installed — skipping"
  ansible.builtin.debug:
    msg: "Envoy Gateway release already deployed in {{ envoy_gateway_namespace }} — skipping install."
  when: _eg_release.status is defined and _eg_release.status is not none

- name: "envoy_gateway | Install"
  when: _eg_release.status is not defined or _eg_release.status is none
  block:
    - name: "envoy_gateway | Install Envoy Gateway via Helm (OCI) — standalone"
      kubernetes.core.helm:
        name: envoy-gateway
        chart_ref: "{{ envoy_gateway_helm_repo }}"
        release_namespace: "{{ envoy_gateway_namespace }}"
        create_namespace: true
        chart_version: "v{{ envoy_gateway_version }}"
        wait: "{{ helm_wait }}"
        timeout: "{{ helm_timeout }}"
        values:
          deployment:
            envoyGateway:
              affinity: "{{ _platform_affinity | default({}) }}"
          # The Backend extension API (gateway.envoyproxy.io/v1alpha1 Backend) is
          # off by default. It is how a route reaches an endpoint outside the
          # cluster with upstream TLS settings of its own - the ONTAP S3 reverse
          # proxy uses one. The inference layer later helm-upgrades this release
          # with the same flag (ext/enterprise.ai-inference/roles/kserve/
          # templates/envoy-gateway-ai-values.yaml.j2), so enabling it here only
          # means a platform-only install already has it, instead of leaving
          # every Backend-backed HTTPRoute at ResolvedRefs=False.
          config:
            envoyGateway:
              extensionApis:
                enableBackend: true
      register: helm_install_result
      until: helm_install_result is succeeded
      retries: "{{ helm_retries }}"
      delay: 15

    - name: "envoy_gateway | Wait for controller deployment"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: envoy-gateway
        namespace: "{{ envoy_gateway_namespace }}"
      register: _eg_deploy
      until:
        - _eg_deploy.resources | length > 0
        - _eg_deploy.resources[0].status.conditions | default([]) | selectattr('type','eq','Available') | selectattr('status','eq','True') | list | length > 0
      retries: 60
      delay: 5

# ── Gateway namespaces ────────────────────────────────────────────────────────

- name: "envoy_gateway | Label envoy-gateway-system namespace — Istio"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ envoy_gateway_namespace }}"
        labels:
          istio.io/dataplane-mode: "ambient"
  when: istio_enabled | default(false) | bool

# The eg-gateway proxy is the north-south mesh edge: external clients terminate TLS
# here with no mesh identity, so it must accept plaintext inbound. Selector-scoped so
# the internal ai-gateway proxy (same namespace, reached in-mesh) stays STRICT.
- name: "envoy_gateway | Allow external ingress at eg-gateway edge (mTLS PERMISSIVE)"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: security.istio.io/v1
      kind: PeerAuthentication
      metadata:
        name: eg-gateway-edge
        namespace: "{{ envoy_gateway_namespace }}"
      spec:
        selector:
          matchLabels:
            gateway.envoyproxy.io/owning-gateway-name: "{{ gateway_name }}"
        mtls:
          mode: PERMISSIVE
  when: istio_enabled | default(false) | bool

# Host-network apiserver (no mesh identity) can't reach the envoy-gateway controller's
# admission webhook under STRICT; open only its port, rest of the pod stays STRICT.
- name: "envoy_gateway | Allow apiserver to reach controller webhook (port-level mTLS)"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: security.istio.io/v1
      kind: PeerAuthentication
      metadata:
        name: allow-webhook-ctrl
        namespace: "{{ envoy_gateway_namespace }}"
      spec:
        selector:
          matchLabels:
            control-plane: envoy-gateway
        mtls:
          mode: STRICT
        portLevelMtls: "{{ {'9443': {'mode': 'PERMISSIVE'}} }}"
  when: istio_enabled | default(false) | bool

- name: "envoy_gateway | Label envoy-gateway-system namespace — PSS"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ envoy_gateway_namespace }}"
        labels:
          # The chart ships a full restricted securityContext and the generated
          # dataplane maps :80/:443 to unprivileged ports, so no NET_BIND_SERVICE.
          pod-security.kubernetes.io/enforce: "restricted"
          pod-security.kubernetes.io/audit: "restricted"
          pod-security.kubernetes.io/warn: "restricted"
  when: enforce_pss | default(false) | bool

- name: "envoy_gateway | Create gateway namespace (if different)"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ gateway_namespace }}"
  when: gateway_create and gateway_namespace != envoy_gateway_namespace

- name: "envoy_gateway | Label gateway namespace — Istio"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ gateway_namespace }}"
        labels:
          istio.io/dataplane-mode: "ambient"
  when:
    - gateway_create
    - gateway_namespace != envoy_gateway_namespace
    - istio_enabled | default(false) | bool

- name: "envoy_gateway | Label gateway namespace — PSS"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ gateway_namespace }}"
        labels:
          pod-security.kubernetes.io/enforce: "restricted"
          pod-security.kubernetes.io/audit: "restricted"
          pod-security.kubernetes.io/warn: "restricted"
  when:
    - gateway_create
    - gateway_namespace != envoy_gateway_namespace
    - enforce_pss | default(false) | bool

# ── TLS serving certificate ───────────────────────────────────────────────────

- name: "envoy_gateway | Provision TLS serving certificate"
  ansible.builtin.include_tasks: tls.yaml

# ── Gateway ───────────────────────────────────────────────────────────────────

# envoy_gateway | Data-plane workload: DaemonSet across all control-plane nodes
# ──────────────────────────────────────────────────────────────────────────
# MetalLB's L2 speaker announces the VIP from a single elected leader node
# (metallb auto-pool uses a control-plane IP). For LB packets to reach an
# envoy pod we need an envoy on that leader. A DaemonSet scoped to CP nodes
# is the simplest way to guarantee that without caring *which* CP node
# MetalLB elects at any given moment: every CP node always has a local
# envoy. Survives CP failover, no hostname pinning, no cp[0] dance.
#
# nodeSelector keys on the standard control-plane label (empty string is
# how kubespray / kubeadm stamp it) rather than the taint, because
# operators can remove the taint; the label is the stable Kubernetes
# control-plane marker. Toleration is kept for the case where the taint
# is still in place.
- name: "envoy_gateway | Create EnvoyProxy config (DaemonSet on control-plane nodes)"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.envoyproxy.io/v1alpha1
      kind: EnvoyProxy
      metadata:
        name: eg-proxy-config
        namespace: "{{ envoy_gateway_namespace }}"
      spec:
        provider:
          type: Kubernetes
          kubernetes:
            envoyDaemonSet:
              pod:
                nodeSelector:
                  node-role.kubernetes.io/control-plane: ""
                tolerations:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
                    effect: NoSchedule

- name: "envoy_gateway | Create GatewayClass"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: GatewayClass
      metadata:
        name: eg
      spec:
        controllerName: gateway.envoyproxy.io/gatewayclass-controller
        parametersRef:
          group: gateway.envoyproxy.io
          kind: EnvoyProxy
          name: eg-proxy-config
          namespace: "{{ envoy_gateway_namespace }}"

- name: "envoy_gateway | Apply Gateway resource"
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('ansible.builtin.template', 'gateway.yaml.j2') | from_yaml_all | list }}"
  when: gateway_create

- name: "envoy_gateway | Wait for Gateway to be accepted"
  kubernetes.core.k8s_info:
    api_version: gateway.networking.k8s.io/v1
    kind: Gateway
    name: "{{ gateway_name }}"
    namespace: "{{ gateway_namespace }}"
  register: _gw_status
  until:
    - _gw_status.resources | length > 0
    - _gw_status.resources[0].status.conditions | default([]) | selectattr('type','eq','Accepted') | selectattr('status','eq','True') | list | length > 0
  retries: 60
  delay: 5
  when: gateway_create

# ── Plaintext HTTP:80 → HTTPS redirect ───────────────────────────────────────
# The HTTP:80 listener exists so browsers hitting http:// still land on the
# stack, but it must never SERVE anything in cleartext. This catch-all route
# (no hostname, so it matches every host on the http listener via sectionName)
# 301-redirects all plaintext traffic to HTTPS. Service routes are pinned to
# sectionName: https so they never bind :80; anything that reaches :80 gets
# bounced here before a request body or credential is forwarded upstream.
- name: "envoy_gateway | Redirect all plaintext HTTP:80 traffic to HTTPS"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: http-to-https-redirect
        namespace: "{{ gateway_namespace }}"
      spec:
        parentRefs:
          - name: "{{ gateway_name }}"
            namespace: "{{ gateway_namespace }}"
            sectionName: http
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            filters:
              - type: RequestRedirect
                requestRedirect:
                  scheme: https
                  statusCode: 301
  when: gateway_create

# The gateway-level JWT SecurityPolicy targets the whole Gateway, so without an
# override the redirect route answers 401 before it can 301. Exempt it so a
# plaintext client is bounced to HTTPS instead of being rejected. Only needed in
# keycloak mode: that is the only mode that attaches a gateway-wide policy. In
# litellm/none mode there is no gateway policy to override.
- name: "envoy_gateway | Exempt the HTTP→HTTPS redirect route from gateway auth"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.envoyproxy.io/v1alpha1
      kind: SecurityPolicy
      metadata:
        name: http-to-https-redirect-no-auth
        namespace: "{{ gateway_namespace }}"
      spec:
        targetRefs:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
            name: http-to-https-redirect
  when: gateway_create and auth_provider == 'keycloak'

# ── Protected hostname ownership (cross-namespace route takeover) ─────────────
# Reserve each platform hostname to its owning namespace so a route in another
# namespace cannot claim it with a more specific match and hijack the traffic.
# See gateway_protected_hostnames in defaults/main.yaml.
- name: "envoy_gateway | Reserve platform hostnames to their owning namespace"
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('ansible.builtin.template', 'route-hostname-admission-policy.yaml.j2') | from_yaml_all | list }}"
  when:
    - gateway_create
    - gateway_route_admission_enabled | bool
    - gateway_protected_hostnames | length > 0

# ── ClientTrafficPolicy - S3 API path handling ───────────────────────────────

- name: "envoy_gateway | Apply S3 listener ClientTrafficPolicy (SigV4 path handling)"
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('ansible.builtin.template', 'client-traffic-policy.yaml.j2') | from_yaml }}"
  when:
    - gateway_create
    - gateway_s3_listener_enabled | bool

# Turning ontap_s3_data_lif off (or switching to routing_mode: path) removes the
# listener the policy targets, and a ClientTrafficPolicy with a dangling
# sectionName stays on the Gateway status as an unresolved policy. Prune it.
- name: "envoy_gateway | Remove the S3 listener ClientTrafficPolicy when the listener is gone"
  kubernetes.core.k8s:
    state: absent
    api_version: gateway.envoyproxy.io/v1alpha1
    kind: ClientTrafficPolicy
    name: "{{ gateway_name }}-s3-path"
    namespace: "{{ gateway_namespace }}"
  # The CRD is absent on a platform that never installed the Backend/policy
  # extension APIs, and the policy is absent on every install that never had an
  # S3 listener - neither is an error.
  failed_when: false
  when: not (gateway_s3_listener_enabled | bool)

# Gateway API resolves overlapping listener hostnames by specificity, so the
# moment 'https-s3' claims s3.<base_domain> exactly, the '*.<base_domain>'
# wildcard listener stops covering that name. Any pre-existing route that claims
# the S3 hostname while pinning sectionName: https therefore flips to
# Accepted=False / NoMatchingListenerHostname - in practice the SeaweedFS S3
# route from a deployment that used the in-cluster object store. That route is
# exactly what the ONTAP S3 proxy replaces, and the RAG layer removes it when it
# activates, but the platform layer runs first so the operator is told here.
- name: "envoy_gateway | Find routes still pinned to 'https' for the S3 hostname"
  kubernetes.core.k8s_info:
    api_version: gateway.networking.k8s.io/v1
    kind: HTTPRoute
  register: _eg_s3_routes
  # Read-only; a cluster without the Gateway API HTTPRoute CRD is not this task's
  # problem, and the report below simply has nothing to say.
  failed_when: false
  changed_when: false
  check_mode: false
  when:
    - gateway_create
    - gateway_s3_listener_enabled | bool

- name: "envoy_gateway | Report routes claiming the S3 hostname"
  vars:
    _claimants: >-
      {{ _eg_s3_routes.resources | default([])
         | selectattr('spec.hostnames', 'defined')
         | selectattr('spec.hostnames', 'contains', gateway_s3_hostname) | list }}
  ansible.builtin.debug:
    msg: |
      The '{{ gateway_s3_listener_name }}' listener now owns
      {{ gateway_s3_hostname }} exclusively. {{ _claimants | length }} HTTPRoute(s)
      claim that hostname:
      {% for r in _claimants %}
      {% set _secs = r.spec.parentRefs | default([]) | selectattr('name', 'equalto', gateway_name) | map(attribute='sectionName', default='(unpinned)') | list %}
        {{ r.metadata.namespace }}/{{ r.metadata.name }} sectionName={{ _secs | join(',') | default('(not this gateway)', true) }}{{ '  <-- OK' if gateway_s3_listener_name in _secs else '  <-- now Accepted=False' }}
      {% endfor %}
      Gateway API resolves overlapping listener hostnames by specificity, so a route
      pinned to sectionName: https no longer intersects {{ gateway_s3_hostname }} and
      goes Accepted=False with reason NoMatchingListenerHostname. The ONTAP S3
      reverse proxy in the RAG layer binds to '{{ gateway_s3_listener_name }}' and
      removes the in-cluster object store's S3 route, so the marker above is
      expected to be OK once that layer is installed. If you are not deploying it,
      set ontap_s3_data_lif back to empty, or re-pin the route with
      sectionName: {{ gateway_s3_listener_name }}.
  when:
    - gateway_create
    - gateway_s3_listener_enabled | bool
    - _claimants | length > 0

- name: "envoy_gateway | S3 path normalization not relaxed (routing_mode: path)"
  ansible.builtin.debug:
    msg: >-
      routing_mode is 'path', so the ONTAP S3 API shares the apex hostname
      {{ base_domain_name }} with the UI and cannot have a listener of its own.
      Envoy's default path normalization therefore still applies to S3 requests:
      an object key containing '//' or '%2F' will reach the object store with a
      different canonical URI than the client signed, and the store will answer
      SignatureDoesNotMatch. The data-prep service rejects such keys before
      signing. Use routing_mode 'subdomain' to get the dedicated
      '{{ gateway_s3_listener_name }}' listener and its ClientTrafficPolicy.
  when:
    - gateway_create
    - ontap_s3_data_lif | default('', true) | string | trim | length > 0
    - (routing_mode | default('subdomain')) == 'path'

# ── BackendTrafficPolicy — default request timeout ───────────────────────────

- name: "envoy_gateway | Apply gateway-default BackendTrafficPolicy (timeout)"
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('ansible.builtin.template', 'backend-traffic-policy.yaml.j2') | from_yaml }}"
  when: gateway_create

# ── SecurityPolicy (auth) ─────────────────────────────────────────────────────
# Only keycloak attaches a gateway-wide auth policy. In litellm mode the gateway
# is TLS + routing only: every published route self-authenticates — LiteLLM
# (litellm.<domain>) validates its virtual keys and the observability UIs
# (langfuse, grafana) own their logins — so no route is left unauthenticated and
# there is nothing for a gateway policy to guard. The inference layer publishes
# the direct-to-ai-gateway route (inference.<domain>) in keycloak mode only.

- name: "envoy_gateway | Apply gateway JWT SecurityPolicy (keycloak)"
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('ansible.builtin.template', 'security-policy.yaml.j2') | from_yaml_all | list }}"
  when: auth_provider == 'keycloak' and gateway_create

- name: "envoy_gateway | Apply no-auth SecurityPolicy overrides (keycloak)"
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('ansible.builtin.template', 'security-policy-no-auth.yaml.j2') | from_yaml_all | list }}"
  when: auth_provider == 'keycloak' and gateway_no_auth_routes | length > 0 and gateway_create

# Prune a gateway-wide auth policy left by a previous keycloak install when the
# cluster is reconfigured to litellm or none. A stale jwt policy would enforce
# JWT on every route and break LiteLLM's self-authenticating endpoint; the
# merge-patch that reconciles the active mode never removes a whole resource.
- name: "envoy_gateway | Remove gateway auth SecurityPolicy when not keycloak"
  kubernetes.core.k8s:
    state: absent
    api_version: gateway.envoyproxy.io/v1alpha1
    kind: SecurityPolicy
    name: gateway-auth
    namespace: "{{ gateway_namespace }}"
  # The CRD is absent on a platform-only install that never attached auth, and
  # the policy is absent on any install that was never in keycloak mode.
  failed_when: false
  when: gateway_create and auth_provider != 'keycloak'

# ServiceMonitors require Prometheus Operator CRDs which are installed by the
# observability role (runs after envoy_gateway). Skip silently if not yet present.
- name: "envoy_gateway | Check if Prometheus Operator CRDs are available"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: servicemonitors.monitoring.coreos.com
  register: _eg_sm_crd
  failed_when: false

- name: "envoy_gateway | Create ServiceMonitor for Envoy Gateway metrics"
  when: (_eg_sm_crd.resources | default([])) | length > 0
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: envoy-gateway
        namespace: "{{ envoy_gateway_namespace }}"
        labels:
          app: envoy-gateway
      spec:
        selector:
          matchLabels:
            app.kubernetes.io/name: gateway-helm
        namespaceSelector:
          matchNames:
            - "{{ envoy_gateway_namespace }}"
        endpoints:
          - port: metrics
            path: /metrics
            interval: 30s

- name: "envoy_gateway | ServiceMonitor skipped (Prometheus Operator not yet installed)"
  when: (_eg_sm_crd.resources | default([])) | length == 0
  ansible.builtin.debug:
    msg: "Prometheus Operator CRDs not found — Envoy Gateway ServiceMonitor will be created by the observability role."

- name: "envoy_gateway | Install complete"
  ansible.builtin.debug:
    msg: >-
      Envoy Gateway v{{ envoy_gateway_version }} installed in {{ envoy_gateway_namespace }}.
      Gateway '{{ gateway_name }}' created with TLS ({{ gateway_tls_mode }}){{ ' + auth (' + auth_provider + ')' if auth_provider != 'none' else '' }}.
