---
# Envoy Gateway — remove the controller, its namespace and CRDs, only if
# controller.yaml installed them (gateway_platform).

- name: "envoy_gateway | Delete the platform GatewayClass and proxy settings"
  kubernetes.core.k8s:
    api_version: "{{ item.api }}"
    kind: "{{ item.kind }}"
    name: "{{ item.name }}"
    namespace: "{{ item.namespace | default(omit) }}"
    state: absent
  loop:
    - {api: gateway.networking.k8s.io/v1, kind: GatewayClass, name: "{{ gateway_platform.class_name }}"}
    - {api: gateway.envoyproxy.io/v1alpha1, kind: EnvoyProxy, name: eg-proxy-config, namespace: "{{ _eg_proxy_config_namespace }}"}
  loop_control:
    label: "{{ item.kind }}/{{ item.name }}"
  failed_when: false
  when: gateway_create

- name: "envoy_gateway | Existing controller and CRDs left in place"
  ansible.builtin.debug:
    msg: >-
      The Envoy Gateway in {{ envoy_gateway_namespace }} and the Gateway API CRDs were not installed
      by this role, so they stay.
  when: not gateway_platform.controller_managed | bool

- name: "envoy_gateway | Uninstall Helm release"
  kubernetes.core.helm:
    name: "{{ envoy_gateway_release_name }}"
    release_namespace: "{{ envoy_gateway_namespace }}"
    state: absent
    wait: "{{ helm_wait }}"
    timeout: "{{ helm_timeout }}"
  failed_when: false
  when: gateway_platform.controller_managed | bool

- name: "envoy_gateway | Find Gateway API CRDs"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
  register: _eg_crds
  when: gateway_platform.controller_managed | bool

- name: "envoy_gateway | Delete Gateway API CRDs"
  kubernetes.core.k8s:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: "{{ item.metadata.name }}"
    state: absent
  loop: "{{ _eg_crds.resources | default([]) | selectattr('metadata.name', 'match', '.*gateway\\.networking\\.(k8s|x-k8s)\\.io') | list }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  failed_when: false
  when: gateway_platform.controller_managed | bool and gateway_platform.gateway_api_owned | default(true) | bool

- name: "envoy_gateway | Find Envoy Gateway CRDs"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
  register: _eg_crds
  when: gateway_platform.controller_managed | bool

- name: "envoy_gateway | Delete Envoy Gateway CRDs"
  kubernetes.core.k8s:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: "{{ item.metadata.name }}"
    state: absent
  loop: "{{ _eg_crds.resources | default([]) | selectattr('metadata.name', 'match', '.*gateway\\.envoyproxy\\.io') | list }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  failed_when: false
  when: gateway_platform.controller_managed | bool

- name: "envoy_gateway | Delete certgen ClusterRole"
  kubernetes.core.k8s:
    api_version: rbac.authorization.k8s.io/v1
    kind: "{{ item }}"
    name: "envoy-gateway-gateway-helm-certgen:{{ envoy_gateway_namespace }}"
    state: absent
  loop:
    - ClusterRoleBinding
    - ClusterRole
  failed_when: false
  when: gateway_platform.controller_managed | bool

- name: "envoy_gateway | Delete namespace"
  kubernetes.core.k8s:
    kind: Namespace
    name: "{{ envoy_gateway_namespace }}"
    state: absent
  failed_when: false
  when: gateway_platform.controller_managed | bool

# Shipped with the Gateway API CRDs; cluster-scoped.
- name: "envoy_gateway | Delete the Gateway API safe-upgrades policy"
  kubernetes.core.k8s:
    api_version: admissionregistration.k8s.io/v1
    kind: "{{ item }}"
    name: safe-upgrades.gateway.networking.k8s.io
    state: absent
  loop: [ValidatingAdmissionPolicyBinding, ValidatingAdmissionPolicy]
  failed_when: false
  when: gateway_platform.controller_managed | bool and gateway_platform.gateway_api_owned | default(true) | bool
