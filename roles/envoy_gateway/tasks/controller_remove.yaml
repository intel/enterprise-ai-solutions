---
# Envoy Gateway — remove the controller, its namespace and CRDs, only if
# controller.yaml installed them (gateway_platform).

- name: "envoy_gateway | Delete the platform GatewayClass and proxy settings"
  kubernetes.core.k8s:
    api_version: "{{ item.api }}"
    kind: "{{ item.kind }}"
    name: "{{ item.name }}"
    namespace: "{{ item.namespace | default(omit) }}"
    state: absent
  loop:
    - {api: gateway.networking.k8s.io/v1, kind: GatewayClass, name: "{{ gateway_platform.class_name }}"}
    - {api: gateway.envoyproxy.io/v1alpha1, kind: EnvoyProxy, name: eg-proxy-config, namespace: "{{ _eg_proxy_config_namespace }}"}
  loop_control:
    label: "{{ item.kind }}/{{ item.name }}"
  failed_when: false
  when: gateway_create

# Our mesh-edge exceptions on an existing controller's namespace (configure_existing).
- name: "envoy_gateway | Remove the mesh edge policies added to the existing controller"
  kubernetes.core.k8s:
    state: absent
    api_version: security.istio.io/v1
    kind: PeerAuthentication
    name: "{{ item }}"
    namespace: "{{ envoy_gateway_namespace }}"
  loop: [eg-gateway-edge, allow-webhook-ctrl]
  failed_when: false
  when:
    - not gateway_platform.controller_managed | bool
    - gateway_platform.configure_existing | default(false) | bool

- name: "envoy_gateway | Existing controller and CRDs left in place"
  ansible.builtin.debug:
    msg: >-
      The Envoy Gateway in {{ envoy_gateway_namespace }} and the Gateway API CRDs were not installed
      by this role, so they stay.
  when: not gateway_platform.controller_managed | bool

# The CRDs are about to go. Gateways and classes of this controller carry its
# finalizers, so remove them while it still runs, or the CRDs never delete.
- name: "envoy_gateway | Find what this controller serves"
  kubernetes.core.k8s_info:
    api_version: gateway.networking.k8s.io/v1
    kind: "{{ item }}"
  loop: [GatewayClass, Gateway]
  register: _eg_served
  failed_when: false
  when:
    - gateway_platform.controller_managed | bool
    - gateway_platform.gateway_api_owned | default(true) | bool

- name: "envoy_gateway | Delete its Gateways, then GatewayClasses (other layers' too)"
  vars:
    _classes: >-
      {{ (_eg_served.results[0].resources | default([]))
         | selectattr('spec.controllerName', 'eq', gateway_platform.controller_name)
         | map(attribute='metadata.name') | list }}
    _objects: >-
      {%- set out = [] -%}
      {%- for g in _eg_served.results[1].resources | default([]) if g.spec.gatewayClassName in _classes -%}
      {%- set _ = out.append({'kind': 'Gateway', 'name': g.metadata.name, 'namespace': g.metadata.namespace}) -%}
      {%- endfor -%}
      {%- for c in _classes -%}{%- set _ = out.append({'kind': 'GatewayClass', 'name': c}) -%}{%- endfor -%}
      {{ out }}
  kubernetes.core.k8s:
    state: absent
    api_version: gateway.networking.k8s.io/v1
    kind: "{{ item.kind }}"
    name: "{{ item.name }}"
    namespace: "{{ item.namespace | default(omit) }}"
    wait: true
    wait_timeout: 180
  loop: "{{ _objects }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.name }}"
  when:
    - gateway_platform.controller_managed | bool
    - gateway_platform.gateway_api_owned | default(true) | bool

- name: "envoy_gateway | Uninstall Helm release"
  kubernetes.core.helm:
    name: "{{ envoy_gateway_release_name }}"
    release_namespace: "{{ envoy_gateway_namespace }}"
    state: absent
    wait: "{{ helm_wait }}"
    timeout: "{{ helm_timeout }}"
  failed_when: false
  when: gateway_platform.controller_managed | bool

- name: "envoy_gateway | Find Gateway API CRDs"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
  register: _eg_crds
  when: gateway_platform.controller_managed | bool

# Envoy AI Gateway puts its finalizer on ReferenceGrants; with its controller
# gone nothing releases it, and the CRD would never finish deleting.
- name: "envoy_gateway | Look for the Envoy AI Gateway controller and ReferenceGrants"
  kubernetes.core.k8s_info:
    api_version: "{{ item.api }}"
    kind: "{{ item.kind }}"
    label_selectors: "{{ item.labels | default(omit) }}"
  loop:
    - {api: apps/v1, kind: Deployment, labels: [app.kubernetes.io/name=ai-gateway-helm]}
    - {api: gateway.networking.k8s.io/v1beta1, kind: ReferenceGrant}
  loop_control:
    label: "{{ item.kind }}"
  register: _eg_aigw
  failed_when: false
  when: gateway_platform.controller_managed | bool and gateway_platform.gateway_api_owned | default(true) | bool

- name: "envoy_gateway | Release orphaned Envoy AI Gateway finalizers"
  kubernetes.core.k8s:
    state: patched
    api_version: gateway.networking.k8s.io/v1beta1
    kind: ReferenceGrant
    name: "{{ item.metadata.name }}"
    namespace: "{{ item.metadata.namespace }}"
    merge_type: merge
    definition:
      metadata:
        finalizers: "{{ item.metadata.finalizers | reject('eq', 'aigateway.envoyproxy.io/finalizer') | list }}"
  loop: >-
    {{ (_eg_aigw.results[1].resources | default([]))
       | selectattr('metadata.finalizers', 'defined')
       | selectattr('metadata.finalizers', 'contains', 'aigateway.envoyproxy.io/finalizer') | list }}
  loop_control:
    label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"
  when:
    - gateway_platform.controller_managed | bool and gateway_platform.gateway_api_owned | default(true) | bool
    - _eg_aigw.results[0].resources | default([]) | length == 0

- name: "envoy_gateway | Delete Gateway API CRDs"
  kubernetes.core.k8s:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: "{{ item.metadata.name }}"
    state: absent
  loop: "{{ _eg_crds.resources | default([]) | selectattr('metadata.name', 'match', '^[a-z0-9-]+\\.gateway\\.networking\\.(k8s|x-k8s)\\.io$') | list }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  failed_when: false
  when: gateway_platform.controller_managed | bool and gateway_platform.gateway_api_owned | default(true) | bool

# A reinstall right after would race CRDs still being deleted.
- name: "envoy_gateway | Wait for the Gateway API CRDs to go"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
  register: _eg_crds_left
  until: >-
    _eg_crds_left.resources | default([])
    | selectattr('metadata.name', 'match', '^[a-z0-9-]+\\.gateway\\.networking\\.(k8s|x-k8s)\\.io$') | list | length == 0
  retries: 24
  delay: 5
  failed_when: false        # reported below; the rest of the teardown still runs
  when: gateway_platform.controller_managed | bool and gateway_platform.gateway_api_owned | default(true) | bool

- name: "envoy_gateway | Gateway API CRDs still deleting"
  vars:
    _left: >-
      {{ _eg_crds_left.resources | default([])
         | selectattr('metadata.name', 'match', '^[a-z0-9-]+\\.gateway\\.networking\\.(k8s|x-k8s)\\.io$')
         | map(attribute='metadata.name') | list }}
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ _left | join(', ') }} still deleting: objects of these kinds carry finalizers of a
      controller that is gone. List them with 'kubectl get <kind> -A -o yaml', remove the finalizer,
      and the CRDs finish deleting.
  when:
    - gateway_platform.controller_managed | bool and gateway_platform.gateway_api_owned | default(true) | bool
    - _left | length > 0

# Exactly this API group: aigateway.envoyproxy.io belongs to Envoy AI Gateway.
- name: "envoy_gateway | Find Envoy Gateway CRDs"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
  register: _eg_crds
  when: gateway_platform.controller_managed | bool

- name: "envoy_gateway | Delete Envoy Gateway CRDs"
  kubernetes.core.k8s:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: "{{ item.metadata.name }}"
    state: absent
  loop: "{{ _eg_crds.resources | default([]) | selectattr('metadata.name', 'match', '^[a-z0-9-]+\\.gateway\\.envoyproxy\\.io$') | list }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  failed_when: false
  when: gateway_platform.controller_managed | bool

- name: "envoy_gateway | Delete certgen ClusterRole"
  kubernetes.core.k8s:
    api_version: rbac.authorization.k8s.io/v1
    kind: "{{ item }}"
    name: "envoy-gateway-gateway-helm-certgen:{{ envoy_gateway_namespace }}"
    state: absent
  loop:
    - ClusterRoleBinding
    - ClusterRole
  failed_when: false
  when: gateway_platform.controller_managed | bool

- name: "envoy_gateway | Delete namespace"
  kubernetes.core.k8s:
    kind: Namespace
    name: "{{ envoy_gateway_namespace }}"
    state: absent
    wait: true
    wait_timeout: 300
  when: gateway_platform.controller_managed | bool

# Shipped with the Gateway API CRDs; cluster-scoped.
- name: "envoy_gateway | Delete the Gateway API safe-upgrades policy"
  kubernetes.core.k8s:
    api_version: admissionregistration.k8s.io/v1
    kind: "{{ item }}"
    name: safe-upgrades.gateway.networking.k8s.io
    state: absent
  loop: [ValidatingAdmissionPolicyBinding, ValidatingAdmissionPolicy]
  failed_when: false
  when: gateway_platform.controller_managed | bool and gateway_platform.gateway_api_owned | default(true) | bool
