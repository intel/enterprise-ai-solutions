---
# =============================================================================
# Envoy Gateway — attach a service to the shared gateway
# =============================================================================
# Called by the role that installs a service, from any repo:
#
#   - ansible.builtin.include_role:
#       name: envoy_gateway
#       tasks_from: attach.yaml
#     vars:
#       gateway_attach_service: <name in that repo's configs/service_routes.yaml>
#
# Resolves the service's route for the cluster's routing_mode, prepares the
# gateway for it (apex label in path mode; its own listener and certificate
# name otherwise) and returns gateway_attach:
#   host, relative_path, frontend_url, section_name, mode, backend, port,
#   namespace, gateway_name, gateway_namespace
# The caller creates its own HTTPRoute with parentRefs.sectionName =
# gateway_attach.section_name and hostnames = [gateway_attach.host].
# =============================================================================

- name: "envoy_gateway | attach | Resolve route for {{ gateway_attach_service }}"
  ansible.builtin.set_fact:
    gateway_attach: >-
      {{ gateway_attach_service
         | service_route(routing_mode | default('subdomain'), base_domain_name,
                         service_routes | default({}), service_route_overrides | default({}))
         | combine({'gateway_name': gateway_name, 'gateway_namespace': gateway_namespace}) }}

# The shared apex admits routes only from labelled namespaces (hijack guard),
# so a service that lands there opts its own namespace in.
- name: "envoy_gateway | attach | Allow {{ gateway_attach.namespace }} on the apex listener"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ gateway_attach.namespace }}"
        labels: "{{ {gateway_apex_route_label_key: gateway_apex_route_label_value} }}"
  when: gateway_attach.section_name == 'https-apex'

# A subdomain service gets its own exact-host listener (admitting only its
# namespace) and a name on the certificate. Both come from the merged registry,
# so a solution installed after the platform re-syncs them here.
- name: "envoy_gateway | attach | Read the gateway"
  kubernetes.core.k8s_info:
    api_version: gateway.networking.k8s.io/v1
    kind: Gateway
    name: "{{ gateway_name }}"
    namespace: "{{ gateway_namespace }}"
  register: _attach_gw
  when: gateway_attach.section_name != 'https-apex'

- name: "envoy_gateway | attach | Add {{ gateway_attach.host }} to the gateway"
  ansible.builtin.include_tasks: sync_hosts.yaml
  vars:
    gateway_create: true
  when:
    - gateway_attach.section_name != 'https-apex'
    - >-
      (_attach_gw.resources | default([{}]) | first).spec.listeners | default([])
      | selectattr('hostname', 'defined')
      | selectattr('hostname', 'equalto', gateway_attach.host) | list | length == 0

- name: "envoy_gateway | attach | Re-read the gateway"
  kubernetes.core.k8s_info:
    api_version: gateway.networking.k8s.io/v1
    kind: Gateway
    name: "{{ gateway_name }}"
    namespace: "{{ gateway_namespace }}"
  register: _attach_gw
  when: gateway_attach.section_name != 'https-apex'

# The listener that serves the host exactly: the service's own, or one the
# platform already runs for it (the dedicated S3 listener). None = misconfigured.
- name: "envoy_gateway | attach | Select the listener serving {{ gateway_attach.host }}"
  vars:
    _serving: >-
      {{ (_attach_gw.resources | default([{}]) | first).spec.listeners | default([])
         | selectattr('protocol', 'equalto', 'HTTPS') | selectattr('hostname', 'defined')
         | selectattr('hostname', 'equalto', gateway_attach.host) | map(attribute='name') | list }}
  ansible.builtin.set_fact:
    gateway_attach: "{{ gateway_attach | combine({'section_name': _serving | first}) }}"
  failed_when: _serving | length == 0
  when: gateway_attach.section_name != 'https-apex'

- name: "envoy_gateway | attach | {{ gateway_attach_service }}"
  ansible.builtin.debug:
    msg: >-
      {{ gateway_attach_service }}: {{ gateway_attach.frontend_url }}
      (listener {{ gateway_attach.section_name }}, namespace {{ gateway_attach.namespace }}).
      {{ 'DNS: point ' ~ gateway_attach.host ~ ' at the gateway address.'
         if gateway_attach.section_name != 'https-apex' else '' }}
