---
# =============================================================================
# Envoy Gateway — apex host in path mode (path grants, landing redirect)
# =============================================================================
# Path mode: solutions register path grants (apex_path.yaml); the admission
# policy enforces them. Subdomain mode: policy and landing are removed.

- name: "envoy_gateway | apex | Path grants ConfigMap (kept across runs)"
  kubernetes.core.k8s_info:
    kind: ConfigMap
    name: "{{ gateway_path_grants_configmap }}"
    namespace: "{{ gateway_namespace }}"
  register: _eg_grants

- name: "envoy_gateway | apex | Create path grants ConfigMap"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ gateway_path_grants_configmap }}"
        namespace: "{{ gateway_namespace }}"
      data: {}
  when: _eg_grants.resources | length == 0

- name: "envoy_gateway | apex | Admit apex routes only within their path grants"
  kubernetes.core.k8s:
    state: "{{ 'present' if gateway_path_mode | bool else 'absent' }}"
    definition: "{{ lookup('ansible.builtin.template', 'apex-path-admission-policy.yaml.j2') | from_yaml_all | select | list }}"

# The landing route lives in the gateway namespace and owns '/' exactly.
- name: "envoy_gateway | apex | Publish the landing redirect path"
  ansible.builtin.include_tasks: apex_path.yaml
  vars:
    gateway_apex_namespace: "{{ gateway_namespace }}"
    gateway_apex_path: "/"
    gateway_apex_route: apex-landing
    gateway_apex_cookies: []
  when: gateway_path_mode | bool and gateway_landing_path | length > 0

- name: "envoy_gateway | apex | Landing redirect"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: apex-landing
        namespace: "{{ gateway_namespace }}"
      spec:
        parentRefs:
          - name: "{{ gateway_name }}"
            namespace: "{{ gateway_namespace }}"
            sectionName: https-apex
        hostnames: ["{{ base_domain_name }}"]
        rules:
          # Exact '/', so unknown paths still 404.
          - matches: [{path: {type: Exact, value: /}}]
            filters:
              - type: RequestRedirect
                requestRedirect:
                  path: {type: ReplaceFullPath, replaceFullPath: "{{ gateway_landing_path }}"}
                  statusCode: 302
  when: gateway_path_mode | bool and gateway_landing_path | length > 0

# A redirect carries no credentials; without this the gateway JWT answers 401.
- name: "envoy_gateway | apex | Exempt the landing redirect from gateway auth"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.envoyproxy.io/v1alpha1
      kind: SecurityPolicy
      metadata:
        name: apex-landing-no-auth
        namespace: "{{ gateway_namespace }}"
      spec:
        targetRefs:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
            name: apex-landing
  when:
    - gateway_path_mode | bool and gateway_landing_path | length > 0
    - auth_provider in ['keycloak', 'litellm']

- name: "envoy_gateway | apex | Remove the landing redirect when off"
  when: not (gateway_path_mode | bool and gateway_landing_path | length > 0)
  block:
    - name: "envoy_gateway | apex | Delete landing route and its policy"
      kubernetes.core.k8s:
        state: absent
        api_version: "{{ item.api }}"
        kind: "{{ item.kind }}"
        name: "{{ item.name }}"
        namespace: "{{ gateway_namespace }}"
      loop:
        - {api: gateway.networking.k8s.io/v1, kind: HTTPRoute, name: apex-landing}
        - {api: gateway.envoyproxy.io/v1alpha1, kind: SecurityPolicy, name: apex-landing-no-auth}
      loop_control:
        label: "{{ item.kind }}/{{ item.name }}"

    - name: "envoy_gateway | apex | Release the landing path grant"
      ansible.builtin.include_tasks: apex_path_remove.yaml
      vars:
        gateway_apex_namespace: "{{ gateway_namespace }}"
        gateway_apex_path: "/"
        gateway_apex_route: apex-landing
