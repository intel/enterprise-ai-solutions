---
# =============================================================================
# Envoy Gateway — publish a service in the current routing mode
# =============================================================================
# subdomain: its own host via a ListenerSet (listenerset.yaml)
# path:      a path on the apex host via a path grant (apex_path.yaml)
# The other mode's objects are removed, so switching modes leaves nothing stale.
#   gateway_publish_name       service / listener name (e.g. keycloak)
#   gateway_publish_namespace  owning namespace
#   gateway_publish_host       subdomain host
#   gateway_publish_path       apex path (e.g. /keycloak)
#   gateway_publish_route      HTTPRoute name (default: gateway_publish_name)
#   gateway_publish_cookies    path mode: cookies the route may receive (see apex_path.yaml)
#   gateway_publish_mode       override routing_mode (e.g. subdomain for apps
#                              that cannot run under a path)
# Sets gateway_publish: {mode, host, relative_path, frontend_url, parent_ref}.

- name: "envoy_gateway | publish | {{ gateway_publish_name ~ ' (' ~ _gp_mode ~ ')' }}"
  ansible.builtin.include_tasks: "{{ _gp_file }}"
  loop: "{{ ['listenerset.yaml', 'apex_path_remove.yaml'] if _gp_mode == 'subdomain'
            else ['apex_path.yaml', 'listenerset_remove.yaml'] }}"
  loop_control:
    loop_var: _gp_file      # included files loop over item themselves
  vars:
    gateway_listenerset_name: "{{ gateway_publish_name }}"
    gateway_listenerset_namespace: "{{ gateway_publish_namespace }}"
    gateway_listenerset_listeners: [{name: "{{ gateway_publish_name }}", hostname: "{{ gateway_publish_host }}"}]
    gateway_apex_namespace: "{{ gateway_publish_namespace }}"
    gateway_apex_path: "{{ gateway_publish_path }}"
    gateway_apex_route: "{{ gateway_publish_route | default(gateway_publish_name) }}"
    gateway_apex_cookies: "{{ gateway_publish_cookies | default([]) }}"

- name: "envoy_gateway | publish | Route parent for {{ gateway_publish_name }}"
  ansible.builtin.set_fact:
    gateway_publish:
      mode: "{{ _gp_mode }}"
      host: "{{ gateway_publish_host if _gp_mode == 'subdomain' else base_domain_name }}"
      relative_path: "{{ '/' if _gp_mode == 'subdomain' else gateway_publish_path }}"
      frontend_url: >-
        {{ 'https://' ~ gateway_publish_host if _gp_mode == 'subdomain'
           else 'https://' ~ base_domain_name ~ gateway_publish_path }}
      parent_ref: >-
        {{ gateway_listenerset_ref | combine({'sectionName': gateway_publish_name}) if _gp_mode == 'subdomain'
           else {'name': gateway_name, 'namespace': gateway_namespace, 'sectionName': 'https-apex'} }}
