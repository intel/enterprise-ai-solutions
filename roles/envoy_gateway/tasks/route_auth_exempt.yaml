---
# A route-level SecurityPolicy overrides the Gateway-wide one; empty means no auth.
- name: "envoy_gateway | auth exempt | {{ gateway_route_namespace }}/{{ gateway_route_name }}"
  kubernetes.core.k8s:
    state: "{{ gateway_route_state | default('present') }}"
    definition:
      apiVersion: gateway.envoyproxy.io/v1alpha1
      kind: SecurityPolicy
      metadata:
        name: "{{ gateway_route_policy_name | default(gateway_route_name ~ '-no-auth', true) }}"
        namespace: "{{ gateway_route_namespace }}"
      spec:
        targetRefs:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
            name: "{{ gateway_route_name }}"
  register: _eg_exempt
  # Removing tolerates a cluster without the Envoy Gateway API.
  failed_when: _eg_exempt is failed and gateway_route_state | default('present') == 'present'
