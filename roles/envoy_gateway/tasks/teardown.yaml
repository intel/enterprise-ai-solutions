---
# =============================================================================
# Envoy Gateway — Teardown
# =============================================================================

# Our own objects always go; the controller, its namespace and CRDs only if
# this role installed them (gateway_platform, see detect.yaml).
- name: "envoy_gateway | Load the platform record"
  ansible.builtin.include_tasks: platform.yaml
  vars:
    _eg_detect_strict: false

- name: "envoy_gateway | Teardown"
  block:
    - name: "envoy_gateway | Delete SecurityPolicy"
      kubernetes.core.k8s:
        api_version: gateway.envoyproxy.io/v1alpha1
        kind: SecurityPolicy
        name: gateway-auth
        namespace: "{{ gateway_namespace }}"
        state: absent
      failed_when: false

    - name: "envoy_gateway | Delete S3 listener ClientTrafficPolicy"
      kubernetes.core.k8s:
        api_version: gateway.envoyproxy.io/v1alpha1
        kind: ClientTrafficPolicy
        name: "{{ gateway_name }}-s3-path"
        namespace: "{{ gateway_namespace }}"
        state: absent
      failed_when: false

    - name: "envoy_gateway | Delete ALPN ClientTrafficPolicies"
      kubernetes.core.k8s:
        api_version: gateway.envoyproxy.io/v1alpha1
        kind: ClientTrafficPolicy
        name: "{{ gateway_name }}-{{ item }}"
        namespace: "{{ gateway_namespace }}"
        state: absent
      loop: [alpn, wildcard-http1]
      failed_when: false

    # Cluster-scoped, so the namespace deletion below does not remove them.
    - name: "envoy_gateway | Delete admission policies (hostname grants, CRD safe-upgrades)"
      kubernetes.core.k8s:
        api_version: admissionregistration.k8s.io/v1
        kind: "{{ item.1 }}"
        name: "{{ item.0 }}"
        state: absent
      loop: >-
        {{ ['eg-listener-hostname-grant', 'eg-route-hostname-grant', 'eg-apex-path-grant', 'eg-protected-hostname-ownership',
            'safe-upgrades.gateway.networking.k8s.io']
           | product(['ValidatingAdmissionPolicyBinding', 'ValidatingAdmissionPolicy']) | list }}
      loop_control:
        label: "{{ item.1 }}/{{ item.0 }}"
      failed_when: false

    - name: "envoy_gateway | Delete Gateway resource"
      kubernetes.core.k8s:
        api_version: gateway.networking.k8s.io/v1
        kind: Gateway
        name: "{{ gateway_name }}"
        namespace: "{{ gateway_namespace }}"
        state: absent
      failed_when: false
      when: gateway_create

    - name: "envoy_gateway | Delete CA ClusterIssuers"
      kubernetes.core.k8s:
        api_version: cert-manager.io/v1
        kind: ClusterIssuer
        name: "{{ item }}"
        state: absent
      loop:
        - gateway-issuer
        - "{{ gateway_ca_bootstrap_issuer_name }}"
      failed_when: false
      when: gateway_tls_mode == 'selfsigned'

    # The CA lives in certmanager_namespace, which this role never deletes —
    # so the Certificate must go explicitly or it lingers with a dead issuer.
    - name: "envoy_gateway | Delete root CA Certificate"
      kubernetes.core.k8s:
        api_version: cert-manager.io/v1
        kind: Certificate
        name: "{{ gateway_ca_cert_name }}"
        namespace: "{{ certmanager_namespace }}"
        state: absent
      failed_when: false
      when: gateway_tls_mode == 'selfsigned'

    - name: "envoy_gateway | Delete root CA secret"
      kubernetes.core.k8s:
        api_version: v1
        kind: Secret
        name: "{{ gateway_ca_secret_name }}"
        namespace: "{{ certmanager_namespace }}"
        state: absent
      failed_when: false
      when: gateway_tls_mode == 'selfsigned'

    - name: "envoy_gateway | Remove exported root CA certificate"
      ansible.builtin.file:
        path: "{{ gateway_ca_export_path }}"
        state: absent
      when: gateway_tls_mode == 'selfsigned'

    - name: "envoy_gateway | Delete platform listener Certificates"
      kubernetes.core.k8s:
        api_version: cert-manager.io/v1
        kind: Certificate
        name: "{{ item }}-cert"
        namespace: "{{ gateway_namespace }}"
        state: absent
      loop: "{{ _eg_platform_certs_all }}"
      failed_when: false
      when: gateway_tls_mode == 'selfsigned'

    - name: "envoy_gateway | Delete TLS secrets"
      kubernetes.core.k8s:
        api_version: v1
        kind: Secret
        name: "{{ item }}"
        namespace: "{{ gateway_namespace }}"
        state: absent
      loop: "{{ _eg_platform_certs_all }}"
      failed_when: false

    - name: "envoy_gateway | Delete the platform GatewayClass, proxy settings and record"
      kubernetes.core.k8s:
        api_version: "{{ item.api }}"
        kind: "{{ item.kind }}"
        name: "{{ item.name }}"
        namespace: "{{ item.namespace | default(omit) }}"
        state: absent
      loop:
        - {api: gateway.networking.k8s.io/v1, kind: GatewayClass, name: "{{ gateway_platform.class_name }}"}
        - {api: gateway.envoyproxy.io/v1alpha1, kind: EnvoyProxy, name: eg-proxy-config, namespace: "{{ _eg_proxy_config_namespace }}"}
        - {api: v1, kind: ConfigMap, name: "{{ gateway_platform_configmap }}", namespace: "{{ gateway_namespace }}"}
      loop_control:
        label: "{{ item.kind }}/{{ item.name }}"
      failed_when: false
      when: gateway_create

    - name: "envoy_gateway | Existing controller and CRDs left in place"
      ansible.builtin.debug:
        msg: >-
          The Envoy Gateway in {{ envoy_gateway_namespace }} and the Gateway API CRDs were not installed
          by this role, so they stay.
      when: not gateway_platform.controller_managed | bool

    # Gateways and classes of this controller carry its finalizers; remove them
    # while it still runs, or the CRDs below never delete.
    - name: "envoy_gateway | Find what this controller serves"
      kubernetes.core.k8s_info:
        api_version: gateway.networking.k8s.io/v1
        kind: "{{ item }}"
      loop: [GatewayClass, Gateway]
      register: _eg_served
      failed_when: false
      when: gateway_platform.controller_managed | bool and gateway_platform.gateway_api_owned | default(true) | bool

    - name: "envoy_gateway | Delete its Gateways, then GatewayClasses (other layers' too)"
      vars:
        _classes: >-
          {{ (_eg_served.results[0].resources | default([]))
             | selectattr('spec.controllerName', 'eq', gateway_platform.controller_name)
             | map(attribute='metadata.name') | list }}
        _objects: >-
          {%- set out = [] -%}
          {%- for g in _eg_served.results[1].resources | default([]) if g.spec.gatewayClassName in _classes -%}
          {%- set _ = out.append({'kind': 'Gateway', 'name': g.metadata.name, 'namespace': g.metadata.namespace}) -%}
          {%- endfor -%}
          {%- for c in _classes -%}{%- set _ = out.append({'kind': 'GatewayClass', 'name': c}) -%}{%- endfor -%}
          {{ out }}
      kubernetes.core.k8s:
        state: absent
        api_version: gateway.networking.k8s.io/v1
        kind: "{{ item.kind }}"
        name: "{{ item.name }}"
        namespace: "{{ item.namespace | default(omit) }}"
        wait: true
        wait_timeout: 180
      loop: "{{ _objects }}"
      loop_control:
        label: "{{ item.kind }}/{{ item.name }}"
      when: gateway_platform.controller_managed | bool and gateway_platform.gateway_api_owned | default(true) | bool

    - name: "envoy_gateway | Uninstall Helm release"
      kubernetes.core.helm:
        name: "{{ envoy_gateway_release_name }}"
        release_namespace: "{{ envoy_gateway_namespace }}"
        state: absent
        wait: "{{ helm_wait }}"
        timeout: "{{ helm_timeout }}"
      failed_when: false
      when: gateway_platform.controller_managed | bool

    - name: "envoy_gateway | Find Gateway API CRDs"
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
      register: _gw_crds
      when: gateway_platform.controller_managed | bool

    - name: "envoy_gateway | Delete Gateway API CRDs"
      kubernetes.core.k8s:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: "{{ item.metadata.name }}"
        state: absent
      loop: "{{ _gw_crds.resources | default([]) | selectattr('metadata.name', 'match', '^[a-z0-9-]+\\.gateway\\.networking\\.(k8s|x-k8s)\\.io$') | list }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      failed_when: false
      when: gateway_platform.controller_managed | bool and gateway_platform.gateway_api_owned | default(true) | bool

    # A reinstall right after would race CRDs still being deleted.
    - name: "envoy_gateway | Wait for the Gateway API CRDs to go"
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
      register: _gw_crds_left
      until: >-
        _gw_crds_left.resources | default([])
        | selectattr('metadata.name', 'match', '^[a-z0-9-]+\\.gateway\\.networking\\.(k8s|x-k8s)\\.io$') | list | length == 0
      retries: 24
      delay: 5
      when: gateway_platform.controller_managed | bool and gateway_platform.gateway_api_owned | default(true) | bool

    # Exactly this API group: aigateway.envoyproxy.io belongs to Envoy AI Gateway.
    - name: "envoy_gateway | Find Envoy Gateway CRDs"
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
      register: _eg_crds
      when: gateway_platform.controller_managed | bool

    - name: "envoy_gateway | Delete Envoy Gateway CRDs"
      kubernetes.core.k8s:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: "{{ item.metadata.name }}"
        state: absent
      loop: "{{ _eg_crds.resources | default([]) | selectattr('metadata.name', 'match', '^[a-z0-9-]+\\.gateway\\.envoyproxy\\.io$') | list }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      failed_when: false
      when: gateway_platform.controller_managed | bool

    - name: "envoy_gateway | Delete certgen ClusterRole"
      kubernetes.core.k8s:
        api_version: rbac.authorization.k8s.io/v1
        kind: "{{ item }}"
        name: "envoy-gateway-gateway-helm-certgen:{{ envoy_gateway_namespace }}"
        state: absent
      loop:
        - ClusterRoleBinding
        - ClusterRole
      failed_when: false
      when: gateway_platform.controller_managed | bool

    - name: "envoy_gateway | Delete namespace"
      kubernetes.core.k8s:
        kind: Namespace
        name: "{{ envoy_gateway_namespace }}"
        state: absent
        wait: true
        wait_timeout: 300
      when: gateway_platform.controller_managed | bool

    - name: "envoy_gateway | Delete gateway namespace (if different)"
      kubernetes.core.k8s:
        kind: Namespace
        name: "{{ gateway_namespace }}"
        state: absent
        wait: true
        wait_timeout: 300
      when: gateway_namespace != envoy_gateway_namespace
