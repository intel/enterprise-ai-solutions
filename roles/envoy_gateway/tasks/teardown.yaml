---
# =============================================================================
# Envoy Gateway — Teardown
# =============================================================================

- name: "envoy_gateway | Check if Helm release exists"
  kubernetes.core.helm_info:
    name: envoy-gateway
    release_namespace: "{{ envoy_gateway_namespace }}"
  register: _eg_release
  failed_when: false

- name: "envoy_gateway | Not installed — skipping teardown"
  ansible.builtin.debug:
    msg: "Envoy Gateway Helm release not found in {{ envoy_gateway_namespace }}. Nothing to tear down."
  when: _eg_release.status is not defined

- name: "envoy_gateway | Teardown"
  when: _eg_release.status is defined
  block:
    - name: "envoy_gateway | Delete SecurityPolicy"
      kubernetes.core.k8s:
        api_version: gateway.envoyproxy.io/v1alpha1
        kind: SecurityPolicy
        name: gateway-auth
        namespace: "{{ gateway_namespace }}"
        state: absent
      failed_when: false

    - name: "envoy_gateway | Delete LiteLLM extAuth shim"
      kubernetes.core.k8s:
        api_version: "{{ item.api }}"
        kind: "{{ item.kind }}"
        name: litellm-authz
        namespace: "{{ gateway_namespace }}"
        state: absent
      loop:
        - { api: apps/v1, kind: Deployment }
        - { api: v1, kind: Service }
        - { api: v1, kind: ConfigMap }
      failed_when: false

    - name: "envoy_gateway | Delete S3 listener ClientTrafficPolicy"
      kubernetes.core.k8s:
        api_version: gateway.envoyproxy.io/v1alpha1
        kind: ClientTrafficPolicy
        name: "{{ gateway_name }}-s3-path"
        namespace: "{{ gateway_namespace }}"
        state: absent
      failed_when: false

    - name: "envoy_gateway | Delete Gateway resource"
      kubernetes.core.k8s:
        api_version: gateway.networking.k8s.io/v1
        kind: Gateway
        name: "{{ gateway_name }}"
        namespace: "{{ gateway_namespace }}"
        state: absent
      failed_when: false
      when: gateway_create

    - name: "envoy_gateway | Delete CA ClusterIssuers"
      kubernetes.core.k8s:
        api_version: cert-manager.io/v1
        kind: ClusterIssuer
        name: "{{ item }}"
        state: absent
      loop:
        - gateway-issuer
        - "{{ gateway_ca_bootstrap_issuer_name }}"
      failed_when: false
      when: gateway_tls_mode == 'selfsigned'

    # The CA lives in certmanager_namespace, which this role never deletes —
    # so the Certificate must go explicitly or it lingers with a dead issuer.
    - name: "envoy_gateway | Delete root CA Certificate"
      kubernetes.core.k8s:
        api_version: cert-manager.io/v1
        kind: Certificate
        name: "{{ gateway_ca_cert_name }}"
        namespace: "{{ certmanager_namespace }}"
        state: absent
      failed_when: false
      when: gateway_tls_mode == 'selfsigned'

    - name: "envoy_gateway | Delete root CA secret"
      kubernetes.core.k8s:
        api_version: v1
        kind: Secret
        name: "{{ gateway_ca_secret_name }}"
        namespace: "{{ certmanager_namespace }}"
        state: absent
      failed_when: false
      when: gateway_tls_mode == 'selfsigned'

    - name: "envoy_gateway | Remove exported root CA certificate"
      ansible.builtin.file:
        path: "{{ gateway_ca_export_path }}"
        state: absent
      when: gateway_tls_mode == 'selfsigned'

    - name: "envoy_gateway | Delete gateway TLS Certificate"
      kubernetes.core.k8s:
        api_version: cert-manager.io/v1
        kind: Certificate
        name: gateway-tls-cert
        namespace: "{{ gateway_namespace }}"
        state: absent
      failed_when: false
      when: gateway_tls_mode == 'selfsigned'

    - name: "envoy_gateway | Delete TLS secret"
      kubernetes.core.k8s:
        api_version: v1
        kind: Secret
        name: "{{ gateway_tls_secret_name }}"
        namespace: "{{ gateway_namespace }}"
        state: absent
      failed_when: false

    - name: "envoy_gateway | Uninstall Helm release"
      kubernetes.core.helm:
        name: envoy-gateway
        release_namespace: "{{ envoy_gateway_namespace }}"
        state: absent
        wait: "{{ helm_wait }}"
        timeout: "{{ helm_timeout }}"
      failed_when: false

    - name: "envoy_gateway | Find Gateway API CRDs"
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
      register: _gw_crds

    - name: "envoy_gateway | Delete Gateway API CRDs"
      kubernetes.core.k8s:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: "{{ item.metadata.name }}"
        state: absent
      loop: "{{ _gw_crds.resources | default([]) | selectattr('metadata.name', 'match', '.*gateway\\.networking\\.(k8s|x-k8s)\\.io') | list }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      failed_when: false

    - name: "envoy_gateway | Find Envoy Gateway CRDs"
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
      register: _eg_crds

    - name: "envoy_gateway | Delete Envoy Gateway CRDs"
      kubernetes.core.k8s:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: "{{ item.metadata.name }}"
        state: absent
      loop: "{{ _eg_crds.resources | default([]) | selectattr('metadata.name', 'match', '.*gateway\\.envoyproxy\\.io') | list }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      failed_when: false

    - name: "envoy_gateway | Delete certgen ClusterRole"
      kubernetes.core.k8s:
        api_version: rbac.authorization.k8s.io/v1
        kind: "{{ item }}"
        name: "envoy-gateway-gateway-helm-certgen:{{ envoy_gateway_namespace }}"
        state: absent
      loop:
        - ClusterRoleBinding
        - ClusterRole
      failed_when: false

    - name: "envoy_gateway | Delete namespace"
      kubernetes.core.k8s:
        kind: Namespace
        name: "{{ envoy_gateway_namespace }}"
        state: absent
      failed_when: false

    - name: "envoy_gateway | Delete gateway namespace (if different)"
      kubernetes.core.k8s:
        kind: Namespace
        name: "{{ gateway_namespace }}"
        state: absent
      failed_when: false
      when: gateway_namespace != envoy_gateway_namespace
