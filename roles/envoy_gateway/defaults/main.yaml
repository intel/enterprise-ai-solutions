---
envoy_gateway_version: "1.7.1"
envoy_gateway_namespace: "envoy-gateway-system"
envoy_gateway_helm_repo: "oci://docker.io/envoyproxy/gateway-helm"
envoy_gateway_wait_timeout: "300s"

# Gateway resource
gateway_create: true
gateway_name: "eg-gateway"
gateway_namespace: "envoy-gateway-system"

# Default request timeout for routes attached to the gateway.
# Envoy's built-in default is 15s which is too aggressive for LLM responses
# (a Llama-3-8B completion with 512 output tokens on CPU easily takes 30-60s).
# Applied as a Gateway-scoped BackendTrafficPolicy; individual HTTPRoutes
# can override via their own timeouts.request / timeouts.backendRequest.
gateway_request_timeout: "600s"

# Authentication
auth_provider: "none"                    # none | keycloak (JWT) | litellm (virtual key)

# ── ONTAP S3 API listener (optional) ─────────────────────────────────────────
# S3 SigV4 signs the request path verbatim. The shared HTTPS listeners run with
# Envoy's default path normalization (merge_slashes and
# path_with_escaped_slashes_action: UNESCAPE_AND_REDIRECT), so a key containing
# '//' or '%2F' reaches the object store with a different canonical URI than the
# client signed and the store answers SignatureDoesNotMatch - which reads as a
# credentials problem. A ClientTrafficPolicy can relax those two rules, but only
# per listener, so the S3 API gets a listener of its own rather than weakening
# normalization for the UI, API and keycloak listeners.
#
# Dot-segment resolution (Envoy's normalize_path) has no Gateway API knob at all
# and is NOT addressed here; keys containing '..' are rejected by the data-prep
# service before signing.
gateway_s3_listener_name: "https-s3"
# Subdomain the S3 API is published under. Owned here, in the platform layer,
# because the listener is part of the gateway. A solution layer that publishes an
# S3 API reads this value rather than the platform reading a solution variable.
gateway_s3_subdomain: "s3"
gateway_s3_hostname: "{{ gateway_s3_subdomain ~ '.' ~ base_domain_name }}"
# ontap_s3_data_lif has to come from env/<env>/global_config.yaml: role defaults
# are role-scoped, so netapp_trident_csi's copy is not in scope here and the
# default below is what an unset value resolves to.
# In routing_mode: path the S3 API shares the apex hostname with the UI, so a
# dedicated listener is impossible - see the warning printed at install.
gateway_s3_listener_enabled: >-
  {{ (ontap_s3_data_lif | default('', true) | string | trim | length > 0)
     and ((routing_mode | default('subdomain')) != 'path') }}

# Routes that must bypass auth even when auth_provider != none.
# Each entry: {name: <policy-name>, namespace: <route-ns>, route: <HTTPRoute-name>}
# The role creates a SecurityPolicy per entry that overrides the gateway-level policy
# for that specific HTTPRoute (e.g. a UI route that must be publicly reachable).
gateway_no_auth_routes: []

# ── Served hostnames: the registry is the allowlist ──────────────────────────
# No wildcard listener, certificate or DNS: the gateway serves the apex plus one
# exact-host HTTPS listener per registry service on its own subdomain, and each
# listener admits routes only from that service's namespace. Any other host has
# no listener. A new hostname means a registry entry (or service_route_overrides).
gateway_service_listeners: >-
  {{ service_routes | default({}) | gateway_listeners(routing_mode | default('subdomain'),
                                                     base_domain_name | default('inference-example.com'),
                                                     service_route_overrides | default({})) }}
# Names the TLS certificate must cover and DNS must resolve to the gateway.
gateway_tls_dns_names: >-
  {{ [base_domain_name] + (gateway_service_listeners | map(attribute='hostname') | list)
     + ([gateway_s3_hostname] if gateway_s3_listener_enabled | bool else []) }}

# ── Protected hostname ownership ─────────────────────────────────────────────
# Defence in depth for listeners that admit any namespace (plaintext :80, S3):
# Gateway API resolves routes on the SAME hostname by match specificity, not
# namespace, so a foreign route pinning an exact path could out-rank a platform
# route. A ValidatingAdmissionPolicy rejects an HTTPRoute that claims a platform
# hostname from any namespace but its owner.
gateway_route_admission_enabled: true
gateway_protected_hostnames: >-
  {{ service_routes | default({}) | protected_hostnames(routing_mode | default('subdomain'),
                                                       base_domain_name | default('inference-example.com'),
                                                       service_route_overrides | default({})) }}

# ── Apex listener admission ──────────────────────────────────────────────────
# The apex listener (https-apex) carries the bare base_domain_name. In
# routing_mode: path every platform service shares this one host, told apart
# only by path — so an open `from: All` here would let any tenant namespace
# publish a more-specific apex path (e.g. /keycloak/...) that out-ranks the
# platform's own route and hijacks its traffic and bearer tokens. That is the
# path analogue of the subdomain takeover gateway_protected_hostnames prevents,
# but the hostname-based admission policy above cannot see paths, so it cannot
# guard a host every service shares. Instead the apex admits routes only from
# namespaces carrying this label; a platform role that mounts an apex route
# stamps it on its own namespace.
gateway_apex_route_label_key: "gateway-apex-routes"
gateway_apex_route_label_value: "allowed"

# Path mode: the bare base domain redirects here ('' = no landing page, 404).
gateway_landing_service: "{{ 'headlamp' if headlamp_enabled | default(false) | bool else '' }}"
# Rendered apex objects, and every object the template can emit (for pruning).
_eg_apex_objects: "{{ lookup('ansible.builtin.template', 'apex.yaml.j2') | from_yaml_all | select | list }}"
_eg_apex_all:
  - { api_version: gateway.networking.k8s.io/v1, kind: HTTPRoute, name: apex-landing }
  - { api_version: gateway.envoyproxy.io/v1alpha1, kind: SecurityPolicy, name: apex-landing-no-auth }
  - { api_version: gateway.envoyproxy.io/v1alpha1, kind: EnvoyExtensionPolicy, name: apex-cookie-confinement }

# Keycloak routing for the SecurityPolicy JWT provider. Resolved from the shared
# service_routes registry (same filter the keycloak role uses) so the external
# issuer and the in-cluster JWKS URL always match where Keycloak actually serves
# under the current routing_mode — in path mode both must carry /keycloak.
keycloak_route: >-
  {{ 'keycloak' | service_route(routing_mode | default('subdomain'),
                                base_domain_name | default('inference-example.com'),
                                service_routes | default({}),
                                service_route_overrides | default({})) }}
keycloak_hostname: "{{ keycloak_route.host }}"   # host only (messages / back-compat)
keycloak_realm: "inference"

# TLS / Domain — HTTPS is mandatory, there is no plaintext mode
gateway_tls_mode: "selfsigned"        # selfsigned | custom
base_domain_name: "inference-example.com"
gateway_tls_cert_file: ""
gateway_tls_key_file: ""
gateway_tls_secret_name: "gateway-tls"

# Internal root CA (selfsigned mode). The serving leaf chains to this
# root, so operators import ONE cert (exported to gateway_ca_export_path) to
# trust every hostname across leaf rotations.
gateway_ca_bootstrap_issuer_name: "gateway-ca-bootstrap"
gateway_ca_cert_name: "ai-solutions-ca"
gateway_ca_secret_name: "ai-solutions-ca"
gateway_ca_common_name: "AI Solutions Root CA"
gateway_ca_duration: "87600h"         # 10y root
gateway_ca_renew_before: "720h"       # 30d
gateway_ca_export_path: "{{ log_dir }}/{{ gateway_ca_cert_name }}.crt"

# Foreign var (canonical owner: cert_manager) — namespace holding the root CA
# secret, which is cert-manager's cluster-resource-namespace.
certmanager_namespace: "cert-manager"
