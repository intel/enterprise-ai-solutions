---

- name: "nri_device_injector | Render NRI device-injector manifests"
  ansible.builtin.include_tasks: render_manifest.yaml

- name: "nri_device_injector | Delete NRI device-injector resource"
  kubernetes.core.k8s:
    state: absent
    definition: "{{ nri_device_injector_manifest.stdout }}"
  register: helm_nri_device_injector_uninstall_result
  until: helm_nri_device_injector_uninstall_result is succeeded
  retries: 5
  delay: 15
