---
# =============================================================================
# PostgreSQL — Install on OpenShift (marketplace CloudNativePG operator)
# =============================================================================

# On OpenShift the operator comes from the marketplace (OLM) and owns the CRDs;
# a Helm install next to it would fight over them.
- name: "postgresql | OpenShift: check for marketplace CNPG operator"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: clusters.postgresql.cnpg.io
  register: _cnpg_crd

- name: "postgresql | OpenShift: require marketplace CNPG operator"
  ansible.builtin.assert:
    that:
      - _cnpg_crd.resources | default([]) | length > 0
    fail_msg: >-
      CloudNativePG is not installed. On OpenShift install it from OperatorHub
      (package cloudnative-pg, certified-operators) before running the installer;
      see docs/deploy/openshift.md.
    success_msg: "CNPG operator provided by the cluster (OLM) — skipping Helm install."
    quiet: true

- name: "postgresql | Database cluster"
  ansible.builtin.include_tasks: cluster.yaml
