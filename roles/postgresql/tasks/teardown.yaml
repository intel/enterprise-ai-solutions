---
# =============================================================================
# PostgreSQL — Teardown (CloudNativePG)
# =============================================================================

- name: "postgresql | Remove the database cluster"
  ansible.builtin.include_tasks: cluster_remove.yaml

- name: "postgresql | Uninstall CNPG operator Helm release"
  kubernetes.core.helm:
    name: cnpg
    release_namespace: "{{ cnpg_namespace }}"
    state: absent
    wait: "{{ helm_wait }}"
    timeout: "{{ helm_timeout }}"
  failed_when: false
  # The marketplace operator belongs to the admin's Subscription and stays.
  when: not _postgresql_from_olm | bool

# The CNPG install creates cnpg_namespace (create_namespace). Deleted by name until
# namespaces and CRDs carry ownership labels; CRDs stay until then (label_crds.yaml).
# With the marketplace operator the installer never creates it: a namespace of that
# name is the admin's, possibly the operator's own.
- name: "postgresql | Delete CNPG operator namespace"
  kubernetes.core.k8s:
    kind: Namespace
    name: "{{ cnpg_namespace }}"
    state: absent
    wait: true
  when: not _postgresql_from_olm | bool

- name: "postgresql | Teardown complete"
  ansible.builtin.debug:
    msg: "PostgreSQL (CNPG) resources removed{{ '; the marketplace CNPG operator stays' if _postgresql_from_olm | bool else '' }}."
