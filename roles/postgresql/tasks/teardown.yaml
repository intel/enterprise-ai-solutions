---
# =============================================================================
# PostgreSQL — Teardown (CloudNativePG)
# =============================================================================

- name: "postgresql | Remove the database cluster"
  ansible.builtin.include_tasks: cluster_remove.yaml

# The marketplace operator belongs to the admin's Subscription: its release, its
# CRDs and a namespace of that name are all theirs, so none of this runs.
- name: "postgresql | Remove the installer's CNPG operator"
  when: not _postgresql_from_olm | bool
  block:
    - name: "postgresql | Uninstall CNPG operator Helm release"
      kubernetes.core.helm:
        name: cnpg
        release_namespace: "{{ cnpg_namespace }}"
        state: absent
        wait: "{{ helm_wait }}"
        timeout: "{{ helm_timeout }}"
      failed_when: false

    # helm does not delete CRDs on uninstall, and deleting them takes every
    # Cluster in the group with them. CNPG owns its PVCs, so a database someone
    # else created against this operator would lose its data.
    - name: "postgresql | List CNPG Clusters in every namespace"
      kubernetes.core.k8s_info:
        api_version: postgresql.cnpg.io/v1
        kind: Cluster
      register: _cnpg_clusters
      failed_when: false

    - name: "postgresql | Note the CNPG Clusters that are not ours"
      ansible.builtin.set_fact:
        _cnpg_foreign: >-
          {{ ((_cnpg_clusters.resources | default([])) | map(attribute='metadata.namespace') | list)
             | zip((_cnpg_clusters.resources | default([])) | map(attribute='metadata.name') | list)
             | map('join', '/')
             | reject('equalto', postgresql_namespace ~ '/' ~ postgresql_cluster_name) | list }}

    # failed_when above sets failed=False on the result too, so a failed lookup
    # shows only as a missing resources key. Then there is no way to tell whose
    # databases are out there, and the CRDs stay.
    - name: "postgresql | Keep the CNPG CRDs"
      ansible.builtin.debug:
        msg: >-
          Keeping the postgresql.cnpg.io CRDs:
          {{ 'the Cluster lookup failed' if _cnpg_clusters.resources is not defined
             else _cnpg_foreign | join(', ') ~ ' still registered' }}.
      when: _cnpg_clusters.resources is not defined or _cnpg_foreign | length > 0

    - name: "postgresql | Remove the CNPG CRDs"
      when:
        - _cnpg_clusters.resources is defined
        - _cnpg_foreign | length == 0
      block:
        - name: "postgresql | List the CNPG CRDs"
          kubernetes.core.k8s_info:
            api_version: apiextensions.k8s.io/v1
            kind: CustomResourceDefinition
          register: _cnpg_crds
          failed_when: false

        - name: "postgresql | Delete the CNPG CRDs"
          kubernetes.core.k8s:
            api_version: apiextensions.k8s.io/v1
            kind: CustomResourceDefinition
            name: "{{ item.metadata.name }}"
            state: absent
          loop: >-
            {{ (_cnpg_crds.resources | default([]))
               | selectattr('spec.group', 'equalto', 'postgresql.cnpg.io') | list }}
          loop_control:
            label: "{{ item.metadata.name }}"
          failed_when: false

    - name: "postgresql | Delete CNPG operator namespace"
      kubernetes.core.k8s:
        kind: Namespace
        name: "{{ cnpg_namespace }}"
        state: absent
        wait: true

- name: "postgresql | Teardown complete"
  ansible.builtin.debug:
    msg: "PostgreSQL (CNPG) resources removed{{ '; the marketplace CNPG operator stays' if _postgresql_from_olm | bool else '' }}."
