---
# =============================================================================
# PostgreSQL — Teardown (CloudNativePG)
# =============================================================================

- name: "postgresql | Delete CNPG Cluster"
  kubernetes.core.k8s:
    api_version: postgresql.cnpg.io/v1
    kind: Cluster
    name: "{{ postgresql_cluster_name }}"
    namespace: "{{ postgresql_namespace }}"
    state: absent
  failed_when: false

- name: "postgresql | Delete per-database secrets"
  kubernetes.core.k8s:
    api_version: v1
    kind: Secret
    name: "postgresql-{{ item.name }}-secret"
    namespace: "{{ postgresql_namespace }}"
    state: absent
  loop: "{{ postgresql_databases }}"
  loop_control:
    label: "{{ item.name }}"
  failed_when: false

- name: "postgresql | Delete consumer namespace secrets"
  kubernetes.core.k8s:
    api_version: v1
    kind: Secret
    name: "{{ item.name }}-db-secret"
    namespace: "{{ item.target_namespace | default(item.name) }}"
    state: absent
  loop: "{{ postgresql_databases }}"
  loop_control:
    label: "{{ item.name }}"
  failed_when: false

- name: "postgresql | Delete namespace"
  kubernetes.core.k8s:
    kind: Namespace
    name: "{{ postgresql_namespace }}"
    state: absent
  failed_when: false

- name: "postgresql | Uninstall CNPG operator Helm release"
  kubernetes.core.helm:
    name: cnpg
    release_namespace: "{{ cnpg_namespace }}"
    state: absent
    wait: "{{ helm_wait }}"
    timeout: "{{ helm_timeout }}"
  failed_when: false

# The CNPG install creates cnpg_namespace (create_namespace). Deleted by name until
# namespaces and CRDs carry ownership labels; CRDs stay until then (label_crds.yaml).
- name: "postgresql | Delete CNPG operator namespace"
  kubernetes.core.k8s:
    kind: Namespace
    name: "{{ cnpg_namespace }}"
    state: absent
    wait: true

- name: "postgresql | Teardown complete"
  ansible.builtin.debug:
    msg: "PostgreSQL (CNPG) resources removed."
