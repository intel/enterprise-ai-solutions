---
# =============================================================================
# PostgreSQL — Teardown (CloudNativePG)
# =============================================================================

- name: "postgresql | Remove the database cluster"
  ansible.builtin.include_tasks: cluster_remove.yaml

- name: "postgresql | Uninstall CNPG operator Helm release"
  kubernetes.core.helm:
    name: cnpg
    release_namespace: "{{ cnpg_namespace }}"
    state: absent
    wait: "{{ helm_wait }}"
    timeout: "{{ helm_timeout }}"
  failed_when: false
  # The marketplace operator belongs to the admin's Subscription and stays.
  when: not _postgresql_from_olm | bool

# Helm leaves CRDs behind on uninstall, so the postgresql.cnpg.io group has to go
# explicitly — same as cert-manager, MetalLB and Istio do. Skipped for the
# marketplace operator, whose CRDs belong to the admin's Subscription.
- name: "postgresql | Find CNPG CRDs"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
  register: _cnpg_crds
  when: not _postgresql_from_olm | bool

- name: "postgresql | Delete CNPG CRDs"
  kubernetes.core.k8s:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: "{{ item.metadata.name }}"
    state: absent
  loop: "{{ _cnpg_crds.resources | default([]) | selectattr('metadata.name', 'match', '.*postgresql\\.cnpg\\.io') | list }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  failed_when: false
  when: not _postgresql_from_olm | bool

# The CNPG install creates cnpg_namespace (create_namespace), deleted here by name.
# With the marketplace operator the installer never creates it: a namespace of that
# name is the admin's, possibly the operator's own.
- name: "postgresql | Delete CNPG operator namespace"
  kubernetes.core.k8s:
    kind: Namespace
    name: "{{ cnpg_namespace }}"
    state: absent
    wait: true
  when: not _postgresql_from_olm | bool

- name: "postgresql | Teardown complete"
  ansible.builtin.debug:
    msg: "PostgreSQL (CNPG) resources removed{{ '; the marketplace CNPG operator stays' if _postgresql_from_olm | bool else '' }}."
