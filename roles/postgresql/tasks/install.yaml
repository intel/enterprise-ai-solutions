---
# =============================================================================
# PostgreSQL — Install (CloudNativePG Operator)
# =============================================================================
# Design:
#   1. Install CNPG operator via Helm (idempotent)
#   2. Create credential Secrets ONCE (check-then-create, never overwrite)
#   3. Create SQL init Secrets with CREATE USER statements (referenced by cluster)
#   4. Deploy CNPG Cluster — postInitSQLRefs runs CREATE USER from Secret
#   5. Use CNPG Database CRD to create additional databases (no exec needed)
#   6. Reconcile: copy secrets to consumer namespaces
# =============================================================================

# ── CNPG Operator ─────────────────────────────────────────────────────────────

- name: "postgresql | Check for existing CNPG Helm release"
  kubernetes.core.helm_info:
    name: cnpg
    release_namespace: "{{ cnpg_namespace }}"
  register: _cnpg_release
  failed_when: false

- name: "postgresql | Install CNPG operator via Helm"
  when: _cnpg_release.status is not defined or _cnpg_release.status is none
  block:
    - name: "postgresql | Add CNPG Helm repo"
      kubernetes.core.helm_repository:
        name: cnpg
        repo_url: "{{ cnpg_helm_repo }}"
      register: helm_repo_add_result
      until: helm_repo_add_result is succeeded
      retries: "{{ helm_retries }}"
      delay: 15

    - name: "postgresql | Label cnpg-system namespace — Istio"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ cnpg_namespace }}"
            labels:
              istio.io/dataplane-mode: "ambient"
      when: istio_enabled | default(false) | bool

    - name: "postgresql | Label cnpg-system namespace — PSS"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ cnpg_namespace }}"
            labels:
              pod-security.kubernetes.io/enforce: "restricted"
              pod-security.kubernetes.io/audit: "restricted"
              pod-security.kubernetes.io/warn: "restricted"
      when: enforce_pss | default(false) | bool

    - name: "postgresql | Install CNPG operator"
      kubernetes.core.helm:
        name: cnpg
        chart_ref: cnpg/cloudnative-pg
        release_namespace: "{{ cnpg_namespace }}"
        create_namespace: true
        chart_version: "{{ cnpg_version }}"
        wait: "{{ helm_wait }}"
        timeout: "{{ helm_timeout }}"
      register: helm_install_result
      until: helm_install_result is succeeded
      retries: "{{ helm_retries }}"
      delay: 15

    - name: "postgresql | Wait for CNPG operator readiness"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ cnpg_namespace }}"
        label_selectors:
          - app.kubernetes.io/name=cloudnative-pg
      register: _cnpg_deploy
      until:
        - _cnpg_deploy.resources | length > 0
        - _cnpg_deploy.resources[0].status.conditions | default([]) | selectattr('type','eq','Available') | selectattr('status','eq','True') | list | length > 0
      retries: 30
      delay: 5

- name: "postgresql | CNPG operator already installed"
  ansible.builtin.debug:
    msg: "CNPG operator already deployed in {{ cnpg_namespace }} — skipping."
  when: _cnpg_release.status is defined and _cnpg_release.status is not none

# ── Namespace ─────────────────────────────────────────────────────────────────

- name: "postgresql | Create namespace"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ postgresql_namespace }}"

- name: "postgresql | Label namespace — Istio"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ postgresql_namespace }}"
        labels:
          istio.io/dataplane-mode: "ambient"
  when: istio_enabled | default(false) | bool

# Under mesh-wide STRICT the host-network apiserver (no mesh identity) can't reach the
# CNPG admission webhook; open only its port, keep the rest of the pod STRICT.
- name: "postgresql | Allow apiserver to reach CNPG webhook (port-level mTLS)"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: security.istio.io/v1
      kind: PeerAuthentication
      metadata:
        name: allow-webhook
        namespace: "{{ cnpg_namespace }}"
      spec:
        selector:
          matchLabels:
            app.kubernetes.io/name: cloudnative-pg
        mtls:
          mode: STRICT
        portLevelMtls: "{{ {'9443': {'mode': 'PERMISSIVE'}} }}"
  when: istio_enabled | default(false) | bool

- name: "postgresql | Label namespace — PSS"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ postgresql_namespace }}"
        labels:
          pod-security.kubernetes.io/enforce: "restricted"
          pod-security.kubernetes.io/audit: "restricted"
          pod-security.kubernetes.io/warn: "restricted"
  when: enforce_pss | default(false) | bool

# ── Credential Secrets — created ONCE, never overwritten ─────────────────────

- name: "postgresql | Check existing per-database secrets"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "postgresql-{{ item.name }}-secret"
    namespace: "{{ postgresql_namespace }}"
  loop: "{{ postgresql_databases | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: _pg_db_secrets_existing
  failed_when: false
  no_log: "{{ secure_logs }}"

- name: "postgresql | Create per-database credential secrets (only if missing)"
  when: (_pg_db_secrets_existing.results[_idx].resources | default([])) | length == 0
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "postgresql-{{ item.name }}-secret"
        namespace: "{{ postgresql_namespace }}"
      type: kubernetes.io/basic-auth
      stringData:
        username: "{{ item.user }}"
        password: "{{ item.password | default(lookup('password', '/dev/null length=24 chars=ascii_letters,digits')) }}"
  loop: "{{ postgresql_databases | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
    index_var: _idx
  no_log: "{{ secure_logs }}"

# ── SQL init Secrets — CREATE USER statements run by CNPG on bootstrap ────────

- name: "postgresql | Read credential secrets for SQL generation"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "postgresql-{{ item.name }}-secret"
    namespace: "{{ postgresql_namespace }}"
  loop: "{{ (postgresql_databases | default([]))[1:] }}"
  loop_control:
    label: "{{ item.name }}"
  register: _pg_cred_secrets
  no_log: "{{ secure_logs }}"

- name: "postgresql | Create SQL init Secrets for additional users"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "postgresql-init-{{ item.item.name }}"
        namespace: "{{ postgresql_namespace }}"
      stringData:
        init.sql: |
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ item.item.user }}') THEN
              EXECUTE format('CREATE USER %I WITH PASSWORD %L',
                '{{ item.item.user }}',
                '{{ item.resources[0].data.password | b64decode }}');
            ELSE
              EXECUTE format('ALTER USER %I WITH PASSWORD %L',
                '{{ item.item.user }}',
                '{{ item.resources[0].data.password | b64decode }}');
            END IF;
          END $$;
  loop: "{{ _pg_cred_secrets.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  no_log: "{{ secure_logs }}"
  when: _pg_cred_secrets.results | default([]) | length > 0

# ── PostgreSQL Cluster ────────────────────────────────────────────────────────

- name: "postgresql | Check for existing CNPG Cluster"
  kubernetes.core.k8s_info:
    api_version: postgresql.cnpg.io/v1
    kind: Cluster
    name: "{{ postgresql_cluster_name }}"
    namespace: "{{ postgresql_namespace }}"
  register: _pg_cluster_existing
  failed_when: false

- name: "postgresql | Already running — skipping cluster deploy"
  ansible.builtin.debug:
    msg: "PostgreSQL cluster '{{ postgresql_cluster_name }}' already exists — skipping."
  when: (_pg_cluster_existing.resources | default([]) | length) > 0

- name: "postgresql | Deploy Cluster"
  when: (_pg_cluster_existing.resources | default([]) | length) == 0
  block:
    - name: "postgresql | Apply CNPG Cluster CR"
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'cnpg-cluster.yaml.j2') | from_yaml }}"

    - name: "postgresql | Wait for CNPG Cluster readiness"
      kubernetes.core.k8s_info:
        api_version: postgresql.cnpg.io/v1
        kind: Cluster
        name: "{{ postgresql_cluster_name }}"
        namespace: "{{ postgresql_namespace }}"
      register: _pg_cluster
      until:
        - _pg_cluster.resources | length > 0
        - _pg_cluster.resources[0].status is defined
        - _pg_cluster.resources[0].status.conditions is defined
        - >-
          _pg_cluster.resources[0].status.conditions
            | selectattr('type', 'eq', 'Ready')
            | selectattr('status', 'eq', 'True')
            | list | length > 0
      retries: 60
      delay: 10

# ── Ensure users on existing clusters (re-runs) ─────────────────────────────
# postInitSQLRefs only runs on fresh bootstrap. For re-runs, use exec fallback.

- name: "postgresql | Ensure users exist (existing clusters)"
  when:
    - postgresql_databases | default([]) | length > 1
    - (_pg_cluster_existing.resources | default([]) | length) > 0
  block:
    - name: "postgresql | Copy provisioning script to pod"
      ansible.builtin.command:
        cmd: >-
          kubectl cp {{ role_path }}/files/provision_db.py
          {{ postgresql_namespace }}/{{ postgresql_cluster_name }}-1:/run/provision_db.py
          -c postgres
      changed_when: true

    - name: "postgresql | Provision users/databases on existing cluster"
      ansible.builtin.command:
        cmd: >-
          kubectl exec -n {{ postgresql_namespace }}
          {{ postgresql_cluster_name }}-1 -c postgres --
          python3 /run/provision_db.py
          {{ item.item.name }}
          {{ item.item.user }}
          {{ postgresql_admin_user }}
          {{ item.resources[0].data.password }}
      loop: "{{ _pg_cred_secrets.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      changed_when: false
      no_log: "{{ secure_logs }}"

# ── Additional Databases via CNPG Database CRD ───────────────────────────────

- name: "postgresql | Create additional databases via CNPG Database CRD"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: postgresql.cnpg.io/v1
      kind: Database
      metadata:
        name: "{{ item.name }}"
        namespace: "{{ postgresql_namespace }}"
      spec:
        name: "{{ item.name }}"
        owner: "{{ item.user }}"
        cluster:
          name: "{{ postgresql_cluster_name }}"
  loop: "{{ (postgresql_databases | default([]))[1:] }}"
  loop_control:
    label: "{{ item.name }}"
  when: postgresql_databases | default([]) | length > 1

- name: "postgresql | Wait for databases to be ready"
  kubernetes.core.k8s_info:
    api_version: postgresql.cnpg.io/v1
    kind: Database
    name: "{{ item.name }}"
    namespace: "{{ postgresql_namespace }}"
  loop: "{{ (postgresql_databases | default([]))[1:] }}"
  loop_control:
    label: "{{ item.name }}"
  register: _pg_db_status
  until: >-
    _pg_db_status.resources | default([]) | length > 0 and
    (_pg_db_status.resources[0].status.applied | default(false) | bool)
  retries: 30
  delay: 5
  when: postgresql_databases | default([]) | length > 1

- name: "postgresql | Install complete"
  ansible.builtin.debug:
    msg: >-
      CloudNativePG {{ cnpg_version }} operator + PostgreSQL {{ postgresql_version }}
      cluster '{{ postgresql_cluster_name }}' deployed in {{ postgresql_namespace }}
      ({{ postgresql_instances }} instance(s)).
      Databases: {{ postgresql_databases | map(attribute='name') | join(', ') | default('none') }}.

# ── Reconcile — copy secrets to consumer namespaces ──────────────────────────
# Runs always so interrupted installs/reruns still propagate secrets.

- name: "postgresql | Ensure consumer namespaces exist"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ item.target_namespace | default(item.name) }}"
  loop: "{{ postgresql_databases | default([]) }}"
  loop_control:
    label: "{{ item.target_namespace | default(item.name) }}"

- name: "postgresql | Label consumer namespaces — Istio"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ item.target_namespace | default(item.name) }}"
        labels:
          istio.io/dataplane-mode: "ambient"
  loop: "{{ postgresql_databases | default([]) }}"
  loop_control:
    label: "{{ item.target_namespace | default(item.name) }}"
  when: istio_enabled | default(false) | bool

- name: "postgresql | Label consumer namespaces — PSS"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ item.target_namespace | default(item.name) }}"
        labels:
          pod-security.kubernetes.io/enforce: "restricted"
          pod-security.kubernetes.io/audit: "restricted"
          pod-security.kubernetes.io/warn: "restricted"
  when: enforce_pss | default(false) | bool
  loop: "{{ postgresql_databases | default([]) }}"
  loop_control:
    label: "{{ item.target_namespace | default(item.name) }}"

- name: "postgresql | Read per-database passwords"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "postgresql-{{ item.name }}-secret"
    namespace: "{{ postgresql_namespace }}"
  loop: "{{ postgresql_databases | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: _pg_db_secrets
  no_log: "{{ secure_logs }}"

- name: "postgresql | Copy DB secrets to consumer namespaces"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ item.item.name }}-db-secret"
        namespace: "{{ item.item.target_namespace | default(item.item.name) }}"
      type: Opaque
      stringData:
        username: "{{ item.item.user }}"
        password: "{{ item.resources[0].data.password | b64decode }}"
        database: "{{ item.item.name }}"
        host: "{{ postgresql_cluster_name }}-rw.{{ postgresql_namespace }}.svc.cluster.local"
        port: "5432"
  loop: "{{ _pg_db_secrets.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.resources | default([]) | length > 0
  no_log: "{{ secure_logs }}"
