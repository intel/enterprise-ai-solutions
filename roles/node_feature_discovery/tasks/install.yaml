# =============================================================================
# Node Feature Discovery — Install
# =============================================================================
# Every rack-scale cluster. A release the inference layer installed before is
# taken over as is: same name, namespace, chart and values.
# =============================================================================

- name: "node_feature_discovery | Install"
  environment:
    KUBECONFIG: "{{ kubernetes_kubeconfig }}"
  block:
    - name: "node_feature_discovery | Check for existing Helm release"
      kubernetes.core.helm_info:
        name: node-feature-discovery
        release_namespace: "{{ node_feature_discovery_namespace }}"
      register: _nfd_release
      failed_when: false

    - name: "node_feature_discovery | Already installed — skipping"
      ansible.builtin.debug:
        msg: "NFD already deployed in {{ node_feature_discovery_namespace }} — skipping install."
      when: _nfd_release.status is defined and _nfd_release.status is not none

    - name: "node_feature_discovery | Deploy"
      when: _nfd_release.status is not defined or _nfd_release.status is none
      block:
        - name: "node_feature_discovery | Add Helm repo"
          kubernetes.core.helm_repository:
            name: "{{ node_feature_discovery_helm_repo_name }}"
            repo_url: "{{ node_feature_discovery_helm_repo }}"
          register: _nfd_repo
          until: _nfd_repo is succeeded
          retries: "{{ helm_retries }}"
          delay: 15

        # The NFD worker mounts hostPath (/sys, /usr/src) and uses hostNetwork,
        # so its namespace needs the privileged Pod Security level. Labelled
        # before the install so the worker pods are admitted.
        - name: "node_feature_discovery | Label namespace — PSS"
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: "{{ node_feature_discovery_namespace }}"
                labels:
                  pod-security.kubernetes.io/enforce: "privileged"
                  pod-security.kubernetes.io/audit: "privileged"
                  pod-security.kubernetes.io/warn: "privileged"
          when: enforce_pss | default(false) | bool

        # Same values as the inference layer's nfd role, so the labels the
        # inference layer relies on (cpu-cpuid.AMXBF16, ...) are unchanged.
        - name: "node_feature_discovery | Install via Helm"
          kubernetes.core.helm:
            name: node-feature-discovery
            chart_ref: "{{ node_feature_discovery_chart }}"
            chart_version: "{{ node_feature_discovery_version }}"
            release_namespace: "{{ node_feature_discovery_namespace }}"
            create_namespace: true
            wait: true
            timeout: "5m0s"
            values:
              master:
                resources:
                  requests:
                    cpu: "100m"
                    memory: "128Mi"
                  limits:
                    cpu: "500m"
                    memory: "256Mi"
              worker:
                resources:
                  requests:
                    cpu: "50m"
                    memory: "64Mi"
                  limits:
                    cpu: "200m"
                    memory: "128Mi"
          register: _nfd_install
          until: _nfd_install is succeeded
          retries: "{{ helm_retries }}"
          delay: 15

    # The GPU operator schedules its operands from the PCI labels the workers
    # publish, so they must be running on every node before it is installed.
    - name: "node_feature_discovery | Wait for worker DaemonSet ready"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: DaemonSet
        name: node-feature-discovery-worker
        namespace: "{{ node_feature_discovery_namespace }}"
      register: _nfd_ds
      until:
        - _nfd_ds.resources | default([]) | length > 0
        - (_nfd_ds.resources[0].status.numberReady | default(0)) == (_nfd_ds.resources[0].status.desiredNumberScheduled | default(0))
      retries: 30
      delay: 10

    # The inference layer's nfd role used to report this; it is left out here.
    - name: "node_feature_discovery | Find AMX nodes"
      kubernetes.core.k8s_info:
        kind: Node
        label_selectors:
          - "feature.node.kubernetes.io/cpu-cpuid.AMXBF16=true"
      register: _nfd_amx_nodes

    - name: "node_feature_discovery | AMX node summary"
      ansible.builtin.debug:
        msg: >-
          NFD detected {{ _nfd_amx_nodes.resources | length }} node(s) with AMX support:
          {{ _nfd_amx_nodes.resources | map(attribute='metadata.name') | join(', ') or 'none' }}

    - name: "node_feature_discovery | ━━━ DONE ━━━"
      ansible.builtin.debug:
        msg: "NFD {{ node_feature_discovery_version }} running in '{{ node_feature_discovery_namespace }}' — the cluster's one NFD."
