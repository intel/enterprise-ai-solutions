# =============================================================================
# Node Feature Discovery — Validate
# =============================================================================

- name: "node_feature_discovery | validate"
  environment:
    KUBECONFIG: "{{ kubernetes_kubeconfig }}"
  block:
    - name: "node_feature_discovery | validate | Check Helm release"
      kubernetes.core.helm_info:
        name: node-feature-discovery
        release_namespace: "{{ node_feature_discovery_namespace }}"
      register: _nfd_val_release
      failed_when: _nfd_val_release.status is not defined or _nfd_val_release.status is none

    - name: "node_feature_discovery | validate | Check worker DaemonSet readiness"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: DaemonSet
        name: node-feature-discovery-worker
        namespace: "{{ node_feature_discovery_namespace }}"
      register: _nfd_val_worker
      failed_when: >-
        _nfd_val_worker.resources | default([]) | length == 0 or
        (_nfd_val_worker.resources[0].status.numberReady | default(0) | int) == 0 or
        (_nfd_val_worker.resources[0].status.numberReady | default(0) | int) !=
        (_nfd_val_worker.resources[0].status.desiredNumberScheduled | default(0) | int)

    - name: "node_feature_discovery | validate | Check master deployment readiness"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: node-feature-discovery-master
        namespace: "{{ node_feature_discovery_namespace }}"
      register: _nfd_val_master
      failed_when: >-
        _nfd_val_master.resources | default([]) | length == 0 or
        (_nfd_val_master.resources[0].status.readyReplicas | default(0) | int) < 1

    - name: "node_feature_discovery | validate | PASS"
      ansible.builtin.debug:
        msg: "NFD release, master and workers are healthy in '{{ node_feature_discovery_namespace }}'."
