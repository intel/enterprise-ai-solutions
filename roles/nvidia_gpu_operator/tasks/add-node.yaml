# =============================================================================
# NVIDIA GPU Operator — add-node (from roles/kubernetes/tasks/add-node.yaml)
# =============================================================================
# Runs after the add-node taint is lifted: the operator's DaemonSets do not
# tolerate it. The operator takes a new GPU node by itself; only the rack's
# first GPU node needs it installed, which install skipped while the rack had
# none. Then waits until the new node(s)' GPUs are allocatable.
# =============================================================================

- name: "nvidia_gpu_operator | add-node | New GPU node(s)"
  ansible.builtin.set_fact:
    _gpu_added: "{{ _added_nodes_list | select('in', groups.get('gpu_nodes', [])) | list }}"

- name: "nvidia_gpu_operator | add-node | GPU node(s) of another vendor"
  ansible.builtin.debug:
    msg: >-
      {{ _gpu_added | join(', ') }} joined without a GPU stack: add-node sets one up for NVIDIA GPUs,
      and this rack's GPU vendor is '{{ rack_scale_gpu_vendor | default('') }}'.
  when:
    - _gpu_added | length > 0
    - (rack_scale_gpu_vendor | default('')) != 'nvidia'

- name: "nvidia_gpu_operator | add-node | GPU stack for new GPU node(s)"
  when:
    - _gpu_added | length > 0
    - (rack_scale_gpu_vendor | default('')) == 'nvidia'
  environment:
    KUBECONFIG: "{{ kubernetes_kubeconfig }}"
  block:
    # The taint is already lifted: a re-run of add-node finds nothing to do.
    - name: "nvidia_gpu_operator | add-node | The rack's GPU stack"
      block:
        - name: "nvidia_gpu_operator | add-node | Find the operator release"
          kubernetes.core.helm_info:
            name: "{{ nvidia_gpu_operator_release_name }}"
            release_namespace: "{{ nvidia_gpu_operator_namespace }}"
          register: _gpu_operator_release

        - name: "nvidia_gpu_operator | add-node | Find the shared NFD release"
          kubernetes.core.helm_info:
            name: node-feature-discovery
            release_namespace: "{{ nfd_namespace | default('node-feature-discovery') }}"
          register: _gpu_nfd_release

        - name: "nvidia_gpu_operator | add-node | Releases found"
          ansible.builtin.set_fact:
            _gpu_operator_found: "{{ _gpu_operator_release.status is defined and _gpu_operator_release.status is not none }}"
            _gpu_nfd_available: >-
              {{ (nvidia_gpu_operator_nfd_enabled | bool)
                 or (_gpu_nfd_release.status is defined and _gpu_nfd_release.status is not none) }}

        - name: "nvidia_gpu_operator | add-node | No platform layer yet"
          ansible.builtin.debug:
            msg: >-
              {{ _gpu_added | join(', ') }} joined without its GPU stack: the platform
              layer is not installed. ./es_auto_installer.sh install --env {{ env_name }} platform
              installs it, the GPU operator included.
          when: not _gpu_operator_found and not _gpu_nfd_available

        - name: "nvidia_gpu_operator | add-node | The rack's first GPU node: install the operator"
          when: not _gpu_operator_found and _gpu_nfd_available
          block:
            - name: "nvidia_gpu_operator | add-node | Install the operator"
              ansible.builtin.include_tasks: install.yaml

            - name: "nvidia_gpu_operator | add-node | Find the ServiceMonitor CRD"
              kubernetes.core.k8s_info:
                api_version: apiextensions.k8s.io/v1
                kind: CustomResourceDefinition
                name: servicemonitors.monitoring.coreos.com
              register: _gpu_monitoring_crd
              when: observability_enabled | default(true) | bool

            - name: "nvidia_gpu_operator | add-node | GPU dashboards and alerts"
              ansible.builtin.include_role:
                name: gpu_observability
                tasks_from: install.yaml
              when: _gpu_monitoring_crd.resources | default([]) | length > 0
      rescue:
        - name: "nvidia_gpu_operator | add-node | GPU stack install failed"
          ansible.builtin.fail:
            msg: >-
              {{ _gpu_added | join(', ') }} joined, but setting up the GPU stack failed:
              {{ ansible_failed_result.msg | default('see the task above') }}.
              A re-run of add-node does not retry it; ./es_auto_installer.sh install --env {{ env_name }} platform does.

    # The driver container builds on the node first: allow 30 minutes.
    - name: "nvidia_gpu_operator | add-node | Wait for the GPUs on new node(s)"
      kubernetes.core.k8s_info:
        kind: Node
        name: "{{ item }}"
      register: _gpu_node
      until: >-
        (_gpu_node.resources | default([]) | length) > 0
        and (_gpu_node.resources[0].status.allocatable['nvidia.com/gpu'] | default(0) | int)
            >= (hostvars[item].node_gpu_count | default(1) | int)
      retries: 60
      delay: 30
      failed_when: false
      loop: "{{ _gpu_added }}"
      when: _gpu_operator_found or _gpu_nfd_available

    - name: "nvidia_gpu_operator | add-node | Fail if a new node's GPUs are not allocatable"
      vars:
        _node: "{{ item.resources | default([]) | first | default({}) }}"
        _allocatable: "{{ ((_node.status | default({})).allocatable | default({}))['nvidia.com/gpu'] | default(0) | int }}"
        _wanted: "{{ hostvars[item.item].node_gpu_count | default(1) | int }}"
      ansible.builtin.fail:
        msg: >-
          {{ item.item }} is in the cluster, but {{ _allocatable }} of its {{ _wanted }} GPU(s)
          are allocatable after 30 minutes. Check the operator's pods on it:
          kubectl -n {{ nvidia_gpu_operator_namespace }} get pods -o wide --field-selector spec.nodeName={{ item.item }}.
          They keep reconciling; re-check with ./es_auto_installer.sh validate --env {{ env_name }} nvidia_gpu_operator.
      loop: "{{ _gpu_node.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - not (item.skipped | default(false))
        - _allocatable | int < _wanted | int
