#
# =============================================================================
# NVIDIA GPU Operator — Validate
# =============================================================================
# Checks GPU operator health, device plugin GPU advertisement and the
# ClusterPolicy, and runs an nvidia-smi test pod when a GPU is free. NVIDIA
# only: nothing to validate for other vendors here.
# =============================================================================

- name: "nvidia_gpu_operator | validate | Skip — vendor is not NVIDIA"
  ansible.builtin.debug:
    msg: "rack_scale_gpu_vendor is '{{ rack_scale_gpu_vendor | default('') }}' — nothing to validate for the NVIDIA GPU operator."
  when: (rack_scale_gpu_vendor | default('')) != 'nvidia'

- name: "nvidia_gpu_operator | validate | End role (no NVIDIA GPU)"
  ansible.builtin.meta: end_role
  when: (rack_scale_gpu_vendor | default('')) != 'nvidia'

# ── GPU Operator pods ────────────────────────────────────────────────────────

- name: "nvidia_gpu_operator | validate | Check GPU operator pods"
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ nvidia_gpu_operator_namespace }}"
  environment:
    KUBECONFIG: "{{ kubernetes_kubeconfig }}"
  register: _gpu_pods
  when: rack_scale_gpu_vendor == 'nvidia'

- name: "nvidia_gpu_operator | validate | Assert GPU operator pods running (NVIDIA)"
  ansible.builtin.assert:
    that:
      - _gpu_pods.resources | selectattr('status.phase', 'equalto', 'Running') | list | length > 0
    fail_msg: >-
      No Running pods in {{ nvidia_gpu_operator_namespace }} namespace.
      Check: kubectl get pods -n {{ nvidia_gpu_operator_namespace }}
    success_msg: >-
      {{ _gpu_pods.resources | selectattr('status.phase', 'equalto', 'Running') | list | length }}
      GPU Operator pods running.
  when: rack_scale_gpu_vendor == 'nvidia'

# ── Device plugin GPU advertisement ──────────────────────────────────────────

- name: "nvidia_gpu_operator | validate | List nodes"
  kubernetes.core.k8s_info:
    kind: Node
  environment:
    KUBECONFIG: "{{ kubernetes_kubeconfig }}"
  register: _gpu_nodes

- name: "nvidia_gpu_operator | validate | Collect nodes advertising GPUs"
  ansible.builtin.set_fact:
    _gpu_advertised: >-
      {%- set out = [] -%}
      {%- for n in _gpu_nodes.resources | default([]) -%}
      {%- set count = (n.status.allocatable | default({})).get('nvidia.com/gpu', '0') | int -%}
      {%- if count > 0 -%}{%- set _ = out.append(n.metadata.name ~ ': ' ~ count) -%}{%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: "nvidia_gpu_operator | validate | Assert GPUs advertised"
  ansible.builtin.assert:
    that:
      - _gpu_advertised | length > 0
    fail_msg: >-
      No nodes advertising GPU resources. Device plugin may not be running.
      Check: kubectl describe node <gpu-node> | grep -i gpu
    success_msg: "GPU resources advertised: {{ _gpu_advertised }}"

# ── ClusterPolicy ────────────────────────────────────────────────────────────
# The operator's own validator (driver, toolkit, CUDA, device plugin) sets the
# ClusterPolicy to ready. It still holds when every GPU is in use.

- name: "nvidia_gpu_operator | validate | Check ClusterPolicy"
  kubernetes.core.k8s_info:
    api_version: nvidia.com/v1
    kind: ClusterPolicy
  environment:
    KUBECONFIG: "{{ kubernetes_kubeconfig }}"
  register: _gpu_cluster_policy
  until: >-
    _gpu_cluster_policy.resources | default([])
    | selectattr('status.state', 'defined')
    | selectattr('status.state', 'equalto', 'ready') | list | length > 0
  retries: 6
  delay: 10
  failed_when: false

- name: "nvidia_gpu_operator | validate | Assert ClusterPolicy ready"
  ansible.builtin.assert:
    that:
      - >-
        _gpu_cluster_policy.resources | default([])
        | selectattr('status.state', 'defined')
        | selectattr('status.state', 'equalto', 'ready') | list | length > 0
    fail_msg: >-
      ClusterPolicy is not ready (state:
      {{ _gpu_cluster_policy.resources | default([]) | map(attribute='status.state', default='unknown') | list }}).
      Check: kubectl get clusterpolicy; kubectl get pods -n {{ nvidia_gpu_operator_namespace }}
    success_msg: "ClusterPolicy ready."

# ── nvidia-smi test (NVIDIA only) ───────────────────────────────────────────
# The test pod needs one GPU. When serving pods hold them all it cannot be
# scheduled, so skip it rather than fail a healthy, busy cluster.

- name: "nvidia_gpu_operator | validate | List scheduled pods"
  kubernetes.core.k8s_info:
    kind: Pod
    field_selectors:
      - status.phase!=Succeeded
      - status.phase!=Failed
  environment:
    KUBECONFIG: "{{ kubernetes_kubeconfig }}"
  register: _gpu_scheduled_pods

- name: "nvidia_gpu_operator | validate | Count free GPUs"
  ansible.builtin.set_fact:
    _gpu_free: >-
      {%- set n = namespace(total=0, used=0) -%}
      {%- for node in _gpu_nodes.resources | default([]) -%}
      {%- set n.total = n.total + (node.status.allocatable | default({})).get('nvidia.com/gpu', '0') | int -%}
      {%- endfor -%}
      {%- for pod in _gpu_scheduled_pods.resources | default([]) if pod.spec.nodeName is defined -%}
      {%- for c in pod.spec.containers -%}
      {%- set n.used = n.used + ((c.resources | default({})).limits | default({})).get('nvidia.com/gpu', '0') | int -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ n.total - n.used }}

- name: "nvidia_gpu_operator | validate | Skip nvidia-smi test (no free GPU)"
  ansible.builtin.debug:
    msg: >-
      All GPUs are allocated to running pods; skipping the nvidia-smi test pod.
      ClusterPolicy is ready, which covers driver and CUDA validation.
  when: _gpu_free | int <= 0

- name: "nvidia_gpu_operator | validate | Run nvidia-smi test"
  when:
    - rack_scale_gpu_vendor == 'nvidia'
    - _gpu_free | int > 0
  environment:
    KUBECONFIG: "{{ kubernetes_kubeconfig }}"
  block:
    - name: "nvidia_gpu_operator | validate | Clean up previous test pod"
      kubernetes.core.k8s:
        api_version: v1
        kind: Pod
        name: gpu-validate-smi-test
        namespace: default
        state: absent
        wait: true
      failed_when: false

    - name: "nvidia_gpu_operator | validate | Create nvidia-smi test pod"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Pod
          metadata:
            name: gpu-validate-smi-test
            namespace: default
          spec:
            restartPolicy: Never
            containers:
              - name: smi
                image: nvidia/cuda:12.4.0-base-ubuntu22.04
                command: ["nvidia-smi"]
                resources:
                  limits:
                    nvidia.com/gpu: "1"

    - name: "nvidia_gpu_operator | validate | Wait for test pod to complete"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        name: gpu-validate-smi-test
        namespace: default
      register: _smi_pod
      until: >-
        (_smi_pod.resources | length > 0) and
        (_smi_pod.resources[0].status.phase in ['Succeeded', 'Failed'])
      retries: 24
      delay: 5

    - name: "nvidia_gpu_operator | validate | Get nvidia-smi output"
      kubernetes.core.k8s_log:
        name: gpu-validate-smi-test
        namespace: default
      register: _smi_output

    - name: "nvidia_gpu_operator | validate | Assert nvidia-smi succeeded"
      ansible.builtin.assert:
        that:
          - "'Driver Version' in _smi_output.log or 'NVIDIA-SMI' in _smi_output.log"
        fail_msg: >-
          nvidia-smi test failed. Output: {{ _smi_output.log_lines[:5] }}
        success_msg: >-
          nvidia-smi passed: {{ _smi_output.log_lines | select('match', '.*Driver Version.*|.*NVIDIA-SMI.*') | first | default('OK') }}

  always:
    - name: "nvidia_gpu_operator | validate | Clean up test pod"
      kubernetes.core.k8s:
        api_version: v1
        kind: Pod
        name: gpu-validate-smi-test
        namespace: default
        state: absent
      failed_when: false

# ── Summary ──────────────────────────────────────────────────────────────────

- name: "nvidia_gpu_operator | validate | ━━━ PASS ━━━"
  ansible.builtin.debug:
    msg:
      - "GPU validation passed."
      - "Vendor: {{ rack_scale_gpu_vendor }}"
      - "Model: {{ rack_scale_gpu_model | default('unknown') }}"
      - "GPUs advertised: {{ _gpu_advertised | default([]) | length }} node(s)"
