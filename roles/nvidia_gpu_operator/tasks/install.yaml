---
# =============================================================================
# NVIDIA GPU Operator — Install
# =============================================================================
# NVIDIA only. Runs when the rack-profile parser found an NVIDIA accelerator:
# (rack_scale_gpu_vendor == nvidia). Other vendors are not handled here: the
# Intel stack is intel_gpu_operator (planner epic B2).
# =============================================================================

- name: "nvidia_gpu_operator | Skip — no GPU vendor detected"
  ansible.builtin.debug:
    msg: "No accelerator: field in rack-profile.yaml — NVIDIA GPU operator not needed."
  when: (rack_scale_gpu_vendor | default('')) | length == 0

- name: "nvidia_gpu_operator | Skip — vendor is not NVIDIA"
  ansible.builtin.debug:
    msg:
      - "WARNING: rack-profile.yaml declares accelerator vendor '{{ rack_scale_gpu_vendor }}'."
      - "This role installs the NVIDIA stack only. No GPU stack is installed for that vendor."
      - "Intel GPUs: intel_gpu_operator (planner epic B2) is not available on this branch yet."
  when:
    - (rack_scale_gpu_vendor | default('')) | length > 0
    - rack_scale_gpu_vendor != 'nvidia'

- name: "nvidia_gpu_operator | End role (no NVIDIA GPU)"
  ansible.builtin.meta: end_role
  when: (rack_scale_gpu_vendor | default('')) != 'nvidia'

- name: "nvidia_gpu_operator | Detected vendor: {{ rack_scale_gpu_vendor }}"
  ansible.builtin.debug:
    msg:
      - "GPU vendor: {{ rack_scale_gpu_vendor }}"
      - "GPU model: {{ rack_scale_gpu_model | default('unknown') }}"
      - "GPU form: {{ rack_scale_gpu_form | default('unknown') }}"

# ═════════════════════════════════════════════════════════════════════════════
# NVIDIA GPU Operator
# ═════════════════════════════════════════════════════════════════════════════

- name: "nvidia_gpu_operator | NVIDIA"
  when: rack_scale_gpu_vendor == 'nvidia'
  environment:
    KUBECONFIG: "{{ kubernetes_kubeconfig }}"
  block:
    - name: "nvidia_gpu_operator | nvidia | Add Helm repository"
      kubernetes.core.helm_repository:
        name: "{{ nvidia_gpu_operator_helm_repo_name }}"
        repo_url: "{{ nvidia_gpu_operator_helm_repo }}"
      register: _gpu_helm_repo
      until: _gpu_helm_repo is succeeded
      retries: "{{ helm_retries }}"
      delay: 15

    - name: "nvidia_gpu_operator | nvidia | Create namespace"
      kubernetes.core.k8s:
        name: "{{ nvidia_gpu_operator_namespace }}"
        api_version: v1
        kind: Namespace
        state: present

    - name: "nvidia_gpu_operator | nvidia | Check for the shared NFD"
      kubernetes.core.helm_info:
        name: node-feature-discovery
        release_namespace: "{{ nfd_namespace | default('node-feature-discovery') }}"
      register: _gpu_shared_nfd
      failed_when: false
      when: not (nvidia_gpu_operator_nfd_enabled | bool)

    - name: "nvidia_gpu_operator | nvidia | Fail if the operator would have no NFD"
      ansible.builtin.fail:
        msg: >-
          The GPU operator's own NFD is off (nvidia_gpu_operator_nfd_enabled: false)
          and no NFD release was found in namespace
          '{{ nfd_namespace | default('node-feature-discovery') }}'. Without NFD the
          operator never finds the GPU nodes. Run the node_feature_discovery
          component first, or set nvidia_gpu_operator_nfd_enabled: true.
      when:
        - not (nvidia_gpu_operator_nfd_enabled | bool)
        - _gpu_shared_nfd.status is not defined or _gpu_shared_nfd.status is none

    - name: "nvidia_gpu_operator | nvidia | Create DCGM custom metrics ConfigMap"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: dcgm-metrics-config
            namespace: "{{ nvidia_gpu_operator_namespace }}"
          data:
            dcgm-metrics.csv: "{{ lookup('ansible.builtin.file', 'dcgm-metrics.csv', rstrip=false) }}"

    - name: "nvidia_gpu_operator | nvidia | Deploy GPU Operator via Helm"
      kubernetes.core.helm:
        name: "{{ nvidia_gpu_operator_release_name }}"
        chart_ref: "{{ nvidia_gpu_operator_chart }}"
        chart_version: "{{ nvidia_gpu_operator_version }}"
        release_namespace: "{{ nvidia_gpu_operator_namespace }}"
        update_repo_cache: true
        wait: true
        timeout: "{{ nvidia_gpu_operator_wait_timeout }}"
        values:
          driver:
            enabled: "{{ nvidia_gpu_operator_driver_enabled | bool }}"
          toolkit:
            enabled: "{{ nvidia_gpu_operator_toolkit_enabled | bool }}"
          devicePlugin:
            enabled: "{{ nvidia_gpu_operator_device_plugin_enabled | bool }}"
          migManager:
            enabled: "{{ nvidia_gpu_operator_mig_enabled | bool }}"
          nodeStatusExporter:
            enabled: true
          nfd:
            enabled: "{{ nvidia_gpu_operator_nfd_enabled | bool }}"
          dcgmExporter:
            enabled: "{{ nvidia_gpu_operator_dcgm_exporter_enabled | bool }}"
            config:
              name: dcgm-metrics-config
            serviceMonitor:
              enabled: false
      register: _gpu_helm_install
      until: _gpu_helm_install is succeeded
      retries: "{{ helm_retries }}"
      delay: 15

    - name: "nvidia_gpu_operator | nvidia | Wait for the bundled NFD workers"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: DaemonSet
        name: gpu-operator-node-feature-discovery-worker
        namespace: "{{ nvidia_gpu_operator_namespace }}"
      register: _gpu_nfd_ds
      until:
        - _gpu_nfd_ds.resources | default([]) | length > 0
        - (_gpu_nfd_ds.resources[0].status.numberReady | default(0)) == (_gpu_nfd_ds.resources[0].status.desiredNumberScheduled | default(0))
      retries: 30
      delay: 10
      ignore_errors: true
      when: nvidia_gpu_operator_nfd_enabled | bool

    - name: "nvidia_gpu_operator | nvidia | Verify GPU Operator pods"
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ nvidia_gpu_operator_namespace }}"
        label_selectors:
          - "app.kubernetes.io/name=gpu-operator"
      register: _gpu_operator_pods

    - name: "nvidia_gpu_operator | nvidia | ━━━ DONE ━━━"
      ansible.builtin.debug:
        msg:
          - "NVIDIA GPU Operator {{ nvidia_gpu_operator_version }} deployed."
          - "Namespace: {{ nvidia_gpu_operator_namespace }}"
          - "Pods: {{ _gpu_operator_pods.resources | map(attribute='metadata.name') | list }}"
          - "DCGM exporter: {{ nvidia_gpu_operator_dcgm_exporter_enabled }}"
