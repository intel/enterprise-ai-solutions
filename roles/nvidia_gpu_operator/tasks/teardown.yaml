# =============================================================================
# NVIDIA GPU Operator — Teardown
# =============================================================================

- name: "nvidia_gpu_operator | teardown | NVIDIA"
  when: rack_scale_gpu_vendor | default('') == 'nvidia'
  environment:
    KUBECONFIG: "{{ kubernetes_kubeconfig }}"
  block:
    - name: "nvidia_gpu_operator | teardown | nvidia | Helm uninstall"
      kubernetes.core.helm:
        name: "{{ nvidia_gpu_operator_release_name }}"
        release_namespace: "{{ nvidia_gpu_operator_namespace }}"
        state: absent
        wait: true
      failed_when: false

    - name: "nvidia_gpu_operator | teardown | nvidia | Delete DCGM metrics ConfigMap"
      kubernetes.core.k8s:
        api_version: v1
        kind: ConfigMap
        name: dcgm-metrics-config
        namespace: "{{ nvidia_gpu_operator_namespace }}"
        state: absent
      failed_when: false

    - name: "nvidia_gpu_operator | teardown | nvidia | Delete namespace"
      kubernetes.core.k8s:
        name: "{{ nvidia_gpu_operator_namespace }}"
        api_version: v1
        kind: Namespace
        state: absent
      failed_when: false

    # helm uninstall leaves the chart's CRDs behind. The NFD CRDs it also
    # ships belong to node_feature_discovery unless the bundled NFD was used.
    - name: "nvidia_gpu_operator | teardown | nvidia | Delete CRDs"
      kubernetes.core.k8s:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: "{{ item }}"
        state: absent
      loop: >-
        {{ ['clusterpolicies.nvidia.com', 'nvidiadrivers.nvidia.com']
           + (['nodefeatures.nfd.k8s-sigs.io', 'nodefeaturerules.nfd.k8s-sigs.io', 'nodefeaturegroups.nfd.k8s-sigs.io']
              if nvidia_gpu_operator_nfd_enabled | bool else []) }}
      failed_when: false
