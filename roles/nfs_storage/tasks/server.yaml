---
# The host that runs the NFS server (_nfs_target) and the address clients
# mount it at (nfs_server): the nfs_server group, else the first control plane.

- name: "nfs_storage | Resolve NFS server target"
  ansible.builtin.set_fact:
    _nfs_target: >-
      {%- if groups['nfs_server'] | default([]) | length > 0 -%}
        {{ groups['nfs_server'] | first }}
      {%- elif groups['kube_control_plane'] | default([]) | length > 0 -%}
        {{ groups['kube_control_plane'] | first }}
      {%- else -%}
        localhost
      {%- endif -%}

- name: "nfs_storage | Resolve NFS server IP"
  ansible.builtin.set_fact:
    nfs_server: >-
      {%- if nfs_server | default('', true) | length > 0 -%}
        {{ nfs_server | trim }}
      {%- elif hostvars[_nfs_target | trim]['ansible_host'] is defined -%}
        {{ hostvars[_nfs_target | trim]['ansible_host'] }}
      {%- else -%}
        {{ _nfs_target | trim }}
      {%- endif -%}
