---
# =============================================================================
# NFS Storage — Install
# =============================================================================
# 1. Set up NFS server on the designated node (delegate_to nfs_server group)
# 2. Install nfs-common on all cluster nodes (delegate_to kube_node)
# 3. Install nfs-subdir-external-provisioner via Helm (localhost)
# 4. Set StorageClass as default (localhost)
# =============================================================================

# ─── Resolve NFS server host ────────────────────────────────────────────
# The nfs_server inventory group designates which host runs NFS.
# Fall back to first kube_control_plane if nfs_server group is empty.

- name: "nfs_storage | Resolve NFS server target"
  ansible.builtin.set_fact:
    _nfs_target: >-
      {%- if groups['nfs_server'] | default([]) | length > 0 -%}
        {{ groups['nfs_server'] | first }}
      {%- elif groups['kube_control_plane'] | default([]) | length > 0 -%}
        {{ groups['kube_control_plane'] | first }}
      {%- else -%}
        localhost
      {%- endif -%}

- name: "nfs_storage | Resolve NFS server IP"
  ansible.builtin.set_fact:
    nfs_server: >-
      {%- if nfs_server | default('', true) | length > 0 -%}
        {{ nfs_server | trim }}
      {%- elif hostvars[_nfs_target | trim]['ansible_host'] is defined -%}
        {{ hostvars[_nfs_target | trim]['ansible_host'] }}
      {%- else -%}
        {{ _nfs_target | trim }}
      {%- endif -%}

- name: "nfs_storage | Display target"
  ansible.builtin.debug:
    msg: "NFS server: {{ nfs_server | trim }} (host={{ _nfs_target | trim }}, path={{ nfs_path }})"

# ─── Validate ──────────────────────────────────────────────────────────

- name: "nfs_storage | Validate configuration"
  ansible.builtin.assert:
    that:
      - nfs_server | default('', true) | trim | length > 0
      - _nfs_target | trim != ''
    fail_msg: "nfs_server could not be resolved. Add hosts to the nfs_server group in inventory."

# ─── Check if already installed ─────────────────────────────────────────

- name: "nfs_storage | Check for existing Helm release"
  kubernetes.core.helm_info:
    name: nfs-subdir-external-provisioner
    release_namespace: "{{ nfs_provisioner_namespace }}"
  register: _nfs_existing
  failed_when: false

- name: "nfs_storage | Check StorageClass"
  kubernetes.core.k8s_info:
    api_version: storage.k8s.io/v1
    kind: StorageClass
    name: "{{ nfs_storageclass_name }}"
  register: _nfs_sc_existing
  failed_when: false

- name: "nfs_storage | Set presence facts"
  ansible.builtin.set_fact:
    _nfs_release_present: "{{ (_nfs_existing.status | default({})) | length > 0 }}"
    _nfs_sc_present: "{{ (_nfs_sc_existing.resources | default([])) | length > 0 }}"

- name: "nfs_storage | Already installed — skip"
  when: _nfs_release_present | bool and _nfs_sc_present | bool
  ansible.builtin.debug:
    msg: "NFS Storage already present (Helm release + StorageClass). Skipping."

# ─── Install nfs-common on ALL cluster nodes ─────────────────────────────
# Always run — a new worker may be missing /sbin/mount.nfs even if the
# StorageClass already exists.

- name: "nfs_storage | Install NFS client packages on cluster nodes"
  ansible.builtin.package:
    name: "{{ 'nfs-common' if ansible_os_family == 'Debian' else 'nfs-utils' }}"
    state: present
    update_cache: "{{ true if ansible_os_family == 'Debian' else omit }}"
  delegate_to: "{{ item }}"
  become: true
  loop: "{{ groups['kube_node'] | default([]) }}"
  loop_control:
    label: "{{ item }}"

# ─── Set up NFS server (delegate_to the nfs_server host) ────────────────

- name: "nfs_storage | Install"
  when: not (_nfs_release_present | bool and _nfs_sc_present | bool)
  block:

    - name: "nfs_storage | ━━━ BEGIN: NFS Storage ━━━"
      ansible.builtin.debug:
        msg: "Setting up NFS server on {{ _nfs_target | trim }} ({{ nfs_path }}) and installing provisioner..."

    - name: "nfs_storage | Install NFS server packages"
      ansible.builtin.package:
        name: "{{ 'nfs-kernel-server' if ansible_os_family == 'Debian' else 'nfs-utils' }}"
        state: present
        update_cache: "{{ true if ansible_os_family == 'Debian' else omit }}"
      delegate_to: "{{ _nfs_target | trim }}"
      become: true

    - name: "nfs_storage | Create export directory"
      ansible.builtin.file:
        path: "{{ nfs_path }}"
        state: directory
        mode: "{{ nfs_dir_mode }}"
        owner: "{{ nfs_dir_owner }}"
        group: "{{ nfs_dir_group }}"
      delegate_to: "{{ _nfs_target | trim }}"
      become: true

    - name: "nfs_storage | Resolve NFS export client list"
      ansible.builtin.set_fact:
        _nfs_export_clients: >-
          {%- if nfs_export_clients | default('', true) | trim | length > 0 -%}
            {{ nfs_export_clients | trim }}
          {%- else -%}
            {%- set ns = namespace(clients=[]) -%}
            {%- for host in ((groups['kube_node'] | default([])) + (groups['kube_control_plane'] | default([]))) | unique -%}
              {%- set _ = ns.clients.append(hostvars[host]['ansible_host'] | default(host)) -%}
            {%- endfor -%}
            {{ ns.clients | unique | join(' ') }}
          {%- endif -%}

    - name: "nfs_storage | Validate NFS export clients"
      ansible.builtin.assert:
        that:
          - _nfs_export_clients | trim | length > 0
          - "'*' not in _nfs_export_clients"
        fail_msg: >-
          nfs_export_clients resolved to '{{ _nfs_export_clients | trim }}'.
          A wildcard ('*') exports the share to every reachable host without
          authentication (CWE-306). Set nfs_export_clients to a CIDR or host
          list, or ensure the kube_node / kube_control_plane inventory groups
          are populated.

    - name: "nfs_storage | Build NFS export line"
      ansible.builtin.set_fact:
        _nfs_exports_line: >-
          {{ nfs_path }}
          {% for c in (_nfs_export_clients | trim).split() %}{{ c }}({{ nfs_export_options }}){% if not loop.last %} {% endif %}{% endfor %}

    - name: "nfs_storage | Configure /etc/exports"
      ansible.builtin.lineinfile:
        path: /etc/exports
        regexp: "^{{ nfs_path | regex_escape }}\\s"
        line: "{{ _nfs_exports_line | trim }}"
        create: true
        mode: "0644"
      delegate_to: "{{ _nfs_target | trim }}"
      become: true

    # nfsd needs /proc/fs/nfsd mounted; a kubeadm reset can unmount it,
    # leaving nfs-server.service active(exited) with no nfsd threads.

    - name: "nfs_storage | Ensure nfsd filesystem is mounted"
      ansible.posix.mount:
        path: /proc/fs/nfsd
        src: nfsd
        fstype: nfsd
        state: mounted
      delegate_to: "{{ _nfs_target | trim }}"
      become: true

    # Restart (not start): the oneshot service reports active(exited) even
    # when nfsd threads never came up, so `started` cannot recover it.

    - name: "nfs_storage | Enable and restart NFS service"
      ansible.builtin.service:
        name: "{{ 'nfs-kernel-server' if ansible_os_family == 'Debian' else 'nfs-server' }}"
        state: restarted
        enabled: true
      delegate_to: "{{ _nfs_target | trim }}"
      become: true

    - name: "nfs_storage | Re-export all shares"
      ansible.builtin.command: exportfs -ra
      delegate_to: "{{ _nfs_target | trim }}"
      become: true
      changed_when: true

    - name: "nfs_storage | Verify NFS exports"
      ansible.builtin.command: exportfs -v
      delegate_to: "{{ _nfs_target | trim }}"
      become: true
      changed_when: false
      register: _nfs_verify_exports

    - name: "nfs_storage | NFS exports"
      ansible.builtin.debug:
        msg: "{{ _nfs_verify_exports.stdout_lines }}"

    # Restrict NFS ports to cluster nodes via iptables.

    - name: "nfs_storage | Collect cluster node IPs for firewall"
      when: nfs_firewall_restrict | default(true) | bool
      ansible.builtin.set_fact:
        _nfs_allowed_ips: >-
          {{ ((groups['kube_node'] | default([])) + (groups['kube_control_plane'] | default([])))
             | unique
             | map('extract', hostvars, 'ansible_host')
             | select('defined')
             | unique
             | list }}

    - name: "nfs_storage | Allow NFS traffic from cluster nodes"
      when: nfs_firewall_restrict | default(true) | bool
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "{{ item.1 }}"
        source: "{{ item.0 }}"
        jump: ACCEPT
        comment: "nfs_storage: allow {{ item.1 }}/tcp from {{ item.0 }}"
      loop: "{{ _nfs_allowed_ips | product(['2049', '111']) | list }}"
      loop_control:
        label: "{{ item.0 }}:{{ item.1 }}"
      delegate_to: "{{ _nfs_target | trim }}"
      become: true

    - name: "nfs_storage | Drop NFS traffic from all other sources"
      when: nfs_firewall_restrict | default(true) | bool
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "{{ item }}"
        jump: DROP
        comment: "nfs_storage: deny {{ item }}/tcp from non-cluster hosts"
      loop: ['2049', '111']
      delegate_to: "{{ _nfs_target | trim }}"
      become: true

    # Wait for nfsd to bind :2049 before smoke-testing the mount.

    - name: "nfs_storage | Wait for nfsd to listen on :2049"
      ansible.builtin.wait_for:
        port: 2049
        host: "{{ nfs_server | trim }}"
        timeout: 60
      delegate_to: "{{ _nfs_target | trim }}"
      become: true

    # Smoke-test: verify a worker can mount the export.

    - name: "nfs_storage | Mount NFS export on first worker"
      ansible.posix.mount:
        path: /tmp/nfs-smoke-test
        src: "{{ nfs_server | trim }}:{{ nfs_path }}"
        fstype: nfs
        state: mounted
      delegate_to: "{{ groups['kube_node'] | first }}"
      become: true

    - name: "nfs_storage | Write and remove test file"
      ansible.builtin.file:
        path: /tmp/nfs-smoke-test/.nfs-test-probe
        state: "{{ item }}"
      loop: [touch, absent]
      delegate_to: "{{ groups['kube_node'] | first }}"
      become: true
      changed_when: false

    - name: "nfs_storage | Unmount NFS smoke test"
      ansible.posix.mount:
        path: /tmp/nfs-smoke-test
        state: absent
      delegate_to: "{{ groups['kube_node'] | first }}"
      become: true

    - name: "nfs_storage | Mount test result"
      ansible.builtin.debug:
        msg: "NFS mount test passed"

    # ── Install Helm provisioner (runs on localhost, talks to k8s API) ────

    - name: "nfs_storage | Add Helm repo"
      kubernetes.core.helm_repository:
        name: "{{ nfs_provisioner_chart_repo_name }}"
        repo_url: "{{ nfs_provisioner_chart_repo }}"

    - name: "nfs_storage | Install nfs-subdir-external-provisioner"
      kubernetes.core.helm:
        name: nfs-subdir-external-provisioner
        chart_ref: "{{ nfs_provisioner_chart_repo_name }}/nfs-subdir-external-provisioner"
        release_namespace: "{{ nfs_provisioner_namespace }}"
        create_namespace: true
        chart_version: "{{ nfs_provisioner_chart_version }}"
        wait: "{{ helm_wait }}"
        timeout: "{{ nfs_wait_timeout }}"
        values:
          nfs:
            server: "{{ nfs_server | trim }}"
            path: "{{ nfs_path }}"
          storageClass:
            name: "{{ nfs_storageclass_name }}"
            defaultClass: "{{ nfs_storageclass_default }}"
            reclaimPolicy: Retain
            archiveOnDelete: true
          tolerations:
            - operator: Exists

    # ── Wait for provisioner ─────────────────────────────────────────────

    - name: "nfs_storage | Wait for provisioner deployment"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: nfs-subdir-external-provisioner
        namespace: "{{ nfs_provisioner_namespace }}"
      register: _nfs_deploy
      until:
        - _nfs_deploy.resources | length > 0
        - _nfs_deploy.resources[0].status.conditions | default([]) | selectattr('type','eq','Available') | selectattr('status','eq','True') | list | length > 0
      retries: 60
      delay: 5

    # ── Verify StorageClass ──────────────────────────────────────────────

    - name: "nfs_storage | Verify StorageClass created"
      kubernetes.core.k8s_info:
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: "{{ nfs_storageclass_name }}"
      register: _nfs_sc
      until: _nfs_sc.resources | length > 0
      retries: 10
      delay: 3

    - name: "nfs_storage | ━━━ DONE: NFS Storage ━━━"
      ansible.builtin.debug:
        msg:
          - "NFS Storage provisioner installed successfully."
          - "  NFS Server: {{ nfs_server | trim }}:{{ nfs_path }}"
          - "  StorageClass: {{ nfs_storageclass_name }} (default={{ nfs_storageclass_default }})"
          - "  Namespace: {{ nfs_provisioner_namespace }}"
