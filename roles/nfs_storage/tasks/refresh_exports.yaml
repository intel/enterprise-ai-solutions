---
# =============================================================================
# NFS exports — client package + /etc/exports refresh
# =============================================================================
# Run on every `install storage`, after add-node for the new node(s)
# (_nfs_refresh_hosts_override) and, for the export line only
# (_nfs_exports_only), after remove-node's inventory reload.
# Resolves the NFS server itself, since add-node never runs install.yaml's
# preamble. A re-run that leaves the client list as it was changes nothing.
# =============================================================================

- name: "nfs_storage | exports | Resolve refresh host list"
  ansible.builtin.set_fact:
    _nfs_refresh_hosts: >-
      {{ _nfs_refresh_hosts_override
         if (_nfs_refresh_hosts_override | default([]) | length > 0)
         else (groups['k8s_cluster'] | default(groups['kube_node'] | default([]))) }}

# install.yaml has resolved it already; add-node and remove-node have not.
- name: "nfs_storage | exports | Resolve NFS server"
  ansible.builtin.include_tasks: server.yaml
  when: _nfs_target is not defined

# ─── NFS client packages on the refresh host list ───────────────────────
# The package name depends on each node's OS family, so its facts are
# gathered on the node: localhost's would pick the wrong one on a mixed-OS
# cluster.

- name: "nfs_storage | exports | Gather OS facts on refresh hosts"
  when: not (_nfs_exports_only | default(false) | bool)
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - distribution
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ _nfs_refresh_hosts }}"
  loop_control:
    label: "{{ item }}"
  changed_when: false

- name: "nfs_storage | exports | Install NFS client packages"
  when: not (_nfs_exports_only | default(false) | bool)
  ansible.builtin.package:
    name: "{{ 'nfs-common' if _os_family == 'Debian' else 'nfs-utils' }}"
    state: present
    update_cache: "{{ true if _os_family == 'Debian' else omit }}"
  vars:
    _os_family: "{{ hostvars[item]['ansible_os_family'] | default('') }}"
  delegate_to: "{{ item }}"
  become: true
  loop: "{{ _nfs_refresh_hosts }}"
  loop_control:
    label: "{{ item }} ({{ hostvars[item]['ansible_os_family'] | default('unknown') }})"

# ─── /etc/exports ─────────────────────────────────────────────────────────
# The export line lists every node, not only _nfs_refresh_hosts.

- name: "nfs_storage | exports | Resolve NFS export client list"
  ansible.builtin.set_fact:
    _nfs_export_clients: >-
      {%- if nfs_export_clients | default('', true) | trim | length > 0 -%}
        {{ nfs_export_clients | trim }}
      {%- else -%}
        {%- set ns = namespace(clients=[]) -%}
        {%- for host in ((groups['kube_node'] | default([])) + (groups['kube_control_plane'] | default([]))) | unique -%}
          {%- set _ = ns.clients.append(hostvars[host]['ansible_host'] | default(host)) -%}
        {%- endfor -%}
        {{ ns.clients | unique | join(' ') }}
      {%- endif -%}

- name: "nfs_storage | exports | Validate NFS export clients"
  ansible.builtin.assert:
    that:
      - _nfs_export_clients | trim | length > 0
      - "'*' not in _nfs_export_clients"
    fail_msg: >-
      nfs_export_clients resolved to '{{ _nfs_export_clients | trim }}'.
      A wildcard ('*') exports the share to every reachable host without
      authentication (CWE-306). Set nfs_export_clients to a CIDR or host
      list, or ensure the kube_node / kube_control_plane inventory groups
      are populated.

- name: "nfs_storage | exports | Build NFS export line"
  ansible.builtin.set_fact:
    _nfs_exports_line: >-
      {{ nfs_path }}
      {% for c in (_nfs_export_clients | trim).split() %}{{ c }}({{ nfs_export_options }}){% if not loop.last %} {% endif %}{% endfor %}

- name: "nfs_storage | exports | Configure /etc/exports"
  ansible.builtin.lineinfile:
    path: /etc/exports
    regexp: "^{{ nfs_path | regex_escape }}\\s"
    line: "{{ _nfs_exports_line | trim }}"
    create: true
    mode: "0644"
  delegate_to: "{{ _nfs_target | trim }}"
  become: true
  notify: nfs_storage exports changed

# Run the re-export handlers (handlers/main.yaml) now rather than at the end
# of the play: install.yaml's smoke test, right after this file, needs the
# export already live. Only fires when the line above actually changed, so
# add-node/remove-node runs that touch nothing here don't poke the server.
- name: "nfs_storage | exports | Apply export changes"
  ansible.builtin.meta: flush_handlers
