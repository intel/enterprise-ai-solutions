---
# =============================================================================
# KEDA — Validate (whoever serves it, external.metrics.k8s.io must answer)
# =============================================================================

- name: "keda | Detect"
  ansible.builtin.include_tasks: detect.yaml

- name: "keda | Check deployments"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ item }}"
    namespace: "{{ keda_namespace }}"
  loop: [keda-operator, keda-operator-metrics-apiserver, keda-admission-webhooks]
  register: _keda_deploys
  when: not _keda_from_olm | bool and _keda_ours | bool

- name: "keda | Assert deployments ready"
  ansible.builtin.assert:
    that:
      - item.resources | length > 0
      - (item.resources[0].status.readyReplicas | default(0) | int) >= 1
    fail_msg: "{{ item.item }} has no ready replica"
    quiet: true
  loop: "{{ _keda_deploys.results | default([]) | rejectattr('skipped', 'defined') | list }}"
  loop_control:
    label: "{{ item.item }}"

- name: "keda | Check the ScaledObject CRD"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: scaledobjects.keda.sh
  register: _keda_crd

- name: "keda | Assert KEDA is serving"
  ansible.builtin.assert:
    that:
      - _keda_crd.resources | length > 0
      - _keda_available | bool
    fail_msg: >-
      KEDA is not serving: {{ 'scaledobjects.keda.sh is missing; ' if not _keda_crd.resources else '' }}external.metrics.k8s.io
      is not Available ({{ _keda_api_service.namespace | default('not registered') }}/{{ _keda_api_service.name | default('') }})
    success_msg: "KEDA CRDs present and external.metrics.k8s.io is Available"
