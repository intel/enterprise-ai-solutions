---
# =============================================================================
# KEDA — Teardown (our release and namespace only)
# =============================================================================

- name: "keda | Custom Metrics Autoscaler belongs to the cluster — nothing to tear down"
  ansible.builtin.debug:
    msg: "KEDA comes from the cluster's Custom Metrics Autoscaler; teardown leaves it."
  when: _keda_from_olm | bool

- name: "keda | Detect"
  ansible.builtin.include_tasks: detect.yaml
  when: not _keda_from_olm | bool

- name: "keda | Teardown"
  when: not _keda_from_olm | bool and _keda_ours | bool
  vars:
    _keda_kinds:
      - {api: keda.sh/v1alpha1, kind: ScaledObject, crd: scaledobjects.keda.sh}
      - {api: keda.sh/v1alpha1, kind: ScaledJob, crd: scaledjobs.keda.sh}
      - {api: keda.sh/v1alpha1, kind: TriggerAuthentication, crd: triggerauthentications.keda.sh}
      - {api: keda.sh/v1alpha1, kind: ClusterTriggerAuthentication, crd: clustertriggerauthentications.keda.sh}
      - {api: eventing.keda.sh/v1alpha1, kind: CloudEventSource, crd: cloudeventsources.eventing.keda.sh}
      - {api: eventing.keda.sh/v1alpha1, kind: ClusterCloudEventSource, crd: clustercloudeventsources.eventing.keda.sh}
  block:
    # First, while the operator runs: it clears finalizer.keda.sh and hands
    # each scaled workload back to its own replica count.
    - name: "keda | Find KEDA objects in every namespace"
      kubernetes.core.k8s_info:
        api_version: "{{ item.api }}"
        kind: "{{ item.kind }}"
      loop: "{{ _keda_kinds }}"
      loop_control:
        label: "{{ item.kind }}"
      register: _keda_objects
      failed_when: false

    - name: "keda | Delete KEDA objects"
      kubernetes.core.k8s:
        state: absent
        api_version: "{{ item.apiVersion }}"
        kind: "{{ item.kind }}"
        name: "{{ item.metadata.name }}"
        namespace: "{{ item.metadata.namespace | default(omit) }}"
        wait: true
        wait_timeout: 60
      loop: "{{ _keda_objects.results | map(attribute='resources') | select('defined') | flatten }}"
      loop_control:
        label: "{{ item.kind }} {{ item.metadata.namespace | default('') }}/{{ item.metadata.name }}"
      failed_when: false

    # No wait: a finalized object left behind keeps its CRD Terminating
    # until the strip below runs.
    - name: "keda | Uninstall Helm release"
      kubernetes.core.helm:
        name: keda
        release_namespace: "{{ keda_namespace }}"
        state: absent
        wait: false

    # A gone operator cannot clear its own finalizer.
    - name: "keda | Find KEDA objects left behind"
      kubernetes.core.k8s_info:
        api_version: "{{ item.api }}"
        kind: "{{ item.kind }}"
      loop: "{{ _keda_kinds }}"
      loop_control:
        label: "{{ item.kind }}"
      register: _keda_left
      failed_when: false

    - name: "keda | Strip finalizer.keda.sh from objects left behind"
      kubernetes.core.k8s:
        state: patched
        api_version: "{{ item.apiVersion }}"
        kind: "{{ item.kind }}"
        name: "{{ item.metadata.name }}"
        namespace: "{{ item.metadata.namespace | default(omit) }}"
        definition:
          metadata:
            finalizers: "{{ item.metadata.finalizers | reject('eq', 'finalizer.keda.sh') | list }}"
      loop: >-
        {{ _keda_left.results | map(attribute='resources') | select('defined') | flatten
           | selectattr('metadata.finalizers', 'defined')
           | selectattr('metadata.finalizers', 'contains', 'finalizer.keda.sh') | list }}
      loop_control:
        label: "{{ item.kind }} {{ item.metadata.namespace | default('') }}/{{ item.metadata.name }}"
      failed_when: false

    - name: "keda | Wait for the KEDA CRDs to go"
      kubernetes.core.k8s:
        state: absent
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: "{{ item }}"
        wait: true
        wait_timeout: 120
      loop: "{{ _keda_kinds | map(attribute='crd') | list }}"

    # Takes the mesh policies with it.
    - name: "keda | Delete the namespace"
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Namespace
        name: "{{ keda_namespace }}"
        wait: true
        wait_timeout: 300

- name: "keda | Not installed by us — nothing to tear down"
  ansible.builtin.debug:
    msg: "No KEDA release in {{ keda_namespace }}."
  when: not _keda_from_olm | bool and not _keda_ours | bool
