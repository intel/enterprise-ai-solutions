---
# =============================================================================
# GPU Observability — Install
# =============================================================================
# Deploys DCGM Grafana dashboard and GPU alert rules into the observability
# namespace. Only for NVIDIA GPUs (Intel XPU uses different metrics).
#
# The GPU Operator's built-in ServiceMonitor is disabled (it lacks the
# release: observability label that kube-prometheus-stack requires). We
# create our own ServiceMonitor here with the correct label, plus:
#   1. DCGM ServiceMonitor (with release: observability label)
#   2. PrometheusRule with GPU health alerts
#   3. Grafana dashboard ConfigMap
# =============================================================================

- name: "gpu_observability | Read GPU vendor from generated flags"
  ansible.builtin.shell: |
    grep '^rack_scale_gpu_vendor=' {{ env_dir }}/inventory/metadata/rack-scale-flags.env 2>/dev/null | cut -d= -f2
  register: _gpu_vendor_from_file
  changed_when: false
  failed_when: false

- name: "gpu_observability | Set GPU vendor fact"
  ansible.builtin.set_fact:
    _gpu_vendor: "{{ _gpu_vendor_from_file.stdout | default('') | trim }}"

- name: "gpu_observability | Skip — no NVIDIA GPU detected"
  ansible.builtin.meta: end_role
  when: _gpu_vendor != 'nvidia'

- name: "gpu_observability | NVIDIA alerts and dashboards"
  environment:
    KUBECONFIG: "{{ kubernetes_kubeconfig }}"
  block:
    # ── DCGM ServiceMonitor ────────────────────────────────────────────────
    # The GPU Operator's built-in ServiceMonitor lacks release: observability,
    # so kube-prometheus-stack's Prometheus silently ignores it. We disable
    # the operator's monitor and create our own with the correct label.

    - name: "gpu_observability | Create DCGM ServiceMonitor"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: monitoring.coreos.com/v1
          kind: ServiceMonitor
          metadata:
            name: dcgm-exporter
            namespace: "{{ gpu_observability_namespace }}"
            labels:
              release: observability
              app.kubernetes.io/name: dcgm-exporter
              app.kubernetes.io/part-of: gpu-observability
          spec:
            selector:
              matchLabels:
                app: nvidia-dcgm-exporter
            namespaceSelector:
              matchNames:
                - gpu-operator
            endpoints:
              - port: gpu-metrics
                interval: 15s
                honorLabels: true

    # ── GPU Alert Rules ──────────────────────────────────────────────────────

    - name: "gpu_observability | Apply GPU alert rules"
      kubernetes.core.k8s:
        state: present
        src: "{{ role_path }}/files/gpu-alerts.yaml"
      when: gpu_observability_alerts_enabled | bool

    # ── Grafana Dashboard ────────────────────────────────────────────────────

    - name: "gpu_observability | Create NVIDIA DCGM Grafana dashboard ConfigMap"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: grafana-dashboard-nvidia-dcgm
            namespace: "{{ gpu_observability_namespace }}"
            labels:
              grafana_dashboard: "1"
              app.kubernetes.io/name: gpu-observability
              app.kubernetes.io/part-of: observability
          data:
            nvidia-dcgm.json: "{{ lookup('file', role_path + '/files/nvidia-dcgm.json') }}"
      when: gpu_observability_grafana_dashboard_enabled | bool

    - name: "gpu_observability | ━━━ DONE ━━━"
      ansible.builtin.debug:
        msg:
          - "GPU observability deployed (NVIDIA)."
          - "Alerts: {{ gpu_observability_alerts_enabled }}"
          - "Dashboard: {{ gpu_observability_grafana_dashboard_enabled }}"
          - "Namespace: {{ gpu_observability_namespace }}"
