# fabric_bgp — Install
#
# Applies per-node Calico BGPPeer CRDs generated by the rack-profile parser.
# One CRD per node per secondary fabric NIC.  Uses spec.sourceAddress so bird
# dials each leaf from the correct NIC IP.
#
# Safe to re-run: kubernetes.core.k8s with state=present is idempotent.
# No files → no-op (single-NIC cluster or VXLAN mode).

- name: "fabric_bgp | install | Find generated BGPPeer CRD files"
  ansible.builtin.find:
    paths: "{{ rack_scale_bgp_peers_dir }}"
    patterns: "*.yaml"
  register: _bgp_peer_files

- name: "fabric_bgp | install | Apply BGPPeer CRDs"
  kubernetes.core.k8s:
    state: present
    src: "{{ item.path }}"
    kubeconfig: "{{ kubernetes_kubeconfig }}"
  loop: "{{ _bgp_peer_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: _bgp_peer_files.files | length > 0

- name: "fabric_bgp | install | No BGPPeer CRDs to apply"
  ansible.builtin.debug:
    msg: >-
      No per-node BGPPeer CRD files found in {{ rack_scale_bgp_peers_dir }}
      — skipping (single-NIC cluster or VXLAN mode).
  when: _bgp_peer_files.files | length == 0
