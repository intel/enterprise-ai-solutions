---
# =============================================================================
# Layer manifest — inference
# =============================================================================
# One file per layer: configs/repos/repos.<layer>.yaml. The filename carries the
# layer name, so `init inference` / `install inference` resolve to this file.
#
# Self-contained: every repo this layer needs, dependencies first, each pinned
# independently. Field reference and the rest of the wiring:
# docs/adding_solutions.md
# =============================================================================

repos:
  - layer: "inference"
    url: "https://github.com/intel/enterprise-inference"
    dest: "enterprise.ai-inference"
    rev: "d035b1ef1981fbf5084ff05c9a337e620478bb87" # v1.1.0
    deployment_subdir: ""
    config_dir: ""
    default_flavour: ""
    model_catalog: "model_manager/models.yaml"
