# =============================================================================
# Layer manifest — agent-toolkit
# =============================================================================

# Applied only to a global_config.yaml that init creates: new envs use LiteLLM.
global_config:
  auth_provider: "litellm"                # keycloak | litellm

repos:
  - layer: "inference"
    url: "https://github.com/intel/enterprise-inference"
    dest: "enterprise.ai-inference"
    rev: "main"
    deployment_subdir: ""
    config_dir: ""
    default_flavour: ""
    model_catalog: "model_manager/models.yaml"

  - layer: "agent-toolkit"
    url: "https://github.com/intel/enterprise-agent-toolkit"
    dest: "enterprise.agent-toolkit"
    rev: "main"
    deployment_subdir: ""
    config_dir: ""
    default_flavour: ""
