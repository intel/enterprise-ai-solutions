---
# =============================================================================
# Layer manifest — erag
# =============================================================================
# The inference layer eRAG builds on, then eRAG itself, each pinned to the
# rev this layer is validated against. Dependencies first: inference is
# cloned and seeded before erag.
#
# Field reference: docs/adding_solutions.md
# =============================================================================

repos:
  - layer: "inference"
    url: "https://github.com/intel/enterprise-inference"
    dest: "enterprise.ai-inference"
    rev: "90da478353cbaf8fd8345f94156103fbc54f171d" # v1.0.1
    deployment_subdir: ""
    config_dir: ""
    default_flavour: ""
    model_catalog: "model_manager/models.yaml"

  - layer: "erag"
    url: "https://github.com/intel/enterprise-rag"
    dest: "enterprise.ai-erag"
    rev: "25812cbbbadbf711af15b50b49d79e38c20c4190" # v3.0.0
    deployment_subdir: "deployment"
    config_dir: "pipelines"
    default_flavour: "chatqna"
