---
# =============================================================================
# Global Configuration — Default Template
# =============================================================================
# Copy to the repo root and edit before deploying. Deployment targets → nodes.yaml
# Override any value: ./es_auto_installer.sh install -e key=value
# =============================================================================

# --- Kubernetes ---
kubernetes_skip_if_exists: true           # false = force reinstall over existing cluster
kubernetes_cluster_name: "cluster.local"
kubernetes_kube_proxy_mode: "nftables"    # nftables | iptables | ipvs
# existing_kubernetes: ""                 # BYO cluster: set to absolute path of your kubeconfig.
#                                         # Skips all Kubespray phases. Leave commented for managed install.

# --- Storage ---
# ceph and netapp-trident each need their own settings block: see Optional
# Features at the bottom of this file.
storage_backend: local-path               # local-path (single-node) | nfs | ceph | netapp-trident(available only with customer specific HW) | custom

# custom = your cluster already has a CSI driver; the installer installs no
# provisioner and only checks the class below. It must be the cluster's default
# StorageClass — every component provisions without naming one:
#   kubectl annotate storageclass <name> storageclass.kubernetes.io/is-default-class=true --overwrite
# storage_custom_storageclass: ""         # required when storage_backend=custom
# storage_custom_rwx: true                # false = the class is RWO-only (single-node only:
#                                         # the shared model store needs ReadWriteMany)

# --- Ceph (only used when storage_backend=ceph) ---
# Raw block devices for OSDs, keyed by node name. Listed nodes run all Ceph daemons.
# rook_ceph_devices:
#   node-1: [/dev/nvme1n1]
#   node-2: [/dev/nvme1n1]

# true = teardown wipes every device above, no confirmation. Off means wiping them by hand (blkdiscard -f) before any re-install, or Ceph creates 0 OSDs.
# rook_ceph_teardown_wipe_devices: false

# --- Proxy (uncomment if behind corporate proxy) ---
# kubernetes_service_cidr: "10.233.0.0/18"    # ClusterIP range
# kubernetes_cluster_cidr: "10.233.64.0/18"   # pod range
# http_proxy: "http://your-proxy:8080"
# https_proxy: "http://your-proxy:8080"
# no_proxy must list both CIDRs above + node subnets: ip route | grep -v default | awk '{print $1}' | grep '/'
# no_proxy: "localhost,127.0.0.1,.svc,.cluster.local,.monitoring,10.233.0.0/18,10.233.64.0/18,<node-subnet>"

# --- TLS ---
# selfsigned: an internal root CA is created and exported to
#   env/<name>/logs/ai-solutions-ca.crt — import that file into your browser or
#   OS trust store to drop the certificate warnings.
gateway_tls_mode: "selfsigned"            # selfsigned | custom
base_domain_name: "solutions.ai"
gateway_request_timeout: "600s"           # Envoy default is 15s — too short for LLM

# --- Custom TLS (only used when gateway_tls_mode=custom) ---
# gateway_tls_cert_file: "/path/to/cert.pem"
# gateway_tls_key_file: "/path/to/key.pem"

# --- Components ---
istio_enabled: true
observability_enabled: true
velero_enabled: false                     # opt-in: backup/restore. Requires CSI-snapshot storage

# --- Authentication ---
auth_provider: "keycloak"                 # keycloak | litellm

# --- PostgreSQL ---
postgresql_databases:
  - name: keycloak
    user: keycloak
  - name: litellm
    user: litellm
  - name: langfuse
    user: langfuse

# =============================================================================
# Advanced Options (most users won't need to change these)
# =============================================================================

# --- Workload Placement ---
# Soft affinity to separate platform pods (masters) from inference pods (workers).
# Single-node: no-op. Set false to let all pods land anywhere.
node_topology_enabled: true

# --- Pod Security Standards (PSS) ---
# Stamps pod-security.kubernetes.io/{enforce,audit,warn} on every installer-created namespace;
# each role picks its own profile (privileged / baseline / restricted).
enforce_pss: true

# --- CPU Policy ---
# NRI balloons is the only supported CPU policy for production deployments.
# It provides NUMA-aware CPU pinning via the NRI resource policy plugin.
# Do NOT change this value — the model-manager and inference stack require NRI.
# (Reserved for future use: additional policies may be added in later releases.)
kubernetes_cpu_policy: "nri-balloons"

kubernetes_accelerator: "cpu"

# --- Object Store ---
# Backend for Loki, Tempo, Langfuse blob storage.
# Options: seaweedfs (default) | rustfs | external
object_store_backend: "seaweedfs"
seaweedfs_volume_storage_size: "10Gi"

# --- Keycloak (only used when auth_provider=keycloak) ---
# keycloak_admin_password: set via KEYCLOAK_ADMIN_PASSWORD env var or prompted

# --- Observability ---
# observability_grafana_admin_password: set via GRAFANA_ADMIN_PASSWORD env var
# observability_prometheus_retention: "30d"
# observability_prometheus_storage_size: "50Gi"

cert_manager_enabled: true
metallb_enabled: true
postgresql_enabled: true
envoy_gateway_enabled: true

# =============================================================================
# Optional Features (only read when the matching option above selects them)
# =============================================================================

# --- NetApp ONTAP (requires storage_backend: netapp-trident) ---
# Prerequisites, troubleshooting and the ONTAP S3 flow: docs/NETAPP_ONTAP.md.
# ontap_management_lif: "10.0.0.100"      # cluster/SVM management LIF, TCP 443
# ontap_data_lif: "10.0.0.101"            # NFS data LIF, TCP 2049 + 111
# ontap_svm: "svm_ai"                     # SVM that owns the LIFs above
# ontap_username: "vsadmin"               # ONTAP user with http/ontapi application access
# ontap_password: ""                      # goes into a K8s Secret; keep this file mode 0600
# ontap_driver: "ontap-nas"               # ontap-nas | ontap-nas-economy | ontap-nas-flexgroup
#
# The StorageClass uses reclaimPolicy: Retain, matching the nfs backend: deleting
# a PVC leaves the ONTAP FlexVol and its data in place. Teardown prints every
# FlexVol left behind plus the ONTAP command to remove them; it cannot delete
# them itself once the CSI driver is gone.
# ontap_teardown_delete_pvcs: false       # true = teardown deletes Trident PVCs first
# ontap_preflight_online: true            # false = validate config/nodes only, never contact the array
#
# ontap_s3_data_lif: "10.0.0.102"         # object-store server data LIF (NOT the NFS one)
# ontap_s3_port: 443                      # TCP port of the ONTAP S3 server. Unset = the
#                                         # consuming layer assumes 443 and preflight does NOT probe it
# ontap_s3_tls: true                      # false = plaintext HTTP to the S3 port
# ontap_s3_ca_cert_file: ""               # PEM on the installer host that signed the S3 certificate
#
# Subdomain the S3 API is published under, as <subdomain>.<base_domain_name>. The
# gateway names its dedicated S3 listener after it, and a solution layer that
# publishes an S3 API reads the same value, so both agree by construction.
# gateway_s3_subdomain: "s3"
