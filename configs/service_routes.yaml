# =============================================================================
# Service Routing Registry — single source of truth for gateway publishing
# =============================================================================
# How each service is exposed through the Envoy Gateway. Shipped WITH the code
# (loaded by playbooks/includes/preflight.yaml), NOT seeded per-env — so new
# services and wiring changes reach every cluster on upgrade with no per-env
# edits.
#
# Per-CLUSTER values live in env/<env>/global_config.yaml, not here:
#   base_domain_name  the cluster's domain
#   routing_mode      'subdomain' (<service>.<domain>) or 'path' (<domain>/<service>)
# To vary a SINGLE service on ONE cluster (custom path, or keep it on a
# subdomain while the rest go path-based), add a service_route_overrides entry
# in that env's global_config.yaml — do not fork this file.
#
# The subdomain-vs-apex derivation itself lives in one place:
# filter_plugins/service_route.py (the `service_route` Jinja filter).
#
# Fields per service:
#   path       logical path in path mode, e.g. /keycloak
#   subdomain  subdomain label in subdomain mode → <subdomain>.<base_domain_name>
#   service    backend Kubernetes Service name
#   port       backend Service port
#   namespace  namespace the Service (and its HTTPRoute) live in
#   mode       optional: pin 'subdomain' | 'path' regardless of routing_mode
#   prefix     how the path-mode prefix reaches the backend:
#                passthrough  app serves under its prefix itself (UIs; default)
#                strip        gateway removes the prefix (APIs serving at '/')
#                none         app cannot serve under a prefix: internal-only in
#                             path mode unless pinned to a subdomain
#   cookies    cookies the app sets on Path=/ ('name*' = prefix). Path mode
#              shares one origin, so the gateway strips them from requests to
#              every other service. Apps that path-scope their cookies need none.
# =============================================================================
service_routes:
  keycloak:
    path: /keycloak
    subdomain: keycloak
    service: keycloak-service
    port: 8080
    namespace: keycloak

  grafana:
    path: /grafana
    subdomain: grafana
    service: kube-prometheus-stack-grafana
    port: 80
    namespace: monitoring


  # Inference layer, auth_provider: keycloak (gateway JWT).
  inference:
    path: /inference
    subdomain: inference
    service: ai-gateway
    port: 80
    namespace: envoy-gateway-system
    prefix: strip

  # Inference layer, auth_provider: litellm (virtual keys).
  litellm:
    path: /litellm
    subdomain: litellm
    service: litellm
    port: 4000
    namespace: litellm
    prefix: strip

  # LiteLLM UI + admin API. The UI session ('token') and the gateway OIDC
  # cookies are Path=/; the token carries an admin key.
  litellm-admin:
    path: /litellm-admin
    subdomain: litellm-admin
    service: litellm
    port: 4000
    namespace: litellm
    cookies:
      - token
      - litellm_*           # SSO state / return-to
      - litellm-admin-*     # gateway OIDC id/access token (cookieNames)
      - OauthHMAC-*
      - OauthExpires-*
      - OauthNonce-*
      - RefreshToken-*
      - IdToken-*
      - AccessToken-*
      - CodeVerifier*

  # Base path is compiled into the stock image (NEXT_PUBLIC_BASE_PATH).
  langfuse:
    path: /langfuse
    subdomain: langfuse
    service: langfuse-web
    port: 3000
    namespace: langfuse
    prefix: none
