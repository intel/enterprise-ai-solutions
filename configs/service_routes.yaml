# =============================================================================
# Service Routing Registry — ai-solutions' own services
# =============================================================================
# How each service ai-solutions installs is exposed through the Envoy Gateway.
# Every repo keeps its own configs/service_routes.yaml for the services it
# installs; preflight merges them and fails if two repos claim the same service
# name, subdomain or path (or one path nests under another repo's). A role
# publishes its service by including envoy_gateway's attach.yaml (see there).
#
# Per-CLUSTER values live in env/<env>/global_config.yaml, not here:
#   base_domain_name  the cluster's domain
#   routing_mode      'subdomain' (<service>.<domain>) or 'path' (<domain>/<service>)
# To vary a SINGLE service on ONE cluster (custom path, or keep it on a
# subdomain while the rest go path-based), add a service_route_overrides entry
# in that env's global_config.yaml — do not fork this file.
#
# The subdomain-vs-apex derivation itself lives in one place:
# filter_plugins/service_route.py (the `service_route` Jinja filter).
#
# Fields per service:
#   path       logical path in path mode, e.g. /keycloak
#   subdomain  subdomain label in subdomain mode → <subdomain>.<base_domain_name>
#   service    backend Kubernetes Service name
#   port       backend Service port
#   namespace  namespace the Service (and its HTTPRoute) live in
#   mode       optional: pin 'subdomain' | 'path' regardless of routing_mode
#   prefix     how the path-mode prefix reaches the backend:
#                passthrough  app serves under its prefix itself (UIs; default)
#                strip        gateway removes the prefix (APIs serving at '/')
#                none         app cannot serve under a prefix: internal-only in
#                             path mode unless pinned to a subdomain
#   cookies    cookies the app sets on Path=/ ('name*' = prefix). Path mode
#              shares one origin, so the gateway strips them from requests to
#              every other service. Apps that path-scope their cookies need none.
# =============================================================================
service_routes:
  keycloak:
    path: /keycloak
    subdomain: keycloak
    service: keycloak-service
    port: 8080
    namespace: keycloak

  grafana:
    path: /grafana
    subdomain: grafana
    service: kube-prometheus-stack-grafana
    port: 80
    namespace: monitoring
