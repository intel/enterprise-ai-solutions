---
# =============================================================================
# Component Registry — ai-solutions' own layers and components
# =============================================================================
# Execution order is derived from depends_on, not from the order of this file:
# layers in dependency order, then components within each layer.
# Component depends_on is SAME-LAYER only — cross-layer ordering comes from the
# layer graph.
#
# Teardown deletes the objects the ownership role labelled during install
# (roles/ownership). `teardown: role` runs the component's own teardown instead, and
# `teardown: both` runs it after the labelled objects are gone: for components that
# also change hosts. `teardown_tasks` names the role's tasks file that takes back what
# the component changed in other components' objects (the gateway's portal and routes),
# run before the labelled objects go. `ownership_declared` lists objects the component
# creates that no task result names (a Job's, a subchart's CRDs), matched by any of kind,
# namespace, name and labels. `used_by` names the components a component exists for: it is
# installed only while one of them is enabled, and torn down with them.
#
# Adding a component here: add an entry and create roles/<name>/.
# Adding a whole solution (its own layer, in its own repo): see
# docs/adding_solutions.md — external repos declare their own layers, which
# preflight merges in, so they are not listed here.
# =============================================================================

layers:
  - name: infrastructure
    enabled: true
    depends_on: []
  - name: platform
    enabled: true
    depends_on: [infrastructure]
  - name: inference
    enabled: true
    depends_on: [platform]
  # Opt-in layers are declared by their own ext repo's components.yaml

components:
  # --- Infrastructure: Rack-Scale Fabric (disabled by default) ---
  # Gated on rack_scale_enabled. When false, all fabric components are skipped
  # and the infrastructure layer behaves identically to before this addition.
  # Pre-K8s fabric: inventory → netplan → sysctl must run BEFORE kubernetes.
  # In star topology the hub must have fabric NICs + ip_forward configured
  # before kubespray can SSH to worker nodes through it.
  - name: fabric_inventory
    layer: infrastructure
    teardown: role
    enabled: "{{ rack_scale_enabled | default(false) | bool }}"
    depends_on: []

  - name: fabric_netplan
    layer: infrastructure
    teardown: role
    enabled: "{{ rack_scale_enabled | default(false) | bool }}"
    depends_on: [fabric_inventory]

  - name: fabric_sysctl
    layer: infrastructure
    teardown: role
    enabled: "{{ rack_scale_enabled | default(false) | bool }}"
    depends_on: [fabric_netplan]

  # The infrastructure layer does not read cluster_distribution. OpenShift is
  # always BYO (existing_kubernetes), and the kubernetes role skips a BYO cluster.
  - name: kubernetes
    layer: infrastructure
    teardown: role
    enabled: true
    depends_on: [fabric_sysctl]

  # Post-K8s fabric: BGP needs kubectl, validate needs the cluster up.
  - name: fabric_bgp
    layer: infrastructure
    teardown: role
    enabled: "{{ rack_scale_enabled | default(false) | bool }}"
    depends_on: [kubernetes]

  - name: fabric_validate
    layer: infrastructure
    teardown: role
    enabled: "{{ rack_scale_enabled | default(false) | bool }}"
    depends_on: [kubernetes, fabric_bgp]

  # Rook keeps the CephCluster and its pools while Ceph volumes exist: its own
  # teardown sets the cleanup policy first.
  - name: storage
    layer: infrastructure
    teardown: role
    enabled: true
    depends_on: [kubernetes]

  # Prepares the nodes over SSH, so it runs with the host-level layer.
  - name: kata_containers
    layer: infrastructure
    teardown: both
    enabled: "{{ kata_containers_enabled | default(false) | bool }}"
    depends_on: [kubernetes]

  # --- Platform ---
  # --- Node features and GPU ---
  # The cluster's one NFD, on every cluster: the Helm chart on Kubernetes, a check of
  # the Node Feature Discovery Operator on OpenShift (vars/openshift.yaml). First in
  # the platform layer, ahead of the GPU operator so the operator does not bring its
  # own. Preflight leaves the inference layer's former nfd component out of the plan,
  # for every action; nfd_enabled turns NFD off. teardown_tasks: the chart's prune
  # hook takes NFD's labels off the nodes on helm uninstall only.
  - name: node_feature_discovery
    layer: platform
    teardown_tasks: release_remove.yaml
    enabled: "{{ nfd_enabled | default(true) | bool }}"
    depends_on: []

  # NVIDIA; enabled when rack_scale is on; role checks gpu_vendor and no-ops if not nvidia.
  # One role per vendor: this is the NVIDIA stack. The Intel stack is a separate
  # role (intel_gpu_plugin, gated on NFD's Intel GPU labels).
  # This role gates on rack_scale_gpu_vendor, which preflight loads from
  # rack-profile.yaml for every action, and no-ops unless it is nvidia.
  # In the platform layer after NFD, whose labels place its operands; fabric_validate
  # (infrastructure) has run before it. Planned (B2): detect vendors from NFD labels
  # and drop the rack_scale gate. Not on OpenShift for now: it expects the NFD Helm
  # release, and OpenShift gets NFD from its operator.
  - name: nvidia_gpu_operator
    layer: platform
    enabled: "{{ rack_scale_enabled | default(false) | bool and cluster_distribution | default('kubernetes') != 'openshift' }}"
    depends_on: [node_feature_discovery]

  # Platform, not inference: every pod lands in a balloon, so `teardown inference` must keep it.
  # Runs before the other platform services only by registry order (no depends_on).
  - name: nri_cpu_balloons
    layer: platform
    enabled: "{{ (kubernetes_cpu_policy | default('nri-balloons')) == 'nri-balloons' and (kubernetes_accelerator | default('cpu')) == 'cpu' }}"
    depends_on: []

  # Intel GPUs (Arc Pro B-Series / B70 and other Xe GPUs): the device plugin that advertises
  # gpu.intel.com/xe for the GPU model runtimes. Installs only where NFD labelled a node
  # with an Intel GPU, so CPU-only clusters are unchanged. Not on OpenShift: the Intel
  # Device Plugins Operator provides it there.
  - name: intel_gpu_plugin
    layer: platform
    enabled: "{{ intel_gpu_plugin_enabled | default(true) | bool and cluster_distribution | default('kubernetes') != 'openshift' }}"
    depends_on: [node_feature_discovery]

  - name: cert_manager
    layer: platform
    enabled: "{{ cert_manager_enabled | default(true) | bool }}"
    depends_on: []

  # Skipped on OpenShift: the mesh is Service Mesh 3 (Sail operator), which owns
  # the Istio CRDs and control plane.
  - name: istio
    layer: platform
    enabled: "{{ istio_enabled | default(true) | bool and cluster_distribution | default('kubernetes') != 'openshift' }}"
    depends_on: [cert_manager]

  # Skipped on OpenShift: services are exposed through the OpenShift router, and
  # a customer who wants a dedicated VIP installs MetalLB from the marketplace.
  - name: metallb
    layer: platform
    enabled: "{{ metallb_enabled | default(true) | bool and not (cluster_distribution | default('kubernetes') == 'openshift') }}"
    depends_on: []

  # Resource metrics (kubectl top, HPA, Headlamp CPU/memory). Skipped on OpenShift,
  # which serves metrics.k8s.io itself; skips itself when a BYO cluster already does.
  - name: metrics_server
    layer: platform
    enabled: "{{ metrics_server_enabled | default(true) | bool and cluster_distribution | default('kubernetes') != 'openshift' }}"
    depends_on: []

  # Platform Gateway; gateway_provider picks the implementation (envoy).
  - name: gateway
    aliases: [envoy_gateway]
    layer: platform
    enabled: "{{ gateway_enabled | default(envoy_gateway_enabled | default(true)) | bool }}"
    depends_on: [cert_manager, metallb]

  - name: postgresql
    layer: platform
    enabled: "{{ postgresql_enabled | default(true) | bool }}"
    depends_on: []

  - name: keycloak
    layer: platform
    teardown_tasks: expose_remove.yaml
    # Both auth modes: people sign in through Keycloak; the gateway trusts its JWTs.
    enabled: "{{ keycloak_enabled | default(true) | bool }}"
    depends_on: [cert_manager, gateway, postgresql]

  # Kubernetes web UI; people sign in through Keycloak (platform realm). Skipped on
  # OpenShift, whose console covers it.
  # Right after keycloak: its API server restart then hits few running components.
  # Its teardown also resets the API server's OIDC settings and /etc/hosts.
  - name: headlamp
    layer: platform
    teardown: both
    enabled: "{{ headlamp_enabled | default(false) | bool and cluster_distribution | default('kubernetes') != 'openshift' }}"
    depends_on: [cert_manager, gateway, keycloak]

  - name: object_store
    layer: platform
    enabled: true
    depends_on: []

  # The telemetry store (release `telemetry` in `monitoring`), not erag EDP's own
  # SeaweedFS. Goes with observability unless Langfuse (inference) still uses it.
  - name: seaweedfs
    layer: platform
    enabled: "{{ (object_store_backend | default('seaweedfs')) == 'seaweedfs' }}"
    depends_on: [object_store]
    used_by: [observability, langfuse]

  # On OpenShift: instances of the operators the admin installed from OperatorHub
  # (Loki, Logging, Tempo, OpenTelemetry, Grafana), metrics from user-workload
  # monitoring. See roles/observability/tasks/install_olm.yaml.
  - name: observability
    layer: platform
    teardown_tasks: grafana_route_remove.yaml
    enabled: "{{ observability_enabled | default(true) | bool }}"
    # kube-prometheus-stack's CRDs come from its `crds` subchart, which the Helm release
    # does not keep (only the top-level chart's crds/ can be read back). Its 85.3.3 set:
    ownership_declared:
      - {kind: CustomResourceDefinition, name: alertmanagerconfigs.monitoring.coreos.com}
      - {kind: CustomResourceDefinition, name: alertmanagers.monitoring.coreos.com}
      - {kind: CustomResourceDefinition, name: podmonitors.monitoring.coreos.com}
      - {kind: CustomResourceDefinition, name: probes.monitoring.coreos.com}
      - {kind: CustomResourceDefinition, name: prometheusagents.monitoring.coreos.com}
      - {kind: CustomResourceDefinition, name: prometheuses.monitoring.coreos.com}
      - {kind: CustomResourceDefinition, name: prometheusrules.monitoring.coreos.com}
      - {kind: CustomResourceDefinition, name: scrapeconfigs.monitoring.coreos.com}
      - {kind: CustomResourceDefinition, name: servicemonitors.monitoring.coreos.com}
      - {kind: CustomResourceDefinition, name: thanosrulers.monitoring.coreos.com}
    # keycloak: Grafana sign-in (observability_grafana_sso).
    depends_on: [cert_manager, metallb, seaweedfs, keycloak]

  # Event-driven autoscaling (external.metrics.k8s.io); triggers query the platform
  # Prometheus. On OpenShift it uses the Custom Metrics Autoscaler, which preflight checks.
  - name: keda
    layer: platform
    enabled: "{{ keda_enabled | default(false) | bool }}"
    depends_on: [observability]

  # depends_on orders, it does not gate: a disabled observability component
  # does not disable this one, so it is gated on observability_enabled too, and
  # off on OpenShift like nvidia_gpu_operator.
  - name: gpu_observability
    layer: platform
    enabled: "{{ (rack_scale_enabled | default(false) | bool) and (observability_enabled | default(true) | bool) and cluster_distribution | default('kubernetes') != 'openshift' }}"
    depends_on: [observability, nvidia_gpu_operator]

  # Its teardown keeps the backups unless velero_teardown_delete_backup_data is set.
  - name: velero
    layer: platform
    teardown: role
    enabled: "{{ velero_enabled | default(false) | bool and cluster_distribution | default('kubernetes') != 'openshift' }}"
    depends_on: []
