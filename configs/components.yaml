---
# =============================================================================
# Component Registry — ai-solutions' own layers and components
# =============================================================================
# Execution order is derived from depends_on, not from the order of this file:
# layers in dependency order, then components within each layer.
# Component depends_on is SAME-LAYER only — cross-layer ordering comes from the
# layer graph.
#
# Adding a component here: add an entry and create roles/<name>/.
# Adding a whole solution (its own layer, in its own repo): see
# docs/adding_solutions.md — external repos declare their own layers, which
# preflight merges in, so they are not listed here.
# =============================================================================

layers:
  - name: infrastructure
    enabled: true
    depends_on: []
  - name: platform
    enabled: true
    depends_on: [infrastructure]
  - name: inference
    enabled: true
    depends_on: [platform]
  # Opt-in layers are declared by their own ext repo's components.yaml

components:
  # --- Infrastructure ---
  - name: kubernetes
    layer: infrastructure
    enabled: true
    depends_on: []

  - name: storage
    layer: infrastructure
    enabled: true
    depends_on: [kubernetes]

  # --- Platform ---
  - name: cert_manager
    layer: platform
    enabled: "{{ cert_manager_enabled | default(true) | bool }}"
    depends_on: []

  - name: istio
    layer: platform
    enabled: "{{ istio_enabled | default(true) | bool }}"
    depends_on: [cert_manager]

  - name: metallb
    layer: platform
    enabled: "{{ metallb_enabled | default(true) | bool }}"
    depends_on: []

  - name: envoy_gateway
    layer: platform
    enabled: "{{ envoy_gateway_enabled | default(true) | bool }}"
    depends_on: [cert_manager, metallb]

  - name: postgresql
    layer: platform
    enabled: "{{ postgresql_enabled | default(true) | bool }}"
    depends_on: []

  - name: keycloak
    layer: platform
    enabled: "{{ keycloak_enabled | default(auth_provider | default('keycloak') != 'litellm') | bool }}"
    depends_on: [cert_manager, envoy_gateway, postgresql]

  - name: object_store
    layer: platform
    enabled: true
    depends_on: []

  - name: minio
    layer: platform
    enabled: "{{ (object_store_backend | default('minio')) == 'minio' }}"
    depends_on: [object_store]

  - name: observability
    layer: platform
    enabled: "{{ observability_enabled | default(true) | bool }}"
    depends_on: [cert_manager, metallb, minio]

  - name: velero
    layer: platform
    enabled: "{{ velero_enabled | default(false) | bool }}"
    depends_on: []

  # --- Inference ---
  # Only nri_cpu_balloons remains here — it configures kubelet-level CPU policy
  # and is tightly coupled to the kubernetes role. All other inference components
  # are registered in ext/enterprise.ai-inference/components.yaml.
  - name: nri_cpu_balloons
    layer: inference
    enabled: "{{ (kubernetes_cpu_policy | default('nri-balloons')) == 'nri-balloons' and (kubernetes_accelerator | default('cpu')) == 'cpu' }}"
    depends_on: []

