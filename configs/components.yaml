---
# =============================================================================
# Component Registry — ai-solutions' own layers and components
# =============================================================================
# Execution order is derived from depends_on, not from the order of this file:
# layers in dependency order, then components within each layer.
# Component depends_on is SAME-LAYER only — cross-layer ordering comes from the
# layer graph.
#
# Teardown deletes the objects the ownership role labelled during install
# (roles/ownership). `teardown: role` runs the component's own teardown instead, and
# `teardown: both` runs it after the labelled objects are gone: for components that
# also change hosts.
#
# Adding a component here: add an entry and create roles/<name>/.
# Adding a whole solution (its own layer, in its own repo): see
# docs/adding_solutions.md — external repos declare their own layers, which
# preflight merges in, so they are not listed here.
# =============================================================================

layers:
  - name: infrastructure
    enabled: true
    depends_on: []
  - name: platform
    enabled: true
    depends_on: [infrastructure]
  - name: inference
    enabled: true
    depends_on: [platform]
  # Opt-in layers are declared by their own ext repo's components.yaml

components:
  # --- Infrastructure: Rack-Scale Fabric (disabled by default) ---
  # Gated on rack_scale_enabled. When false, all fabric components are skipped
  # and the infrastructure layer behaves identically to before this addition.
  # Pre-K8s fabric: inventory → netplan → sysctl must run BEFORE kubernetes.
  # In star topology the hub must have fabric NICs + ip_forward configured
  # before kubespray can SSH to worker nodes through it.
  - name: fabric_inventory
    layer: infrastructure
    teardown: role
    enabled: "{{ rack_scale_enabled | default(false) | bool }}"
    depends_on: []

  - name: fabric_netplan
    layer: infrastructure
    teardown: role
    enabled: "{{ rack_scale_enabled | default(false) | bool }}"
    depends_on: [fabric_inventory]

  - name: fabric_sysctl
    layer: infrastructure
    teardown: role
    enabled: "{{ rack_scale_enabled | default(false) | bool }}"
    depends_on: [fabric_netplan]

  # Infrastructure sets up Kubernetes only. On OpenShift the cluster is BYO
  # and the admin provides its storage, so kubernetes and storage are skipped.
  - name: kubernetes
    layer: infrastructure
    teardown: role
    enabled: "{{ cluster_distribution | default('kubernetes') != 'openshift' }}"
    depends_on: [fabric_sysctl]

  # Post-K8s fabric: BGP needs kubectl, validate needs the cluster up.
  - name: fabric_bgp
    layer: infrastructure
    teardown: role
    enabled: "{{ rack_scale_enabled | default(false) | bool }}"
    depends_on: [kubernetes]

  - name: fabric_validate
    layer: infrastructure
    teardown: role
    enabled: "{{ rack_scale_enabled | default(false) | bool }}"
    depends_on: [kubernetes, fabric_bgp]

  - name: storage
    layer: infrastructure
    teardown: both
    enabled: "{{ cluster_distribution | default('kubernetes') != 'openshift' }}"
    depends_on: [kubernetes]

  # --- Platform ---
  - name: cert_manager
    layer: platform
    enabled: "{{ cert_manager_enabled | default(true) | bool }}"
    depends_on: []

  # Skipped on OpenShift: the mesh is Service Mesh 3 (Sail operator), which owns
  # the Istio CRDs and control plane.
  - name: istio
    layer: platform
    enabled: "{{ istio_enabled | default(true) | bool and cluster_distribution | default('kubernetes') != 'openshift' }}"
    depends_on: [cert_manager]

  # Skipped on OpenShift: services are exposed through the OpenShift router, and
  # a customer who wants a dedicated VIP installs MetalLB from the marketplace.
  - name: metallb
    layer: platform
    enabled: "{{ metallb_enabled | default(true) | bool and not (cluster_distribution | default('kubernetes') == 'openshift') }}"
    depends_on: []

  # Platform Gateway; gateway_provider picks the implementation (envoy).
  - name: gateway
    aliases: [envoy_gateway]
    layer: platform
    enabled: "{{ gateway_enabled | default(envoy_gateway_enabled | default(true)) | bool }}"
    depends_on: [cert_manager, metallb]

  - name: postgresql
    layer: platform
    enabled: "{{ postgresql_enabled | default(true) | bool }}"
    depends_on: []

  - name: keycloak
    layer: platform
    # Both auth modes: people sign in through Keycloak; the gateway trusts its JWTs.
    enabled: "{{ keycloak_enabled | default(true) | bool }}"
    depends_on: [cert_manager, gateway, postgresql]

  - name: object_store
    layer: platform
    enabled: true
    depends_on: []

  - name: seaweedfs
    layer: platform
    enabled: "{{ (object_store_backend | default('seaweedfs')) == 'seaweedfs' }}"
    depends_on: [object_store]

  # On OpenShift: instances of the operators the admin installed from OperatorHub
  # (Loki, Logging, Tempo, OpenTelemetry, Grafana), metrics from user-workload
  # monitoring. See roles/observability/tasks/openshift.yaml.
  - name: observability
    layer: platform
    enabled: "{{ observability_enabled | default(true) | bool }}"
    depends_on: [cert_manager, metallb, seaweedfs]

  - name: velero
    layer: platform
    enabled: "{{ velero_enabled | default(false) | bool }}"
    depends_on: []

  # --- Inference ---
  # Only nri_cpu_balloons remains here — it configures kubelet-level CPU policy
  # and is tightly coupled to the kubernetes role. All other inference components
  # are registered in ext/enterprise.ai-inference/components.yaml.
  - name: nri_cpu_balloons
    layer: inference
    enabled: "{{ (kubernetes_cpu_policy | default('nri-balloons')) == 'nri-balloons' and (kubernetes_accelerator | default('cpu')) == 'cpu' }}"
    depends_on: []

