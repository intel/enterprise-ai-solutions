---
# =============================================================================
# Master Install Playbook - Dynamically includes roles from components.yaml
# =============================================================================
# Usage: target is required — name a layer or a component, there is no "all".
#   ansible-playbook playbooks/site.yaml -e target=platform    # layer + its deps
#   ansible-playbook playbooks/site.yaml -e target=kserve      # component + its deps
#   ansible-playbook playbooks/site.yaml -e key=value          # override vars
# =============================================================================

- name: "AI-solutions"
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    component_action: install
    # Shared vars for solution-layer roles dispatched via site.yaml
    log_dir: "{{ env_dir | default(playbook_dir + '/../env/local') }}/logs"
    tmp_dir: "{{ log_dir }}/tmp"
    secure_logs: false
    helm_timeout: "600s"
    helm_wait: true
    helm_retries: 3
  environment:
    http_proxy: "{{ http_proxy | default('') }}"
    https_proxy: "{{ https_proxy | default('') }}"
    no_proxy: "{{ no_proxy | default('') }}"
    HTTP_PROXY: "{{ http_proxy | default('') }}"
    HTTPS_PROXY: "{{ https_proxy | default('') }}"
    NO_PROXY: "{{ no_proxy | default('') }}"
    K8S_AUTH_NO_PROXY: "{{ no_proxy | default('') }}"

  pre_tasks:
    - name: "Preflight"
      ansible.builtin.include_tasks: includes/preflight.yaml

  tasks:
    # Before the first layer runs: a lower layer's run can change a higher layer's
    # data. A resume keeps the snapshot its first attempt took.
    - name: "Take the pre-run counts"
      block:
        - name: "Count the data of each reported layer before the run"
          ansible.builtin.include_role:
            name: upgrade_checks
            tasks_from: consistency.yaml
          vars:
            upgrade_record_layer: "{{ layer }}"
            upgrade_consistency_phase: pre
          loop: "{{ _reported_layers | default([]) }}"
          loop_control:
            loop_var: layer
          when: _layer_class[layer] != 'resume'

        - name: "Note which reported layers' pre-run count failed"
          ansible.builtin.set_fact:
            _pre_consistency_gate: >-
              {{ (_pre_consistency_counts | default({}))
                 | pre_consistency_gate(_layer_supports_upgrade | default({}), _upgrade_force | default(false) | bool) }}

        # The checks carry the reason into the layer's upgrade report.
        - name: "Record a forced pre-run count in the layer's forcedChecks"
          ansible.builtin.set_fact:
            _upgrade_gate: >-
              {{ _upgrade_gate | combine({'forcedChecks': _upgrade_gate.forcedChecks + _pre_consistency_gate.forcedChecks,
                                          'checks': _upgrade_gate.checks + _pre_consistency_gate.checks | selectattr('gating') | list}) }}
          when: _pre_consistency_gate.forcedChecks | length > 0

      # No record is written yet, so there is nothing to mark halted.
      rescue:
        - name: "Discard the pre-run snapshots this run took"
          ansible.builtin.include_role:
            name: upgrade_checks
            tasks_from: consistency.yaml
          vars:
            upgrade_record_layer: "{{ layer }}"
            upgrade_consistency_phase: discard
          loop: "{{ _reported_layers | default([]) }}"
          loop_control:
            loop_var: layer
          when: layer in _pre_snapshots_written | default([])

        - name: "Stop before any layer runs"
          ansible.builtin.fail:
            msg: >-
              The data-consistency count before the run failed in {{ _counting_layer | default('a reported layer') }};
              nothing was changed. The failing task is reported above.

    # Nothing ran, so this run left nothing unfinished: its own snapshots would let the retry skip
    # their counts. A snapshot kept from an earlier unfinished run stays.
    - name: "Discard the pre-run snapshots this run took"
      ansible.builtin.include_role:
        name: upgrade_checks
        tasks_from: consistency.yaml
      vars:
        upgrade_record_layer: "{{ layer }}"
        upgrade_consistency_phase: discard
      loop: "{{ _reported_layers | default([]) }}"
      loop_control:
        loop_var: layer
      when:
        - _pre_consistency_gate.refused | length > 0
        - layer in _pre_snapshots_written | default([])

    - name: "Refuse before any change on a failed gating pre-run count"
      ansible.builtin.fail:
        msg: |-
          The data-consistency count before the run failed; nothing was changed.
          {% for check in _pre_consistency_gate.checks | selectattr('gating') %}
            - {{ check.layer }} {{ check.check }}: {{ check.reason }}. Resolve: {{ check.resolve }}
          {% endfor %}
          To run anyway, add --force; the run is then recorded as forced.
      when: _pre_consistency_gate.refused | length > 0

    - name: "Execute layers"
      ansible.builtin.include_tasks: includes/run_layer.yaml
      loop: "{{ _active_components | map(attribute='layer') | unique | list }}"
      loop_control:
        loop_var: layer
