---
# =============================================================================
# Service routing registry — merged from every repo
# =============================================================================
# Each repo publishes its own services in configs/service_routes.yaml (here and
# beside every ext components.yaml). Sets service_routes; a service, subdomain
# or path claimed by two repos fails here (see service_routes_merge).
# =============================================================================

- name: "Service routes | Find ext repos"
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/../ext"
    patterns: components.yaml
    recurse: true
    file_type: file
    follow: true
    excludes: ['.git', 'node_modules', '.venv']
  register: _route_repos
  failed_when: false

- name: "Service routes | Find registries"
  ansible.builtin.stat:
    path: "{{ item }}/configs/service_routes.yaml"
  loop: >-
    {{ [playbook_dir ~ '/..']
       + ((_route_repos.files | default([])) | sort(attribute='path') | map(attribute='path') | map('dirname') | list) }}
  register: _route_registries

- name: "Service routes | Merge registries"
  ansible.builtin.set_fact:
    service_routes: "{{ _sources | service_routes_merge }}"
  vars:
    _sources: >-
      {%- set out = [] -%}
      {%- for r in _route_registries.results if r.stat.exists -%}
      {%- set _ = out.append({'source': ('ai-solutions' if r.item == playbook_dir ~ '/..' else r.item | basename),
                              'routes': (lookup('ansible.builtin.file', r.stat.path) | from_yaml
                                         | default({}, true)).service_routes | default({})}) -%}
      {%- endfor -%}
      {{ out }}
