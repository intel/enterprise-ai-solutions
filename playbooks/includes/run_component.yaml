---
- name: "{{ component_action | upper }}: {{ component.name }}"
  ansible.builtin.debug:
    msg: |-
      ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
      ┃  {{ component_action | upper }}: {{ component.name }}{{ ' ' * (71 - component_action | length - component.name | length) }}┃
      ┃  Layer: {{ component.layer | default('unknown') }}{{ ' ' * (66 - (component.layer | default('unknown')) | length) }}┃
      ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# The namespaces that join the mesh while the component installs are the ones it
# put there (roles/mesh).
- name: "Mesh before {{ component.name }}"
  ansible.builtin.include_role:
    name: mesh
    tasks_from: snapshot
  when:
    - component_action == 'install'
    - istio_enabled | default(false) | bool

- name: "Execute {{ component.name }}"
  ansible.builtin.include_role:
    name: "{{ component.name }}"

# The policies it adds carry the component's labels, so its teardown deletes them,
# also when istio_enabled was turned off since.
- name: "Mesh for what {{ component.name }} installed"
  ansible.builtin.include_role:
    name: mesh
  when:
    - component_action == 'install'
    - istio_enabled | default(false) | bool

- name: "Mesh for what {{ component.name }} tore down"
  ansible.builtin.include_role:
    name: mesh
    tasks_from: teardown
  when: component_action == 'teardown'

- name: "{{ component.name }} — {{ (_component_prep_only | default(false)) | ternary('prep complete (install continues from caller)', component_action + ' complete') }}"
  ansible.builtin.debug:
    msg: |-
      {% if _component_prep_only | default(false) %}
      ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
      ┃  ⧗ {{ component.name }} — prep complete (install continues from caller){{ ' ' * (34 - component.name | length) }}┃
      ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
      {% else %}
      ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
      ┃  ✓ {{ component.name }} — {{ component_action }} complete{{ ' ' * (59 - component.name | length - component_action | length) }}┃
      ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
      {% endif %}

- name: "Reset prep-only flag"
  ansible.builtin.set_fact:
    _component_prep_only: false
  when: _component_prep_only | default(false)
  
