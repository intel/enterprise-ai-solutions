# Kubespray-compatible inventory — edit for your deployment mode.
# Only ONE section should be uncommented at a time.
#
# TIP: For multi-node deployments, you can define nodes in nodes.yaml instead
# of editing this file directly. The installer will auto-generate this file.
# See: configs/defaults/nodes.yaml → nodes_control_plane / nodes_workers
#
# ─── Option A: Localhost (default, single-node PoC) ─────────────────────
all:
    hosts:
        localhost:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
    children:
        kube_control_plane:
            hosts: { localhost: {} }
        kube_node:
            hosts: { localhost: {} }
        etcd:
            hosts: { localhost: {} }
        calico_rr:
            hosts: {}

